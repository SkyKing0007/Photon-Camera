name: Build 26467 Exact Wronski Performance

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26467_exact_wronski_performance.sh
      - .github/workflows/build-26467-exact-wronski.yml
  workflow_dispatch:

jobs:
  build-26467:
    name: Guarded 26467 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run guarded 26467 script
        run: |
          chmod +x ./build_26467_exact_wronski_performance.sh
          ./build_26467_exact_wronski_performance.sh

      - name: Upload 26467 reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26467-exact-wronski
          if-no-files-found: warn
          path: |
            build_26467_outputs/**
            IrisCamera-0.9726467-26467-exact-wronski-reference-cache-debug.apk
