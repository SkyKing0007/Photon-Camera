name: Build 26714 Normalized Handheld Highlight
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26714_README_UPLOAD.txt'
      - '26714_*'
      - 'build_26714_normalized_handheld_highlight.sh'
      - 'transform_26714.py'
      - 'validate_26714.py'
      - 'verify_26714_*.py'
      - 'handoff_payload_26714/**'
      - '.github/workflows/build-26714-normalized-handheld-highlight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26714 handoff and exact successful 26713 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26714_HANDOFF_HASHES.sha256
          bash -n build_26714_normalized_handheld_highlight.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26714.py','validate_26714.py','verify_26714_authority.py','verify_26714_patches.py','verify_26714_regressions.py','verify_26714_shaders.py','verify_26714_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26714_infrastructure.py build_26714_normalized_handheld_highlight.sh .github/workflows/build-26714-normalized-handheld-highlight.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26714 candidate from successful 26713 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26714_normalized_handheld_highlight.sh
      - name: Verify exact 26714 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726714-26714-normalized-handheld-highlight-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726714-26714-normalized-handheld-highlight-debug.apk' build_26714_normalized_handheld_highlight_outputs/26714_APK.sha256
      - name: Upload 26714 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26714-normalized-handheld-highlight
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726714-26714-normalized-handheld-highlight-debug.apk
            build_26714_normalized_handheld_highlight_outputs/
