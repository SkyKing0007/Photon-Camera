name: Build 26749 Bounded ResolveSabre CFA Reference
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26749_README_UPLOAD.txt'
      - '26749_*'
      - 'build_26749_bounded_resolvesabre_cfa_reference.sh'
      - 'transform_26749.py'
      - 'validate_26749.py'
      - 'verify_26749_*.py'
      - 'handoff_payload_26749/**'
      - '.github/workflows/build-26749-bounded-resolvesabre-cfa-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26749 handoff and exact successful 26748 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26749_HANDOFF_HASHES.sha256
          python3 -S verify_26749_infrastructure.py build_26749_bounded_resolvesabre_cfa_reference.sh .github/workflows/build-26749-bounded-resolvesabre-cfa-reference.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26749 candidate with successful 26748 procedure from exact successful 26748 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26749_bounded_resolvesabre_cfa_reference.sh
      - name: Verify exact 26749 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726749-26749-bounded-resolvesabre-cfa-reference-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726749-26749-bounded-resolvesabre-cfa-reference-debug.apk' build_26749_bounded_resolvesabre_cfa_reference_outputs/26749_APK.sha256
      - name: Upload 26749 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26749-bounded-resolvesabre-cfa-reference
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726749-26749-bounded-resolvesabre-cfa-reference-debug.apk
            build_26749_bounded_resolvesabre_cfa_reference_outputs/
