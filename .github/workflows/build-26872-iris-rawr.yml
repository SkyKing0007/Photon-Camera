name: Build 26872 B Preview Stripe
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26872.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 26871 mechanics and generate guarded 26872 build
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26872.txt
          grep -Fx 'RUN_26872_B_PREVIEW_STRIPE' TRIGGER_26872.txt
          sha256sum -c 26872_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py generate_26872_build.py verify_26872_candidate.py verify_26872_patches.py verify_26872_runtime_shader.py regressions/26872_b_preview_only.py
          python3 -S generate_26871_build.py .
          test "$(sha256sum build_26871_iris_rawr.sh | awk '{print $1}')" = 'ca2d99d38c1de9a310205ba2c2af0fd7b49399f506e39a24fa94a6f15a338e0e'
          python3 -S generate_26872_build.py .
          sha256sum -c 26872_GENERATED_BUILD_SHA256.txt
          bash -n build_26872_iris_rawr.sh
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26872_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26872_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact historical generated GLSL guard and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26872 native B build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26872_iris_rawr.sh
      - name: Verify exactly one intended 26872 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726872-26872-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726872-26872-iris-rawr-debug.apk' build_26872_iris_rawr_outputs/26872_APK.sha256
      - name: Upload authoritative 26872 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26872-b-preview-stripe
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726872-26872-iris-rawr-debug.apk
            build_26872_iris_rawr_outputs/
