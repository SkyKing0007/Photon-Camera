name: Build 26741 Super Res Confidence Bright Neutrality
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26741_README_UPLOAD.txt'
      - '26741_*'
      - 'build_26741_superres_confidence_bright_neutrality.sh'
      - 'transform_26741.py'
      - 'validate_26741.py'
      - 'verify_26741_*.py'
      - 'handoff_payload_26741/**'
      - '.github/workflows/build-26741-superres-confidence-bright-neutrality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26741 handoff and exact successful 26740 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26741_HANDOFF_HASHES.sha256
          python3 -S verify_26741_infrastructure.py build_26741_superres_confidence_bright_neutrality.sh .github/workflows/build-26741-superres-confidence-bright-neutrality.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26741 candidate with successful 26740 procedure from exact successful 26740 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26741_superres_confidence_bright_neutrality.sh
      - name: Verify exact 26741 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726741-26741-superres-confidence-bright-neutrality-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726741-26741-superres-confidence-bright-neutrality-debug.apk' build_26741_superres_confidence_bright_neutrality_outputs/26741_APK.sha256
      - name: Upload 26741 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26741-superres-confidence-bright-neutrality
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726741-26741-superres-confidence-bright-neutrality-debug.apk
            build_26741_superres_confidence_bright_neutrality_outputs/
