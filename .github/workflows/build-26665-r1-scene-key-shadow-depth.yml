name: Build 26665 R1 Scene Key Shadow Depth

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26665_R1_README_UPLOAD.txt'
      - 'R1_26665_*'
      - 'build_26665_r1_scene_key_shadow_depth.sh'
      - 'transform_26665.py'
      - 'validate_26665.py'
      - 'verify_26665_*.py'
      - 'handoff_payload_26665/**'
      - '.github/workflows/build-26665-r1-scene-key-shadow-depth.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26665 handoff and exact successful 26664 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26665_HANDOFF_HASHES.sha256
          bash -n build_26665_r1_scene_key_shadow_depth.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26665.py','validate_26665.py','verify_26665_authority.py','verify_26665_infrastructure.py','verify_26665_patches.py','verify_26665_regressions.py','verify_26665_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26665 candidate from successful 26664 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26665_r1_scene_key_shadow_depth.sh
      - name: Verify exact 26665 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726665-26665-r1-scene-key-shadow-depth-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726665-26665-r1-scene-key-shadow-depth-debug.apk" build_26665_r1_scene_key_shadow_depth_outputs/26665_R1_APK.sha256
      - name: Upload 26665 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26665-r1-scene-key-shadow-depth
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726665-26665-r1-scene-key-shadow-depth-debug.apk
            build_26665_r1_scene_key_shadow_depth_outputs/
