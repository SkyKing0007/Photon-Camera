name: Build 26628 R3 Bjzhou Color + Lens UI Compiler Repair

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26628_R3_README_UPLOAD.txt'
      - 'REGRESSION_R3_26628_*'
      - 'R3_26628_*'
      - 'build_26628_r3_bjzhou_color_motion_night_superres.sh'
      - 'transform_26628_r3.py'
      - 'validate_26628_r3.py'
      - 'verify_26628_r3_*.py'
      - 'handoff_payload_26628_r3/**'
      - '.github/workflows/build-26628-r3-bjzhou-color-motion-night-superres.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26628 R3 package and exact successful 26627 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R3_26628_HANDOFF_HASHES.sha256
          bash -n build_26628_r3_bjzhou_color_motion_night_superres.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26628_r3.py','validate_26628_r3.py','verify_26628_r3_authority.py','verify_26628_r3_infrastructure.py','verify_26628_r3_patches.py','verify_26628_r3_regressions.py','verify_26628_r3_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26628 R3 candidate from successful compiled 26627 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26628_r3_bjzhou_color_motion_night_superres.sh
      - name: Upload 26628 R3 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26628-r3-bjzhou-color-motion-night-superres-lens-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726628-26628-r3-bjzhou-color-motion-night-superres-debug.apk
            build_26628_r3_bjzhou_color_motion_night_superres_outputs/
