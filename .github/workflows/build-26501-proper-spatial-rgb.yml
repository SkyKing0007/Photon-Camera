name: Build 26501 Proper Per-Frame Spatial RGB

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26501_proper_per_frame_spatial_rgb.sh
      - 26501_proper_per_frame_spatial_rgb_runtime.patch
      - 26499_v7_successful_app_source.tar.gz
      - 26499_v7_successful_after.sha256
      - validate_26501_proper_spatial_rgb.py
      - verify_26501_source_integrity.py
      - 26501_HANDOFF_HASHES.sha256
      - .github/workflows/build-26501-proper-spatial-rgb.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Verify branch and 26499 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          git merge-base --is-ancestor ed5470179aea9514c15d52dcb35613c7925778c6 HEAD
          if git diff --name-only ed5470179aea9514c15d52dcb35613c7925778c6..HEAD -- app/src/main app/version.properties | grep -q .; then
            echo "Handoff commit directly modified app runtime source" >&2
            git diff --name-status ed5470179aea9514c15d52dcb35613c7925778c6..HEAD -- app/src/main app/version.properties >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update && sudo timeout 180 apt-get install -y glslang-tools; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Unable to install glslang-tools" >&2
              exit 1
            fi
            sleep 5
          done
          command -v glslangValidator
          glslangValidator --version

      - name: Verify exact 26501 handoff files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26501_HANDOFF_HASHES.sha256
          bash -n build_26501_proper_per_frame_spatial_rgb.sh
          python3 -m py_compile validate_26501_proper_spatial_rgb.py verify_26501_source_integrity.py
          grep -F 'V7_SHA="ed5470179aea9514c15d52dcb35613c7925778c6"' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'VERSION_NAME=0.9726501' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'VERSION_BUILD=26501' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F './gradlew clean :app:assembleDebug --stacktrace' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26501_proper_per_frame_spatial_rgb.sh

      - name: Build guarded 26501 candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26501_proper_per_frame_spatial_rgb.sh
          ./build_26501_proper_per_frame_spatial_rgb.sh

      - name: Upload 26501 APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26501-proper-per-frame-spatial-rgb
          path: |
            IrisCamera-0.9726501-26501-proper-per-frame-spatial-rgb-debug.apk
            build_26501_proper_spatial_rgb_outputs/
          if-no-files-found: warn
