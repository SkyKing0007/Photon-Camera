name: Build 26501 Proper Per-Frame Spatial RGB

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26501_proper_per_frame_spatial_rgb.sh
      - 26501_proper_per_frame_spatial_rgb_runtime.patch
      - 26501_v6_glsl_portability_runtime_fix.patch
      - 26499_v7_successful_after.sha256
      - validate_26501_proper_spatial_rgb.py
      - verify_26501_source_integrity.py
      - 26501_HANDOFF_HASHES.sha256
      - .github/workflows/build-26501-proper-spatial-rgb.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Verify branch and 26499 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor ed5470179aea9514c15d52dcb35613c7925778c6 HEAD
          DIRECT_RUNTIME_DIFF="${RUNNER_TEMP}/26501-direct-runtime-diff.txt"
          git diff --name-only ed5470179aea9514c15d52dcb35613c7925778c6..HEAD -- app/src/main app/version.properties > "$DIRECT_RUNTIME_DIFF"
          if [[ -s "$DIRECT_RUNTIME_DIFF" ]]; then
            echo "Handoff commit directly modified app runtime source" >&2
            git diff --name-status ed5470179aea9514c15d52dcb35613c7925778c6..HEAD -- app/src/main app/version.properties >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator without APT
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          GLSLANG_VERSION="16.5.0"
          GLSLANG_ASSET="glslang-${GLSLANG_VERSION}-linux-x86_64-release.tar.gz"
          GLSLANG_URL="https://github.com/KhronosGroup/glslang/releases/download/${GLSLANG_VERSION}/${GLSLANG_ASSET}"
          RELEASE_META="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-release.json"
          TOOL_ROOT="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/${GLSLANG_ASSET}"
          rm -rf "$TOOL_ROOT" "$ARCHIVE" "$RELEASE_META"
          mkdir -p "$TOOL_ROOT"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/${GLSLANG_VERSION}" -o "$RELEASE_META"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 "$GLSLANG_URL" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          python3 -c 'import hashlib,json,sys; m,v,n,u,a=sys.argv[1:]; d=json.load(open(m,encoding="utf-8")); assert d.get("tag_name")==v, f"Khronos release tag mismatch: {d.get(chr(116)+chr(97)+chr(103)+chr(95)+chr(110)+chr(97)+chr(109)+chr(101))!r} != {v!r}"; xs=[x for x in d.get("assets",[]) if x.get("name")==n]; assert len(xs)==1, f"Expected exactly one Khronos release asset {n!r}, found {len(xs)}"; x=xs[0]; assert x.get("browser_download_url")==u, "Khronos release asset URL mismatch"; dg=x.get("digest") or ""; assert dg.startswith("sha256:"), f"Missing GitHub SHA-256 digest for Khronos asset: {dg!r}"; ex=dg.split(":",1)[1].lower(); ac=hashlib.sha256(open(a,"rb").read()).hexdigest(); assert ac==ex, f"Khronos asset SHA-256 mismatch: {ac} != {ex}"; print(f"PASS: official Khronos release asset SHA256 {ac}")' "$RELEASE_META" "$GLSLANG_VERSION" "$GLSLANG_ASSET" "$GLSLANG_URL" "$ARCHIVE"
          ARCHIVE_LIST="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-contents.txt"
          tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"
          grep -Fxq 'bin/glslangValidator' "$ARCHIVE_LIST"
          grep -Fxq 'bin/glslang' "$ARCHIVE_LIST"
          tar -xzf "$ARCHIVE" -C "$TOOL_ROOT"
          test -x "$TOOL_ROOT/bin/glslang"
          test -e "$TOOL_ROOT/bin/glslangValidator"
          VERSION_OUTPUT="$("$TOOL_ROOT/bin/glslangValidator" --version)"
          VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"
          printf '%s\n' "$VERSION_LINE"
          grep -F '16.5.0' <<<"$VERSION_LINE"
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"
          echo "PASS: pinned Khronos glslangValidator 16.5.0 ready without APT"

      - name: Restore canonical 26499 V7 source archive from Git history
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SOURCE_COMMIT="719f93fd2085ffd41ead0c9bcfa2bd630f34ab8b"
          CANONICAL_SOURCE_SHA256="ce5be58fa20b9e28786b9c6e4355743066fe92e78791b50b5ee2df568c5ae9e1"
          git merge-base --is-ancestor "$CANONICAL_SOURCE_COMMIT" HEAD
          git show "${CANONICAL_SOURCE_COMMIT}:26499_v7_successful_app_source.tar.gz" > 26499_v7_successful_app_source.tar.gz
          echo "$CANONICAL_SOURCE_SHA256  26499_v7_successful_app_source.tar.gz" | sha256sum -c -
          echo "PASS: restored canonical V7 source archive from Git history"

      - name: Verify exact 26501 handoff files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26501_HANDOFF_HASHES.sha256
          bash -n build_26501_proper_per_frame_spatial_rgb.sh
          python3 -m py_compile validate_26501_proper_spatial_rgb.py verify_26501_source_integrity.py
          grep -F 'V7_SHA="ed5470179aea9514c15d52dcb35613c7925778c6"' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'VERSION_NAME=0.9726501' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'VERSION_BUILD=26501' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F './gradlew clean :app:assembleDebug --stacktrace' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'V6_PATCH="$ROOT/26501_v6_glsl_portability_runtime_fix.patch"' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'V6_PATCH_SHA="db574aec0e3b67504fddf64d2129cb7a2a782f27eba3271f730acb1fa05df0e6"' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'PASS: V6 GLSL portability patch is identifier-only; reconstruction math is byte-equivalent' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'PASS: no GLSL reserved identifiers are used as declarations across 7 preflight shaders' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'DIRECT_RUNTIME_DIFF="$OUT/26501_direct_runtime_diff.txt"' build_26501_proper_per_frame_spatial_rgb.sh
          grep -F 'SUCCESS_TAR_LIST="$OUT/26501_successful_app_source.list"' build_26501_proper_per_frame_spatial_rgb.sh
          if grep -Eq '\|[[:space:]]*grep[[:space:]]+-q' build_26501_proper_per_frame_spatial_rgb.sh; then
            echo "pipefail-unsafe grep -q pipeline survived in guarded build script" >&2
            exit 1
          fi
          grep -F 'GLSLANG_VERSION="16.5.0"' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F 'glslang-${GLSLANG_VERSION}-linux-x86_64-release.tar.gz' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F 'api.github.com/repos/KhronosGroup/glslang/releases/tags/${GLSLANG_VERSION}' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F 'Khronos asset SHA-256 mismatch' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F -- '--max-time 180' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F 'tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"' .github/workflows/build-26501-proper-spatial-rgb.yml
          grep -F 'VERSION_OUTPUT="$("$TOOL_ROOT/bin/glslangValidator" --version)"' .github/workflows/build-26501-proper-spatial-rgb.yml
          if grep -Eq '^[[:space:]]+sudo[[:space:]]+apt-get[[:space:]]' .github/workflows/build-26501-proper-spatial-rgb.yml || grep -Eq '^[[:space:]]+apt-get[[:space:]].*glslang-tools' .github/workflows/build-26501-proper-spatial-rgb.yml; then
            echo "Executable APT-based GLSL bootstrap unexpectedly survived" >&2
            exit 1
          fi
          echo "PASS: bounded pinned official Khronos GLSL bootstrap with GitHub SHA-256 verification; no APT"

      - name: Build guarded 26501 candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26501_proper_per_frame_spatial_rgb.sh
          ./build_26501_proper_per_frame_spatial_rgb.sh

      - name: Upload 26501 APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26501-proper-per-frame-spatial-rgb
          path: |
            IrisCamera-0.9726501-26501-proper-per-frame-spatial-rgb-debug.apk
            build_26501_proper_spatial_rgb_outputs/
          if-no-files-found: warn
