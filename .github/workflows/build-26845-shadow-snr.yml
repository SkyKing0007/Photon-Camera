name: Build 26845 Shadow SNR
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26845.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26845 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26845.txt
          grep -Fx 'RUN_26845_SHADOW_SNR' TRIGGER_26845.txt
          sha256sum -c 26845_HANDOFF_HASHES.sha256
          bash -n build_26845_shadow_snr.sh
          python3 -S -m py_compile transform_26845.py validate_26845.py verify_26845_patches.py verify_26845_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26845_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26845_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26845 candidate from successful 26844 authority using exact successful 26844 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26845_shadow_snr.sh
      - name: Verify exact 26845 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726845-26845-shadow-snr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726845-26845-shadow-snr-debug.apk' build_26845_shadow_snr_outputs/26845_APK.sha256
      - name: Upload 26845 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26845-shadow-snr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726845-26845-shadow-snr-debug.apk
            build_26845_shadow_snr_outputs/
