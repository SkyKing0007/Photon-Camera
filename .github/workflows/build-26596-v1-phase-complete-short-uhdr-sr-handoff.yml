name: Build 26596 V1 Phase-Complete SHORT + UHDR + SR Handoff

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26596_README_UPLOAD.txt'
      - 'REGRESSION_V1_26596_*'
      - 'V1_26596_*'
      - 'build_26596_v1_phase_complete_short_uhdr_sr_handoff.sh'
      - 'transform_26596_v1.py'
      - 'validate_26596_v1.py'
      - 'verify_26596_v1_*.py'
      - 'handoff_payload_26596_v1/**'
      - '.github/workflows/build-26596-v1-phase-complete-short-uhdr-sr-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26596 package and exact successful 26595/26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26596_HANDOFF_HASHES.sha256
          bash -n build_26596_v1_phase_complete_short_uhdr_sr_handoff.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26596_v1.py','validate_26596_v1.py','verify_26596_v1_authority.py','verify_26596_v1_infrastructure.py','verify_26596_v1_patches.py','verify_26596_v1_regressions.py','verify_26596_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26596 candidate from successful compiled 26595 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26596_v1_phase_complete_short_uhdr_sr_handoff.sh
      - name: Upload 26596 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26596-v1-phase-complete-short-uhdr-sr-handoff
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726596-26596-v1-phase-complete-short-uhdr-sr-handoff-debug.apk
            build_26596_v1_phase_complete_short_uhdr_sr_handoff_outputs/
