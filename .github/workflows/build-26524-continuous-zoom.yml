name: Build 26524 Continuous Zoom
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26524_continuous_zoom.py
      - validate_26524_continuous_zoom.py
      - preflight_26524_zoom_shaders.py
      - build_26524_continuous_zoom.sh
      - 26524_BASE_26523_HEAD.txt
      - 26524_SCOPE_PROVENANCE.txt
      - 26524_README_UPLOAD.txt
      - 26524_HANDOFF_HASHES.sha256
      - .github/workflows/build-26524-continuous-zoom.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26524-continuous-zoom-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          expected=digest.split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26524 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26524_HANDOFF_HASHES.sha256
          python3 -m py_compile apply_26524_continuous_zoom.py validate_26524_continuous_zoom.py preflight_26524_zoom_shaders.py
          bash -n build_26524_continuous_zoom.sh
          [[ "$(tr -d '\r\n' < 26524_BASE_26523_HEAD.txt)" == "c53d891c698ec29efbe4152407f024dff49e9abe" ]]
          grep -F 'SUCCESSFUL_26523_HEAD="c53d891c698ec29efbe4152407f024dff49e9abe"' build_26524_continuous_zoom.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26523-ui-focus-temporal-support-v1"' build_26524_continuous_zoom.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726524"; VERSION_BUILD="26524"' build_26524_continuous_zoom.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26524_continuous_zoom.sh >/dev/null
          grep -F 'TELE_MAX_GLOBAL_ZOOM = 50.0f' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'NO_TELE_MAX_GLOBAL_ZOOM = 20.0f' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'isContinuousZoomEnabledForCurrentMode' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'CameraMode.MOTION' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'IRIS_26524_FULLSIZE_MOTION_ZOOM_RENDER' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'IRIS_26524_UHDR_ZOOM_GEOMETRY_PARITY' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'IRIS_26524_RESIDUAL_ZOOM_FOCUS_MAPPING' apply_26524_continuous_zoom.py >/dev/null
          grep -F 'IRIS_26524_ACTUAL_HAL_ZOOM_RECONCILIATION' apply_26524_continuous_zoom.py >/dev/null
          glslangValidator --version | head -1 | grep -F 16.5.0
          echo "PASS: 26524 handoff static guards verified"
      - name: Guarded 26524 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26524_continuous_zoom.sh
          ./build_26524_continuous_zoom.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26524-continuous-zoom-v1
          path: |
            IrisCamera-0.9726524-26524-continuous-zoom-debug.apk
            build_26524_continuous_zoom_outputs/
          if-no-files-found: warn
