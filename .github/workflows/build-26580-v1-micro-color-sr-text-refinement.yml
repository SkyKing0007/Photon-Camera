name: Build 26580 V1 Micro Color SR Text Refinement

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26580_*'
      - 'REGRESSION_V1_26580_*'
      - 'build_26580_v1_micro_color_sr_text_refinement.sh'
      - 'transform_26580_v1.py'
      - 'validate_26580_v1.py'
      - 'verify_26580_v1_authority.py'
      - 'verify_26580_v1_regressions.py'
      - 'verify_26580_v1_patches.py'
      - 'verify_26580_v1_shaders.py'
      - 'handoff_payload_26580_v1/**'
      - '.github/workflows/build-26580-v1-micro-color-sr-text-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26580 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26580_HANDOFF_HASHES.sha256
          bash -n build_26580_v1_micro_color_sr_text_refinement.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26580_v1.py',
              'validate_26580_v1.py',
              'verify_26580_v1_authority.py',
              'verify_26580_v1_regressions.py',
              'verify_26580_v1_patches.py',
              'verify_26580_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26580_v1_micro_color_sr_text_refinement.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="10acb393cea9b9e55f68e357177ffd36f2e90949"' in s
          assert 'HANDOFF_PARENT_COMMIT="10acb393cea9b9e55f68e357177ffd36f2e90949"' in s
          assert 'BASE_RUN_ID="33590407936"' in s
          assert 'BASE_JOB_ID="100123073090"' in s
          assert 'BASE_ARTIFACT_ID="9831599102"' in s
          assert 'BASE_ARTIFACT_SHA="02d3001d2c558e9bc9c6070d367e3566a7ad7b1dd6c565d8f7e0f64189efbffa"' in s
          assert 'BASE_TAR_SHA="09b5f9b7796a08de7207c5b3bd3718255d240c86454b4aebe2b6824d384f0266"' in s
          assert 'VERSION_NAME="0.9726580"' in s and 'VERSION_BUILD="26580"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26579 compiler/build ordering remains unchanged.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26580 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          main='\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n'
          assert main in s
          snap='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert snap in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 3 ]]' in s
          print('PASS sealed Python syntax + exact successful 26579 authority-seeded verification order inheritance')
          PY
          grep -F 'compact 3x3 multicolor flag/logo area is preserved' REGRESSION_V1_26580_MICRO_COLOR_SR_TEXT.txt >/dev/null
          grep -F 'motionv2_jpeg444_jni.cpp must remain byte-identical SHA-256 d73cd24452280958f089e9124545a81461939e8fa0c9c95272b2825942e4b43d' REGRESSION_V1_26580_CARRIED_FAILURES.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26580_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26580_' .github/workflows --exclude='build-26580-v1-micro-color-sr-text-refinement.yml'
          ! grep -R -F 'handoff_payload_26580_v1' .github/workflows --exclude='build-26580-v1-micro-color-sr-text-refinement.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26580 candidate from successful compiled 26579 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26580_v1_micro_color_sr_text_refinement.sh

      - name: Upload 26580 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26580-v1-micro-color-sr-text-refinement
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726580-26580-v1-micro-color-sr-text-refinement-debug.apk
            build_26580_v1_micro_color_sr_text_refinement_outputs/
