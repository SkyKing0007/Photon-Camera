name: Build 26523 UI Focus Temporal Support
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26523_ui_focus_temporal_support.py
      - validate_26523_ui_focus_temporal_support.py
      - preflight_26523_iris_embedded_shaders.py
      - build_26523_ui_focus_temporal_support.sh
      - 26523_BASE_26522_HEAD.txt
      - 26523_SCOPE_PROVENANCE.txt
      - 26523_README_UPLOAD.txt
      - 26523_HANDOFF_HASHES.sha256
      - .github/workflows/build-26523-ui-focus-temporal-support.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26523-ui-focus-temporal-support-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          expected=digest.split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert expected==actual
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26523 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26523_HANDOFF_HASHES.sha256
          python3 -m py_compile apply_26523_ui_focus_temporal_support.py validate_26523_ui_focus_temporal_support.py preflight_26523_iris_embedded_shaders.py
          bash -n build_26523_ui_focus_temporal_support.sh
          [[ "$(tr -d '\r\n' < 26523_BASE_26522_HEAD.txt)" == "d65993d6c831b5e21ca70e032325a90a5b5a5a62" ]]
          grep -F 'SUCCESSFUL_26522_HEAD="d65993d6c831b5e21ca70e032325a90a5b5a5a62"' build_26523_ui_focus_temporal_support.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26522-fullrange-stacked-dng-v1"' build_26523_ui_focus_temporal_support.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726523"; VERSION_BUILD="26523"' build_26523_ui_focus_temporal_support.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26523_ui_focus_temporal_support.sh >/dev/null
          grep -F 'IRIS_26523_DNG_FRAME_EQUIVALENT_SUPPORT_MOMENTS' apply_26523_ui_focus_temporal_support.py >/dev/null
          grep -F 'IRIS_26523_DNG_SINGLE_METADATA_OWNERSHIP' apply_26523_ui_focus_temporal_support.py >/dev/null
          grep -F 'IRIS_26523_ACTUAL_PREVIEW_TOUCH_BOUNDS' apply_26523_ui_focus_temporal_support.py >/dev/null
          grep -F 'IRIS_26523_ACTIVE_CROP_FOCUS_MAPPING' apply_26523_ui_focus_temporal_support.py >/dev/null
          grep -F 'mPreviewCaptureResult.get(CaptureResult.SCALER_CROP_REGION)' apply_26523_ui_focus_temporal_support.py >/dev/null
          ! grep -F 'mPreviewCaptureResult.get(CaptureRequest.SCALER_CROP_REGION)' apply_26523_ui_focus_temporal_support.py
          grep -F 'IRIS_26523_ABOUT_MINIMAL_IRIS' apply_26523_ui_focus_temporal_support.py >/dev/null
          glslangValidator --version | head -1 | grep -F 16.5.0
          echo "PASS: 26523 handoff static guards verified"
      - name: Guarded 26523 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26523_ui_focus_temporal_support.sh
          ./build_26523_ui_focus_temporal_support.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26523-ui-focus-temporal-support-v1
          path: |
            IrisCamera-0.9726523-26523-ui-focus-temporal-support-debug.apk
            build_26523_ui_focus_temporal_support_outputs/
          if-no-files-found: warn
