name: Build 26691 R1 Spektra Capture Native Histogram

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26691_R1_README_UPLOAD.txt'
      - 'R1_26691_*'
      - 'build_26691_r1_spektra_capture_native_histogram.sh'
      - 'transform_26691.py'
      - 'validate_26691.py'
      - 'verify_26691_*.py'
      - 'handoff_payload_26691/**'
      - '.github/workflows/build-26691-r1-spektra-capture-native-histogram.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26691 handoff and exact successful 26690 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26691_HANDOFF_HASHES.sha256
          bash -n build_26691_r1_spektra_capture_native_histogram.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26691.py','validate_26691.py','verify_26691_authority.py','verify_26691_infrastructure.py','verify_26691_patches.py','verify_26691_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26691 candidate from successful 26690 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26691_r1_spektra_capture_native_histogram.sh
      - name: Verify exact 26691 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726691-26691-r1-spektra-capture-native-histogram-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726691-26691-r1-spektra-capture-native-histogram-debug.apk" build_26691_r1_spektra_capture_native_histogram_outputs/26691_R1_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26691_r1_spektra_capture_native_histogram_outputs/26691_apk_jni_contract.txt
      - name: Upload 26691 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26691-r1-spektra-capture-native-histogram
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726691-26691-r1-spektra-capture-native-histogram-debug.apk
            build_26691_r1_spektra_capture_native_histogram_outputs/
