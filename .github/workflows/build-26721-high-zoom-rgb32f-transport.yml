name: Build 26721 High Zoom RGB32F Transport
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26721_README_UPLOAD.txt'
      - '26721_*'
      - 'build_26721_high_zoom_rgb32f_transport.sh'
      - 'transform_26721.py'
      - 'validate_26721.py'
      - 'verify_26721_*.py'
      - 'handoff_payload_26721/**'
      - '.github/workflows/build-26721-high-zoom-rgb32f-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26721 handoff and exact successful 26720 R2 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26721_HANDOFF_HASHES.sha256
          python3 -S verify_26721_infrastructure.py build_26721_high_zoom_rgb32f_transport.sh .github/workflows/build-26721-high-zoom-rgb32f-transport.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26721 candidate with successful 26720 R2 procedure from successful 26720 R2 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26721_high_zoom_rgb32f_transport.sh
      - name: Verify exact 26721 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726721-26721-high-zoom-rgb32f-transport-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726721-26721-high-zoom-rgb32f-transport-debug.apk' build_26721_high_zoom_rgb32f_transport_outputs/26721_APK.sha256
      - name: Upload 26721 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26721-high-zoom-rgb32f-transport
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726721-26721-high-zoom-rgb32f-transport-debug.apk
            build_26721_high_zoom_rgb32f_transport_outputs/
