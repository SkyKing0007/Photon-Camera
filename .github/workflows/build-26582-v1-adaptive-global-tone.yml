name: Build 26582 V1 Adaptive Global Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26582_*'
      - 'REGRESSION_V1_26582_*'
      - 'build_26582_v1_adaptive_global_tone.sh'
      - 'transform_26582_v1.py'
      - 'validate_26582_v1.py'
      - 'verify_26582_v1_authority.py'
      - 'verify_26582_v1_regressions.py'
      - 'verify_26582_v1_patches.py'
      - 'verify_26582_v1_shaders.py'
      - 'handoff_payload_26582_v1/**'
      - '.github/workflows/build-26582-v1-adaptive-global-tone.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26582 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26582_HANDOFF_HASHES.sha256
          bash -n build_26582_v1_adaptive_global_tone.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26582_v1.py',
              'validate_26582_v1.py',
              'verify_26582_v1_authority.py',
              'verify_26582_v1_regressions.py',
              'verify_26582_v1_patches.py',
              'verify_26582_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26582_v1_adaptive_global_tone.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="f24f815ee3a34467641d184b029eae8dca5948cb"' in s
          assert 'HANDOFF_PARENT_COMMIT="f24f815ee3a34467641d184b029eae8dca5948cb"' in s
          assert 'BASE_RUN_ID="33643933451"' in s
          assert 'BASE_JOB_ID="100293694453"' in s
          assert 'BASE_ARTIFACT_ID="9852109713"' in s
          assert 'BASE_ARTIFACT_SHA="933667371f114faa8f82a51c158fb7f5115185ae596870b7cc15a388c4f4d8d4"' in s
          assert 'BASE_TAR_SHA="b64ec98a6f79aed8a6f0457654c1ca01753e666b99b6d809351fb2d1e4c12618"' in s
          assert 'VERSION_NAME="0.9726582"' in s and 'VERSION_BUILD="26582"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 4 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26582 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          main='\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n'
          assert main in s
          snap='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert snap in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          print('PASS sealed Python syntax + exact successful 26581 authority-seeded verification order inheritance')
          PY
          grep -F 'no-HDR-tail scene must preserve exact 26581 base scene-white decision' REGRESSION_V1_26582_ADAPTIVE_GLOBAL_TONE.txt >/dev/null
          grep -F 'motionv2_jpeg444_jni.cpp must remain byte-identical SHA-256 d73cd24452280958f089e9124545a81461939e8fa0c9c95272b2825942e4b43d' REGRESSION_V1_26582_CARRIED_FAILURES.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26582_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26582_' .github/workflows --exclude='build-26582-v1-adaptive-global-tone.yml'
          ! grep -R -F 'handoff_payload_26582_v1' .github/workflows --exclude='build-26582-v1-adaptive-global-tone.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26582 candidate from successful compiled 26581 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26582_v1_adaptive_global_tone.sh

      - name: Upload 26582 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26582-v1-adaptive-global-tone
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726582-26582-v1-adaptive-global-tone-debug.apk
            build_26582_v1_adaptive_global_tone_outputs/
