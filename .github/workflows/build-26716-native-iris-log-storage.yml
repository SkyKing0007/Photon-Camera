name: Build 26716 Native Iris Log Storage
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26716_README_UPLOAD.txt'
      - '26716_*'
      - 'build_26716_native_iris_log_storage.sh'
      - 'transform_26716.py'
      - 'validate_26716.py'
      - 'verify_26716_*.py'
      - 'handoff_payload_26716/**'
      - '.github/workflows/build-26716-native-iris-log-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26716 handoff and exact successful 26715 mechanics
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26716_HANDOFF_HASHES.sha256
          python3 -S verify_26716_infrastructure.py build_26716_native_iris_log_storage.sh .github/workflows/build-26716-native-iris-log-storage.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26716 candidate from successful 26715 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26716_native_iris_log_storage.sh
      - name: Verify exact 26716 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726716-26716-native-iris-log-storage-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726716-26716-native-iris-log-storage-debug.apk' build_26716_native_iris_log_storage_outputs/26716_APK.sha256
      - name: Upload 26716 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26716-native-iris-log-storage
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726716-26716-native-iris-log-storage-debug.apk
            build_26716_native_iris_log_storage_outputs/
