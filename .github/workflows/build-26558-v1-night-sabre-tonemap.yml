name: Build 26558 V1 Night Sabre + Adaptive Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26558_*'
      - 'build_26558_v1_night_sabre_tonemap.sh'
      - 'validate_26558_v1_night_sabre_tonemap.py'
      - 'extract_26558_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26558.py'
      - '.github/workflows/build-26558-v1-night-sabre-tonemap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26558 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26558_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26558_v1_night_sabre_tonemap.py extract_26558_runtime_glsl.py scan_glsl_reserved_identifiers_26558.py
          python3 validate_26558_v1_night_sabre_tonemap.py --self-test
          python3 extract_26558_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26558.py --self-test
          bash -n build_26558_v1_night_sabre_tonemap.sh
          grep -F 'BASE_SUCCESS_COMMIT="b080e8c2794e9ca7a59f9dc5cbbed7915a4a4aed"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'HANDOFF_PARENT_COMMIT="a08e153984ca76caa6b417298baac7b979b5306c"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26556-v1-before-26558-night-sabre-tonemap"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BASE_RUN_ID="33223417490"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9706067486"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="d0fbe9ceb8ebbe9d7fa18eb7f1acd8523f42eda3d0808dcc3e1c43a64273abb7"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BASE_TAR_SHA="33d8dede08886e67c171323ff074e3b5618420ec99ef15cc2cda75340a3b13b8"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="aa0a28cbe2cb7a71943e35f8ba715190b6011e34e07c74cd08cc6bd034ccd500"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="348a615d62529bd9019bbd4d1634a1c54645d00f2d702e457cdabeb53289ac8c"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726558"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F 'VERSION_BUILD="26558"' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26558_v1_night_sabre_tonemap.sh >/dev/null
          ! grep -F 'V1_26558_' .github/workflows/build-26557-v1-jin-chroma-safe-fast.yml

      - name: Build exact 26558 candidate from successful compiled 26556 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26558_v1_night_sabre_tonemap.sh
          ./build_26558_v1_night_sabre_tonemap.sh

      - name: Upload 26558 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26558-v1-night-sabre-tonemap
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726558-26558-v1-night-sabre-tonemap-debug.apk
            build_26558_v1_night_sabre_tonemap_outputs/
