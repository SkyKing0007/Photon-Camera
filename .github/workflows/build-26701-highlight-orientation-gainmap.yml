name: Build 26701 Highlight + Orientation + Gainmap

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26701_README_UPLOAD.txt'
      - '26701_*'
      - 'build_26701_highlight_orientation_gainmap.sh'
      - 'transform_26701.py'
      - 'validate_26701.py'
      - 'verify_26701_*.py'
      - 'handoff_payload_26701/**'
      - '.github/workflows/build-26701-highlight-orientation-gainmap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26701 handoff and exact successful 26700 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26701_HANDOFF_HASHES.sha256
          bash -n build_26701_highlight_orientation_gainmap.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26701.py','validate_26701.py','verify_26701_authority.py','verify_26701_infrastructure.py','verify_26701_patches.py','verify_26701_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26701 candidate from successful 26700 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26701_highlight_orientation_gainmap.sh
      - name: Verify exact 26701 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726701-26701-highlight-orientation-gainmap-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726701-26701-highlight-orientation-gainmap-debug.apk" build_26701_highlight_orientation_gainmap_outputs/26701_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26701_highlight_orientation_gainmap_outputs/26701_apk_jni_contract.txt
      - name: Upload 26701 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26701-highlight-orientation-gainmap
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726701-26701-highlight-orientation-gainmap-debug.apk
            build_26701_highlight_orientation_gainmap_outputs/
