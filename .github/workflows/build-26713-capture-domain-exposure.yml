name: Build 26713 Capture-Domain Exposure
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26713_README_UPLOAD.txt'
      - '26713_*'
      - 'build_26713_capture_domain_exposure.sh'
      - 'transform_26713.py'
      - 'validate_26713.py'
      - 'verify_26713_*.py'
      - 'handoff_payload_26713/**'
      - '.github/workflows/build-26713-capture-domain-exposure.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26713 handoff and exact successful 26712 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26713_HANDOFF_HASHES.sha256
          bash -n build_26713_capture_domain_exposure.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26713.py','validate_26713.py','verify_26713_authority.py','verify_26713_patches.py','verify_26713_regressions.py','verify_26713_shaders.py','verify_26713_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26713_infrastructure.py build_26713_capture_domain_exposure.sh .github/workflows/build-26713-capture-domain-exposure.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26713 candidate from successful 26712 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26713_capture_domain_exposure.sh
      - name: Verify exact 26713 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726713-26713-capture-domain-exposure-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726713-26713-capture-domain-exposure-debug.apk' build_26713_capture_domain_exposure_outputs/26713_APK.sha256
      - name: Upload 26713 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26713-capture-domain-exposure
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726713-26713-capture-domain-exposure-debug.apk
            build_26713_capture_domain_exposure_outputs/
