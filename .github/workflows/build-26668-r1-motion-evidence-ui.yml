name: Build 26668 R1 Motion Evidence UI

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26668_R1_README_UPLOAD.txt'
      - 'R1_26668_*'
      - 'build_26668_r1_motion_evidence_ui.sh'
      - 'transform_26668.py'
      - 'validate_26668.py'
      - 'verify_26668_*.py'
      - 'handoff_payload_26668/**'
      - '.github/workflows/build-26668-r1-motion-evidence-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26668 handoff and exact successful 26667 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26668_HANDOFF_HASHES.sha256
          bash -n build_26668_r1_motion_evidence_ui.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26668.py','validate_26668.py','verify_26668_authority.py','verify_26668_infrastructure.py','verify_26668_patches.py','verify_26668_regressions.py','verify_26668_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26668 candidate from successful 26667 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26668_r1_motion_evidence_ui.sh
      - name: Verify exact 26668 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726668-26668-r1-motion-evidence-ui-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726668-26668-r1-motion-evidence-ui-debug.apk" build_26668_r1_motion_evidence_ui_outputs/26668_R1_APK.sha256
      - name: Upload 26668 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26668-r1-motion-evidence-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726668-26668-r1-motion-evidence-ui-debug.apk
            build_26668_r1_motion_evidence_ui_outputs/
