name: Build 26740 Wronski Confidence Highlight Integrity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26740_README_UPLOAD.txt'
      - '26740_*'
      - 'build_26740_wronski_confidence_highlight_integrity.sh'
      - 'transform_26740.py'
      - 'validate_26740.py'
      - 'verify_26740_*.py'
      - 'handoff_payload_26740/**'
      - '.github/workflows/build-26740-wronski-confidence-highlight-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26740 handoff and exact successful 26739 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26740_HANDOFF_HASHES.sha256
          python3 -S verify_26740_infrastructure.py build_26740_wronski_confidence_highlight_integrity.sh .github/workflows/build-26740-wronski-confidence-highlight-integrity.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26740 candidate with successful 26739 procedure from exact successful 26739 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26740_wronski_confidence_highlight_integrity.sh
      - name: Verify exact 26740 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726740-26740-wronski-confidence-highlight-integrity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726740-26740-wronski-confidence-highlight-integrity-debug.apk' build_26740_wronski_confidence_highlight_integrity_outputs/26740_APK.sha256
      - name: Upload 26740 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26740-wronski-confidence-highlight-integrity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726740-26740-wronski-confidence-highlight-integrity-debug.apk
            build_26740_wronski_confidence_highlight_integrity_outputs/
