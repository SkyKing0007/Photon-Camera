name: Build 26748 Temporal RAW Chroma Provenance
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26748_README_UPLOAD.txt'
      - '26748_*'
      - 'build_26748_temporal_raw_chroma_provenance.sh'
      - 'transform_26748.py'
      - 'validate_26748.py'
      - 'verify_26748_*.py'
      - 'handoff_payload_26748/**'
      - '.github/workflows/build-26748-temporal-raw-chroma-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26748 handoff and exact successful 26747 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26748_HANDOFF_HASHES.sha256
          python3 -S verify_26748_infrastructure.py build_26748_temporal_raw_chroma_provenance.sh .github/workflows/build-26748-temporal-raw-chroma-provenance.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26748 candidate with successful 26747 procedure from exact successful 26747 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26748_temporal_raw_chroma_provenance.sh
      - name: Verify exact 26748 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726748-26748-temporal-raw-chroma-provenance-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726748-26748-temporal-raw-chroma-provenance-debug.apk' build_26748_temporal_raw_chroma_provenance_outputs/26748_APK.sha256
      - name: Upload 26748 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26748-temporal-raw-chroma-provenance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726748-26748-temporal-raw-chroma-provenance-debug.apk
            build_26748_temporal_raw_chroma_provenance_outputs/
