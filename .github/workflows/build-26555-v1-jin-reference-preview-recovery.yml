name: Build 26555 V1 Jin Reference + Preview Recovery

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26555_*'
      - 'build_26555_v1_jin_reference_preview_recovery.sh'
      - 'validate_26555_v1_jin_reference_preview_recovery.py'
      - 'extract_26555_protected_glsl.py'
      - 'scan_glsl_reserved_identifiers_26555.py'
      - '.github/workflows/build-26555-v1-jin-reference-preview-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26555 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26555_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26555_v1_jin_reference_preview_recovery.py extract_26555_protected_glsl.py scan_glsl_reserved_identifiers_26555.py
          python3 validate_26555_v1_jin_reference_preview_recovery.py --self-test
          python3 extract_26555_protected_glsl.py /dev/null .extractor-selftest-unused --self-test
          rm -rf .extractor-selftest-unused
          python3 scan_glsl_reserved_identifiers_26555.py --self-test
          bash -n build_26555_v1_jin_reference_preview_recovery.sh
          grep -F 'BASE_RUN_ID="33187394947"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9692405053"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="a4fa7ff17f4998d126396b301e254e9a0dd33693"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26554-v1-before-26555-jin-preview-architecture"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'BASE_TAR_SHA="01c0fd55a288a972168612a86a7430cbed975b570019438e57926c110659fd34"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="93157b96250eecca785695ba21de71ab3d52e0434b16c5f22bddc2afb8714325"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="fac620a2decc10bc23d22531236a0eef589d8f9778f6be3bec529c8c48b8339f"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726555"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'VERSION_BUILD="26555"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26555_v1_jin_reference_preview_recovery.sh >/dev/null
          # Trigger isolation: successful 26554 workflow must not react to V1_26555 files.
          ! grep -F "V1_26555_" .github/workflows/build-26554-v1-night-recovery-jin-processing-guard.yml

      - name: Build exact 26555 V1 candidate from successful compiled 26554 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26555_v1_jin_reference_preview_recovery.sh
          ./build_26555_v1_jin_reference_preview_recovery.sh

      - name: Upload 26555 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26555-v1-jin-reference-preview-recovery
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726555-26555-v1-jin-reference-preview-recovery-debug.apk
            build_26555_v1_jin_reference_preview_recovery_outputs/
