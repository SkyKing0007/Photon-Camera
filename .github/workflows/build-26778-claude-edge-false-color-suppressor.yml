name: Build 26778 Claude Edge False Color Suppressor
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26778.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26778 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26778.txt
          grep -Fx 'RUN_26778_CLAUDE_EDGE_FALSE_COLOR_SUPPRESSOR' TRIGGER_26778.txt
          sha256sum -c 26778_HANDOFF_HASHES.sha256
          bash -n build_26778_claude_edge_false_color_suppressor.sh
          python3 -S -m py_compile transform_26778.py validate_26778.py verify_26778_patches.py verify_26778_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26778_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26778_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26778 candidate from successful 26777 authority using unchanged successful procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26778_claude_edge_false_color_suppressor.sh
      - name: Verify exact 26778 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726778-26778-claude-edge-false-color-suppressor-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726778-26778-claude-edge-false-color-suppressor-debug.apk' build_26778_claude_edge_false_color_suppressor_outputs/26778_APK.sha256
      - name: Upload 26778 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26778-claude-edge-false-color-suppressor
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726778-26778-claude-edge-false-color-suppressor-debug.apk
            build_26778_claude_edge_false_color_suppressor_outputs/
