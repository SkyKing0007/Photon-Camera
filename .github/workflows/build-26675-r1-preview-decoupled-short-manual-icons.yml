name: Build 26675 R1 Preview-Decoupled HDR + SHORT + Manual Icons

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26675_R1_README_UPLOAD.txt'
      - 'R1_26675_*'
      - 'build_26675_r1_preview_decoupled_short_manual_icons.sh'
      - 'transform_26675.py'
      - 'validate_26675.py'
      - 'verify_26675_*.py'
      - 'handoff_payload_26675/**'
      - '.github/workflows/build-26675-r1-preview-decoupled-short-manual-icons.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26675 handoff and exact successful 26674 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26675_HANDOFF_HASHES.sha256
          bash -n build_26675_r1_preview_decoupled_short_manual_icons.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26675.py','validate_26675.py','verify_26675_authority.py','verify_26675_infrastructure.py','verify_26675_patches.py','verify_26675_regressions.py','verify_26675_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26675 candidate from successful 26674 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26675_r1_preview_decoupled_short_manual_icons.sh
      - name: Verify exact 26675 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726675-26675-r1-preview-decoupled-short-manual-icons-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726675-26675-r1-preview-decoupled-short-manual-icons-debug.apk" build_26675_r1_preview_decoupled_short_manual_icons_outputs/26675_R1_APK.sha256
      - name: Upload 26675 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26675-r1-preview-decoupled-short-manual-icons
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726675-26675-r1-preview-decoupled-short-manual-icons-debug.apk
            build_26675_r1_preview_decoupled_short_manual_icons_outputs/
