name: Build 26626 R1 Bounded Source Structure + SHORT Proof

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26626_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26626_*'
      - 'R1_26626_*'
      - 'build_26626_r1_bounded_source_structure_short_proof.sh'
      - 'transform_26626_r1.py'
      - 'validate_26626_r1.py'
      - 'verify_26626_r1_*.py'
      - 'handoff_payload_26626_r1/**'
      - '.github/workflows/build-26626-r1-bounded-source-structure-short-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26626 package and exact successful 26624 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26626_HANDOFF_HASHES.sha256
          bash -n build_26626_r1_bounded_source_structure_short_proof.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26626_r1.py','validate_26626_r1.py','verify_26626_r1_authority.py','verify_26626_r1_infrastructure.py','verify_26626_r1_patches.py','verify_26626_r1_regressions.py','verify_26626_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26626 candidate from successful compiled 26625 R3 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26626_r1_bounded_source_structure_short_proof.sh
      - name: Upload 26626 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26626-r1-bounded-source-structure-short-proof
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726626-26626-r1-bounded-source-structure-short-proof-debug.apk
            build_26626_r1_bounded_source_structure_short_proof_outputs/
