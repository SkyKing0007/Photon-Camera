name: Build 26683 R1 Spektra End-to-End Owner

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26683_R1_README_UPLOAD.txt'
      - 'R1_26683_*'
      - 'build_26683_r1_spektra_end_to_end_owner.sh'
      - 'transform_26683.py'
      - 'validate_26683.py'
      - 'verify_26683_*.py'
      - 'handoff_payload_26683/**'
      - '.github/workflows/build-26683-r1-spektra-end-to-end-owner.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26683 handoff and exact successful 26682 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26683_HANDOFF_HASHES.sha256
          bash -n build_26683_r1_spektra_end_to_end_owner.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26683.py','validate_26683.py','verify_26683_authority.py','verify_26683_infrastructure.py','verify_26683_patches.py','verify_26683_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26683 candidate from successful 26682 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26683_r1_spektra_end_to_end_owner.sh
      - name: Verify exact 26683 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726683-26683-r1-spektra-end-to-end-owner-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726683-26683-r1-spektra-end-to-end-owner-debug.apk" build_26683_r1_spektra_end_to_end_owner_outputs/26683_R1_APK.sha256
      - name: Upload 26683 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26683-r1-spektra-end-to-end-owner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726683-26683-r1-spektra-end-to-end-owner-debug.apk
            build_26683_r1_spektra_end_to_end_owner_outputs/
