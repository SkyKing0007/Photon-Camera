name: Build 26498 Root Architecture

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26494_successful_app_source.tar.gz'
      - '26494_successful_after.sha256'
      - '26498_source_delta_from_exact_26494.patch'
      - 'validate_26498_root_architecture.py'
      - 'build_26498_root_architecture_v1.sh'
      - '.github/workflows/build-26498-root-architecture-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact tested 26497 backup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="00deeae2c82518511988ca6267b2e6071300cba6"
          BACKUP="backup-26497-tested-regression-before-26498-root-architecture"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED" ]] || { echo "::error::backup mismatch $BACKUP=$actual expected=$EXPECTED"; exit 1; }
          echo "PASS: exact tested 26497 backup $BACKUP=$actual"

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then glslangValidator --version | head -1; exit 0; fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26498 package identity and root-math preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha(){ local file="$1" expected="$2" actual; actual="$(sha256sum "$file" | awk '{print $1}')"; echo "IDENTITY: $file actual=$actual expected=$expected"; [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }; }
          check_sha 26494_successful_app_source.tar.gz "ee4ccb614d9cb216e2e39a76adc8f72ce9fe2a07daa75eb6f705e958502e010b"
          check_sha 26494_successful_after.sha256 "939a7555adaf1b9859e8fc9e40798b38ac5b85343dfbdb45cfe34a4a88b500c7"
          check_sha 26498_source_delta_from_exact_26494.patch "988691939ff9ac70a6c0ece1eae03a44c5d0f46cb4a541448c94bd10ad0106a3"
          check_sha validate_26498_root_architecture.py "cf0a86765bb078c5f7c611b3d20b3a9cada1a42e5bd623ee98ac0da84cc14f83"
          check_sha build_26498_root_architecture_v1.sh "451bd223c9897d6dd1ceaf4ad2f09ccdacd62970dcee0a8f696109ce452cf1e8"
          bash -n build_26498_root_architecture_v1.sh
          python3 -m py_compile validate_26498_root_architecture.py
          python3 validate_26498_root_architecture.py
          [[ "$(wc -l < 26494_successful_after.sha256)" -eq 856 ]]
          echo "PASS: 26498 package identity + syntax + root architecture preflight"

      - name: Build guarded 26498 APK
        shell: bash
        run: |
          chmod +x build_26498_root_architecture_v1.sh
          ./build_26498_root_architecture_v1.sh

      - name: Upload 26498 APK and complete next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26498-root-architecture
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726498-26498-root-architecture-debug.apk
            build_26498_outputs/**
