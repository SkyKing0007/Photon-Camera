name: Build 26516 v2 Direct Tested-26515 Profile + Viewfinder Match

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26516_profile_viewfinder_match.py
      - validate_26516_profile_viewfinder_match.py
      - patch_26516_derived_builder.py
      - build_26516_profile_viewfinder_match.sh
      - 26516_BASE_26515_COMMIT.txt
      - 26516_README_UPLOAD.txt
      - 26516_HANDOFF_HASHES.sha256
      - .github/workflows/build-26516-profile-viewfinder-match.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26516-profile-viewfinder-match-v2
  cancel-in-progress: false

jobs:
  build:
    name: Direct tested 26515 source to 26516
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify v2 direct-26515 handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26516_HANDOFF_HASHES.sha256
          bash -n build_26516_profile_viewfinder_match.sh
          python3 -m py_compile apply_26516_profile_viewfinder_match.py validate_26516_profile_viewfinder_match.py
          [[ "$(tr -d '\r\n' < 26516_BASE_26515_COMMIT.txt)" == "01a53d2301dc32a246eba52e3d2e965f7a498cfd" ]]
          grep -F 'SUCCESSFUL_26515_HEAD="01a53d2301dc32a246eba52e3d2e965f7a498cfd"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26515-short-bento-domain.yml"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26515-short-bento-domain-v4"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F '26515_candidate_app_source.tar.gz' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'gh run download' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'DISABLED_26516_DIRECT_26515_SOURCE' patch_26516_derived_builder.py >/dev/null
          grep -F 'VERSION_NAME="0.9726516"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'VERSION_BUILD="26516"' build_26516_profile_viewfinder_match.sh >/dev/null
          python3 - <<'PYNOHIST'
          from pathlib import Path
          s=Path('build_26516_profile_viewfinder_match.sh').read_text()
          bad=(
              'build_'+'26512','apply_'+'26513','validate_'+'26513',
              'apply_'+'26514','validate_'+'26514','apply_'+'26515','validate_'+'26515',
              'derived_from_exact_'+'26512','candidate'+'26512','golden'+'26513')
          assert not [x for x in bad if x in s]
          print('PASS: 26516 builder has no historical runtime constructor invocation')
          PYNOHIST
          grep -F 'FAILED_26516_V1_HEAD="b4461c6c969fd56fee8f353bd58bc444cbb59aee"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'BACKUP_26516_V1="backup-26516-v1-before-handoff-gate-fix-20260820"' build_26516_profile_viewfinder_match.sh >/dev/null
          grep -F 'IRIS_26516_V2_ARTIFACT_BYTE_AUTHORITY' build_26516_profile_viewfinder_match.sh >/dev/null
          python3 - <<'PYNOBRITTLE'
          from pathlib import Path
          s=Path('build_26516_profile_viewfinder_match.sh').read_text()
          stale=('c1feb33087bb7436f0d7fa18489458d3d84594cc','05a850c5a7df1f338c448c84e59e188ebdcf71a1','748b94327da96fa0b2fc6d8a5750dc07651c4796','552576a32166acfd674dacd6d2a7a1958a797317','3d2b6aa7f2997b8ce9d9f43523967672f17d003c')
          assert not [x for x in stale if x in s]
          print('PASS: v2 contains no repository-placeholder SHA assumptions for 26515 runtime')
          PYNOBRITTLE
          echo 'PASS: v2 handoff is direct-tested-26515 only; no historical runtime reconstruction' 

      - name: Build guarded 26516 from successful 26515 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26516_profile_viewfinder_match.sh apply_26516_profile_viewfinder_match.py validate_26516_profile_viewfinder_match.py
          ./build_26516_profile_viewfinder_match.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26516-profile-viewfinder-match-v2
          path: |
            IrisCamera-0.9726516-26516-profile-viewfinder-match-debug.apk
            build_26516_profile_viewfinder_match_outputs/
          if-no-files-found: warn
