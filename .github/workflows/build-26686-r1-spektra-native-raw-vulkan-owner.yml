name: Build 26686 R1 Spektra Native RAW Vulkan Owner

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26686_R1_README_UPLOAD.txt'
      - 'R1_26686_*'
      - 'build_26686_r1_spektra_native_raw_vulkan_owner.sh'
      - 'transform_26686.py'
      - 'validate_26686.py'
      - 'verify_26686_*.py'
      - 'handoff_payload_26686/**'
      - '.github/workflows/build-26686-r1-spektra-native-raw-vulkan-owner.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26686 handoff and exact successful 26685 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26686_HANDOFF_HASHES.sha256
          bash -n build_26686_r1_spektra_native_raw_vulkan_owner.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26686.py','validate_26686.py','verify_26686_authority.py','verify_26686_infrastructure.py','verify_26686_patches.py','verify_26686_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26686 candidate from successful 26685 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26686_r1_spektra_native_raw_vulkan_owner.sh
      - name: Verify exact 26686 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726686-26686-r1-spektra-native-raw-vulkan-owner-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726686-26686-r1-spektra-native-raw-vulkan-owner-debug.apk" build_26686_r1_spektra_native_raw_vulkan_owner_outputs/26686_R1_APK.sha256
      - name: Upload 26686 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26686-r1-spektra-native-raw-vulkan-owner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726686-26686-r1-spektra-native-raw-vulkan-owner-debug.apk
            build_26686_r1_spektra_native_raw_vulkan_owner_outputs/
