name: Build 26837 Device-Safe Final Clip-Zone Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26837.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26837 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26837.txt
          grep -Fx 'RUN_26837_DEVICE_SAFE_FINAL_CLIP_ZONE_CHROMA' TRIGGER_26837.txt
          sha256sum -c 26837_HANDOFF_HASHES.sha256
          bash -n build_26837_device_safe_final_clip_zone_chroma.sh
          python3 -S -m py_compile transform_26837.py validate_26837.py verify_26837_patches.py verify_26837_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26837_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26837_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26837 candidate from successful 26836 authority using exact successful 26836 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26837_device_safe_final_clip_zone_chroma.sh
      - name: Verify exact 26837 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726837-26837-device-safe-final-clip-zone-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726837-26837-device-safe-final-clip-zone-chroma-debug.apk' build_26837_device_safe_final_clip_zone_chroma_outputs/26837_APK.sha256
      - name: Upload 26837 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26837-device-safe-final-clip-zone-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726837-26837-device-safe-final-clip-zone-chroma-debug.apk
            build_26837_device_safe_final_clip_zone_chroma_outputs/
