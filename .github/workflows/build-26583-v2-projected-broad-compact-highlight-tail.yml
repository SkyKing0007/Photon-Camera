name: Build 26583 V2 Projected Broad + Compact Highlight Tail

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V2_26583_*'
      - 'REGRESSION_V2_26583_*'
      - 'build_26583_v2_projected_broad_compact_highlight_tail.sh'
      - 'transform_26583_v2.py'
      - 'validate_26583_v2.py'
      - 'verify_26583_v2_authority.py'
      - 'verify_26583_v2_regressions.py'
      - 'verify_26583_v2_patches.py'
      - 'verify_26583_v2_shaders.py'
      - 'handoff_payload_26583_v2/**'
      - '.github/workflows/build-26583-v2-projected-broad-compact-highlight-tail.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26583 V2 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V2_26583_HANDOFF_HASHES.sha256
          bash -n build_26583_v2_projected_broad_compact_highlight_tail.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26583_v2.py','validate_26583_v2.py','verify_26583_v2_authority.py','verify_26583_v2_regressions.py','verify_26583_v2_patches.py','verify_26583_v2_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26583_v2_projected_broad_compact_highlight_tail.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="d815e5ab71ef527a70b955c856e3b9d62f897b6a"' in s
          assert 'BASE_RUN_ID="33691354043"' in s
          assert 'BASE_JOB_ID="100450561860"' in s
          assert 'BASE_ARTIFACT_ID="9870236053"' in s
          assert 'BASE_ARTIFACT_SHA="10cbe4dca23ab25488077f97f7c4a8df22aac5d34173be48cb1a3e9e304136f6"' in s
          assert 'BASE_TAR_SHA="67dfb57612dc131ec77d8dfaaa84928cf3bffd22f4a5f1d49b90f4e7bb6866a0"' in s
          assert 'VERSION_NAME="0.9726583"' in s and 'VERSION_BUILD="26583"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 4 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26583 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert '[[ "$(git rev-parse HEAD^)" == "$BASE_SUCCESS_COMMIT" ]]' in s
          print('PASS sealed syntax + successful 26582 V2 authority + inherited compiler/build order')
          PY
          grep -F 'no-HDR-tail scene must preserve exact 26582 base scene-white decision' REGRESSION_V2_26583_ADAPTIVE_GLOBAL_TONE.txt >/dev/null
          grep -F 'motionv2_jpeg444_jni.cpp must remain byte-identical SHA-256 d73cd24452280958f089e9124545a81461939e8fa0c9c95272b2825942e4b43d' REGRESSION_V2_26583_CARRIED_FAILURES.txt >/dev/null
          grep -F 'no verification gate is weakened' V2_26583_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V2_26583_' .github/workflows --exclude='build-26583-v2-projected-broad-compact-highlight-tail.yml'
          ! grep -R -F 'handoff_payload_26583_v2' .github/workflows --exclude='build-26583-v2-projected-broad-compact-highlight-tail.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26583 candidate from successful compiled 26582 V2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26583_v2_projected_broad_compact_highlight_tail.sh

      - name: Upload 26583 V2 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26583-v2-projected-broad-compact-highlight-tail
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726583-26583-v2-projected-broad-compact-highlight-tail-debug.apk
            build_26583_v2_projected_broad_compact_highlight_tail_outputs/
