name: Build 26563 V1 Universal Adaptive Color Appearance

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26563_*'
      - 'build_26563_v1_universal_adaptive_color_appearance.sh'
      - 'transform_26563_v1_universal_adaptive_color_appearance.py'
      - 'validate_26563_v1_universal_adaptive_color_appearance.py'
      - 'extract_26563_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26563.py'
      - '.github/workflows/build-26563-v1-universal-adaptive-color-appearance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26563 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26563_HANDOFF_HASHES.sha256
          python3 -m py_compile transform_26563_v1_universal_adaptive_color_appearance.py validate_26563_v1_universal_adaptive_color_appearance.py extract_26563_runtime_glsl.py scan_glsl_reserved_identifiers_26563.py
          python3 validate_26563_v1_universal_adaptive_color_appearance.py --self-test
          python3 extract_26563_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26563.py --self-test
          bash -n build_26563_v1_universal_adaptive_color_appearance.sh
          grep -F 'BASE_SUCCESS_COMMIT="3a7f9c192eecd4ecefc53491e0acfb928478c21e"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'BASE_RUN_ID="33275727405"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9721461694"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="7943c16ae154922123060d27b6cd7a35802e800f098ee2fa8bbed5fb13599700"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'BASE_TAR_SHA="e9ae4395a5df906eb34a1ec1feeeb6c6b6a944f349ab66686adcfa8b6a6baea0"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26562-v1-1-before-26563-universal-adaptive-color-appearance"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726563"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'VERSION_BUILD="26563"' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'run_preinstall_vendor_authority_regression' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'run_live_repository_extras_scope_regression' build_26563_v1_universal_adaptive_color_appearance.sh >/dev/null
          grep -F 'PASS exact 4-file 26563 runtime allowlist' validate_26563_v1_universal_adaptive_color_appearance.py >/dev/null
          grep -F 'explicit positive saturation semantic gate failed' validate_26563_v1_universal_adaptive_color_appearance.py >/dev/null
          ! grep -Eq '  /' V1_26563_PREWRITE_SOURCE_HASHES.sha256
          ! grep -R -F 'V1_26563_' .github/workflows --exclude='build-26563-v1-universal-adaptive-color-appearance.yml'

      - name: Build exact 26563 candidate from successful compiled 26562 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26563_v1_universal_adaptive_color_appearance.sh
          ./build_26563_v1_universal_adaptive_color_appearance.sh

      - name: Upload 26563 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26563-v1-universal-adaptive-color-appearance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726563-26563-v1-universal-adaptive-color-appearance-debug.apk
            build_26563_v1_universal_adaptive_color_appearance_outputs/
