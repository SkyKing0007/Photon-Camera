name: Motion V2 Curated 26462 Full Wronski

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
    paths:
      - reconstruct_motion_v2_26452.sh
      - historical_replay/**
      - apply_curated_26428_to_26453_then_wronski_26462.ps1
      - .github/workflows/motion-v2-mobile-build.yml

permissions:
  contents: read

jobs:
  curated-wronski-26462:
    name: Curate 26428-26453 + Full Wronski + Build 26462
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove immutable source baseline and curated inputs
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf

          BASE="aac8ea5a0f518142b0f8ad60ce34c9a165e4611b"
          git cat-file -e "${BASE}^{commit}"

          branch="$(git branch --show-current)"
          [[ "$branch" == "experimental-mobile-26452-cfa-to-cfa" ]] || {
            echo "FAIL: wrong Actions branch $branch"
            exit 1
          }
          [[ "$branch" != "dev" ]]

          [[ -f reconstruct_motion_v2_26452.sh ]]
          [[ -f apply_curated_26428_to_26453_then_wronski_26462.ps1 ]]
          [[ -d historical_replay ]]

          # The recovery harness must still explicitly identify the clean 26428
          # application baseline. The final Wronski transformer then starts only
          # after exact 26452 source has been reconstructed.
          grep -q 'aac8ea5a0f518142b0f8ad60ce34c9a165e4611b' reconstruct_motion_v2_26452.sh
          grep -q '0.9726452' apply_curated_26428_to_26453_then_wronski_26462.ps1
          grep -q '0.9726462' apply_curated_26428_to_26453_then_wronski_26462.ps1
          grep -q 'IRIS_26453_STRUCTURAL_EDGE_CHROMA_PROTECTION' apply_curated_26428_to_26453_then_wronski_26462.ps1
          grep -q 'IRIS_26462_WRONSKI_PUBLISHED_COARSE_TO_FINE_ALIGNMENT' apply_curated_26428_to_26453_then_wronski_26462.ps1

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: 26428 immutable source baseline + curated final transformer proven"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install deterministic Android NDK glslc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ANDROID_HOME) { throw "ANDROID_HOME is not set" }

          $SdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
              $SdkManager = Get-ChildItem `
                  -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") `
                  -Filter "sdkmanager.bat" -Recurse -File |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $SdkManager) { throw "sdkmanager.bat not found" }

          & $SdkManager "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { throw "NDK install failed" }

          $Glslc = Join-Path $env:ANDROID_HOME `
              "ndk\27.3.13750724\shader-tools\windows-x86_64\glslc.exe"
          if (-not (Test-Path -LiteralPath $Glslc -PathType Leaf)) {
              throw "deterministic glslc.exe missing"
          }
          & $Glslc --version
          if ($LASTEXITCODE -ne 0) { throw "glslc.exe failed" }

          Write-Host "PASS: deterministic NDK glslc verified"

      - name: Install and falsify-test real Khronos ESSL validator
        shell: bash
        run: |
          set -euo pipefail
          MSYS_BASH="C:/msys64/usr/bin/bash.exe"
          [[ -f "$MSYS_BASH" ]] || { echo "FAIL: MSYS2 bash missing"; exit 1; }

          "$MSYS_BASH" -lc \
            "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-glslang"

          REAL_GLSLANG="C:/msys64/ucrt64/bin/glslangValidator.exe"
          [[ -f "$REAL_GLSLANG" ]] || {
            echo "FAIL: real glslangValidator.exe missing"
            exit 1
          }
          "$REAL_GLSLANG" --version

          SMOKE="$RUNNER_TEMP/iris_26462_essl_smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"

          cat > "$SMOKE/legal.comp" <<'GLSL_OK'
          #version 310 es
          precision highp float;
          precision highp image2D;
          layout(local_size_x=1,local_size_y=1,local_size_z=1) in;
          uniform sampler2D inputTexture;
          uniform float exposureGain;
          uniform vec2 irisImageExtent;
          layout(rgba16f,binding=0) uniform highp writeonly image2D outImage;
          void main(){
              ivec2 p=ivec2(gl_GlobalInvocationID.xy);
              vec2 uv=(vec2(p)+vec2(0.5))/max(irisImageExtent,vec2(1.0));
              imageStore(outImage,p,vec4(texture(inputTexture,uv).r*exposureGain));
          }
          GLSL_OK

          "$REAL_GLSLANG" -S comp "$SMOKE/legal.comp"

          cat > "$SMOKE/invalid.comp" <<'GLSL_BAD'
          #version 310 es
          layout(local_size_x=1) in;
          void main( {
          GLSL_BAD

          if "$REAL_GLSLANG" -S comp "$SMOKE/invalid.comp" >/dev/null 2>&1; then
              echo "FAIL: ESSL validator accepted intentionally invalid source"
              exit 1
          fi

          echo "REAL_GLSLANG_VALIDATOR=$REAL_GLSLANG" >> "$GITHUB_ENV"
          echo "PASS: real Khronos ESSL validator positive/negative tests"

      - name: Parse final Wronski transformer before reconstruction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Path = Join-Path $PWD "apply_curated_26428_to_26453_then_wronski_26462.ps1"
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,[ref]$Tokens,[ref]$Errors) | Out-Null
          if ($Errors.Count -gt 0) {
              foreach ($e in $Errors) {
                  Write-Host ("line " + $e.Extent.StartLineNumber + ": " + $e.Message)
              }
              throw "final 26462 transformer PowerShell parse failed"
          }
          Write-Host "PASS: final 26462 transformer PowerShell parses"

      - name: Reconstruct curated production source through 26452
        shell: bash
        run: |
          set -euo pipefail

          # Work only in a disposable clone. The primary Actions checkout is
          # retained as immutable input/evidence.
          ROOT="${RUNNER_TEMP}/iris_curated_26462_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          REPO="$ROOT/recovery"
          EVIDENCE="$GITHUB_WORKSPACE/curated-26462-evidence"

          rm -rf "$ROOT" "$EVIDENCE" "$GITHUB_WORKSPACE/curated-26462-output"
          mkdir -p "$ROOT" "$EVIDENCE"

          git -c core.autocrlf=false clone --no-hardlinks --no-checkout . "$REPO"
          git -C "$REPO" config core.autocrlf false
          git -C "$REPO" config core.eol lf
          git -C "$REPO" checkout -B experimental-mobile-26452-cfa-to-cfa "$GITHUB_SHA"

          # Re-materialize the critical harness bytes from Git objects to make
          # the Windows checkout's newline behavior irrelevant.
          for path in reconstruct_motion_v2_26452.sh \
                      apply_curated_26428_to_26453_then_wronski_26462.ps1; do
              git -C "$REPO" cat-file blob "HEAD:$path" > "$REPO/$path.gitblob"
              mv -f "$REPO/$path.gitblob" "$REPO/$path"
          done

          chmod +x "$REPO/reconstruct_motion_v2_26452.sh"

          set +e
          (
              cd "$REPO"
              ./reconstruct_motion_v2_26452.sh
          ) 2>&1 | tee "$EVIDENCE/26428_to_26452_reconstruction.log"
          rc=${PIPESTATUS[0]}
          set -e
          [[ "$rc" -eq 0 ]] || {
              echo "FAIL: curated source reconstruction returned $rc"
              exit "$rc"
          }

          # The canonical recovery engine creates the late-history source here.
          mapfile -t candidates < <(
              find "$REPO" -type d -path '*/motion_v2_26452_real_*/late_history_repo' -print
          )
          [[ "${#candidates[@]}" -eq 1 ]] || {
              printf 'Found late-history repos:\n%s\n' "${candidates[*]:-NONE}"
              echo "FAIL: expected exactly one reconstructed late_history_repo"
              exit 1
          }
          FINAL_SRC="${candidates[0]}"

          [[ -f "$FINAL_SRC/app/version.properties" ]]
          tr -d '\r' < "$FINAL_SRC/app/version.properties" > "$EVIDENCE/26452_version.properties"
          grep -qx 'VERSION_NAME=0.9726452' "$EVIDENCE/26452_version.properties"
          grep -qx 'VERSION_BUILD=26452' "$EVIDENCE/26452_version.properties"

          # Exact audited successful 26452 source boundary.
          sha_upper(){ sha256sum "$1" | awk '{print toupper($1)}'; }
          [[ "$(sha_upper "$FINAL_SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2CfaReconstruction.java")" == \
             "1974CB5F496E1FEF36E486494E16DBBCE299725B08CD2FA69F68BC7D01AFBDF3" ]]
          [[ "$(sha_upper "$FINAL_SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2Alignment.java")" == \
             "1C26F824DA9E41B0FAF40434590585A714B4B04D09C0D903CE14FDB678D03A87" ]]
          [[ "$(sha_upper "$FINAL_SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/MotionV2CfaInput.java")" == \
             "5C9E676FFEF278405852F699CF4A3466C99175AC0A0D1A172B9DB36A0B5FF728" ]]
          [[ "$(sha_upper "$FINAL_SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/PostPipeline.java")" == \
             "BFC37A9D2000B0C54A7023C34991FE768ACC07750E08F64643029E7298993270" ]]
          [[ "$(sha_upper "$FINAL_SRC/app/src/main/assets/shaders/motionv2/denoise.glsl")" == \
             "F9F5F5F6B3A27F4005F82F91FFE2A5FF00496E406969D4AB84AB83E5CAD32BB2" ]]

          grep -q 'IRIS_26450_MOTION_V2_REFERENCE_DNG' \
              "$FINAL_SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/HdrxProcessor.java"
          grep -q 'IRIS_26445_' \
              "$FINAL_SRC/app/src/main/assets/shaders/motionv2/color_transform.glsl"
          grep -q 'IRIS_26446_TRUE_FRAME_EQUIVALENT_LOCAL_SUPPORT' \
              "$FINAL_SRC/app/src/main/assets/shaders/motionv2/direct_rgb_accumulate.glsl"

          printf '%s\n' "$FINAL_SRC" > "$GITHUB_WORKSPACE/curated-26462-source-path.txt"

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: exact curated 26452 source boundary reconstructed from 26428"

      - name: Apply isolated 26453 and full published-Wronski 26462
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $SourcePathFile = Join-Path $PWD "curated-26462-source-path.txt"
          if (-not (Test-Path -LiteralPath $SourcePathFile -PathType Leaf)) {
              throw "curated source path file missing"
          }
          $SourceRepo = (Get-Content -LiteralPath $SourcePathFile -Raw).Trim()
          if (-not (Test-Path -LiteralPath $SourceRepo -PathType Container)) {
              throw "curated source repository missing: $SourceRepo"
          }

          $Transformer = Join-Path $PWD "apply_curated_26428_to_26453_then_wronski_26462.ps1"
          & pwsh -NoLogo -NoProfile -File $Transformer -Repo $SourceRepo
          if ($LASTEXITCODE -ne 0) {
              throw "curated 26453 + Wronski 26462 transformer failed"
          }

      - name: Verify and package only final 26462
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(tr -d '\r\n' < curated-26462-source-path.txt)"
          EVIDENCE="$GITHUB_WORKSPACE/curated-26462-evidence"
          OUT="$GITHUB_WORKSPACE/curated-26462-output"
          mkdir -p "$OUT" "$EVIDENCE"

          tr -d '\r' < "$SRC/app/version.properties" > "$EVIDENCE/final_version.properties"
          grep -qx 'VERSION_NAME=0.9726462' "$EVIDENCE/final_version.properties"
          grep -qx 'VERSION_BUILD=26462' "$EVIDENCE/final_version.properties"

          grep -q 'IRIS_26453_STRUCTURAL_EDGE_CHROMA_PROTECTION' \
              "$SRC/app/src/main/assets/shaders/motionv2/denoise.glsl"
          grep -q 'IRIS_26462_WRONSKI_DIRECT_RGB_FINAL_OWNER' \
              "$SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2CfaReconstruction.java"
          grep -q 'IRIS_26462_WRONSKI_PUBLISHED_COARSE_TO_FINE_ALIGNMENT' \
              "$SRC/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2WronskiAlignment.java"

          # Explicit reject proof: later no-change/diagnostic production markers
          # must not be present in the final active source.
          ! grep -R -q 'IRIS_26460_CROSS_PHASE_PLATEAU_CHROMA' "$SRC/app/src/main"
          ! grep -R -q 'IRIS_26461_MATRIX_AWARE_CHROMA_LIMITER' "$SRC/app/src/main"

          mapfile -t apks < <(find "$SRC" -maxdepth 1 -type f \
              -name 'IrisCamera-0.9726462-26462-*.apk' -print)
          [[ "${#apks[@]}" -eq 1 ]] || {
              printf '26462 root APKs:\n%s\n' "${apks[*]:-NONE}"
              echo "FAIL: expected exactly one final 26462 APK"
              exit 1
          }

          cp -p "${apks[0]}" "$OUT/"
          sha256sum "$OUT"/*.apk | tee "$EVIDENCE/26462_apk_sha256.txt"

          git -C "$SRC" diff --binary HEAD -- app \
              > "$EVIDENCE/curated_26428_to_26453_wronski_26462.patch"
          git -C "$SRC" diff --check -- app

          cat > "$EVIDENCE/RETAIN_REJECT_POLICY.txt" <<'POLICY'
          SOURCE BASELINE
          - exact committed 0.9726428 / 26428:
            aac8ea5a0f518142b0f8ad60ce34c9a165e4611b

          RETAINED PRODUCTION EVIDENCE
          - 26429 shared-guide/reference structure
          - 26430 Camera2 color/headroom ownership
          - 26431 all-retained-frame handoff; no global gyro discard
          - true Motion V2 Ultra HDR lineage
          - 26435 stable SDR/headroom + conservative UHDR
          - 26436-26439 reference/temporal/detail ownership that survived later builds
          - 26443 reference-first local ownership
          - 26445 channel/specular/highlight validity
          - 26446 true frame-equivalent support semantics
          - 26450 timestamp-owned reference RAW/DNG
          - 26452 surrounding capture/color/UHDR/support plumbing
          - 26453 structural-edge residual chroma protection

          EXCLUDED AS PRODUCTION INPUT
          - 26440-26442 diagnostics/readbacks
          - 26447/26448 no-improvement direct-RGB experiments
          - untested 26449 highlight experiment
          - 26454-26459 diagnostics/readbacks
          - 26460 cross-phase/plateau chroma: user reported no change
          - 26461 matrix-aware chroma: user reported no change

          REPLACED BY PUBLISHED-WRONSKI CORE
          - old CFA merge/demosaic reconstruction owner
          - old custom direct-RGB estimator/finalizer math

          WRONSKI CORE
          - four-level coarse-to-fine alignment factors 1,2,4,4
          - radii 1,4,4,4; L1 finest / L2 coarser
          - three inverse-compositional LK refinements per level
          - GAT + structure tensor
          - published steerable covariance equations
          - noise-aware statistical robustness
          - 5x5 local minimum robustness
          - direct physical-CFA independent R/G/B numerator/denominator
          - native-resolution linear RGB
          - no standard-Bayer merge-then-demosaic
          - sharpening disabled
          POLICY

          # Primary checkout must remain untouched.
          git diff --exit-code -- app historical_replay \
              reconstruct_motion_v2_26452.sh \
              apply_curated_26428_to_26453_then_wronski_26462.ps1

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "BUILD SUCCESSFUL"
          echo "PASS: final 0.9726462 / 26462 curated Wronski APK verified"
          echo "PASS: primary checkout remained untouched"

      - name: Upload final 26462 APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: iris-motion-26462-curated-full-wronski-${{ github.run_number }}
          path: |
            curated-26462-output/
            curated-26462-evidence/
          if-no-files-found: error
          retention-days: 14
