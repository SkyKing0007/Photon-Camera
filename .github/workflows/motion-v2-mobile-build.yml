name: Motion V2 Mobile APK Build

on:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Motion V2 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Motion V2 reconstruction safety gates
        shell: bash
        run: |
          chmod +x ./reconstruct_motion_v2_26452.sh
          ./reconstruct_motion_v2_26452.sh

      - name: Verify branch and source version
        shell: bash
        run: |
          set -euo pipefail

          echo "Git ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" != "refs/heads/experimental-mobile-26452-cfa-to-cfa" ]]; then
            echo "ERROR: Refusing to build unexpected branch: ${GITHUB_REF}"
            exit 1
          fi

          echo
          echo "app/version.properties:"
          cat app/version.properties

          echo
          echo "Gradle wrapper:"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

          echo
          echo "PRE-BUILD BRANCH SAFETY CHECK PASSED"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug --stacktrace

          echo
          echo "APK files produced:"
          find app/build/outputs/apk/debug -type f -name '*.apk' -print

          APK_COUNT="$(find app/build/outputs/apk/debug -type f -name '*.apk' | wc -l)"

          if [[ "${APK_COUNT}" -lt 1 ]]; then
            echo "ERROR: Gradle completed but no debug APK was found."
            exit 1
          fi

          echo
          echo "BUILD SUCCESSFUL APK VERIFICATION PASSED"

      - name: Collect build information
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p motion-v2-build-output

          cp app/version.properties motion-v2-build-output/version.properties

          find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -exec cp {} motion-v2-build-output/ \;

          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo
            sha256sum motion-v2-build-output/*.apk
          } > motion-v2-build-output/build-proof.txt

          cat motion-v2-build-output/build-proof.txt

      - name: Upload Motion V2 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: motion-v2-debug-${{ github.run_number }}
          path: motion-v2-build-output/
          if-no-files-found: error
          retention-days: 14