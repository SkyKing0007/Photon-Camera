name: Motion V2 Windows Native Reconstruction V12 Full Audit LF

on:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-build:
    name: Disposable Windows E2E reconstruction V12
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rematerialize exact reconstruction inputs from Git objects
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf

          INPUT_COUNT=0
          while IFS= read -r -d '' path; do
            [[ "$path" == app/* || "$path" == historical_replay/* || "$path" == "reconstruct_motion_v2_26452.sh" ]] || {
              echo "FAIL: unexpected reconstruction input path: $path"
              exit 1
            }
            tmp="${path}.iris_git_blob_tmp"
            git cat-file blob "HEAD:$path" > "$tmp"
            mv -f "$tmp" "$path"
            INPUT_COUNT=$((INPUT_COUNT + 1))
          done < <(git ls-files -z -- app historical_replay reconstruct_motion_v2_26452.sh)

          [[ "$INPUT_COUNT" -gt 100 ]] || { echo "FAIL: suspicious input count $INPUT_COUNT"; exit 1; }

          VERIFY_COUNT=0
          while IFS= read -r -d '' path; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object --no-filters "$path")"
            [[ "$actual" == "$expected" ]] || {
              echo "FAIL: committed-byte mismatch: $path"
              exit 1
            }
            VERIFY_COUNT=$((VERIFY_COUNT + 1))
          done < <(git ls-files -z -- app historical_replay reconstruct_motion_v2_26452.sh)
          [[ "$VERIFY_COUNT" -eq "$INPUT_COUNT" ]]

          EXPECTED_LAUNCHER_BLOB="c83a86610bb2cdc4bba82837d33e8800e468e796"
          [[ "$(git rev-parse HEAD:reconstruct_motion_v2_26452.sh)" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: committed V12 launcher blob mismatch"
            exit 1
          }
          [[ "$(git hash-object --no-filters reconstruct_motion_v2_26452.sh)" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: worktree V12 launcher blob mismatch"
            exit 1
          }

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: reconstruction inputs rematerialized from exact Git blobs"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify deterministic Windows NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ANDROID_HOME) { throw "ANDROID_HOME is not set" }
          $SdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            $SdkManager = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") -Filter "sdkmanager.bat" -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $SdkManager) { throw "sdkmanager.bat not found" }
          & $SdkManager "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install NDK 27.3.13750724" }
          $Glslc = Join-Path $env:ANDROID_HOME "ndk\27.3.13750724\shader-tools\windows-x86_64\glslc.exe"
          if (-not (Test-Path -LiteralPath $Glslc -PathType Leaf)) { throw "glslc.exe missing" }
          & $Glslc --version
          if ($LASTEXITCODE -ne 0) { throw "glslc.exe did not execute" }
          Write-Host "PASS: deterministic Windows NDK glslc.exe verified"

      - name: Install and falsify-test real Khronos ESSL validator
        shell: bash
        run: |
          set -euo pipefail
          MSYS_BASH="C:/msys64/usr/bin/bash.exe"
          [[ -f "$MSYS_BASH" ]] || { echo "FAIL: MSYS2 bash missing"; exit 1; }
          "$MSYS_BASH" -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-glslang"

          REAL_GLSLANG="C:/msys64/ucrt64/bin/glslangValidator.exe"
          [[ -f "$REAL_GLSLANG" ]] || { echo "FAIL: glslangValidator.exe missing"; exit 1; }
          "$REAL_GLSLANG" --version

          SMOKE="$RUNNER_TEMP/iris_v11_essl_smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE"
          cat > "$SMOKE/legal.comp" <<'GLSL'
          #version 310 es
          precision highp float;
          precision highp image2D;
          layout(local_size_x=1,local_size_y=1,local_size_z=1) in;
          uniform sampler2D inputTexture;
          uniform float exposureGain;
          uniform vec2 irisImageExtent;
          layout(rgba16f,binding=0) uniform highp writeonly image2D outImage;
          void main(){
              ivec2 p=ivec2(gl_GlobalInvocationID.xy);
              vec2 uv=(vec2(p)+vec2(0.5))/max(irisImageExtent,vec2(1.0));
              imageStore(outImage,p,vec4(texture(inputTexture,uv).r*exposureGain));
          }
          GLSL
          "$REAL_GLSLANG" -S comp "$SMOKE/legal.comp"

          cat > "$SMOKE/invalid.comp" <<'GLSL'
          #version 310 es
          layout(local_size_x=1) in;
          void main( {
          GLSL
          if "$REAL_GLSLANG" -S comp "$SMOKE/invalid.comp" >/dev/null 2>&1; then
            echo "FAIL: ESSL validator accepted intentionally invalid GLSL"
            exit 1
          fi

          echo "REAL_GLSLANG_VALIDATOR=$REAL_GLSLANG" >> "$GITHUB_ENV"
          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: real Khronos ESSL positive + negative smoke tests"

      - name: Prove branch and pinned V12 launcher
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="$(git branch --show-current)"
          [[ "$BRANCH" == "experimental-mobile-26452-cfa-to-cfa" ]] || { echo "FAIL: wrong branch $BRANCH"; exit 1; }
          [[ "$BRANCH" != "dev" ]]
          EXPECTED_LAUNCHER_BLOB="c83a86610bb2cdc4bba82837d33e8800e468e796"
          [[ "$(git rev-parse HEAD:reconstruct_motion_v2_26452.sh)" == "$EXPECTED_LAUNCHER_BLOB" ]]
          [[ "$(git hash-object --no-filters reconstruct_motion_v2_26452.sh)" == "$EXPECTED_LAUNCHER_BLOB" ]]
          grep -q 'V12 FULL-CHAIN HISTORICAL RECOVERY + LF AUDIT' reconstruct_motion_v2_26452.sh
          for tool in git bash pwsh python3 cygpath sha256sum tar base64; do command -v "$tool"; done
          echo "PASS: branch / V12 launcher / toolchain contract proven"

      - name: Full disposable Windows reconstruction and APK build
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OS:-}" == "Windows_NT" ]] || { echo "FAIL: expected Windows_NT"; exit 1; }
          [[ -n "${REAL_GLSLANG_VALIDATOR:-}" ]] || { echo "FAIL: REAL_GLSLANG_VALIDATOR missing"; exit 1; }

          AUDIT_ROOT="${RUNNER_TEMP}/iris_26452_v11_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          AUDIT_REPO="$AUDIT_ROOT/repo"
          EVIDENCE="$GITHUB_WORKSPACE/motion-v2-e2e-evidence"
          rm -rf "$AUDIT_ROOT" "$EVIDENCE" "$GITHUB_WORKSPACE/motion-v2-build-output"
          mkdir -p "$AUDIT_ROOT" "$EVIDENCE"

          git -c core.autocrlf=false clone --no-hardlinks --no-checkout . "$AUDIT_REPO"
          git -C "$AUDIT_REPO" config core.autocrlf false
          git -C "$AUDIT_REPO" config core.eol lf
          git -C "$AUDIT_REPO" checkout -B experimental-mobile-26452-cfa-to-cfa "$GITHUB_SHA"
          [[ "$(git -C "$AUDIT_REPO" rev-parse HEAD)" == "$GITHUB_SHA" ]]

          FILE_COUNT=0
          while IFS= read -r -d '' path; do
            expected="$(git -C "$AUDIT_REPO" rev-parse "HEAD:$path")"
            actual="$(git -C "$AUDIT_REPO" hash-object --no-filters "$AUDIT_REPO/$path")"
            [[ "$actual" == "$expected" ]] || { echo "FAIL: disposable byte mismatch $path"; exit 1; }
            FILE_COUNT=$((FILE_COUNT + 1))
          done < <(git -C "$AUDIT_REPO" ls-files -z app historical_replay reconstruct_motion_v2_26452.sh)
          [[ "$FILE_COUNT" -gt 100 ]]

          EXPECTED_LAUNCHER_BLOB="c83a86610bb2cdc4bba82837d33e8800e468e796"
          [[ "$(git -C "$AUDIT_REPO" rev-parse HEAD:reconstruct_motion_v2_26452.sh)" == "$EXPECTED_LAUNCHER_BLOB" ]]
          [[ "$(git -C "$AUDIT_REPO" hash-object --no-filters "$AUDIT_REPO/reconstruct_motion_v2_26452.sh")" == "$EXPECTED_LAUNCHER_BLOB" ]]

          chmod +x "$AUDIT_REPO/reconstruct_motion_v2_26452.sh"
          set +e
          (
            cd "$AUDIT_REPO"
            ./reconstruct_motion_v2_26452.sh
          ) 2>&1 | tee "$EVIDENCE/full_reconstruction.log"
          RC=${PIPESTATUS[0]}
          set -e
          [[ "$RC" -eq 0 ]] || { echo "FAIL: full disposable reconstruction returned $RC"; exit "$RC"; }

          OUT="$AUDIT_REPO/motion-v2-build-output"
          [[ -f "$OUT/version.properties" ]] || { echo "FAIL: final version.properties missing"; exit 1; }
          grep -q '^VERSION_NAME=0\.9726452$' "$OUT/version.properties"
          grep -q '^VERSION_BUILD=26452$' "$OUT/version.properties"
          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          [[ "$APK_COUNT" -ge 1 ]] || { echo "FAIL: no APK produced"; exit 1; }

          cp -a "$OUT" "$GITHUB_WORKSPACE/motion-v2-build-output"
          cp "$OUT/version.properties" "$EVIDENCE/final_version.properties"
          sha256sum "$GITHUB_WORKSPACE"/motion-v2-build-output/*.apk > "$EVIDENCE/apk_sha256.txt"

          while IFS= read -r -d '' path; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object --no-filters "$path")"
            [[ "$actual" == "$expected" ]] || { echo "FAIL: primary checkout modified $path"; exit 1; }
          done < <(git ls-files -z -- app historical_replay reconstruct_motion_v2_26452.sh)
          git diff --exit-code -- app historical_replay reconstruct_motion_v2_26452.sh

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "BUILD SUCCESSFUL"
          echo "PASS: expected 0.9726452 / 26452 APK verified"
          echo "PASS: primary checkout remained untouched"

      - name: Verify final artifact package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Output = Join-Path $PWD "motion-v2-build-output"
          $VersionFile = Join-Path $Output "version.properties"
          if (-not (Test-Path -LiteralPath $VersionFile -PathType Leaf)) { throw "version.properties missing" }
          $Version = Get-Content -LiteralPath $VersionFile -Raw
          if ($Version -notmatch '(?m)^VERSION_NAME=0\.9726452$') { throw "Final VERSION_NAME is not 0.9726452" }
          if ($Version -notmatch '(?m)^VERSION_BUILD=26452$') { throw "Final VERSION_BUILD is not 26452" }
          $Apks = @(Get-ChildItem -LiteralPath $Output -Filter "*.apk" -File)
          if ($Apks.Count -lt 1) { throw "No final APK present" }
          foreach ($Apk in $Apks) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $Apk.FullName
            Write-Host "APK: $($Apk.Name)"
            Write-Host "SHA256: $($Hash.Hash)"
          }
          Write-Host "BUILD SUCCESSFUL APK VERIFICATION PASSED"

      - name: Upload Motion V2 APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: motion-v2-windows-v11-full-audit-${{ github.run_number }}
          path: |
            motion-v2-build-output/
            motion-v2-e2e-evidence/
          if-no-files-found: error
          retention-days: 14
