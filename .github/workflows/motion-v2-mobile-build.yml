name: Motion V2 Windows Native Reconstruction

on:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-build:
    name: Disposable Windows E2E reconstruction
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rematerialize exact reconstruction inputs from Git objects
        shell: bash
        run: |
          set -euo pipefail

          git config core.autocrlf false
          git config core.eol lf

          echo "Restoring exact committed bytes for every reconstruction input..."

          INPUT_COUNT=0
          while IFS= read -r -d '' path; do
            [[ "$path" == app/* || "$path" == historical_replay/* || "$path" == "reconstruct_motion_v2_26452.sh" ]] || {
              echo "FAIL: unexpected reconstruction input path: $path"
              exit 1
            }

            tmp="${path}.iris_git_blob_tmp"
            rm -f "$tmp"

            git cat-file blob "HEAD:$path" > "$tmp" || {
              echo "FAIL: could not materialize HEAD blob for $path"
              exit 1
            }

            mv -f "$tmp" "$path"
            INPUT_COUNT=$((INPUT_COUNT + 1))
          done < <(
            git ls-files -z -- \
              app \
              historical_replay \
              reconstruct_motion_v2_26452.sh
          )

          [[ "$INPUT_COUNT" -gt 100 ]] || {
            echo "FAIL: suspicious reconstruction-input count: $INPUT_COUNT"
            exit 1
          }

          echo "PASS: rematerialized $INPUT_COUNT reconstruction inputs directly from Git blobs"

          echo
          echo "=== COMPLETE RECONSTRUCTION-INPUT BYTE PROOF ==="

          VERIFY_COUNT=0
          while IFS= read -r -d '' path; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object --no-filters "$path")"

            [[ "$actual" == "$expected" ]] || {
              echo "FAIL: committed byte mismatch after rematerialization: $path"
              echo "Expected blob: $expected"
              echo "Actual blob:   $actual"
              exit 1
            }

            VERIFY_COUNT=$((VERIFY_COUNT + 1))
          done < <(
            git ls-files -z -- \
              app \
              historical_replay \
              reconstruct_motion_v2_26452.sh
          )

          [[ "$VERIFY_COUNT" -eq "$INPUT_COUNT" ]] || {
            echo "FAIL: reconstruction-input verification count mismatch"
            exit 1
          }

          EXPECTED_LAUNCHER_BLOB="42d3cdbe4f995916c449d2784485d1fd0f851bda"
          COMMITTED_LAUNCHER_BLOB="$(git rev-parse HEAD:reconstruct_motion_v2_26452.sh)"
          WORKTREE_LAUNCHER_BLOB="$(git hash-object --no-filters reconstruct_motion_v2_26452.sh)"

          echo "Canonical launcher Git-blob proof:"
          echo "  expected=$EXPECTED_LAUNCHER_BLOB"
          echo "  committed=$COMMITTED_LAUNCHER_BLOB"
          echo "  worktree=$WORKTREE_LAUNCHER_BLOB"

          [[ "$COMMITTED_LAUNCHER_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: committed launcher Git blob is not the audited launcher"
            exit 1
          }
          [[ "$WORKTREE_LAUNCHER_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: rematerialized launcher bytes do not reproduce the audited Git blob"
            exit 1
          }

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: app/, historical_replay/, and launcher are exact committed bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify deterministic Windows NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not set"
          }

          $SdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            $SdkManager = Get-ChildItem `
              -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") `
              -Filter "sdkmanager.bat" `
              -Recurse `
              -File |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $SdkManager -or -not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            throw "sdkmanager.bat not found"
          }

          & $SdkManager "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install NDK 27.3.13750724"
          }

          $Glslc = Join-Path $env:ANDROID_HOME "ndk\27.3.13750724\shader-tools\windows-x86_64\glslc.exe"
          if (-not (Test-Path -LiteralPath $Glslc -PathType Leaf)) {
            throw "Expected Windows NDK glslc.exe missing: $Glslc"
          }

          & $Glslc --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows NDK glslc.exe did not execute"
          }

          Write-Host "PASS: deterministic Windows NDK glslc.exe verified"

      - name: Prove branch and pinned reconstruction launcher
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$(git branch --show-current)"
          [[ "$BRANCH" == "experimental-mobile-26452-cfa-to-cfa" ]] || {
            echo "FAIL: wrong branch: $BRANCH"
            exit 1
          }
          [[ "$BRANCH" != "dev" ]] || {
            echo "FAIL: refusing dev"
            exit 1
          }

          EXPECTED_LAUNCHER_BLOB="42d3cdbe4f995916c449d2784485d1fd0f851bda"
          ACTUAL_LAUNCHER_BLOB="$(git rev-parse HEAD:reconstruct_motion_v2_26452.sh)"
          ACTUAL_WORKTREE_BLOB="$(git hash-object --no-filters reconstruct_motion_v2_26452.sh)"

          echo "Pinned reconstruction launcher Git blob:"
          echo "  expected=$EXPECTED_LAUNCHER_BLOB"
          echo "  committed=$ACTUAL_LAUNCHER_BLOB"
          echo "  worktree=$ACTUAL_WORKTREE_BLOB"

          [[ "$ACTUAL_LAUNCHER_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: reconstruction launcher Git blob mismatch"
            exit 1
          }
          [[ "$ACTUAL_WORKTREE_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: reconstruction launcher worktree bytes mismatch audited Git blob"
            exit 1
          }

          command -v git
          command -v bash
          command -v pwsh
          command -v python3
          command -v cygpath
          command -v sha256sum
          command -v tar
          command -v base64

          echo "PASS: branch/launcher/toolchain contract proven"

      - name: Full disposable Windows reconstruction and APK build
        shell: bash
        run: |
          set -euo pipefail

          [[ "${OS:-}" == "Windows_NT" ]] || {
            echo "FAIL: expected Windows_NT"
            exit 1
          }

          AUDIT_ROOT="${RUNNER_TEMP}/iris_26452_e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          AUDIT_REPO="$AUDIT_ROOT/repo"
          EVIDENCE="$GITHUB_WORKSPACE/motion-v2-e2e-evidence"

          rm -rf "$AUDIT_ROOT" "$EVIDENCE" "$GITHUB_WORKSPACE/motion-v2-build-output"
          mkdir -p "$AUDIT_ROOT" "$EVIDENCE"

          echo "=== E2E GATE A: CREATE DISPOSABLE NO-CHECKOUT CLONE ==="
          git -c core.autocrlf=false clone --no-hardlinks --no-checkout . "$AUDIT_REPO"

          git -C "$AUDIT_REPO" config core.autocrlf false
          git -C "$AUDIT_REPO" config core.eol lf
          git -C "$AUDIT_REPO" checkout -B experimental-mobile-26452-cfa-to-cfa "$GITHUB_SHA"

          [[ "$(git -C "$AUDIT_REPO" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C "$AUDIT_REPO" branch --show-current)" == "experimental-mobile-26452-cfa-to-cfa" ]]

          echo "=== E2E GATE B: PROVE DISPOSABLE INPUT BYTES ==="
          FILE_COUNT=0
          while IFS= read -r -d '' path; do
            expected="$(git -C "$AUDIT_REPO" rev-parse "HEAD:$path")"
            actual="$(git -C "$AUDIT_REPO" hash-object --no-filters "$AUDIT_REPO/$path")"
            [[ "$actual" == "$expected" ]] || {
              echo "FAIL: disposable clone byte mismatch: $path"
              echo "Expected blob: $expected"
              echo "Actual blob:   $actual"
              exit 1
            }
            FILE_COUNT=$((FILE_COUNT + 1))
          done < <(git -C "$AUDIT_REPO" ls-files -z app historical_replay reconstruct_motion_v2_26452.sh)

          [[ "$FILE_COUNT" -gt 100 ]] || {
            echo "FAIL: suspicious disposable proof count: $FILE_COUNT"
            exit 1
          }
          echo "PASS: $FILE_COUNT reconstruction inputs match committed Git blobs"

          EXPECTED_LAUNCHER_BLOB="42d3cdbe4f995916c449d2784485d1fd0f851bda"
          DISP_COMMITTED_BLOB="$(git -C "$AUDIT_REPO" rev-parse HEAD:reconstruct_motion_v2_26452.sh)"
          DISP_WORKTREE_BLOB="$(git -C "$AUDIT_REPO" hash-object --no-filters "$AUDIT_REPO/reconstruct_motion_v2_26452.sh")"

          echo "Disposable launcher Git-blob proof:"
          echo "  expected=$EXPECTED_LAUNCHER_BLOB"
          echo "  committed=$DISP_COMMITTED_BLOB"
          echo "  worktree=$DISP_WORKTREE_BLOB"

          [[ "$DISP_COMMITTED_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: disposable committed launcher blob mismatch"
            exit 1
          }
          [[ "$DISP_WORKTREE_BLOB" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo "FAIL: disposable launcher bytes do not reproduce audited Git blob"
            exit 1
          }

          echo "=== E2E GATE C: FULL REAL PROGRAM EXECUTION IN DISPOSABLE REPO ==="
          chmod +x "$AUDIT_REPO/reconstruct_motion_v2_26452.sh"

          set +e
          (
            cd "$AUDIT_REPO"
            ./reconstruct_motion_v2_26452.sh
          ) 2>&1 | tee "$EVIDENCE/full_reconstruction.log"
          RC=${PIPESTATUS[0]}
          set -e

          if [[ "$RC" -ne 0 ]]; then
            echo "FAIL: full disposable reconstruction returned $RC"
            exit "$RC"
          fi

          echo "=== E2E GATE D: EXPECTED VERSION/APK PROOF ==="
          OUT="$AUDIT_REPO/motion-v2-build-output"
          [[ -d "$OUT" ]] || {
            echo "FAIL: motion-v2-build-output missing from disposable build"
            exit 1
          }

          [[ -f "$OUT/version.properties" ]] || {
            echo "FAIL: version.properties missing from disposable output"
            exit 1
          }

          grep -q '^VERSION_NAME=0\.9726452$' "$OUT/version.properties" || {
            cat "$OUT/version.properties"
            echo "FAIL: expected VERSION_NAME=0.9726452"
            exit 1
          }
          grep -q '^VERSION_BUILD=26452$' "$OUT/version.properties" || {
            cat "$OUT/version.properties"
            echo "FAIL: expected VERSION_BUILD=26452"
            exit 1
          }

          APK_COUNT="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          [[ "$APK_COUNT" -ge 1 ]] || {
            echo "FAIL: no APK produced by disposable reconstruction"
            exit 1
          }

          cp -a "$OUT" "$GITHUB_WORKSPACE/motion-v2-build-output"
          cp "$OUT/version.properties" "$EVIDENCE/final_version.properties"
          sha256sum "$GITHUB_WORKSPACE"/motion-v2-build-output/*.apk             > "$EVIDENCE/apk_sha256.txt"

          echo "=== E2E GATE E: PRIMARY CHECKOUT MUST STILL BE UNTOUCHED ==="
          while IFS= read -r -d '' path; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object --no-filters "$path")"
            [[ "$actual" == "$expected" ]] || {
              echo "FAIL: primary reconstruction input was modified: $path"
              exit 1
            }
          done < <(
            git ls-files -z -- \
              app \
              historical_replay \
              reconstruct_motion_v2_26452.sh
          )

          git diff --exit-code -- \
            app \
            historical_replay \
            reconstruct_motion_v2_26452.sh

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "BUILD SUCCESSFUL"
          echo "PASS: full reconstruction executed only in disposable Windows clone"
          echo "PASS: expected 0.9726452 / 26452 output verified"
          echo "PASS: primary reconstruction inputs remained untouched"

      - name: Verify final artifact package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Output = Join-Path $PWD "motion-v2-build-output"
          $VersionFile = Join-Path $Output "version.properties"

          if (-not (Test-Path -LiteralPath $VersionFile -PathType Leaf)) {
            throw "Final version.properties missing"
          }

          $Version = Get-Content -LiteralPath $VersionFile -Raw
          if ($Version -notmatch '(?m)^VERSION_NAME=0\.9726452$') {
            throw "Final VERSION_NAME is not 0.9726452"
          }
          if ($Version -notmatch '(?m)^VERSION_BUILD=26452$') {
            throw "Final VERSION_BUILD is not 26452"
          }

          $Apks = @(Get-ChildItem -LiteralPath $Output -Filter "*.apk" -File)
          if ($Apks.Count -lt 1) {
            throw "No final APK present"
          }

          foreach ($Apk in $Apks) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $Apk.FullName
            Write-Host "APK: $($Apk.Name)"
            Write-Host "SHA256: $($Hash.Hash)"
          }

          Write-Host "BUILD SUCCESSFUL APK VERIFICATION PASSED"

      - name: Upload Motion V2 APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: motion-v2-windows-e2e-${{ github.run_number }}
          path: |
            motion-v2-build-output/
            motion-v2-e2e-evidence/
          if-no-files-found: error
          retention-days: 14
