name: Motion V2 Windows Native Reconstruction

on:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-build:
    name: Windows-native Motion V2 reconstruction
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout runs before job-local Git config can affect its initial
      # worktree. The next step therefore ignores checkout byte normalization
      # and restores app/ directly from Git objects.

      - name: Rematerialize exact app bytes from Git objects
        shell: bash
        run: |
          set -euo pipefail

          git config core.autocrlf false
          git config core.eol lf

          echo "Rematerializing every tracked app/ file from its canonical HEAD blob..."

          FILE_COUNT=0
          while IFS= read -r -d '' path; do
            [[ "$path" == app/* ]] || {
              echo "FAIL: unexpected path outside app/: $path"
              exit 1
            }

            tmp="${path}.iris_git_blob_tmp"
            rm -f "$tmp"

            git cat-file blob "HEAD:$path" > "$tmp" || {
              echo "FAIL: could not materialize HEAD blob for $path"
              exit 1
            }

            mv -f "$tmp" "$path"
            FILE_COUNT=$((FILE_COUNT + 1))
          done < <(git ls-files -z app)

          [[ "$FILE_COUNT" -gt 100 ]] || {
            echo "FAIL: suspicious app tracked-file count: $FILE_COUNT"
            exit 1
          }

          echo "PASS: rematerialized $FILE_COUNT tracked app files directly from Git blobs"

          echo
          echo "=== COMPLETE APP BLOB/WORKTREE BYTE PROOF ==="

          VERIFY_COUNT=0
          while IFS= read -r -d '' path; do
            EXPECTED_BLOB="$(git rev-parse "HEAD:$path")"
            ACTUAL_BLOB="$(git hash-object --no-filters "$path")"

            if [[ "$ACTUAL_BLOB" != "$EXPECTED_BLOB" ]]; then
              echo "FAIL: canonical byte mismatch after rematerialization"
              echo "File:     $path"
              echo "Expected: $EXPECTED_BLOB"
              echo "Actual:   $ACTUAL_BLOB"
              exit 1
            fi

            VERIFY_COUNT=$((VERIFY_COUNT + 1))
          done < <(git ls-files -z app)

          [[ "$VERIFY_COUNT" -eq "$FILE_COUNT" ]] || {
            echo "FAIL: app verification count mismatch"
            exit 1
          }

          # Preserve the historical explicit SHA-256 proof that previously failed.
          DEN="$(
            sha256sum app/src/main/assets/shaders/motionv2/denoise.glsl |
            awk '{print toupper($1)}'
          )"
          EXPECTED_DEN="5A939C709C181E61534233BECFABDE9C7C9A5A6296F3F362135832D03DC0FC0C"

          echo "Canonical denoise.glsl SHA256:"
          echo "  expected=$EXPECTED_DEN"
          echo "  actual=$DEN"

          [[ "$DEN" == "$EXPECTED_DEN" ]] || {
            echo "FAIL: exact canonical denoise.glsl SHA256 still mismatched"
            exit 1
          }

          echo
          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS: every tracked app file is byte-identical to its committed Git blob"
          echo "PASS: exact 26428 denoise.glsl SHA256 proven"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows Android SDK and install deterministic NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not set"
          }

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"

          $SdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            $SdkManager = Get-ChildItem `
              -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") `
              -Filter "sdkmanager.bat" `
              -Recurse `
              -File |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $SdkManager -or -not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            throw "sdkmanager.bat not found"
          }

          & $SdkManager "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install NDK 27.3.13750724"
          }

          $Glslc = Join-Path $env:ANDROID_HOME "ndk\27.3.13750724\shader-tools\windows-x86_64\glslc.exe"
          if (-not (Test-Path -LiteralPath $Glslc -PathType Leaf)) {
            throw "Expected Windows NDK glslc.exe missing: $Glslc"
          }

          & $Glslc --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows NDK glslc.exe did not execute"
          }

          Write-Host "PASS: deterministic Windows NDK glslc.exe verified"

      - name: Verify branch before reconstruction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Branch = git branch --show-current
          if ($Branch.Trim() -ne "experimental-mobile-26452-cfa-to-cfa") {
            throw "Unexpected branch: $Branch"
          }

          if ($Branch.Trim() -eq "dev") {
            throw "Refusing to run on dev"
          }

          Write-Host "PASS: branch = $($Branch.Trim())"
          Write-Host "HEAD: $(git rev-parse HEAD)"

      - name: Run Windows-native Motion V2 reconstruction and build
        shell: bash
        run: |
          set -euo pipefail

          [[ "${OS:-}" == "Windows_NT" ]] || {
            echo "FAIL: expected Windows_NT"
            exit 1
          }

          command -v cygpath
          command -v pwsh
          command -v python3

          chmod +x ./reconstruct_motion_v2_26452.sh
          ./reconstruct_motion_v2_26452.sh

      - name: Verify reconstructed build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Output = Join-Path $PWD "motion-v2-build-output"
          if (-not (Test-Path -LiteralPath $Output -PathType Container)) {
            throw "motion-v2-build-output directory missing"
          }

          $VersionFile = Join-Path $Output "version.properties"
          if (-not (Test-Path -LiteralPath $VersionFile -PathType Leaf)) {
            throw "version.properties missing from reconstruction output"
          }

          Get-Content -LiteralPath $VersionFile

          $Apks = @(Get-ChildItem -LiteralPath $Output -Filter "*.apk" -File)
          if ($Apks.Count -lt 1) {
            throw "No APK produced by reconstruction"
          }

          foreach ($Apk in $Apks) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $Apk.FullName
            Write-Host "APK: $($Apk.Name)"
            Write-Host "SHA256: $($Hash.Hash)"
          }

          Write-Host "BUILD SUCCESSFUL APK VERIFICATION PASSED"

      - name: Upload Motion V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: motion-v2-windows-native-${{ github.run_number }}
          path: motion-v2-build-output/
          if-no-files-found: error
          retention-days: 14
