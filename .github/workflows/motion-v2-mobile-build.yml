name: Motion V2 Windows Native Reconstruction

on:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-build:
    name: Windows-native Motion V2 reconstruction
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows Android SDK and install deterministic NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not set"
          }

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"

          $SdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            $SdkManager = Get-ChildItem `
              -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") `
              -Filter "sdkmanager.bat" `
              -Recurse `
              -File |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $SdkManager -or -not (Test-Path -LiteralPath $SdkManager -PathType Leaf)) {
            throw "sdkmanager.bat not found"
          }

          & $SdkManager "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install NDK 27.3.13750724"
          }

          $Glslc = Join-Path $env:ANDROID_HOME "ndk\27.3.13750724\shader-tools\windows-x86_64\glslc.exe"
          if (-not (Test-Path -LiteralPath $Glslc -PathType Leaf)) {
            throw "Expected Windows NDK glslc.exe missing: $Glslc"
          }

          & $Glslc --version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows NDK glslc.exe did not execute"
          }

          Write-Host "PASS: deterministic Windows NDK glslc.exe verified"

      - name: Verify branch before reconstruction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Branch = git branch --show-current
          if ($Branch.Trim() -ne "experimental-mobile-26452-cfa-to-cfa") {
            throw "Unexpected branch: $Branch"
          }

          if ($Branch.Trim() -eq "dev") {
            throw "Refusing to run on dev"
          }

          Write-Host "PASS: branch = $($Branch.Trim())"
          Write-Host "HEAD: $(git rev-parse HEAD)"

      - name: Run Windows-native Motion V2 reconstruction and build
        shell: bash
        run: |
          set -euo pipefail

          [[ "${OS:-}" == "Windows_NT" ]] || {
            echo "FAIL: expected Windows_NT"
            exit 1
          }

          command -v cygpath
          command -v pwsh
          command -v python3

          chmod +x ./reconstruct_motion_v2_26452.sh
          ./reconstruct_motion_v2_26452.sh

      - name: Verify reconstructed build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Output = Join-Path $PWD "motion-v2-build-output"
          if (-not (Test-Path -LiteralPath $Output -PathType Container)) {
            throw "motion-v2-build-output directory missing"
          }

          $VersionFile = Join-Path $Output "version.properties"
          if (-not (Test-Path -LiteralPath $VersionFile -PathType Leaf)) {
            throw "version.properties missing from reconstruction output"
          }

          Get-Content -LiteralPath $VersionFile

          $Apks = @(Get-ChildItem -LiteralPath $Output -Filter "*.apk" -File)
          if ($Apks.Count -lt 1) {
            throw "No APK produced by reconstruction"
          }

          foreach ($Apk in $Apks) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $Apk.FullName
            Write-Host "APK: $($Apk.Name)"
            Write-Host "SHA256: $($Hash.Hash)"
          }

          Write-Host "BUILD SUCCESSFUL APK VERIFICATION PASSED"

      - name: Upload Motion V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: motion-v2-windows-native-${{ github.run_number }}
          path: motion-v2-build-output/
          if-no-files-found: error
          retention-days: 14
