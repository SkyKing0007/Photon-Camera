name: Motion V2 26462 Curated Full Wronski E2E

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-mobile-26452-cfa-to-cfa
    paths:
      - curate_motion_v2_26428_to_26436_exact_payloads.py
      - apply_full_published_wronski_26462_from_curated_26436.ps1
      - .github/workflows/motion-v2-mobile-build.yml

permissions:
  contents: read

jobs:
  build-26462:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: harness

      - name: Checkout immutable 26428 source
        uses: actions/checkout@v4
        with:
          ref: aac8ea5a0f518142b0f8ad60ce34c9a165e4611b
          fetch-depth: 0
          path: target

      - name: Gate 0 - explicit source and harness proof
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "FAIL GATE0: $*" >&2; exit 1; }
          [[ "$(git -C target rev-parse HEAD)" == "aac8ea5a0f518142b0f8ad60ce34c9a165e4611b" ]] || fail "target is not exact 26428"
          [[ -f harness/curate_motion_v2_26428_to_26436_exact_payloads.py ]] || fail "curator missing"
          [[ -f harness/apply_full_published_wronski_26462_from_curated_26436.ps1 ]] || fail "Wronski transformer missing"
          [[ -d harness/historical_replay ]] || fail "historical evidence directory missing"
          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS GATE0: immutable 26428 plus non-replay harness present"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Gate 1 - backup and pre-curation proof
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "FAIL GATE1: $*" >&2; exit 1; }
          cd target
          git config user.name "Photon 26462 Actions"
          git config user.email "actions@users.noreply.github.com"
          [[ "$(git rev-parse HEAD)" == "aac8ea5a0f518142b0f8ad60ce34c9a165e4611b" ]] || fail "base moved"
          git branch "backup/actions-before-curation-26462-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p ../evidence
          git diff --binary HEAD -- app > ../evidence/pre_curation_26428.patch
          while IFS= read -r f; do
            [[ -f "$f" ]] && sha256sum "$f"
          done < <(git ls-files app) | sort > ../evidence/base_26428_app.sha256
          echo "PASS GATE1: backup branch, patch, and protected baseline created before curation"

      - name: Gate 2 - exact payload source curation only
        shell: bash
        run: |
          set -o pipefail
          python harness/curate_motion_v2_26428_to_26436_exact_payloads.py \
            --harness harness \
            --target target \
            --manifest evidence/curated_source_manifest.json \
            2>&1 | tee evidence/curation.log
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "FAIL GATE2: curator rc=$rc"
            exit $rc
          fi
          grep -q 'PASS: exact payload-only curation complete; no historical build executed' evidence/curation.log || {
            echo "FAIL GATE2: curator completion proof missing"
            exit 1
          }
          echo "PASS GATE2: historical scripts were source evidence only"

      - name: Gate 3 - prepare curated branch for Wronski transformer
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git switch -c wronski-26462-build
          git diff --binary HEAD -- app > ../evidence/curated_pre_wronski.patch
          echo "PASS GATE3: local Wronski build branch created; dev untouched"

      - name: Gate 4 - parse and apply 26453 plus full published Wronski
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $Script = Join-Path $PWD "harness\apply_full_published_wronski_26462_from_curated_26436.ps1"
          $Tokens=$null
          $Errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $Script,[ref]$Tokens,[ref]$Errors) | Out-Null
          if($Errors.Count -gt 0){
              foreach($e in $Errors){
                  Write-Host ("FAIL GATE4 PARSER line "+$e.Extent.StartLineNumber+": "+$e.Message)
              }
              throw "FAIL GATE4: transformer parse"
          }
          & pwsh -NoLogo -NoProfile -File $Script -Repo (Resolve-Path "target")
          if($LASTEXITCODE -ne 0){
              throw "FAIL GATE4: transformer returned $LASTEXITCODE"
          }

      - name: Gate 5 - final source architecture proof
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "FAIL GATE5: $*" >&2; exit 1; }

          R=target/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2CfaReconstruction.java
          A=target/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2WronskiAlignment.java
          D=target/app/src/main/assets/shaders/motionv2/denoise.glsl

          [[ -f "$A" ]] || fail "Wronski alignment Java missing"
          grep -q 'IRIS_26462_WRONSKI_PUBLISHED_COARSE_TO_FINE_ALIGNMENT' "$A" || fail "published alignment marker missing"
          grep -q 'IRIS_26462_WRONSKI_DIRECT_RGB_FINAL_OWNER' "$R" || fail "direct RGB final owner missing"
          grep -q 'IRIS_26453_STRUCTURAL_EDGE_CHROMA_PROTECTION' "$D" || fail "26453 retained denoise missing"

          ! grep -R -q 'IRIS_26460_CROSS_PHASE_PLATEAU_CHROMA' target/app/src/main || fail "rejected 26460 code survived"
          ! grep -R -q 'IRIS_26461_MATRIX_AWARE_CHROMA_LIMITER' target/app/src/main || fail "rejected 26461 code survived"

          tr -d '\r' < target/app/version.properties | tee evidence/final_version.properties
          grep -qx 'VERSION_NAME=0.9726462' evidence/final_version.properties || fail "VERSION_NAME not 0.9726462"
          grep -qx 'VERSION_BUILD=26462' evidence/final_version.properties || fail "VERSION_BUILD not 26462"

          git -C target diff --check -- app || fail "git diff --check"
          git -C target diff --binary HEAD -- app > evidence/final_26462.patch

          echo "candidate/source validation PASS"
          echo "Temporary-copy validation: PASS"
          echo "PRE-BUILD SAFETY PROOF PASSED"
          echo "PASS GATE5: final architecture, version, and reject proofs"

      - name: Gate 6 - Javac proof
        shell: bash
        run: |
          set -o pipefail
          cd target
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace 2>&1 | tee ../evidence/javac_26462.log
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "FAIL GATE6: javac rc=$rc"
            exit $rc
          fi
          echo "PASS GATE6: JAVAC"

      - name: Gate 7 - one final APK build
        shell: bash
        run: |
          set -o pipefail
          cd target
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../evidence/build_26462.log
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "FAIL GATE7: Gradle rc=$rc"
            exit $rc
          fi
          grep -q 'BUILD SUCCESSFUL' ../evidence/build_26462.log || {
            echo "FAIL GATE7: BUILD SUCCESSFUL text missing"
            exit 1
          }

          mkdir -p ../apk
          mapfile -t files < <(
              find app/build/outputs/apk -type f -name '*.apk' -printf '%T@ %p\n' |
              sort -nr | awk '{print $2}'
          )
          [[ ${#files[@]} -ge 1 ]] || {
              echo "FAIL GATE7: no APK found"
              exit 1
          }
          cp "${files[0]}" ../apk/IrisCamera-0.9726462-26462-curated-full-wronski-debug.apk
          sha256sum ../apk/*.apk | tee ../evidence/apk_sha256.txt
          echo "BUILD SUCCESSFUL"
          echo "PASS GATE7: final 26462 APK packaged"

      - name: Upload final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iris-26462-curated-full-wronski-${{ github.run_number }}
          path: apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload audit evidence even if a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-26462-audit-${{ github.run_number }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
