name: Build 26477 Strict Wronski Authority V1

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26477_strict_wronski_authority_v1.sh
      - transform_26477_strict_wronski_authority.py
      - .github/workflows/build-26477-strict-wronski-authority-v1.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26477 strict Wronski authority
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "e51a77a2c49282cd36e7a5503961b47c5fc60274" || {
            echo "26477 infrastructure commit must be direct child of exact 26476 V3"
            git log -5 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26477 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26477 infrastructure lineage PASS"

      - name: Run guarded strict-authority build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26477_strict_wronski_authority_v1.sh
          ./build_26477_strict_wronski_authority_v1.sh

      - name: Upload 26477 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26477-strict-wronski-authority-v1
          if-no-files-found: error
          path: |
            build_26477_outputs/**
            IrisCamera-0.9726477-26477-strict-wronski-authority-debug.apk
