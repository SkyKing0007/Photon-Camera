name: Build 26869 B Sharpest and Chroma Toe
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26869.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26869 source and infrastructure package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26869.txt
          grep -Fx 'RUN_26869_B_SHARPEST_CHROMA_TOE' TRIGGER_26869.txt
          sha256sum -c 26869_HANDOFF_HASHES.sha256
          bash -n build_26869_iris_rawr.sh
          python3 -S -m py_compile verify_26869_candidate.py verify_26869_patches.py verify_26864_rawr_sources.py verify_26864_runtime_glsl.py verify_26864_semantics.py regressions/26864_glsl_reserved_identifiers.py regressions/26864_wronski_publisher.py regressions/26865_b_lsc_owner.py regressions/26866_b_color_only.py regressions/26867_b_highlight_ab_retired.py regressions/26868_direct_b_long_retire_ab.py regressions/26869_b_sharpest_chroma_toe.py verify_26867_runtime_shader.py verify_26868_runtime_shader.py verify_26869_runtime_shader.py
          rm -rf __pycache__ regressions/__pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26869_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26869_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Verify and remove exactly historical 50 generated GLSL files from temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run exact inherited 17-stage guarded 26869 native B build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26869_iris_rawr.sh
      - name: Verify exactly one intended 26869 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726869-26869-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726869-26869-iris-rawr-debug.apk' build_26869_iris_rawr_outputs/26869_APK.sha256
      - name: Upload 26869 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26869-iris-rawr-sharpest-chroma-toe
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726869-26869-iris-rawr-debug.apk
            build_26869_iris_rawr_outputs/
