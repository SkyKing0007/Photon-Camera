name: Build 26847 Same Material CFA
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26847.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26847 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26847.txt
          grep -Fx 'RUN_26847_SAME_MATERIAL_CFA' TRIGGER_26847.txt
          sha256sum -c 26847_HANDOFF_HASHES.sha256
          bash -n build_26847_same_material_cfa.sh
          python3 -S -m py_compile transform_26847.py validate_26847.py verify_26847_patches.py verify_26847_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26847_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26847_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26847 candidate from successful 26846 authority using exact successful 26846 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26847_same_material_cfa.sh
      - name: Verify exact 26847 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726847-26847-same-material-cfa-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726847-26847-same-material-cfa-debug.apk' build_26847_same_material_cfa_outputs/26847_APK.sha256
      - name: Upload 26847 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26847-same-material-cfa
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726847-26847-same-material-cfa-debug.apk
            build_26847_same_material_cfa_outputs/
