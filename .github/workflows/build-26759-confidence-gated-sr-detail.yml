name: Build 26759 Confidence-Gated SR Detail
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26759_README_UPLOAD.txt'
      - '26759_*'
      - 'build_26759_confidence_gated_sr_detail.sh'
      - 'transform_26759.py'
      - 'validate_26759.py'
      - 'verify_26759_*.py'
      - 'handoff_payload_26759/**'
      - '.github/workflows/build-26759-confidence-gated-sr-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26759 handoff and exact successful 26758/26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26759_HANDOFF_HASHES.sha256
          python3 -S verify_26759_infrastructure.py build_26759_confidence_gated_sr_detail.sh .github/workflows/build-26759-confidence-gated-sr-detail.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26759 candidate from exact successful 26758 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26759_confidence_gated_sr_detail.sh
      - name: Verify exact 26759 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726759-26759-confidence-gated-sr-detail-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726759-26759-confidence-gated-sr-detail-debug.apk' build_26759_confidence_gated_sr_detail_outputs/26759_APK.sha256
      - name: Upload 26759 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26759-confidence-gated-sr-detail
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726759-26759-confidence-gated-sr-detail-debug.apk
            build_26759_confidence_gated_sr_detail_outputs/
