name: Build 26664 R1 Global Log Body Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26664_R1_README_UPLOAD.txt'
      - 'R1_26664_*'
      - 'build_26664_r1_global_log_body_tone.sh'
      - 'transform_26664.py'
      - 'validate_26664.py'
      - 'verify_26664_*.py'
      - 'handoff_payload_26664/**'
      - '.github/workflows/build-26664-r1-global-log-body-tone.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26664 handoff and exact successful 26663 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26664_HANDOFF_HASHES.sha256
          bash -n build_26664_r1_global_log_body_tone.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26664.py','validate_26664.py','verify_26664_authority.py','verify_26664_infrastructure.py','verify_26664_patches.py','verify_26664_regressions.py','verify_26664_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26664 candidate from successful 26663 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26664_r1_global_log_body_tone.sh
      - name: Verify exact 26664 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726664-26664-r1-global-log-body-tone-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726664-26664-r1-global-log-body-tone-debug.apk" build_26664_r1_global_log_body_tone_outputs/26664_R1_APK.sha256
      - name: Upload 26664 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26664-r1-global-log-body-tone
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726664-26664-r1-global-log-body-tone-debug.apk
            build_26664_r1_global_log_body_tone_outputs/
