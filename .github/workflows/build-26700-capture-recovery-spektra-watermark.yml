name: Build 26700 Capture Recovery + Spektra Watermark

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26700_README_UPLOAD.txt'
      - '26700_*'
      - 'build_26700_capture_recovery_spektra_watermark.sh'
      - 'transform_26700.py'
      - 'validate_26700.py'
      - 'repair_26700_*.py'
      - 'handoff_payload_26700/**'
      - '.github/workflows/build-26700-capture-recovery-spektra-watermark.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26700 handoff and exact successful 26699 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26700_HANDOFF_HASHES.sha256
          bash -n build_26700_capture_recovery_spektra_watermark.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26700.py','validate_26700.py','repair_26700_authority.py','repair_26700_infrastructure.py','repair_26700_patches.py','repair_26700_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26700 candidate from successful 26699 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26700_capture_recovery_spektra_watermark.sh
      - name: Verify exact 26700 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726700-26700-capture-recovery-spektra-watermark-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726700-26700-capture-recovery-spektra-watermark-debug.apk" build_26700_capture_recovery_spektra_watermark_outputs/26700_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26700_capture_recovery_spektra_watermark_outputs/26700_apk_jni_contract.txt
      - name: Upload 26700 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26700-capture-recovery-spektra-watermark
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726700-26700-capture-recovery-spektra-watermark-debug.apk
            build_26700_capture_recovery_spektra_watermark_outputs/
