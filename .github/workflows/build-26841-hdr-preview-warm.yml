name: Build 26841 HDR Preview Warm Midtone
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26841.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26841 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26841.txt
          grep -Fx 'RUN_26841_HDR_PREVIEW_WARM' TRIGGER_26841.txt
          sha256sum -c 26841_HANDOFF_HASHES.sha256
          bash -n build_26841_hdr_preview_warm.sh
          python3 -S -m py_compile transform_26841.py validate_26841.py verify_26841_patches.py verify_26841_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26841_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26841_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26841 candidate from successful 26840 authority using exact successful 26840 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26841_hdr_preview_warm.sh
      - name: Verify exact 26841 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726841-26841-hdr-preview-warm-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726841-26841-hdr-preview-warm-debug.apk' build_26841_hdr_preview_warm_outputs/26841_APK.sha256
      - name: Upload 26841 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26841-hdr-preview-warm
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726841-26841-hdr-preview-warm-debug.apk
            build_26841_hdr_preview_warm_outputs/
