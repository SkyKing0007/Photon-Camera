name: Build 26688 R1 Spektra CPU RAW Frontend

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26688_R1_README_UPLOAD.txt'
      - 'R1_26688_*'
      - 'build_26688_r1_spektra_cpu_raw_frontend.sh'
      - 'transform_26688.py'
      - 'validate_26688.py'
      - 'verify_26688_*.py'
      - 'handoff_payload_26688/**'
      - '.github/workflows/build-26688-r1-spektra-cpu-raw-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26688 handoff and exact successful 26687 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26688_HANDOFF_HASHES.sha256
          bash -n build_26688_r1_spektra_cpu_raw_frontend.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26688.py','validate_26688.py','verify_26688_authority.py','verify_26688_infrastructure.py','verify_26688_patches.py','verify_26688_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26688 candidate from successful 26687 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26688_r1_spektra_cpu_raw_frontend.sh
      - name: Verify exact 26688 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726688-26688-r1-spektra-cpu-raw-frontend-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726688-26688-r1-spektra-cpu-raw-frontend-debug.apk" build_26688_r1_spektra_cpu_raw_frontend_outputs/26688_R1_APK.sha256
      - name: Upload 26688 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26688-r1-spektra-cpu-raw-frontend
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726688-26688-r1-spektra-cpu-raw-frontend-debug.apk
            build_26688_r1_spektra_cpu_raw_frontend_outputs/
