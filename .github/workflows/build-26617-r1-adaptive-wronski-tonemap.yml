name: Build 26617 Adaptive Wronski Tonemap

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26617_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26617_*'
      - 'R1_26617_*'
      - 'build_26617_r1_adaptive_wronski_tonemap.sh'
      - 'transform_26617.py'
      - 'validate_26617.py'
      - 'verify_26617_*.py'
      - 'handoff_payload_26617/**'
      - '.github/workflows/build-26617-r1-adaptive-wronski-tonemap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26617 package and successful 26616 R1.2 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26617_HANDOFF_HASHES.sha256
          bash -n build_26617_r1_adaptive_wronski_tonemap.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26617.py','validate_26617.py','verify_26617_authority.py','verify_26617_infrastructure.py','verify_26617_patches.py','verify_26617_regressions.py','verify_26617_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26617 candidate from successful compiled 26616 R1.2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26617_r1_adaptive_wronski_tonemap.sh
      - name: Upload 26617 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26617-r1-adaptive-wronski-tonemap
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726617-26617-r1-adaptive-wronski-tonemap-debug.apk
            build_26617_r1_adaptive_wronski_tonemap_outputs/
