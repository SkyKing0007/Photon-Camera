name: Build 26853 Multiframe Native CFA Denoise
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26853.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26853 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26853.txt
          grep -Fx 'RUN_26853_MULTIFRAME_NATIVE_CFA_DENOISE' TRIGGER_26853.txt
          sha256sum -c 26853_HANDOFF_HASHES.sha256
          bash -n build_26853_multiframe_native_cfa_denoise.sh
          python3 -S -m py_compile transform_26853.py validate_26853.py verify_26853_patches.py verify_26853_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26853_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26853_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26853 candidate from successful 26849 authority using exact successful 26849 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26853_multiframe_native_cfa_denoise.sh
      - name: Verify exact 26853 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726853-26853-multiframe-native-cfa-denoise-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726853-26853-multiframe-native-cfa-denoise-debug.apk' build_26853_multiframe_native_cfa_denoise_outputs/26853_APK.sha256
      - name: Upload 26853 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26853-multiframe-native-cfa-denoise
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726853-26853-multiframe-native-cfa-denoise-debug.apk
            build_26853_multiframe_native_cfa_denoise_outputs/
