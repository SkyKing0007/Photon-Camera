name: Build 26511 Direct 26507 Bento Chroma JPEG

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 26507_successful_app_source.tar.gz
      - 26507_SUCCESSFUL_SOURCE.sha256
      - 26507_SUCCESSFUL_SOURCE_ARCHIVE.sha256
      - 26507_BJZHOU_NATIVE_DEPENDENCIES.sha256
      - 26507_BJZHOU_DEPENDENCY_COMMIT.txt
      - 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch
      - 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch.sha256
      - 26511_RESTORE_TO_SUCCESSFUL_26507.patch
      - 26511_RESTORE_TO_SUCCESSFUL_26507.patch.sha256
      - validate_26511_bento_chroma_jpeg.py
      - build_26511_direct_26507_bento_chroma_jpeg.sh
      - 26511_README_UPLOAD.txt
      - 26511_HANDOFF_HASHES.sha256
      - .github/workflows/build-26511-direct-26507-bento-chroma-jpeg.yml

permissions:
  contents: read

concurrency:
  group: photon-26511-direct-26507-bento-chroma-jpeg
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26511 direct successful-26507 Bento/chroma/JPEG
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify direct-source 26511 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26511_HANDOFF_HASHES.sha256
          bash -n build_26511_direct_26507_bento_chroma_jpeg.sh
          python3 -m py_compile validate_26511_bento_chroma_jpeg.py
          grep -F 'SOURCE_TAR_SHA="3165a63224fc99652504113c312827b4af823eb643567f3678bfd938ad2c0082"' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26510-rejected-before-26511-20260819"' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'REJECTED_26510_HEAD="19b134a4716f877e25e9c2c8050208d25400e1c7"' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726511"' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'VERSION_BUILD="26511"' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26511_direct_26507_bento_chroma_jpeg.sh >/dev/null
          grep -F 'IRIS_26511_BENTO_REGION_CANDIDATE_OWNER' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26511_BENTO_COHERENT_RGB_REGION' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26511_PROPAGATED_CHROMA_ONLY_FINISH' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26511_ASYNC_JPEGR_NORMAL_PRIORITY_OWNER' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26511_PARALLEL_JPEGR_ENCODE_OWNER' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26511_DEBUG_APK_JPEG_OPTIMIZATION_OWNER' 26511_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build_26511_direct_26507_bento_chroma_jpeg.sh').read_text()
          forbidden=['git '+'archive','apply_'+'26502','apply_'+'26503','apply_'+'26504','apply_'+'26505','apply_'+'26506','apply_'+'26507','apply_'+'26508','apply_'+'26509','apply_'+'26510','validate_'+'26502','validate_'+'26503','validate_'+'26504','validate_'+'26505','validate_'+'26506','validate_'+'26509','validate_'+'26510']
          bad=[x for x in forbidden if x in s]
          assert not bad, 'historical runtime reconstruction dependency survived: '+repr(bad)
          assert '26507_successful_app_source.tar.gz' in s
          assert 'patch -s -d "$AFTER" -p1 < "$DELTA_PATCH"' in s
          v=Path('validate_26511_bento_chroma_jpeg.py').read_text()
          assert 'mfsr_flow_expand.glsl' in v
          assert "forbid(runtime,'IRIS_26510_'" in v
          print('PASS: 26511 is one direct eight-path patch on successful 26507; rejected 26509/26510 runtime excluded')
          PY
          echo "PASS: 26511 direct-source handoff static guards"

      - name: Build guarded 26511 directly from successful 26507 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26511_direct_26507_bento_chroma_jpeg.sh validate_26511_bento_chroma_jpeg.py
          ./build_26511_direct_26507_bento_chroma_jpeg.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26511-direct-26507-bento-chroma-jpeg
          path: |
            IrisCamera-0.9726511-26511-bento-chroma-jpeg-debug.apk
            build_26511_direct_26507_bento_chroma_jpeg_outputs/
          if-no-files-found: warn
