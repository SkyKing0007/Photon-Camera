name: Build 26689 R1 Unspektrawesome Hosted Mode

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26689_R1_README_UPLOAD.txt'
      - 'R1_26689_*'
      - 'build_26689_r1_unspektrawesome_hosted_mode.sh'
      - 'transform_26689.py'
      - 'validate_26689.py'
      - 'verify_26689_*.py'
      - 'handoff_payload_26689/**'
      - '.github/workflows/build-26689-r1-unspektrawesome-hosted-mode.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26689 handoff and exact successful 26688 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26689_HANDOFF_HASHES.sha256
          bash -n build_26689_r1_unspektrawesome_hosted_mode.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26689.py','validate_26689.py','verify_26689_authority.py','verify_26689_infrastructure.py','verify_26689_patches.py','verify_26689_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26689 candidate from successful 26688 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26689_r1_unspektrawesome_hosted_mode.sh
      - name: Verify exact 26689 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726689-26689-r1-unspektrawesome-hosted-mode-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726689-26689-r1-unspektrawesome-hosted-mode-debug.apk" build_26689_r1_unspektrawesome_hosted_mode_outputs/26689_R1_APK.sha256
      - name: Upload 26689 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26689-r1-unspektrawesome-hosted-mode
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726689-26689-r1-unspektrawesome-hosted-mode-debug.apk
            build_26689_r1_unspektrawesome_hosted_mode_outputs/
