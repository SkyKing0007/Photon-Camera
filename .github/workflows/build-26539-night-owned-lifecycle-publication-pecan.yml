name: Build 26539 V1.1 Compile Fix
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26539_night_owned_lifecycle_publication_pecan.py
      - validate_26539_night_owned_lifecycle_publication_pecan.py
      - preflight_26539_changed_syntax.py
      - build_26539_night_owned_lifecycle_publication_pecan.sh
      - 26539_HANDOFF_HASHES.sha256
      - 26539_BASE_26538_CANDIDATE_SOURCE.sha256
      - 26539_BASE_26538_CANDIDATE_SOURCE_FILE.sha256
      - 26539_BASE_26538_HANDOFF_HEAD.txt
      - 26539_PROTECTED_26538_RUNTIME_ANCHORS.sha256
      - 26539_RUNTIME_FILES.txt
      - 26539_RUNTIME_DELTA_FROM_26538.patch
      - 26539_RUNTIME_DELTA_FROM_26538.patch.sha256
      - 26539_RUNTIME_ROLLBACK_TO_26538.patch
      - 26539_RUNTIME_ROLLBACK_TO_26538.patch.sha256
      - 26539_UPLOAD_INSTRUCTIONS.md
      - 26539_LOCAL_VALIDATION.txt
      - .github/workflows/build-26539-night-owned-lifecycle-publication-pecan.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26539-v1-1-compile-fix
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26539 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26539_HANDOFF_HASHES.sha256
          sha256sum -c 26539_BASE_26538_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26539_RUNTIME_DELTA_FROM_26538.patch.sha256
          sha256sum -c 26539_RUNTIME_ROLLBACK_TO_26538.patch.sha256
          python3 -m py_compile apply_26539_night_owned_lifecycle_publication_pecan.py validate_26539_night_owned_lifecycle_publication_pecan.py preflight_26539_changed_syntax.py
          ! grep -F 'Log.getStackTraceString(exifFailure)' 26539_RUNTIME_DELTA_FROM_26538.patch >/dev/null
          grep -F 'IRIS_26539_NIGHT_BASE_EXIF_NONFATAL", exifFailure);' 26539_RUNTIME_DELTA_FROM_26538.patch >/dev/null
          grep -F 'IRIS_26539_NIGHT_FINAL_EXIF_NONFATAL", exifFailure);' 26539_RUNTIME_DELTA_FROM_26538.patch >/dev/null
          echo 'PASS: 26539 V1.1 Throwable logging uses Log.w(Throwable) overload'
          python3 apply_26539_night_owned_lifecycle_publication_pecan.py --self-test
          python3 validate_26539_night_owned_lifecycle_publication_pecan.py --self-test
          bash -n build_26539_night_owned_lifecycle_publication_pecan.sh
          B=build_26539_night_owned_lifecycle_publication_pecan.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26538_HANDOFF_HEAD="038137ce66faaf697edce772109dc2a5d6176cb2"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26538-night-rgba16f-native-pecan-root-fix"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9549164602"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="12d0e2f1129591c6980289231f270642516000bdaaa829c2a7a4572ba2e3a69b"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="b03230be60672562c5abd2d2370d99ebf9804e0f774deb7df0aa1ecbc95b20dc"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=965' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=965' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726539"; VERSION_BUILD="26539"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'assert_cpp_deps_exact "$ROOT" post' "$B" >/dev/null
          grep -F 'IRIS_26539_POSTBUILD_SANITIZED_VALIDATION' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'NIGHT_POST_OWNER_SELF_CLOSE_BEFORE_JIN=true' "$B" >/dev/null
          grep -F 'NIGHT_CARRIER_RELEASE_FINALLY=true' "$B" >/dev/null
          grep -F 'NIGHT_BASE_JPEG_BEFORE_JIN=true' "$B" >/dev/null
          grep -F 'NIGHT_PRIMARY_PUBLICATION=IRIS_NIGHT_JPEG444' "$B" >/dev/null
          grep -F 'NIGHT_FINAL_PUBLICATION=ATOMIC_REPLACE' "$B" >/dev/null
          grep -F 'NIGHT_MOTION_SAVER_POLICY=false' "$B" >/dev/null
          grep -F 'NIGHT_PRE_JIN_ULTRAHDR=false' "$B" >/dev/null
          grep -F 'NIGHT_JIN_PROVIDER=CPU_ONLY_FILE_BACKED' "$B" >/dev/null
          grep -F 'LUMA_AUTOMATIC_FLOOR=NATIVE_PECAN_LOW_LIGHT_DEMAND' "$B" >/dev/null
          grep -F 'LUMA_USER_CONTROL=INDEPENDENT_MAX_WITH_AUTOMATIC' "$B" >/dev/null
          grep -F 'PHOTON_NIGHT_FALLBACK=false' "$B" >/dev/null
          grep -F 'SINGLE_FRAME_FALLBACK=false' "$B" >/dev/null
          python3 - "$B" <<'PY'
          from pathlib import Path
          s=Path(__import__('sys').argv[1]).read_text().splitlines()
          bad=[x for x in s if 'git branch ' in x and 'git branch --show-current' not in x]
          assert not bad,bad
          print('PASS: no backup/local branch creation in 26539 build script')
          PY
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: 26539 handoff mirrors proven 26535-26538 strict pre-execution procedure'
      - name: Guarded 26539 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26539_night_owned_lifecycle_publication_pecan.sh
          ./build_26539_night_owned_lifecycle_publication_pecan.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26539-v1-1-night-owned-lifecycle-publication-pecan
          path: |
            IrisCamera-0.9726539-26539-night-owned-lifecycle-publication-pecan-debug.apk
            build_26539_night_owned_lifecycle_publication_pecan_outputs/
          if-no-files-found: warn
