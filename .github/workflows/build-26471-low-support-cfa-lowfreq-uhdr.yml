name: Build 26471 Low Support CFA LowFreq UHDR

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26471_low_support_cfa_lowfreq_uhdr.sh
      - .github/workflows/build-26471-low-support-cfa-lowfreq-uhdr.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26471 build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard workflow lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "9d4c693aa334e1668cb630a1d015e77a43785b32" || {
            echo "Revised 26471 commit is not directly based on the failed 26471 infrastructure commit"
            git log -4 --oneline
            exit 1
          }
          test "$(git rev-parse HEAD^^)" = "43f4b77e6f2fb103db2bded4ddb9278ca26f97a4" || {
            echo "Failed 26471 infrastructure commit is not directly based on protected 26470 head"
            git log -4 --oneline
            exit 1
          }
      - name: Run guarded 26471 operation
        shell: bash
        run: |
          chmod +x ./build_26471_low_support_cfa_lowfreq_uhdr.sh
          ./build_26471_low_support_cfa_lowfreq_uhdr.sh
      - name: Upload 26471 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26471-low-support-cfa-lowfreq-uhdr
          if-no-files-found: error
          path: |
            build_26471_outputs/**
            IrisCamera-0.9726471-26471-low-support-cfa-lowfreq-uhdr-debug.apk
