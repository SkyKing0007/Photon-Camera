name: Build 26515 Short Bento Domain Fix

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26515_short_bento_exposure_domain.py
      - validate_26515_short_bento_exposure_domain.py
      - patch_26515_derived_builder.py
      - build_26515_short_bento_exposure_domain.sh
      - 26515_BASE_26514_COMMIT.txt
      - 26515_README_UPLOAD.txt
      - 26515_HANDOFF_HASHES.sha256
      - .github/workflows/build-26515-short-bento-domain.yml

permissions:
  contents: read

concurrency:
  group: photon-26515-short-bento-domain
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26515 from exact 26514 handoff
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26515 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26515_HANDOFF_HASHES.sha256
          sha256sum -c 26514_HANDOFF_HASHES.sha256
          bash -n build_26515_short_bento_exposure_domain.sh
          python3 -m py_compile apply_26515_short_bento_exposure_domain.py validate_26515_short_bento_exposure_domain.py patch_26515_derived_builder.py
          [[ "$(tr -d '\r\n' < 26515_BASE_26514_COMMIT.txt)" == "e9855a3af7a79801a762ec3f99b441474926f009" ]]
          grep -F 'BACKUP_26514="backup-26514-before-26515-short-bento-fix-20260820"' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726515"' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'VERSION_BUILD="26515"' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'IRIS_26515_SHORT_BASELINE_DOMAIN' apply_26515_short_bento_exposure_domain.py >/dev/null
          grep -F 'IRIS_26515_FUSED_LINEAR_SOURCE_RESTORE' apply_26515_short_bento_exposure_domain.py >/dev/null
          grep -F 'IRIS_26515_RENDER_EXPOSURE_AUTHORITY_SPLIT' apply_26515_short_bento_exposure_domain.py >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          a=Path('apply_26515_short_bento_exposure_domain.py').read_text()
          v=Path('validate_26515_short_bento_exposure_domain.py').read_text()
          p=Path('patch_26515_derived_builder.py').read_text()
          assert 'parameters.motionV2MgcSourceExposureGain = baselineScale' in a
          assert 'parameters.motionV2DisplayGain = referenceDisplayGain' in a
          assert 'float combinedLinearGain = displayGain * sourceDomainGain;' in a
          assert 'OUTPUT_EXPOSURE_SCALE * postDisplaySensorWhite' in a and '* mgcSourceExposureGain' in a
          assert 'MgcFullResolutionDenoise.denoise(' in v
          assert 'GATE 4.7: apply only 26515' in p
          print('PASS: 26515 static handoff/domain-split guards')
          PY

      - name: Build guarded 26515
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26515_short_bento_exposure_domain.sh apply_26515_short_bento_exposure_domain.py validate_26515_short_bento_exposure_domain.py patch_26515_derived_builder.py
          ./build_26515_short_bento_exposure_domain.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26515-short-bento-domain-fix
          path: |
            IrisCamera-0.9726515-26515-short-bento-domain-fix-debug.apk
            build_26515_short_bento_exposure_domain_outputs/
          if-no-files-found: warn
