name: Build 26515 v4 Direct Tested-26514 Short/Bento Domain Fix

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26515_short_bento_exposure_domain.py
      - validate_26515_short_bento_exposure_domain.py
      - patch_26515_derived_builder.py
      - build_26515_short_bento_exposure_domain.sh
      - 26515_BASE_26514_COMMIT.txt
      - 26515_README_UPLOAD.txt
      - 26515_HANDOFF_HASHES.sha256
      - .github/workflows/build-26515-short-bento-domain.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26515-short-bento-domain
  cancel-in-progress: false

jobs:
  build:
    name: Direct tested 26514 source to 26515
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify v4 direct-baseline handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26515_HANDOFF_HASHES.sha256
          bash -n build_26515_short_bento_exposure_domain.sh
          python3 -m py_compile apply_26515_short_bento_exposure_domain.py validate_26515_short_bento_exposure_domain.py
          [[ "$(tr -d '\r\n' < 26515_BASE_26514_COMMIT.txt)" == "e9855a3af7a79801a762ec3f99b441474926f009" ]]
          grep -F 'SUCCESSFUL_26514_HEAD="e9855a3af7a79801a762ec3f99b441474926f009"' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F '26514_candidate_app_source.tar.gz' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'gh run download' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'DISABLED_26515_V4_DIRECT_26514_SOURCE' patch_26515_derived_builder.py >/dev/null
          python3 - <<'PYNOHIST'
          from pathlib import Path
          s=Path('build_26515_short_bento_exposure_domain.sh').read_text()
          bad=('build_'+'26512','apply_'+'26513','validate_'+'26513','derived_from_exact_'+'26512','candidate'+'26512','golden'+'26513')
          assert not [x for x in bad if x in s]
          print('PASS: no historical runtime constructor reference in v4 builder')
          PYNOHIST
          grep -F 'VERSION_NAME="0.9726515"' build_26515_short_bento_exposure_domain.sh >/dev/null
          grep -F 'VERSION_BUILD="26515"' build_26515_short_bento_exposure_domain.sh >/dev/null
          echo 'PASS: v4 handoff is direct-tested-26514 only; no historical runtime constructor'

      - name: Build guarded 26515 from successful 26514 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26515_short_bento_exposure_domain.sh apply_26515_short_bento_exposure_domain.py validate_26515_short_bento_exposure_domain.py
          ./build_26515_short_bento_exposure_domain.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26515-short-bento-domain-v4
          path: |
            IrisCamera-0.9726515-26515-short-bento-domain-fix-debug.apk
            build_26515_short_bento_exposure_domain_outputs/
          if-no-files-found: warn
