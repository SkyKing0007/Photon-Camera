name: Build 26695 Spektra Runtime Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26695_README_UPLOAD.txt'
      - '26695_*'
      - 'build_26695_spektra_runtime_parity.sh'
      - 'transform_26695.py'
      - 'validate_26695.py'
      - 'repair_26695_*.py'
      - 'handoff_payload_26695/**'
      - '.github/workflows/build-26695-spektra-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26695 handoff and exact successful 26694 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26695_HANDOFF_HASHES.sha256
          bash -n build_26695_spektra_runtime_parity.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26695.py','validate_26695.py','repair_26695_authority.py','repair_26695_infrastructure.py','repair_26695_patches.py','repair_26695_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26695 candidate from successful 26694 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26695_spektra_runtime_parity.sh
      - name: Verify exact 26695 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726695-26695-spektra-runtime-parity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726695-26695-spektra-runtime-parity-debug.apk" build_26695_spektra_runtime_parity_outputs/26695_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26695_spektra_runtime_parity_outputs/26695_apk_jni_contract.txt
      - name: Upload 26695 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26695-spektra-runtime-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726695-26695-spektra-runtime-parity-debug.apk
            build_26695_spektra_runtime_parity_outputs/
