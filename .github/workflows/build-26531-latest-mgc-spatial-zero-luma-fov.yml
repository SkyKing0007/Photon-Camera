name: Build 26531 V1.1 Latest MGC Spatial Zero Luma FOV
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26531_latest_mgc_spatial_zero_luma_fov.py
      - validate_26531_latest_mgc_spatial_zero_luma_fov.py
      - preflight_26531_latest_mgc_spatial_shaders.py
      - preflight_26530_superres_shaders.py
      - build_26531_latest_mgc_spatial_zero_luma_fov.sh
      - 26531_BASE_SUCCESSFUL_26530_V1.2_HEAD.txt
      - 26531_BASE_SUCCESSFUL_26530_V1.2_SOURCE_TAR.sha256
      - 26531_BASE_SUCCESSFUL_26530_V1.2_SOURCE_MANIFEST.sha256
      - 26531_SCOPE_PROVENANCE.txt
      - 26531_README_UPLOAD.txt
      - 26531_PREHANDOFF_STATIC_AUDIT.txt
      - 26531_RUNTIME_DELTA_FROM_SUCCESSFUL_26530_V1.2.patch
      - 26531_RUNTIME_DELTA_FROM_SUCCESSFUL_26530_V1.2.patch.sha256
      - 26531_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26530_V1.2.patch
      - 26531_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26530_V1.2.patch.sha256
      - 26531_HANDOFF_HASHES.sha256
      - .github/workflows/build-26531-latest-mgc-spatial-zero-luma-fov.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26531-latest-mgc-spatial-zero-luma-fov
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26531 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26531_HANDOFF_HASHES.sha256
          sha256sum -c 26531_RUNTIME_DELTA_FROM_SUCCESSFUL_26530_V1.2.patch.sha256
          sha256sum -c 26531_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26530_V1.2.patch.sha256
          python3 -m py_compile \
            apply_26531_latest_mgc_spatial_zero_luma_fov.py \
            validate_26531_latest_mgc_spatial_zero_luma_fov.py \
            preflight_26531_latest_mgc_spatial_shaders.py \
            preflight_26530_superres_shaders.py
          python3 apply_26531_latest_mgc_spatial_zero_luma_fov.py --self-test
          bash -n build_26531_latest_mgc_spatial_zero_luma_fov.sh
          [[ "$(tr -d '\r\n' < 26531_BASE_SUCCESSFUL_26530_V1.2_HEAD.txt)" == "8e847de9841b5ed3522970a1106f2b53cb3f7eb1" ]]
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726531"; VERSION_BUILD="26531"' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'SUCCESSFUL_26530_HEAD="8e847de9841b5ed3522970a1106f2b53cb3f7eb1"' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26530-gcam-luma-motion-safe-superres-v1-2"' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          ! grep -F 'BACKUP_BRANCH=' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          ! grep -F 'refs/heads/backup-' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          ! grep -E 'git (branch|switch -c|checkout -b).*backup' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'SABRE=SOURCE_ALLOWED_RUNTIME_DORMANT' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'MGC_LUMA_DENOISE=0' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          grep -F 'FOV_AUTHORITY=FULL_MOTIONV2_OUTPUT_ZOOM' build_26531_latest_mgc_spatial_zero_luma_fov.sh >/dev/null
          ! grep -F 'MgcMergeMethod.SABRE' apply_26531_latest_mgc_spatial_zero_luma_fov.py >/dev/null || \
            grep -F "if 'MgcMergeMethod.SABRE' in active" apply_26531_latest_mgc_spatial_zero_luma_fov.py >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26531 strict handoff static guards verified"

      - name: Guarded 26531 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26531_latest_mgc_spatial_zero_luma_fov.sh
          ./build_26531_latest_mgc_spatial_zero_luma_fov.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26531-latest-mgc-spatial-zero-luma-fov
          path: |
            IrisCamera-0.9726531-26531-latest-mgc-spatial-zero-luma-fov-debug.apk
            build_26531_latest_mgc_spatial_zero_luma_fov_outputs/
          if-no-files-found: warn
