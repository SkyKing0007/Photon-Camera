name: Build 26794 Post Denoise Spatial Chroma Floor
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26794.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26794 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26794.txt
          grep -Fx 'RUN_26794_POST_DENOISE_SPATIAL_CHROMA_FLOOR' TRIGGER_26794.txt
          sha256sum -c 26794_HANDOFF_HASHES.sha256
          bash -n build_26794_post_denoise_spatial_chroma_floor.sh
          python3 -S -m py_compile transform_26794.py validate_26794.py verify_26794_patches.py verify_26794_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26794_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26794_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26794 candidate from successful 26793 authority using exact successful 26793 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26794_post_denoise_spatial_chroma_floor.sh
      - name: Verify exact 26794 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726794-26794-post-denoise-spatial-chroma-floor-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726794-26794-post-denoise-spatial-chroma-floor-debug.apk' build_26794_post_denoise_spatial_chroma_floor_outputs/26794_APK.sha256
      - name: Upload 26794 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26794-post-denoise-spatial-chroma-floor
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726794-26794-post-denoise-spatial-chroma-floor-debug.apk
            build_26794_post_denoise_spatial_chroma_floor_outputs/
