name: Build 26486 Full Bjzhou Censored Opponent Latency V1

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26483_successful_source.patch'
      - '26483_successful_after.sha256'
      - '26484_delta_from_26483.patch'
      - 'transform_26485_runtime_shutter_full_fix_v1.py'
      - 'transform_26486_full_bjzhou_censored_opponent_latency_v1.py'
      - 'build_26486_full_bjzhou_censored_opponent_latency_v1.sh'
      - '.github/workflows/build-26486-full-bjzhou-censored-opponent-latency-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact infrastructure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Verify authoritative 26486 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum build_26486_full_bjzhou_censored_opponent_latency_v1.sh | awk '{print $1}')" = "9aa592771266ecdf84d2f7dcc2781461d4740f193c5eb9d9af9550f1af1f54bb"
          test "$(sha256sum transform_26486_full_bjzhou_censored_opponent_latency_v1.py | awk '{print $1}')" = "a520de4ed11435fee2a9a43026c4513b183a9c56a5ddee44664b71fbe7ea1a65"
          test "$(sha256sum transform_26485_runtime_shutter_full_fix_v1.py | awk '{print $1}')" = "2e04a8e250d0fb64ca3e4a7763ed4943203d7f1ae740283018a7fb1b90c9a461"
          test "$(sha256sum 26483_successful_source.patch | awk '{print $1}')" = "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          test "$(sha256sum 26483_successful_after.sha256 | awk '{print $1}')" = "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          test "$(sha256sum 26484_delta_from_26483.patch | awk '{print $1}')" = "18fbb861c3c49f4ad8399f29aa60ca3e85df57ffacc794b8b6a2206b42197ac3"
          bash -n build_26486_full_bjzhou_censored_opponent_latency_v1.sh
          python3 -m py_compile transform_26485_runtime_shutter_full_fix_v1.py transform_26486_full_bjzhou_censored_opponent_latency_v1.py
          echo "26486 infrastructure identity PASS"

      - name: Build 26486 with full safety gates
        shell: bash
        run: |
          chmod +x build_26486_full_bjzhou_censored_opponent_latency_v1.sh
          ./build_26486_full_bjzhou_censored_opponent_latency_v1.sh

      - name: Upload 26486 APK and audit package
        uses: actions/upload-artifact@v4
        with:
          name: IrisCamera-0.9726486-26486-full-bjzhou-censored-opponent-latency
          if-no-files-found: error
          path: |
            IrisCamera-0.9726486-26486-full-bjzhou-censored-opponent-latency-debug.apk
            build_26486_outputs/**
