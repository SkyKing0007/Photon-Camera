name: Build 26586 V1 Viewfinder + Highlight Authority Split

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26586_*'
      - 'REGRESSION_V1_26586_*'
      - 'build_26586_v1_viewfinder_highlight_authority_split.sh'
      - 'transform_26586_v1.py'
      - 'validate_26586_v1.py'
      - 'verify_26586_v1_authority.py'
      - 'verify_26586_v1_regressions.py'
      - 'verify_26586_v1_patches.py'
      - 'verify_26586_v1_shaders.py'
      - 'handoff_payload_26586_v1/**'
      - '.github/workflows/build-26586-v1-viewfinder-highlight-authority-split.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26586 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26586_HANDOFF_HASHES.sha256
          bash -n build_26586_v1_viewfinder_highlight_authority_split.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26586_v1.py','validate_26586_v1.py','verify_26586_v1_authority.py','verify_26586_v1_regressions.py','verify_26586_v1_patches.py','verify_26586_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26586_v1_viewfinder_highlight_authority_split.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="7201c93c1993a1a42c89744acce2f661adc5d09d"' in s
          assert 'BASE_RUN_ID="33710354236"' in s
          assert 'BASE_JOB_ID="100508291920"' in s
          assert 'BASE_ARTIFACT_ID="9876758467"' in s
          assert 'BASE_ARTIFACT_SHA="aa95beb48d3cebfb1c5df959b7778cac043faf55bc78d96ac098b22d17349c8c"' in s
          assert 'BASE_TAR_SHA="fe80c7288b94e11194f28710f08f0a8c221d9e8c706e75fdbd1639b6b55e8f28"' in s
          assert 'VERSION_NAME="0.9726586"' in s and 'VERSION_BUILD="26586"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 2 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26586 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert '[[ "$(git rev-parse HEAD^)" == "$BASE_SUCCESS_COMMIT" ]]' in s
          print('PASS sealed syntax + successful 26585 V1 authority + inherited compiler/build order')
          PY
          grep -F 'meter structured branch is exact successful 26584 64-bin P90 / 0.965 target' REGRESSION_V1_26586_METER_HIGHLIGHT_AUTHORITY_SPLIT.txt >/dev/null
          grep -F 'adaptive_color_appearance_26563.glsl remains byte-identical to successful 26585' REGRESSION_V1_26586_CARRIED_26585.txt >/dev/null
          grep -F 'workflow does not invent or require a prior build-script blob assertion that successful 26585 did not use' REGRESSION_V1_26586_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26586_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26586_' .github/workflows --exclude='build-26586-v1-viewfinder-highlight-authority-split.yml'
          ! grep -R -F 'handoff_payload_26586_v1' .github/workflows --exclude='build-26586-v1-viewfinder-highlight-authority-split.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26586 candidate from successful compiled 26585 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26586_v1_viewfinder_highlight_authority_split.sh

      - name: Upload 26586 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26586-v1-viewfinder-highlight-authority-split
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726586-26586-v1-viewfinder-highlight-authority-split-debug.apk
            build_26586_v1_viewfinder_highlight_authority_split_outputs/
