name: Build 26777 Claude Resolve Support Footprint
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26777.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26777 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26777.txt
          grep -Fx 'RUN_26777_CLAUDE_RESOLVE_SUPPORT_FOOTPRINT' TRIGGER_26777.txt
          sha256sum -c 26777_HANDOFF_HASHES.sha256
          bash -n build_26777_claude_resolve_support_footprint.sh
          python3 -S -m py_compile transform_26777.py validate_26777.py verify_26777_patches.py verify_26777_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26777_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26777_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26777 candidate from successful 26776 authority using unchanged successful procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26777_claude_resolve_support_footprint.sh
      - name: Verify exact 26777 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726777-26777-claude-resolve-support-footprint-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726777-26777-claude-resolve-support-footprint-debug.apk' build_26777_claude_resolve_support_footprint_outputs/26777_APK.sha256
      - name: Upload 26777 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26777-claude-resolve-support-footprint
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726777-26777-claude-resolve-support-footprint-debug.apk
            build_26777_claude_resolve_support_footprint_outputs/
