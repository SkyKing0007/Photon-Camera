name: Build 26801 Telemetry GL Cleanup Repair
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26801.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26801 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26801.txt
          grep -Fx 'RUN_26801_TELEMETRY_GL_CLEANUP_REPAIR' TRIGGER_26801.txt
          sha256sum -c 26801_HANDOFF_HASHES.sha256
          bash -n build_26801_telemetry_gl_cleanup_repair.sh
          python3 -S -m py_compile transform_26801.py validate_26801.py verify_26801_patches.py verify_26801_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26801_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26801_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26801 candidate from successful 26800 authority using exact successful 26800 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26801_telemetry_gl_cleanup_repair.sh
      - name: Verify exact 26801 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726801-26801-telemetry-gl-cleanup-repair-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726801-26801-telemetry-gl-cleanup-repair-debug.apk' build_26801_telemetry_gl_cleanup_repair_outputs/26801_APK.sha256
      - name: Upload 26801 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26801-telemetry-gl-cleanup-repair
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726801-26801-telemetry-gl-cleanup-repair-debug.apk
            build_26801_telemetry_gl_cleanup_repair_outputs/
