name: Build 26899 B Super Res OFF Additional High-Zoom Luminance Sharpen
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26899.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay SHA-pinned successful 26898 historical runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26893_replay_exact_26892_workflow.py
          python3 -S generate_26893_build.py .
          test "$(sha256sum build_26893_iris_rawr.sh | awk '{print $1}')" = '9a70b375fd5f0a1e5148cef7e4640b4014fe0a24d8e5f38fcada15bbc0713956'
          sha256sum -c 26893_GENERATED_BUILD_SHA256.txt
          python3 -S generate_26894_build.py .
          test "$(sha256sum build_26894_iris_rawr.sh | awk '{print $1}')" = '1f9dcc045b6ca5fa8928443dcc28b98907b7fad152546d802445b74207244be6'
          sha256sum -c 26894_GENERATED_BUILD_SHA256.txt
          python3 -S generate_26895_build.py .
          test "$(sha256sum build_26895_iris_rawr.sh | awk '{print $1}')" = 'a6c341d9389887329a55545c78c5c25e727655fbae73ccedc2c353d321165b2b'
          sha256sum -c 26895_GENERATED_BUILD_SHA256.txt
          python3 -S stage_26897_root.py
          sha256sum -c 26897_HANDOFF_HASHES.sha256
          python3 -S generate_26897_build.py .
          test "$(sha256sum build_26897_iris_rawr.sh | awk '{print $1}')" = '1a0b521c75e12003e0ab31e91bbe9ab8ae9c85b261ba8988ed37cf2e4cfc8dd3'
          sha256sum -c 26897_GENERATED_BUILD_SHA256.txt
          test -f TRIGGER_26898.txt && grep -Fx 'RUN_26898_ISOLATED_SABRE_DNG_BEFORE_B_JPEG_V1' TRIGGER_26898.txt
          python3 -S stage_26898_root.py
          sha256sum -c 26898_HANDOFF_HASHES.sha256
          python3 -S test_26898_three_stage_negatives.py
          python3 -S generate_26898_build.py .
          test "$(sha256sum build_26898_iris_rawr.sh | awk '{print $1}')" = '9c97ed074b1d4ec48528e1d63103aed3198d44406a0c3f4820ad3309c203c99a'
          sha256sum -c 26898_GENERATED_BUILD_SHA256.txt
      - name: Derive SHA-sealed 26899 successor guarded runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26899.txt && grep -Fx 'RUN_26899_B_OFF_ONLY_ZOOM_LUMA_SHARPEN_V1' TRIGGER_26899.txt
          python3 -S stage_26899_root.py
          sha256sum -c 26899_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26899_build.py verify_26899.py stage_26899_root.py test_26899_three_stage_negatives.py test_26899_modes.py
          python3 -S test_26899_three_stage_negatives.py
          python3 -S generate_26899_build.py .
          cp build_26899_iris_rawr.sh /tmp/26899_first_generation.sh
          python3 -S generate_26899_build.py .
          cmp /tmp/26899_first_generation.sh build_26899_iris_rawr.sh
          sha256sum -c 26899_GENERATED_BUILD_SHA256.txt
          bash -n build_26899_iris_rawr.sh
          python3 -S test_26899_three_stage_negatives.py --runner
          python3 -S stage_26899_root.py
          test "$(find handoff_payload_26899 -type f | wc -l)" -eq 5
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited 17-stage 26899 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26899_iris_rawr.sh
      - name: Prove single intended 26899 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726899-26899-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726899-26899-iris-rawr-debug.apk' build_26899_iris_rawr_outputs/26899_APK.sha256
      - name: Seal exact EXECUTED 26899 runner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26899_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26899 --root . --expected-sha256 7d18fe9c340d6202ca2953d8aee9b490e23e4f27145b2edc39eace5095aeb238
          test -f build_26899_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26899_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26899 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26899-b-only-superres-off-zoom-luma-sharpen-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726899-26899-iris-rawr-debug.apk
            build_26899_iris_rawr_outputs/
