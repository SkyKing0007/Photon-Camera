name: Build 26577 V1 GPU Publication Resolve

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26577_*'
      - 'REGRESSION_V1_26577_*'
      - 'build_26577_v1_gpu_publication_resolve.sh'
      - 'transform_26577_v1.py'
      - 'validate_26577_v1.py'
      - 'verify_26577_v1_authority.py'
      - 'verify_26577_v1_patches.py'
      - 'verify_26577_v1_shaders.py'
      - 'handoff_payload_26577_v1/**'
      - '.github/workflows/build-26577-v1-gpu-publication-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26577 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26577_HANDOFF_HASHES.sha256
          bash -n build_26577_v1_gpu_publication_resolve.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26577_v1.py',
              'validate_26577_v1.py',
              'verify_26577_v1_authority.py',
              'verify_26577_v1_patches.py',
              'verify_26577_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26577_v1_gpu_publication_resolve.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="7ed83adfa4a7161f9488ffdaa21b20505d8e5585"' in s
          assert 'HANDOFF_PARENT_COMMIT="7ed83adfa4a7161f9488ffdaa21b20505d8e5585"' in s
          assert 'BASE_RUN_ID="33558974026"' in s
          assert 'BASE_JOB_ID="100026602573"' in s
          assert 'BASE_ARTIFACT_ID="9820597239"' in s
          assert 'BASE_ARTIFACT_SHA="b21e78895fc4911fe22cea2b955e1367ff527167a288de7acf3734503d0d6123"' in s
          assert 'BASE_TAR_SHA="cba6a009bcf05dd50fe5e61bc15e1b0c97c2b0e0e1464fcc3739d9b926554a37"' in s
          assert 'VERSION_NAME="0.9726577"' in s and 'VERSION_BUILD="26577"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26576 verification/build ordering remains unchanged.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26577 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          expected="""snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26576 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }"""
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          print('PASS sealed Python syntax + exact successful 26576 authority-seeded verification order inheritance')
          PY
          grep -F 'gpuFallbackReason=gpu_failed' REGRESSION_V1_26577_GPU_PUBLICATION_RESOLVE.txt >/dev/null
          grep -F 'Generic gpu_failed is forbidden' REGRESSION_V1_26577_GPU_PUBLICATION_RESOLVE.txt >/dev/null
          grep -F 'GPU map-synchronized PBO compatibility tier' REGRESSION_V1_26577_GPU_PUBLICATION_RESOLVE.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26577_CARRIED_FAILURES.txt >/dev/null
          grep -F 'no verification order is weakened' V1_26577_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26577_' .github/workflows --exclude='build-26577-v1-gpu-publication-resolve.yml'
          ! grep -R -F 'handoff_payload_26577_v1' .github/workflows --exclude='build-26577-v1-gpu-publication-resolve.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26577 candidate from successful compiled 26576 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26577_v1_gpu_publication_resolve.sh
          ./build_26577_v1_gpu_publication_resolve.sh

      - name: Upload 26577 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26577-v1-gpu-publication-resolve
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726577-26577-v1-gpu-publication-resolve-debug.apk
            build_26577_v1_gpu_publication_resolve_outputs/
