name: Build 26476 Wronski Runtime Shader Portability V2

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26476_wronski_runtime_shader_portability_v2.sh
      - .github/workflows/build-26476-wronski-runtime-shader-portability-v2.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26476 Wronski runtime shader portability V2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard 26476 V2 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "7b80ea5fcb69d6eece6102b460add0ca8e4eb3cd" || {
            echo "26476 V2 infrastructure commit must be directly based on failed 26476 V1 infrastructure commit"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26476 V2 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26476 V2 workflow lineage gate PASS"

      - name: Run guarded 26476 V2 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26476_wronski_runtime_shader_portability_v2.sh
          ./build_26476_wronski_runtime_shader_portability_v2.sh

      - name: Upload 26476 V2 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26476-wronski-runtime-shader-portability-v2
          if-no-files-found: error
          path: |
            build_26476_outputs/**
            IrisCamera-0.9726476-26476-wronski-runtime-shader-portability-debug.apk
