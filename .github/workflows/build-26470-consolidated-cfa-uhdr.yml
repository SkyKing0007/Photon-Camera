name: Build 26470 Consolidated CFA UHDR

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26470_consolidated_cfa_uhdr.sh
      - .github/workflows/build-26470-consolidated-cfa-uhdr.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26470 build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run guarded 26470 operation
        shell: bash
        run: |
          chmod +x ./build_26470_consolidated_cfa_uhdr.sh
          ./build_26470_consolidated_cfa_uhdr.sh

      - name: Upload 26470 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26470-consolidated-cfa-uhdr
          if-no-files-found: error
          path: |
            build_26470_outputs/**
            IrisCamera-0.9726470-26470-consolidated-cfa-uhdr-debug.apk
