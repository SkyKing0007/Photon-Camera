name: Build 26473 IPOL Wronski Completion V2

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26473_ipol_wronski_completion_v2.sh
      - .github/workflows/build-26473-ipol-wronski-completion-v2.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26473 IPOL Wronski completion V2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard corrective V2 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "b0e9d196b8c0918acf7c91dcaa338515552d090e" || {
            echo "26473 V2 must be directly based on failed V1 infrastructure commit"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26473 V2 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26473 V2 workflow lineage gate PASS"

      - name: Run guarded 26473 IPOL Wronski completion V2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26473_ipol_wronski_completion_v2.sh
          ./build_26473_ipol_wronski_completion_v2.sh

      - name: Upload 26473 V2 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26473-ipol-wronski-completion-v2
          if-no-files-found: error
          path: |
            build_26473_outputs/**
            IrisCamera-0.9726473-26473-ipol-wronski-completion-debug.apk
