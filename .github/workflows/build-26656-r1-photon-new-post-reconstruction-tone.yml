name: Build 26656 R1 Photon New Post-Reconstruction Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26656_R1_README_UPLOAD.txt'
      - 'R1_26656_*'
      - 'build_26656_r1_photon_new_post_reconstruction_tone.sh'
      - 'transform_26656.py'
      - 'validate_26656.py'
      - 'verify_26656_*.py'
      - 'handoff_payload_26656/**'
      - '.github/workflows/build-26656-r1-photon-new-post-reconstruction-tone.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26656 handoff and exact successful 26655 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26656_HANDOFF_HASHES.sha256
          bash -n build_26656_r1_photon_new_post_reconstruction_tone.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26656.py','validate_26656.py','verify_26656_authority.py','verify_26656_infrastructure.py','verify_26656_patches.py','verify_26656_regressions.py','verify_26656_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26656 candidate from successful 26655 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26656_r1_photon_new_post_reconstruction_tone.sh
      - name: Verify exact 26656 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726656-26656-r1-photon-new-post-reconstruction-tone-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726656-26656-r1-photon-new-post-reconstruction-tone-debug.apk" build_26656_r1_photon_new_post_reconstruction_tone_outputs/26656_R1_APK.sha256
      - name: Upload 26656 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26656-r1-photon-new-post-reconstruction-tone
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726656-26656-r1-photon-new-post-reconstruction-tone-debug.apk
            build_26656_r1_photon_new_post_reconstruction_tone_outputs/
