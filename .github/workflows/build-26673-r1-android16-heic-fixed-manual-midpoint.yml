name: Build 26673 R1 Android16 HEIC Fixed Manual Midpoint

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26673_R1_README_UPLOAD.txt'
      - 'R1_26673_*'
      - 'build_26673_r1_android16_heic_fixed_manual_midpoint.sh'
      - 'transform_26673.py'
      - 'validate_26673.py'
      - 'verify_26673_*.py'
      - 'handoff_payload_26673/**'
      - '.github/workflows/build-26673-r1-android16-heic-fixed-manual-midpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26673 handoff and exact successful 26672 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26673_HANDOFF_HASHES.sha256
          bash -n build_26673_r1_android16_heic_fixed_manual_midpoint.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26673.py','validate_26673.py','verify_26673_authority.py','verify_26673_infrastructure.py','verify_26673_patches.py','verify_26673_regressions.py','verify_26673_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26673 candidate from successful 26672 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26673_r1_android16_heic_fixed_manual_midpoint.sh
      - name: Verify exact 26673 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726673-26673-r1-android16-heic-fixed-manual-midpoint-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726673-26673-r1-android16-heic-fixed-manual-midpoint-debug.apk" build_26673_r1_android16_heic_fixed_manual_midpoint_outputs/26673_R1_APK.sha256
      - name: Upload 26673 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26673-r1-android16-heic-fixed-manual-midpoint
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726673-26673-r1-android16-heic-fixed-manual-midpoint-debug.apk
            build_26673_r1_android16_heic_fixed_manual_midpoint_outputs/
