name: Build 26677 R1 Watermark Correction

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26677_R1_README_UPLOAD.txt'
      - 'R1_26677_*'
      - 'build_26677_r1_watermark_correction.sh'
      - 'transform_26677.py'
      - 'validate_26677.py'
      - 'verify_26677_*.py'
      - 'handoff_payload_26677/**'
      - '.github/workflows/build-26677-r1-watermark-correction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26677 handoff and exact successful 26676 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26677_HANDOFF_HASHES.sha256
          bash -n build_26677_r1_watermark_correction.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26677.py','validate_26677.py','verify_26677_authority.py','verify_26677_infrastructure.py','verify_26677_patches.py','verify_26677_regressions.py','verify_26677_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26677 candidate from successful 26676 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26677_r1_watermark_correction.sh
      - name: Verify exact 26677 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726677-26677-r1-watermark-correction-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726677-26677-r1-watermark-correction-debug.apk" build_26677_r1_watermark_correction_outputs/26677_R1_APK.sha256
      - name: Upload 26677 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26677-r1-watermark-correction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726677-26677-r1-watermark-correction-debug.apk
            build_26677_r1_watermark_correction_outputs/
