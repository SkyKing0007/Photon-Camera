name: Build 26685 R1 Spektra VF-S Native Session Reuse

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26685_R1_README_UPLOAD.txt'
      - 'R1_26685_*'
      - 'build_26685_r1_spektra_verified_autodiscovery_native_geometry.sh'
      - 'transform_26685.py'
      - 'validate_26685.py'
      - 'verify_26685_*.py'
      - 'handoff_payload_26685/**'
      - '.github/workflows/build-26685-r1-spektra-verified-autodiscovery-native-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26685 handoff and exact successful 26684 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26685_HANDOFF_HASHES.sha256
          bash -n build_26685_r1_spektra_verified_autodiscovery_native_geometry.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26685.py','validate_26685.py','verify_26685_authority.py','verify_26685_infrastructure.py','verify_26685_patches.py','verify_26685_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26685 candidate from successful 26684 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26685_r1_spektra_verified_autodiscovery_native_geometry.sh
      - name: Verify exact 26685 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726685-26685-r1-spektra-verified-autodiscovery-native-geometry-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726685-26685-r1-spektra-verified-autodiscovery-native-geometry-debug.apk" build_26685_r1_spektra_verified_autodiscovery_native_geometry_outputs/26685_R1_APK.sha256
      - name: Upload 26685 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26685-r1-spektra-verified-autodiscovery-native-geometry
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726685-26685-r1-spektra-verified-autodiscovery-native-geometry-debug.apk
            build_26685_r1_spektra_verified_autodiscovery_native_geometry_outputs/
