name: Build 26889 B OFF Shutter Reference Motion-Aware LONG
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26889.txt'
      - 'generate_26889_build.py'
      - '.github/workflows/build-26889-iris-rawr.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact SHA-pinned successful 26888 historical setup and GLSL cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26889_replay_exact_26888_workflow.py
          test "$(sha256sum build_26888_iris_rawr.sh | awk '{print $1}')" = '5e9bc28287ba38099390b9cad99168c314e3058473e9924137aaf2f02d7f4753'
          sha256sum -c 26888_GENERATED_BUILD_SHA256.txt
      - name: Derive and seal exact-successor guarded 26889 runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26889.txt && grep -Fx 'RUN_26889_B_OFF_SHUTTER_ADJACENT_MOTION_LONG_V1' TRIGGER_26889.txt
          python3 -S stage_26889_root.py
          sha256sum -c 26889_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26889_build.py verify_26889_candidate.py verify_26889_semantics.py verify_26889_patches.py verify_26889_expanded_glsl.py test_26889_negative_tamper.py verify_26889_compiled_push_abi.py stage_26889_root.py photon_26889_replay_exact_26888_workflow.py
          python3 -S generate_26889_build.py .
          sha256sum -c 26889_GENERATED_BUILD_SHA256.txt
          bash -n build_26889_iris_rawr.sh
          python3 -S stage_26889_root.py
          test "$(find handoff_payload_26889 -type f | wc -l)" -eq 10
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited guarded 17-stage 26889 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26889_iris_rawr.sh
      - name: Verify exactly one intended 26889 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726889-26889-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726889-26889-iris-rawr-debug.apk' build_26889_iris_rawr_outputs/26889_APK.sha256
      - name: Seal exact EXECUTED 26889 runner and compiled evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26889_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26889 --root . --expected-sha256 4070c3a0f47fb043d99ad18a1b2d53a629be26891d1147ef9bfc60d790cb7d73
          test -f build_26889_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26889_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26889 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26889-b-off-shutter-reference-motion-long-archived-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726889-26889-iris-rawr-debug.apk
            build_26889_iris_rawr_outputs/
