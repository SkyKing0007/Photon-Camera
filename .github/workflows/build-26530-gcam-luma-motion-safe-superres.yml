name: Build 26530 V1.2 GCam Luma Motion Safe SuperRes
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26530_gcam_luma_motion_safe_superres.py
      - validate_26530_gcam_luma_motion_safe_superres.py
      - preflight_26530_superres_shaders.py
      - build_26530_gcam_luma_motion_safe_superres.sh
      - 26530_BASE_26529_HEAD.txt
      - 26530_SCOPE_PROVENANCE.txt
      - 26530_README_UPLOAD.txt
      - 26530_V1.2_PREHANDOFF_STATIC_AUDIT.txt
      - 26530_RUNTIME_DELTA_FROM_SUCCESSFUL_26529.patch
      - 26530_RUNTIME_DELTA_FROM_SUCCESSFUL_26529.patch.sha256
      - 26530_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26529.patch
      - 26530_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26529.patch.sha256
      - 26530_HANDOFF_HASHES.sha256
      - .github/workflows/build-26530-gcam-luma-motion-safe-superres.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26530-gcam-luma-motion-safe-superres-v1-2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26530 V1.2 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26530_HANDOFF_HASHES.sha256
          sha256sum -c 26530_RUNTIME_DELTA_FROM_SUCCESSFUL_26529.patch.sha256
          sha256sum -c 26530_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26529.patch.sha256
          python3 -m py_compile \
            apply_26530_gcam_luma_motion_safe_superres.py \
            validate_26530_gcam_luma_motion_safe_superres.py \
            preflight_26530_superres_shaders.py
          python3 apply_26530_gcam_luma_motion_safe_superres.py --self-test
          bash -n build_26530_gcam_luma_motion_safe_superres.sh
          [[ "$(tr -d '\r\n' < 26530_BASE_26529_HEAD.txt)" == "dae32a760a31a7f9f8d80c612e8b58be4519e637" ]]
          [[ "$(sha256sum 26530_RUNTIME_DELTA_FROM_SUCCESSFUL_26529.patch | awk '{print $1}')" == "b971932bf71622d8966f45bb1a2b93297a0b0e1ecd538c5d09990cafb1b4f6a3" ]]
          [[ "$(sha256sum 26530_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26529.patch | awk '{print $1}')" == "b509cc5ad9ba16a3d8df4f44f98bc193efa979907146d759017d75682c35a314" ]]
          grep -F 'VERSION_NAME="0.9726530"; VERSION_BUILD="26530"' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'SUCCESSFUL_26529_HEAD="dae32a760a31a7f9f8d80c612e8b58be4519e637"' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26529-manual-30x-iris-spatial-rgb-v3.yml"' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F "m.group(1).strip()+\"\\n\"" preflight_26530_superres_shaders.py >/dev/null
          grep -F "source.startswith('#version ')" preflight_26530_superres_shaders.py >/dev/null
          grep -F 'preflight_26529_iris_embedded_shaders_v3.py' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'preflight_26526_inherited_shaders.py' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'preflight_26527_native_syntax.py' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          grep -F 'test_26527_dng_subifd.py' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          ! grep -Ei 'git (branch|switch -c|checkout -b).*backup' build_26530_gcam_luma_motion_safe_superres.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26530 V1.2 strict handoff static guards verified"

      - name: Guarded 26530 V1.2 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26530_gcam_luma_motion_safe_superres.sh
          ./build_26530_gcam_luma_motion_safe_superres.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26530-gcam-luma-motion-safe-superres-v1-2
          path: |
            IrisCamera-0.9726530-26530-gcam-luma-motion-safe-superres-debug.apk
            build_26530_gcam_luma_motion_safe_superres_outputs/
          if-no-files-found: warn
