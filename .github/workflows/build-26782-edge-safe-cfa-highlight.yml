name: Build 26782 Edge Safe CFA Highlight
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26782.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26782 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26782.txt
          grep -Fx 'RUN_26782_EDGE_SAFE_CFA_HIGHLIGHT' TRIGGER_26782.txt
          sha256sum -c 26782_HANDOFF_HASHES.sha256
          bash -n build_26782_edge_safe_cfa_highlight.sh
          python3 -S -m py_compile transform_26782.py validate_26782.py verify_26782_patches.py verify_26782_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26782_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26782_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26782 candidate from successful 26781 authority using exact successful 26781 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26782_edge_safe_cfa_highlight.sh
      - name: Verify exact 26782 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726782-26782-edge-safe-cfa-highlight-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726782-26782-edge-safe-cfa-highlight-debug.apk' build_26782_edge_safe_cfa_highlight_outputs/26782_APK.sha256
      - name: Upload 26782 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26782-edge-safe-cfa-highlight
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726782-26782-edge-safe-cfa-highlight-debug.apk
            build_26782_edge_safe_cfa_highlight_outputs/
