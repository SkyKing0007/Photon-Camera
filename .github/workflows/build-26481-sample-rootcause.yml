name: Build 26481 Authoritative Sample Root-Cause V2

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26481_authoritative_sample_rootcause_v2.sh
      - transform_26481_sample_rootcause_v1.py
      - 26479_successful_source.patch
      - 26479_successful_after.sha256
      - transform_26480_bjzhou_short_highlight_v1.py
      - .github/workflows/build-26481-sample-rootcause.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26481 sample root-cause
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental rebuild branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard authoritative 26481 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git diff --name-only 8233415edf738bf35c0fe1c4907f5dfe51de31a4 -- app/src/main app/version.properties | wc -l)" -eq 0
          test "$(sha256sum 26479_successful_source.patch | awk '{print $1}')" = "996aac3986f658663d23b53d698f4657f0c01c65c3f725de3fc362fde88ab417"
          test "$(sha256sum 26479_successful_after.sha256 | awk '{print $1}')" = "900729d32ddc3d621bd51f21ff6afde74d0e34a5531d9593a2c6bc8ecaa193e7"
          test "$(sha256sum transform_26480_bjzhou_short_highlight_v1.py | awk '{print $1}')" = "62f4716e402a5525416ae869c378342465d9b78cc5d3bea3b516096e86cd03aa"
          test "$(sha256sum transform_26481_sample_rootcause_v1.py | awk '{print $1}')" = "e912d743dbba989ca3f466436ecbe22a567b47a71ae8cb0b801cea5bd0916672"
          test "$(sha256sum build_26481_authoritative_sample_rootcause_v2.sh | awk '{print $1}')" = "1fed0007c1fc67f719535a5867d91f4310f55adfc25896935bd5ef93af6bedc1"
          python3 -m py_compile transform_26480_bjzhou_short_highlight_v1.py
          python3 -m py_compile transform_26481_sample_rootcause_v1.py
          bash -n build_26481_authoritative_sample_rootcause_v2.sh
          echo "26481 exact infrastructure/replay/syntax guard PASS"

      - name: Run complete guarded 26481 build
        shell: bash
        run: |
          chmod +x build_26481_authoritative_sample_rootcause_v2.sh
          ./build_26481_authoritative_sample_rootcause_v2.sh

      - name: Upload 26481 audit patches, logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26481-authoritative-sample-rootcause-v2
          if-no-files-found: warn
          path: |
            26481_outputs/**
            IrisCamera-0.9726481-26481-sample-rootcause-highlight-debug.apk
