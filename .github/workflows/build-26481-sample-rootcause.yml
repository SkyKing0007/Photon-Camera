name: Build 26481 sample root-cause

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate 26481 package
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum transform_26481_sample_rootcause_v1.py | awk '{print $1}')" = "e912d743dbba989ca3f466436ecbe22a567b47a71ae8cb0b801cea5bd0916672"
          test "$(sha256sum build_26481_authoritative_sample_rootcause_v1.sh | awk '{print $1}')" = "36b554c431e33e99ec3ca927976407ee0e26bbae65fcdb81f6ce960b3c76983c"
          echo "26481 package validation PASS"

      - name: Build 26481
        shell: bash
        run: |
          chmod +x build_26481_authoritative_sample_rootcause_v1.sh
          ./build_26481_authoritative_sample_rootcause_v1.sh

      - name: Upload APK and audits
        uses: actions/upload-artifact@v4
        with:
          name: 26481-sample-rootcause
          if-no-files-found: error
          path: |
            IrisCamera-0.9726481-26481-sample-rootcause-highlight-debug.apk
            26481_outputs/**
