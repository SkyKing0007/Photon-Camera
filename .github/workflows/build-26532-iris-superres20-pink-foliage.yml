name: Build 26532 V1.4 Iris SuperRes20 Pink Foliage
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26532_iris_superres20_pink_foliage.py
      - validate_26532_iris_superres20_pink_foliage.py
      - preflight_26532_iris_shaders.py
      - preflight_26532_native_jpeg_syntax.py
      - preflight_26532_java_xml_syntax.py
      - build_26532_iris_superres20_pink_foliage.sh
      - 26532_BASE_SUCCESSFUL_26531_HEAD.txt
      - 26532_BASE_SUCCESSFUL_26531_SOURCE_TAR.sha256
      - 26532_BASE_SUCCESSFUL_26531_SOURCE_MANIFEST.sha256
      - 26532_SCOPE_PROVENANCE.txt
      - 26532_PREHANDOFF_STATIC_AUDIT.txt
      - 26532_README_UPLOAD.txt
      - 26532_RUNTIME_DELTA_FROM_26531.patch
      - 26532_RUNTIME_DELTA_FROM_26531.patch.sha256
      - 26532_RUNTIME_ROLLBACK_TO_26531.patch
      - 26532_RUNTIME_ROLLBACK_TO_26531.patch.sha256
      - 26532_HANDOFF_HASHES.sha256
      - .github/workflows/build-26532-iris-superres20-pink-foliage.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26532-iris-superres20-pink-foliage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26532 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26532_HANDOFF_HASHES.sha256
          sha256sum -c 26532_RUNTIME_DELTA_FROM_26531.patch.sha256
          sha256sum -c 26532_RUNTIME_ROLLBACK_TO_26531.patch.sha256
          python3 -m py_compile \
            apply_26532_iris_superres20_pink_foliage.py \
            validate_26532_iris_superres20_pink_foliage.py \
            preflight_26532_iris_shaders.py \
            preflight_26532_native_jpeg_syntax.py \
            preflight_26532_java_xml_syntax.py
          bash -n build_26532_iris_superres20_pink_foliage.sh
          test "$(tr -d '\r\n' < 26532_BASE_SUCCESSFUL_26531_HEAD.txt)" = "3d0184ea279b2dab166f9837082d57f08c5e7ef4"
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26531-before-26532-superres-pink-reset"' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726532"; VERSION_BUILD="26532"' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F ':app:compileDebugKotlin :app:compileDebugJavaWithJavac' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F ':app:assembleDebug' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F '26507_BJZHOU_NATIVE_DEPENDENCIES.sha256' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F '26507_BJZHOU_DEPENDENCY_COMMIT.txt' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'libjpeg-turbo/CMakeLists.txt' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'libultrahdr/ultrahdr_api.h' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'libultrahdr/lib/src/ultrahdr_api.cpp' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'core.sparseCheckout true' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F '/app/src/main/cpp/libjpeg-turbo/' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F '/app/src/main/cpp/libultrahdr/' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F 'exact successful-26531 native vendor checkout + full manifest verified before Gradle' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          ! grep -F 'libultrahdr/CMakeLists.txt' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          ! grep -F 'git -C "$BJ" archive' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          ! grep -F 'preflight_26531_latest_mgc_spatial_shaders.py' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          ! grep -F 'preflight_26530_superres_shaders.py' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F "tar --sort=name --mtime='UTC 2026-08-23 00:00:00' --owner=0 --group=0 --numeric-owner" build_26532_iris_superres20_pink_foliage.sh >/dev/null
          grep -F "unexpected path in 26531 candidate archive" build_26532_iris_superres20_pink_foliage.sh >/dev/null
          echo "PASS: 26532 V1.4 strict handoff + exact successful-26531 native procedure guards verified"

      - name: Guarded 26532 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26532_iris_superres20_pink_foliage.sh
          ./build_26532_iris_superres20_pink_foliage.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26532-iris-superres20-pink-foliage
          path: |
            IrisCamera-0.9726532-26532-superres20-pink-foliage-debug.apk
            build_26532_iris_superres20_pink_foliage_outputs/
          if-no-files-found: warn
