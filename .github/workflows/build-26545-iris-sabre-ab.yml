name: Build 26545 Iris Sabre A-B

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26545-iris-sabre-ab.yml'
      - 'build_26545_iris_sabre_ab.sh'
      - 'validate_26545_iris_sabre_ab.py'
      - 'preflight_26545_sabre_glsl.py'
      - '26545_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26545-iris-sabre-ab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26545 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26545_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26545_iris_sabre_ab.py preflight_26545_sabre_glsl.py
          python3 validate_26545_iris_sabre_ab.py --self-test
          python3 preflight_26545_sabre_glsl.py --self-test
          bash -n build_26545_iris_sabre_ab.sh
          B=build_26545_iris_sabre_ab.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_HEAD="99b1a4ec0bafd583e09ec686ef396de40403d2fe"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="32976403042"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9609760449"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="3092d61603574a01957e5268f842c5527dc682c69bfcd855144a72f090e5addd"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="411a79c54acbc8e1092ecb306bdea6f3c1ae4c45d4860ee528b1ca153e0eea37"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="90a0651864f17ffe535871a185c5de87821cb6c7aefefb757869001f1b02a746"' "$B" >/dev/null
          grep -F 'CAND_MANIFEST_SHA="30cc34de484b958a66a5b95b2d2781924213e4fc6c1a0767c2cce55d8567c21c"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726545"' "$B" >/dev/null
          grep -F 'VERSION_BUILD="26545"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F 'BJZHOU_SABRE_HEAD="8e37909035b51b82ab54941dba390427478899b7"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F '21 active Sabre/shared shaders' "$B" >/dev/null
          grep -F 'IRIS_26545_SABRE_MEASURED_SUPPORT' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          grep -F 'IRIS_26545_SABRE_NORMALIZED16_DNG' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          grep -F 'pref_iris_motion_reconstruction' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          grep -F 'IRIS_26545_SHARED_RESIDUAL_DENOISE_CONTROLS' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          grep -F 'pref_iris_luma_denoise_v2' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          grep -F 'mgcSabreNoiseModelScale = if (sabreSelected) sabreNoiseScale else null' 26545_RUNTIME_DELTA_FROM_26544.patch >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          ! grep -E 'git branch [^-]' "$B" >/dev/null
          echo 'PASS: 26545 handoff pins exact successful 26544 authority + current Sabre source + full compiler/patch/invariance gates'

      - name: Guarded 26545 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26545_iris_sabre_ab.sh
          ./build_26545_iris_sabre_ab.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26545-iris-sabre-ab
          path: |
            IrisCamera-0.9726545-26545-iris-sabre-ab-debug.apk
            build_26545_iris_sabre_ab_outputs/
          if-no-files-found: warn
