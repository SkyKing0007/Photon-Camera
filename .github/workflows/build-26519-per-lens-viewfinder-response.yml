name: Build 26519 Per-Lens Viewfinder Response

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26519_per_lens_viewfinder_response.py
      - validate_26519_per_lens_viewfinder_response.py
      - build_26519_per_lens_viewfinder_response.sh
      - 26519_BASE_26518_COMMIT.txt
      - 26519_BJZHOU_RELEASE_SPATIAL_REF.txt
      - 26519_README_UPLOAD.txt
      - 26519_HANDOFF_HASHES.sha256
      - .github/workflows/build-26519-per-lens-viewfinder-response.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26519-per-lens-viewfinder-response-v1
  cancel-in-progress: false

jobs:
  build:
    name: Direct tested 26518 to per-lens calibrated viewfinder 26519
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify 26519 handoff invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26519_HANDOFF_HASHES.sha256
          bash -n build_26519_per_lens_viewfinder_response.sh
          python3 -m py_compile apply_26519_per_lens_viewfinder_response.py validate_26519_per_lens_viewfinder_response.py apply_26516_profile_viewfinder_match.py
          [[ "$(tr -d '\r\n' < 26519_BASE_26518_COMMIT.txt)" == "18582e3ca2c9a7fdaf5bb5c816036d215e887f95" ]]
          grep -F 'SUCCESSFUL_26518_HEAD="18582e3ca2c9a7fdaf5bb5c816036d215e887f95"' build_26519_per_lens_viewfinder_response.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26518-released-spatial-abi.yml"' build_26519_per_lens_viewfinder_response.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26518-released-spatial-abi-v1"' build_26519_per_lens_viewfinder_response.sh >/dev/null
          grep -F 'RELEASE_SPATIAL_HEAD="c4ff5a3e99b5f9f6027ba1c038eb7cc850bb9b01"' build_26519_per_lens_viewfinder_response.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726519"; VERSION_BUILD="26519"' build_26519_per_lens_viewfinder_response.sh >/dev/null
          grep -F "DEFAULT_PERCENT = 65.0" apply_26519_per_lens_viewfinder_response.py >/dev/null
          grep -F "solvedEv = clamp(rawSolvedEv * matchStrength, MIN_EV, MAX_EV);" apply_26519_per_lens_viewfinder_response.py >/dev/null
          grep -F "pref_motion_viewfinder_match_strength" apply_26519_per_lens_viewfinder_response.py >/dev/null
          grep -F "NO_BACKUP_REQUESTED_BY_USER=true" build_26519_per_lens_viewfinder_response.sh >/dev/null
          echo "PASS: 26519 handoff is exact-26518 base + exact-26516 solver response calibration + settings slider"

      - name: Build guarded 26519 from successful 26518 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26519_per_lens_viewfinder_response.sh apply_26519_per_lens_viewfinder_response.py validate_26519_per_lens_viewfinder_response.py
          ./build_26519_per_lens_viewfinder_response.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26519-per-lens-viewfinder-response-v1
          path: |
            IrisCamera-0.9726519-26519-per-lens-viewfinder-response-debug.apk
            build_26519_per_lens_viewfinder_response_outputs/
          if-no-files-found: warn
