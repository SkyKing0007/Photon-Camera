name: Build 26769 Frozen Map Bipolar Color Integrity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26769_README_UPLOAD.txt'
      - '26769_*'
      - 'build_26769_frozen_map_bipolar_color_integrity.sh'
      - 'transform_26769.py'
      - 'validate_26769.py'
      - 'verify_26769_*.py'
      - 'handoff_payload_26769/**'
      - '.github/workflows/build-26769-frozen-map-bipolar-color-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26769 handoff and successful 26768/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26769_HANDOFF_HASHES.sha256
          bash -n build_26769_frozen_map_bipolar_color_integrity.sh
          python3 -S -m py_compile transform_26769.py validate_26769.py verify_26769_patches.py verify_26769_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26769 candidate from exact successful 26768 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26769_frozen_map_bipolar_color_integrity.sh
      - name: Verify exact 26769 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726769-26769-frozen-map-bipolar-color-integrity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726769-26769-frozen-map-bipolar-color-integrity-debug.apk' build_26769_frozen_map_bipolar_color_integrity_outputs/26769_APK.sha256
      - name: Upload 26769 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26769-frozen-map-bipolar-color-integrity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726769-26769-frozen-map-bipolar-color-integrity-debug.apk
            build_26769_frozen_map_bipolar_color_integrity_outputs/
