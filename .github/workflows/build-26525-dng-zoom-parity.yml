name: Build 26525 DNG Zoom Parity
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26525_dng_zoom_parity.py
      - validate_26525_dng_zoom_parity.py
      - build_26525_dng_zoom_parity.sh
      - 26525_BASE_26524_HEAD.txt
      - 26525_SCOPE_PROVENANCE.txt
      - 26525_README_UPLOAD.txt
      - 26525_HANDOFF_HASHES.sha256
      - .github/workflows/build-26525-dng-zoom-parity.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26525-dng-zoom-parity-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          expected=digest.split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          VERSION_OUTPUT="$("$T/bin/glslangValidator" --version)"
          VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"
          grep -F 16.5.0 <<<"$VERSION_LINE"
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26525 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26525_HANDOFF_HASHES.sha256
          python3 -m py_compile apply_26525_dng_zoom_parity.py validate_26525_dng_zoom_parity.py
          bash -n build_26525_dng_zoom_parity.sh
          [[ "$(tr -d '\r\n' < 26525_BASE_26524_HEAD.txt)" == "b8547f3062e164759e5494b31ba595a07c4bfe69" ]]
          grep -F 'SUCCESSFUL_26524_HEAD="b8547f3062e164759e5494b31ba595a07c4bfe69"' build_26525_dng_zoom_parity.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26524-continuous-zoom-v1"' build_26525_dng_zoom_parity.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726525"; VERSION_BUILD="26525"' build_26525_dng_zoom_parity.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26525_dng_zoom_parity.sh >/dev/null
          grep -F 'TIFFTAG_DEFAULT_CROP_ORIGIN = 50719' apply_26525_dng_zoom_parity.py >/dev/null
          grep -F 'TIFFTAG_DEFAULT_CROP_SIZE = 50720' apply_26525_dng_zoom_parity.py >/dev/null
          grep -F 'parameters.iris26524OutputLocalZoom' apply_26525_dng_zoom_parity.py >/dev/null
          grep -F '624d614bf3e3bccb394ec54d1bca5bbb350859be' apply_26525_dng_zoom_parity.py >/dev/null
          VERSION_OUTPUT="$(glslangValidator --version)"
          VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"
          grep -F 16.5.0 <<<"$VERSION_LINE"
          echo "PASS: 26525 handoff static guards verified"
      - name: Guarded 26525 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26525_dng_zoom_parity.sh
          ./build_26525_dng_zoom_parity.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26525-dng-zoom-parity-v1
          path: |
            IrisCamera-0.9726525-26525-dng-zoom-parity-debug.apk
            build_26525_dng_zoom_parity_outputs/
          if-no-files-found: warn
