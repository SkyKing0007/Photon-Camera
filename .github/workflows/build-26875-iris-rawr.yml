name: Build 26875 B Device Correction
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26875.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact successful 26874 mechanics and generate guarded 26875 build
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26875.txt
          grep -Fx 'RUN_26875_B_DEVICE_CORRECTION' TRIGGER_26875.txt
          sha256sum -c 26875_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py generate_26872_build.py generate_26873_build.py generate_26874_build.py generate_26875_build.py verify_26875_candidate.py verify_26875_patches.py regressions/26875_device_failures.py
          python3 -S generate_26871_build.py .
          test "$(sha256sum build_26871_iris_rawr.sh | awk '{print $1}')" = 'ca2d99d38c1de9a310205ba2c2af0fd7b49399f506e39a24fa94a6f15a338e0e'
          python3 -S generate_26872_build.py .
          test "$(sha256sum build_26872_iris_rawr.sh | awk '{print $1}')" = '042f4550b60ba7efb8e363230a76931969e98c2ffacda3fa310895e98f40b7db'
          python3 -S generate_26873_build.py .
          test "$(sha256sum build_26873_iris_rawr.sh | awk '{print $1}')" = '121323a5eba3dca75ffb6f05089f73b180a6e692015895237cd780babb92aaa4'
          python3 -S generate_26874_build.py .
          test "$(sha256sum build_26874_iris_rawr.sh | awk '{print $1}')" = '3b48818fd6cd6376f97cecca5a34b85ce4788e10a37435e3273beb2eddf3282a'
          python3 -S generate_26875_build.py .
          sha256sum -c 26875_GENERATED_BUILD_SHA256.txt
          bash -n build_26875_iris_rawr.sh
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26875_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26875_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact historical generated GLSL guard and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26875 native B build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26875_iris_rawr.sh
      - name: Verify exactly one intended 26875 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726875-26875-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726875-26875-iris-rawr-debug.apk' build_26875_iris_rawr_outputs/26875_APK.sha256
      - name: Upload authoritative 26875 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26875-b-device-correction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726875-26875-iris-rawr-debug.apk
            build_26875_iris_rawr_outputs/
