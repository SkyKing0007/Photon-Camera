name: Build 26527 Final MGC Zoom DNG
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26527_final_mgc_zoom_dng.py
      - validate_26527_final_mgc_zoom_dng.py
      - audit_26527_temporal_support.py
      - preflight_26527_embedded_shaders.py
      - preflight_26527_native_syntax.py
      - test_26527_dng_subifd.py
      - build_26527_final_mgc_zoom_dng.sh
      - 26527_BASE_26526_HEAD.txt
      - 26527_SCOPE_PROVENANCE.txt
      - 26527_README_UPLOAD.txt
      - 26527_RUNTIME_DELTA_FROM_SUCCESSFUL_26526.patch
      - 26527_RUNTIME_DELTA_FROM_SUCCESSFUL_26526.patch.sha256
      - 26527_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26526.patch
      - 26527_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26526.patch.sha256
      - 26527_HANDOFF_HASHES.sha256
      - .github/workflows/build-26527-final-mgc-zoom-dng.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26527-final-mgc-zoom-dng-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m))
          xs=[x for x in d["assets"] if x["name"]==n]
          assert d["tag_name"]==v and len(xs)==1 and xs[0]["browser_download_url"]==u
          digest=xs[0].get("digest"); assert digest and digest.startswith("sha256:")
          actual=hashlib.sha256(open(a,"rb").read()).hexdigest()
          assert actual==digest.split(":",1)[1]
          print("PASS: glslang release asset SHA256",actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26527 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26527_HANDOFF_HASHES.sha256
          python3 -m py_compile \
            apply_26527_final_mgc_zoom_dng.py \
            validate_26527_final_mgc_zoom_dng.py \
            audit_26527_temporal_support.py \
            preflight_26527_embedded_shaders.py \
            preflight_26527_native_syntax.py \
            test_26527_dng_subifd.py
          python3 apply_26527_final_mgc_zoom_dng.py --self-test
          bash -n build_26527_final_mgc_zoom_dng.sh
          [[ "$(tr -d '\r\n' < 26527_BASE_26526_HEAD.txt)" == "0c57e0a887a66bcc57c59d868ddf4d2f53c48130" ]]
          grep -F 'EXPECTED_BASE_TAR_SHA="659d69d2314d283c87716889cf6efb47940b9c425b3a2ddf4bfb82aa1b07f29e"' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="ffecfff0aaae17e5c0bead2b60d60f19764922acd4b75d4f85e4872aa0ccd9a6"' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726527"; VERSION_BUILD="26527"' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'TEMPORAL_RUNTIME_TELEMETRY=true' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'TEMPORAL_IMAGE_MATH_CHANGED=true' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'TEMPORAL_CORRECTION=FINAL_MGC_REJECTION_AND_ALIGNMENT_DOMAIN_PARITY' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26527_final_mgc_zoom_dng.sh >/dev/null
          grep -F 'RUNTIME_CHANGED_FILES=10' build_26527_final_mgc_zoom_dng.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26527 handoff static guards verified"

      - name: Guarded 26527 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26527_final_mgc_zoom_dng.sh
          ./build_26527_final_mgc_zoom_dng.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26527-final-mgc-zoom-dng-v1
          path: |
            IrisCamera-0.9726527-26527-final-mgc-zoom-dng-debug.apk
            build_26527_final_mgc_zoom_dng_outputs/
          if-no-files-found: warn
