name: Build 26723 Intelligent Flicker + High Zoom Detail
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26723_README_UPLOAD.txt'
      - '26723_*'
      - 'build_26723_intelligent_flicker_high_zoom_detail.sh'
      - 'transform_26723.py'
      - 'validate_26723.py'
      - 'verify_26723_*.py'
      - 'handoff_payload_26723/**'
      - '.github/workflows/build-26723-intelligent-flicker-high-zoom-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26723 handoff and exact successful 26722 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26723_HANDOFF_HASHES.sha256
          python3 -S verify_26723_infrastructure.py build_26723_intelligent_flicker_high_zoom_detail.sh .github/workflows/build-26723-intelligent-flicker-high-zoom-detail.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26723 candidate with successful 26722 procedure from successful 26722 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26723_intelligent_flicker_high_zoom_detail.sh
      - name: Verify exact 26723 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726723-26723-intelligent-flicker-high-zoom-detail-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726723-26723-intelligent-flicker-high-zoom-detail-debug.apk' build_26723_intelligent_flicker_high_zoom_detail_outputs/26723_APK.sha256
      - name: Upload 26723 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26723-intelligent-flicker-high-zoom-detail
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726723-26723-intelligent-flicker-high-zoom-detail-debug.apk
            build_26723_intelligent_flicker_high_zoom_detail_outputs/
