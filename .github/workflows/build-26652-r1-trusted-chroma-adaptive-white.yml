name: Build 26652 R1 Trusted Chroma + Adaptive White

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26652_R1_README_UPLOAD.txt'
      - 'R1_26652_*'
      - 'build_26652_r1_trusted_chroma_adaptive_white.sh'
      - 'transform_26652.py'
      - 'validate_26652.py'
      - 'verify_26652_*.py'
      - 'handoff_payload_26652/**'
      - '.github/workflows/build-26652-r1-trusted-chroma-adaptive-white.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26652 handoff and exact successful 26651 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26652_HANDOFF_HASHES.sha256
          bash -n build_26652_r1_trusted_chroma_adaptive_white.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26652.py','validate_26652.py','verify_26652_authority.py','verify_26652_infrastructure.py','verify_26652_patches.py','verify_26652_regressions.py','verify_26652_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26652 candidate from successful 26651 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26652_r1_trusted_chroma_adaptive_white.sh
      - name: Verify exact 26652 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726652-26652-r1-trusted-chroma-adaptive-white-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726652-26652-r1-trusted-chroma-adaptive-white-debug.apk" build_26652_r1_trusted_chroma_adaptive_white_outputs/26652_R1_APK.sha256
      - name: Upload 26652 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26652-r1-trusted-chroma-adaptive-white
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726652-26652-r1-trusted-chroma-adaptive-white-debug.apk
            build_26652_r1_trusted_chroma_adaptive_white_outputs/
