name: Build 26746 Extreme Flattened Highlight Veto
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26746_README_UPLOAD.txt'
      - '26746_*'
      - 'build_26746_extreme_flattened_highlight_veto.sh'
      - 'transform_26746.py'
      - 'validate_26746.py'
      - 'verify_26746_*.py'
      - 'handoff_payload_26746/**'
      - '.github/workflows/build-26746-extreme-flattened-highlight-veto.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26746 handoff and exact successful 26745 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26746_HANDOFF_HASHES.sha256
          python3 -S verify_26746_infrastructure.py build_26746_extreme_flattened_highlight_veto.sh .github/workflows/build-26746-extreme-flattened-highlight-veto.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26746 candidate with successful 26745 procedure from exact successful 26745 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26746_extreme_flattened_highlight_veto.sh
      - name: Verify exact 26746 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726746-26746-extreme-flattened-highlight-veto-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726746-26746-extreme-flattened-highlight-veto-debug.apk' build_26746_extreme_flattened_highlight_veto_outputs/26746_APK.sha256
      - name: Upload 26746 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26746-extreme-flattened-highlight-veto
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726746-26746-extreme-flattened-highlight-veto-debug.apk
            build_26746_extreme_flattened_highlight_veto_outputs/
