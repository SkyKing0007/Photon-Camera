name: Build 26770 Foliage Chroma + Midtone Trim
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26770_README_UPLOAD.txt'
      - '26770_*'
      - 'build_26770_foliage_chroma_midtone_trim.sh'
      - 'transform_26770.py'
      - 'validate_26770.py'
      - 'verify_26770_*.py'
      - 'handoff_payload_26770/**'
      - '.github/workflows/build-26770-foliage-chroma-midtone-trim.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26770 handoff and successful 26769/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26770_HANDOFF_HASHES.sha256
          bash -n build_26770_foliage_chroma_midtone_trim.sh
          python3 -S -m py_compile transform_26770.py validate_26770.py verify_26770_patches.py verify_26770_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26770 candidate from exact successful 26769 Actions runtime authority using successful 26769 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26770_foliage_chroma_midtone_trim.sh
      - name: Verify exact 26770 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726770-26770-foliage-chroma-midtone-trim-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726770-26770-foliage-chroma-midtone-trim-debug.apk' build_26770_foliage_chroma_midtone_trim_outputs/26770_APK.sha256
      - name: Upload 26770 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26770-foliage-chroma-midtone-trim
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726770-26770-foliage-chroma-midtone-trim-debug.apk
            build_26770_foliage_chroma_midtone_trim_outputs/
