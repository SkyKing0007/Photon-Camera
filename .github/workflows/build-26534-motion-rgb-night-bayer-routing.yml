name: Build 26534 Motion Spatial-RGB Night Spatial-Bayer Routing
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26534_motion_rgb_night_bayer_routing.py
      - validate_26534_motion_rgb_night_bayer_routing.py
      - preflight_26534_changed_syntax.py
      - build_26534_motion_rgb_night_bayer_routing.sh
      - 26534_*.txt
      - 26534_*.sha256
      - 26534_*.patch
      - .github/workflows/build-26534-motion-rgb-night-bayer-routing.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26534-motion-rgb-night-bayer-routing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26534 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26534_HANDOFF_HASHES.sha256
          sha256sum -c 26534_BASE_V16_SOURCE_MANIFEST_FILE.sha256
          sha256sum -c 26534_RUNTIME_DELTA_FROM_V16.patch.sha256
          sha256sum -c 26534_RUNTIME_ROLLBACK_TO_V16.patch.sha256
          python3 -m py_compile apply_26534_motion_rgb_night_bayer_routing.py validate_26534_motion_rgb_night_bayer_routing.py preflight_26534_changed_syntax.py
          python3 apply_26534_motion_rgb_night_bayer_routing.py --self-test
          python3 validate_26534_motion_rgb_night_bayer_routing.py --self-test
          bash -n build_26534_motion_rgb_night_bayer_routing.sh
          grep -F 'BASE_V16_HANDOFF_HEAD="c6d6d74a38be68f31166d09162adb98a1d41923a"' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726534"; VERSION_BUILD="26534"' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F 'git branch backup-26533-v16-before-26534' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F 'MOTION_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          grep -F 'NIGHT_PRODUCTION=MGC_SPATIAL_BAYER_R16UI_TO_RCD_TO_JIN' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          ! grep -E 'git push|git switch dev|git checkout dev' build_26534_motion_rgb_night_bayer_routing.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26534 exact V1.6 routing-restoration handoff verified"
      - name: Guarded 26534 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26534_motion_rgb_night_bayer_routing.sh
          ./build_26534_motion_rgb_night_bayer_routing.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26534-motion-spatial-rgb-night-spatial-bayer
          path: |
            IrisCamera-0.9726534-26534-motion-spatial-rgb-night-spatial-bayer-debug.apk
            build_26534_routing_restoration_outputs/
          if-no-files-found: warn
