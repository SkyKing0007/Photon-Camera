name: Build 26472 Wronski Reference SDR-Authoritative UHDR V6

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26472_wronski_reference_sdr_authoritative_uhdr_v6.sh
      - .github/workflows/build-26472-wronski-reference-sdr-authoritative-uhdr-v6.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26472 SDR-authoritative V6 build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard V6 corrective infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "14cbf57ad05df5e6b2844c3fd4783d730c8c2eda" || {
            echo "26472 V6 corrective commit must be directly based on V5 infrastructure commit"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26472 V6 corrective commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26472 V6 corrective workflow lineage gate PASS"

      - name: Run guarded 26472 SDR-authoritative V6 operation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26472_wronski_reference_sdr_authoritative_uhdr_v6.sh
          ./build_26472_wronski_reference_sdr_authoritative_uhdr_v6.sh

      - name: Upload 26472 V6 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26472-wronski-reference-sdr-authoritative-uhdr-v6
          if-no-files-found: error
          path: |
            build_26472_outputs/**
            IrisCamera-0.9726472-26472-wronski-reference-sdr-authoritative-uhdr-debug.apk
