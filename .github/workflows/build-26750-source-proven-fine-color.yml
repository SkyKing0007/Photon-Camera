name: Build 26750 Source-Proven Fine Color
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26750_README_UPLOAD.txt'
      - '26750_*'
      - 'build_26750_source_proven_fine_color.sh'
      - 'transform_26750.py'
      - 'validate_26750.py'
      - 'verify_26750_*.py'
      - 'handoff_payload_26750/**'
      - '.github/workflows/build-26750-source-proven-fine-color.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26750 handoff and exact successful 26749 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26750_HANDOFF_HASHES.sha256
          python3 -S verify_26750_infrastructure.py build_26750_source_proven_fine_color.sh .github/workflows/build-26750-source-proven-fine-color.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26750 candidate from exact successful 26728 Actions runtime authority using successful 26749 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26750_source_proven_fine_color.sh
      - name: Verify exact 26750 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726750-26750-source-proven-fine-color-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726750-26750-source-proven-fine-color-debug.apk' build_26750_source_proven_fine_color_outputs/26750_APK.sha256
      - name: Upload 26750 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26750-source-proven-fine-color
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726750-26750-source-proven-fine-color-debug.apk
            build_26750_source_proven_fine_color_outputs/
