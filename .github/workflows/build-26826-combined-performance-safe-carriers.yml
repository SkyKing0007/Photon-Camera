name: Build 26826 Combined Performance Safe Carriers
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26826.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26826 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26826.txt
          grep -Fx 'RUN_26826_COMBINED_PERFORMANCE_SAFE_CARRIERS' TRIGGER_26826.txt
          sha256sum -c 26826_HANDOFF_HASHES.sha256
          bash -n build_26826_combined_performance_safe_carriers.sh
          python3 -S -m py_compile transform_26826.py validate_26826.py verify_26826_patches.py verify_26826_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26826_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26826_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26826 candidate from successful 26825 authority using exact successful 26825 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26826_combined_performance_safe_carriers.sh
      - name: Verify exact 26826 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726826-26826-combined-performance-safe-carriers-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726826-26826-combined-performance-safe-carriers-debug.apk' build_26826_combined_performance_safe_carriers_outputs/26826_APK.sha256
      - name: Upload 26826 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26826-combined-performance-safe-carriers
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726826-26826-combined-performance-safe-carriers-debug.apk
            build_26826_combined_performance_safe_carriers_outputs/
