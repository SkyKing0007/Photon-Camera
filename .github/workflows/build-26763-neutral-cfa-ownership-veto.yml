name: Build 26763 Neutral CFA Ownership Veto
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26763_README_UPLOAD.txt'
      - '26763_*'
      - 'build_26763_neutral_cfa_ownership_veto.sh'
      - 'transform_26763.py'
      - 'validate_26763.py'
      - 'verify_26763_*.py'
      - 'handoff_payload_26763/**'
      - '.github/workflows/build-26763-neutral-cfa-ownership-veto.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26763 handoff and successful 26762/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26763_HANDOFF_HASHES.sha256
          bash -n build_26763_neutral_cfa_ownership_veto.sh
          python3 -S -m py_compile transform_26763.py validate_26763.py verify_26763_patches.py verify_26763_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26763 candidate from exact successful 26762 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26763_neutral_cfa_ownership_veto.sh
      - name: Verify exact 26763 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726763-26763-neutral-cfa-ownership-veto-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726763-26763-neutral-cfa-ownership-veto-debug.apk' build_26763_neutral_cfa_ownership_veto_outputs/26763_APK.sha256
      - name: Upload 26763 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26763-neutral-cfa-ownership-veto
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726763-26763-neutral-cfa-ownership-veto-debug.apk
            build_26763_neutral_cfa_ownership_veto_outputs/
