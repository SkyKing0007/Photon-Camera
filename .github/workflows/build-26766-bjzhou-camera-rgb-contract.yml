name: Build 26766 bjzhou Camera RGB Contract
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26766_README_UPLOAD.txt'
      - '26766_*'
      - 'build_26766_bjzhou_camera_rgb_contract.sh'
      - 'transform_26766.py'
      - 'validate_26766.py'
      - 'verify_26766_*.py'
      - 'handoff_payload_26766/**'
      - '.github/workflows/build-26766-bjzhou-camera-rgb-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26766 handoff and successful 26765/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26766_HANDOFF_HASHES.sha256
          bash -n build_26766_bjzhou_camera_rgb_contract.sh
          python3 -S -m py_compile transform_26766.py validate_26766.py verify_26766_patches.py verify_26766_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26766 candidate from exact successful 26765 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26766_bjzhou_camera_rgb_contract.sh
      - name: Verify exact 26766 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726766-26766-bjzhou-camera-rgb-contract-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726766-26766-bjzhou-camera-rgb-contract-debug.apk' build_26766_bjzhou_camera_rgb_contract_outputs/26766_APK.sha256
      - name: Upload 26766 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26766-bjzhou-camera-rgb-contract
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726766-26766-bjzhou-camera-rgb-contract-debug.apk
            build_26766_bjzhou_camera_rgb_contract_outputs/
