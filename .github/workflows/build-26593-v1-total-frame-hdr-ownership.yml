name: Build 26593 V1 Total-Frame HDR Ownership

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26593_*'
      - 'REGRESSION_V1_26593_*'
      - 'build_26593_v1_total_frame_hdr_ownership.sh'
      - 'transform_26593_v1.py'
      - 'validate_26593_v1.py'
      - 'verify_26593_v1_authority.py'
      - 'verify_26593_v1_regressions.py'
      - 'verify_26593_v1_patches.py'
      - 'verify_26593_v1_shaders.py'
      - 'handoff_payload_26593_v1/**'
      - '.github/workflows/build-26593-v1-total-frame-hdr-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26593 V1 package and inherited successful 26592 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26593_HANDOFF_HASHES.sha256
          bash -n build_26593_v1_total_frame_hdr_ownership.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26593_v1.py','validate_26593_v1.py','verify_26593_v1_authority.py','verify_26593_v1_regressions.py','verify_26593_v1_patches.py','verify_26593_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26593_v1_total_frame_hdr_ownership.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="3aa675104ed11738823d7d5afc2339cfc2c575ce"' in s
          assert 'BASE_RUN_ID="33827308817"' in s
          assert 'BASE_JOB_ID="100882607223"' in s
          assert 'BASE_ARTIFACT_ID="9920485263"' in s
          assert 'BASE_ARTIFACT_SHA="5506466475b873dcd210e8277e7349d30d267fa8863d4e90a97b96f8ca1c2678"' in s
          assert 'BASE_TAR_SHA="111f887bb8ed6a00d932093e115683bb14f541f1fd5e161b3fb687033a63ec92"' in s
          assert 'VERSION_NAME="0.9726593"' in s and 'VERSION_BUILD="26593"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 4 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26593 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'HANDOFF_PARENT_COMMIT="3aa675104ed11738823d7d5afc2339cfc2c575ce"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          assert 'user explicitly requested no new backup for 26593' in s
          print('PASS sealed syntax + successful 26592 authority + exact inherited successful-26592 compiler/build order')
          PY
          grep -F 'CHANDELIER DEVICE FAILURE 26592 PERMANENT REGRESSION:' REGRESSION_V1_26593_TOTAL_FRAME_HDR_OWNERSHIP.txt >/dev/null
          grep -F 'requestShort=true must never reach Sabre as NORMAL-only' REGRESSION_V1_26593_TOTAL_FRAME_HDR_OWNERSHIP.txt >/dev/null
          grep -F 'ACTIONS JAVA COMPILER FAILURE 33833745581 PERMANENT REGRESSION:' REGRESSION_V1_26593_TOTAL_FRAME_HDR_OWNERSHIP.txt >/dev/null
          grep -F 'incompatible types: CaptureResult cannot be converted to TotalCaptureResult' REGRESSION_V1_26593_TOTAL_FRAME_HDR_OWNERSHIP.txt >/dev/null
          grep -F 'Historic broad pink, pink/green dotted edges, cyan/green speckling, zipper/ghost artifacts' REGRESSION_V1_26593_CARRIED_26592.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26593_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F '26593 LOCAL PACKAGING CATCH PERMANENT REGRESSION:' REGRESSION_V1_26593_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26593_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F '5ecd39ce59954d5412a59de3fdda42b33a69e5bc639ed4c4f75396bc468be1d8' V1_26593_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26592.txt >/dev/null
          grep -F '5e3f26bfc82952dd0da6b0973e956de0ce2bce48f0a32ebbb78e0566a256c890' V1_26593_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26592.txt >/dev/null
          ! grep -R -F 'V1_26593_' .github/workflows --exclude='build-26593-v1-total-frame-hdr-ownership.yml'
          ! grep -R -F 'handoff_payload_26593_v1' .github/workflows --exclude='build-26593-v1-total-frame-hdr-ownership.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26593 candidate from successful compiled 26592 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26593_v1_total_frame_hdr_ownership.sh

      - name: Upload 26593 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26593-v1-total-frame-hdr-ownership
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726593-26593-v1-total-frame-hdr-ownership-debug.apk
            build_26593_v1_total_frame_hdr_ownership_outputs/
