name: Build 26800 High Chroma False Color UI Stability
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26800.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26800 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26800.txt
          grep -Fx 'RUN_26800_HIGH_CHROMA_FALSE_COLOR_UI_STABILITY' TRIGGER_26800.txt
          sha256sum -c 26800_HANDOFF_HASHES.sha256
          bash -n build_26800_high_chroma_false_color_ui_stability.sh
          python3 -S -m py_compile transform_26800.py validate_26800.py verify_26800_patches.py verify_26800_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26800_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26800_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26800 candidate from successful 26799 authority using exact successful 26799 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26800_high_chroma_false_color_ui_stability.sh
      - name: Verify exact 26800 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726800-26800-high-chroma-false-color-ui-stability-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726800-26800-high-chroma-false-color-ui-stability-debug.apk' build_26800_high_chroma_false_color_ui_stability_outputs/26800_APK.sha256
      - name: Upload 26800 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26800-high-chroma-false-color-ui-stability
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726800-26800-high-chroma-false-color-ui-stability-debug.apk
            build_26800_high_chroma_false_color_ui_stability_outputs/
