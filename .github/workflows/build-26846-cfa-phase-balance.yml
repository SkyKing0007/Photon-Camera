name: Build 26846 CFA Phase Balance
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26846.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26846 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26846.txt
          grep -Fx 'RUN_26846_CFA_PHASE_BALANCE' TRIGGER_26846.txt
          sha256sum -c 26846_HANDOFF_HASHES.sha256
          bash -n build_26846_cfa_phase_balance.sh
          python3 -S -m py_compile transform_26846.py validate_26846.py verify_26846_patches.py verify_26846_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26846_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26846_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26846 candidate from successful 26845 authority using exact successful 26845 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26846_cfa_phase_balance.sh
      - name: Verify exact 26846 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726846-26846-cfa-phase-balance-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726846-26846-cfa-phase-balance-debug.apk' build_26846_cfa_phase_balance_outputs/26846_APK.sha256
      - name: Upload 26846 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26846-cfa-phase-balance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726846-26846-cfa-phase-balance-debug.apk
            build_26846_cfa_phase_balance_outputs/
