name: Build 26592 V1.1 HDR Radiometric Handoff

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26592_*'
      - 'REGRESSION_V1_26592_*'
      - 'build_26592_v1_hdr_radiometric_handoff.sh'
      - 'transform_26592_v1.py'
      - 'validate_26592_v1.py'
      - 'verify_26592_v1_authority.py'
      - 'verify_26592_v1_regressions.py'
      - 'verify_26592_v1_patches.py'
      - 'verify_26592_v1_shaders.py'
      - 'handoff_payload_26592_v1/**'
      - '.github/workflows/build-26592-v1-hdr-radiometric-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26592 V1 package and inherited successful 26591 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26592_HANDOFF_HASHES.sha256
          bash -n build_26592_v1_hdr_radiometric_handoff.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26592_v1.py','validate_26592_v1.py','verify_26592_v1_authority.py','verify_26592_v1_regressions.py','verify_26592_v1_patches.py','verify_26592_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26592_v1_hdr_radiometric_handoff.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="998312cbc5d72c8654cdf176c6b278b77afb8415"' in s
          assert 'BASE_RUN_ID="33814033766"' in s
          assert 'BASE_JOB_ID="100842044239"' in s
          assert 'BASE_ARTIFACT_ID="9915953054"' in s
          assert 'BASE_ARTIFACT_SHA="3609fdfc50cc03fd602bf37a3cf94970eca07114f16ff24d59d819ba3f5d718d"' in s
          assert 'BASE_TAR_SHA="79dceb445786b65d45b2d18adceabce60c2a5eba338e5f47c5c2d77b283125de"' in s
          assert 'VERSION_NAME="0.9726592"' in s and 'VERSION_BUILD="26592"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 8 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26592 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'backup-26591-pre-26592-hdr-handoff' in s
          assert 'HANDOFF_PARENT_COMMIT="998312cbc5d72c8654cdf176c6b278b77afb8415"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          print('PASS sealed syntax + successful 26591 authority + exact inherited successful-26591 compiler/build order')
          PY
          grep -F 'Repeated 26589-26591 window/sun/car-interior fixtures' REGRESSION_V1_26592_HDR_RADIOMETRIC_HANDOFF.txt >/dev/null
          grep -F 'Historic broad pink, pink/green dotted edges, cyan/green speckling, zipper/ghost artifacts' REGRESSION_V1_26592_CARRIED_26591.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26592_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26592_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F '7c54e3763da6fb0f07e79c7df5b0a3b6f2eeeba5' V1_26592_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26591.txt >/dev/null
          grep -F '1cb6bac7ca8f437acdcf299082197fd5ad4ca12b' V1_26592_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26591.txt >/dev/null
          ! grep -R -F 'V1_26592_' .github/workflows --exclude='build-26592-v1-hdr-radiometric-handoff.yml'
          ! grep -R -F 'handoff_payload_26592_v1' .github/workflows --exclude='build-26592-v1-hdr-radiometric-handoff.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26592 candidate from successful compiled 26591 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26592_v1_hdr_radiometric_handoff.sh

      - name: Upload 26592 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26592-v1-1-hdr-radiometric-handoff
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726592-26592-v1-hdr-radiometric-handoff-debug.apk
            build_26592_v1_hdr_radiometric_handoff_outputs/
