name: Build 26505 Physical Bracket Low-Support RCD

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26505_physical_bracket_low_support_rcd.sh
      - apply_26505_bjzhou_consistency.py
      - validate_26505_bjzhou_consistency.py
      - 26505_README_UPLOAD.txt
      - 26505_HANDOFF_HASHES.sha256
      - .github/workflows/build-26505-physical-bracket-low-support-rcd.yml

permissions:
  contents: write

concurrency:
  group: photon-26505-physical-bracket-low-support-rcd
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26505 physical bracket + low-support RCD build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
          persist-credentials: true

      - name: Verify branch, canonical runtime, tested 26504 handoff, and backup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor 299731b9447a4d0cd69f0c2e521216bf307724b3 HEAD
          git merge-base --is-ancestor 6118984523296945a0910e55ddaa4d3126184059 HEAD
          test -z "$(git diff --name-only 6118984523296945a0910e55ddaa4d3126184059..HEAD -- app/src/main app/version.properties)"
          test "$(git ls-remote origin refs/heads/backup-26504-tested-before-26505-20260818 | awk '{print $1}')" = "299731b9447a4d0cd69f0c2e521216bf307724b3"
          echo "PASS: tested 26504 handoff + canonical 26502 runtime + exact 26505 backup; dev excluded"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator without APT
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          GLSLANG_VERSION="16.5.0"
          GLSLANG_ASSET="glslang-${GLSLANG_VERSION}-linux-x86_64-release.tar.gz"
          GLSLANG_URL="https://github.com/KhronosGroup/glslang/releases/download/${GLSLANG_VERSION}/${GLSLANG_ASSET}"
          RELEASE_META="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-release.json"
          TOOL_ROOT="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/${GLSLANG_ASSET}"
          rm -rf "$TOOL_ROOT" "$ARCHIVE" "$RELEASE_META"; mkdir -p "$TOOL_ROOT"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/${GLSLANG_VERSION}" -o "$RELEASE_META"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 "$GLSLANG_URL" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          python3 -c 'import hashlib,json,sys; m,v,n,u,a=sys.argv[1:]; d=json.load(open(m,encoding="utf-8")); assert d.get("tag_name")==v; xs=[x for x in d.get("assets",[]) if x.get("name")==n]; assert len(xs)==1; x=xs[0]; assert x.get("browser_download_url")==u; dg=x.get("digest") or ""; assert dg.startswith("sha256:"); ex=dg.split(":",1)[1].lower(); ac=hashlib.sha256(open(a,"rb").read()).hexdigest(); assert ac==ex; print(f"PASS: official Khronos release asset SHA256 {ac}")' "$RELEASE_META" "$GLSLANG_VERSION" "$GLSLANG_ASSET" "$GLSLANG_URL" "$ARCHIVE"
          ARCHIVE_LIST="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-contents.txt"
          tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"
          grep -Fxq 'bin/glslangValidator' "$ARCHIVE_LIST"
          grep -Fxq 'bin/glslang' "$ARCHIVE_LIST"
          tar -xzf "$ARCHIVE" -C "$TOOL_ROOT"
          test -x "$TOOL_ROOT/bin/glslang"
          test -e "$TOOL_ROOT/bin/glslangValidator"
          VERSION_OUTPUT="$("$TOOL_ROOT/bin/glslangValidator" --version)"
          VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"
          printf '%s\n' "$VERSION_LINE"
          grep -F '16.5.0' <<<"$VERSION_LINE"
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"
          echo "PASS: pinned Khronos glslangValidator 16.5.0 ready without APT"

      - name: Verify 26505 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26505_HANDOFF_HASHES.sha256
          bash -n build_26505_physical_bracket_low_support_rcd.sh
          python3 -m py_compile apply_26504_integrated.py validate_26504_integrated.py apply_26505_bjzhou_consistency.py validate_26505_bjzhou_consistency.py verify_26501_source_integrity.py
          grep -F 'HANDOFF_26504_HEAD="299731b9447a4d0cd69f0c2e521216bf307724b3"' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'CANONICAL_26502_HEAD="6118984523296945a0910e55ddaa4d3126184059"' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26504-tested-before-26505-20260818"' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'VERSION_NAME=0.9726505' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'VERSION_BUILD=26505' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F './gradlew clean :app:assembleDebug --stacktrace' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'IRIS_26505_PHYSICAL_LONG_BRACKET' apply_26505_bjzhou_consistency.py >/dev/null
          grep -F 'IRIS_26505_LOW_SUPPORT_PPG_REFERENCE' apply_26505_bjzhou_consistency.py >/dev/null
          grep -F 'IRIS_26505_LOW_SUPPORT_RECONSTRUCTION_AUTHORITY' apply_26505_bjzhou_consistency.py >/dev/null
          grep -F 'apply_26504_integrated.py' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          grep -F 'validate_26504_integrated.py' build_26505_physical_bracket_low_support_rcd.sh >/dev/null
          if grep -Eq 'edit\(.*ParseExif|IRIS_26503_ACTUAL_CAPTURE_RESULT_ISO_EXIF' apply_26505_bjzhou_consistency.py; then
            echo 'forbidden EXIF rewrite found' >&2; exit 1
          fi
          if grep -Eq 'PyramidAlignment|unaligned alternate|single-frame whole-photo fallback' apply_26505_bjzhou_consistency.py; then
            echo 'forbidden alignment/fallback architecture found' >&2; exit 1
          fi
          echo "PASS: 26505 handoff syntax/hashes/architecture/version gates verified"

      - name: Build guarded 26505 physical bracket + low-support RCD
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26505_physical_bracket_low_support_rcd.sh apply_26505_bjzhou_consistency.py
          ./build_26505_physical_bracket_low_support_rcd.sh

      - name: Upload APK and complete proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26505-physical-bracket-low-support-rcd
          path: |
            IrisCamera-0.9726505-26505-physical-bracket-low-support-rcd-debug.apk
            build_26505_physical_bracket_low_support_rcd_outputs/
          if-no-files-found: warn
