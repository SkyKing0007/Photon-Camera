name: Build 26728 Physically Supported Chroma Magnitude
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26728_README_UPLOAD.txt'
      - '26728_*'
      - 'build_26728_physically_supported_chroma.sh'
      - 'transform_26728.py'
      - 'validate_26728.py'
      - 'verify_26728_*.py'
      - 'handoff_payload_26728/**'
      - '.github/workflows/build-26728-physically-supported-chroma.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26728 handoff and exact successful 26727 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26728_HANDOFF_HASHES.sha256
          python3 -S verify_26728_infrastructure.py build_26728_physically_supported_chroma.sh .github/workflows/build-26728-physically-supported-chroma.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26728 candidate with successful 26727 procedure from successful 26727 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26728_physically_supported_chroma.sh
      - name: Verify exact 26728 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726728-26728-physically-supported-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726728-26728-physically-supported-chroma-debug.apk' build_26728_physically_supported_chroma_outputs/26728_APK.sha256
      - name: Upload 26728 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26728-physically-supported-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726728-26728-physically-supported-chroma-debug.apk
            build_26728_physically_supported_chroma_outputs/
