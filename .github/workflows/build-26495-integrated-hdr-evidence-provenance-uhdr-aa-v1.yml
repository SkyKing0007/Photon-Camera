name: Build 26495 Integrated HDR Evidence Provenance UHDR AA

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26494_successful_app_source.tar.gz'
      - '26494_successful_after.sha256'
      - 'transform_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.py'
      - 'build_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.sh'
      - '.github/workflows/build-26495-integrated-hdr-evidence-provenance-uhdr-aa-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create exact pre-26495 26494 backup branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="287590c2e847522cac06752ecdc6be4c0ca3b42a"
          BACKUP="backup-26494-before-26495-integrated-hdr-evidence-uhdr"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          existing="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$EXPECTED" ]] || { echo "::error::backup branch moved: $existing expected=$EXPECTED"; exit 1; }
            echo "PASS: exact pre-26495 backup already exists $BACKUP=$existing"
          else
            git push origin "$EXPECTED:refs/heads/$BACKUP"
            actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$EXPECTED" ]] || { echo "::error::backup branch verification failed"; exit 1; }
            echo "PASS: exact pre-26495 backup created $BACKUP=$actual"
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26495 package identity and math preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26494_successful_app_source.tar.gz "ee4ccb614d9cb216e2e39a76adc8f72ce9fe2a07daa75eb6f705e958502e010b"
          check_sha 26494_successful_after.sha256 "939a7555adaf1b9859e8fc9e40798b38ac5b85343dfbdb45cfe34a4a88b500c7"
          check_sha transform_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.py "83f4d2b90fb35689277a8964ab639a1bc9cf3c73a34d7d4a8022e4df20d21b0e"
          check_sha build_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.sh "50513e8d8211924857342e9cf4cd1c24dce8369f1050c9ef888bbe67a10ee7a2"
          bash -n build_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.sh
          python3 -m py_compile transform_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.py
          python3 transform_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.py --self-test
          [[ "$(wc -l < 26494_successful_after.sha256)" -eq 856 ]]
          echo "PASS: 26495 package identity + syntax + math preflight"

      - name: Build guarded 26495 APK
        shell: bash
        run: |
          chmod +x build_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.sh
          ./build_26495_integrated_hdr_evidence_provenance_uhdr_aa_v1.sh

      - name: Upload 26495 APK and complete next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26495-integrated-hdr-evidence-provenance-uhdr-aa
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726495-26495-integrated-hdr-evidence-provenance-uhdr-aa-debug.apk
            build_26495_outputs/**
