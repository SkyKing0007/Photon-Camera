name: Build 26599 V1 Effective SHORT + Shared HDR Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26599_README_UPLOAD.txt'
      - 'REGRESSION_V1_26599_*'
      - 'V1_26599_*'
      - 'build_26599_v1_effective_short_shared_hdr_tone.sh'
      - 'transform_26599_v1.py'
      - 'validate_26599_v1.py'
      - 'verify_26599_v1_*.py'
      - 'handoff_payload_26599_v1/**'
      - '.github/workflows/build-26599-v1-effective-short-shared-hdr-tone.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26599 V1 package and exact successful 26598/26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26599_HANDOFF_HASHES.sha256
          bash -n build_26599_v1_effective_short_shared_hdr_tone.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26599_v1.py','validate_26599_v1.py','verify_26599_v1_authority.py','verify_26599_v1_infrastructure.py','verify_26599_v1_patches.py','verify_26599_v1_regressions.py','verify_26599_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26599 candidate from successful compiled 26598 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26599_v1_effective_short_shared_hdr_tone.sh
      - name: Upload 26599 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26599-v1-effective-short-shared-hdr-tone
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726599-26599-v1-effective-short-shared-hdr-tone-debug.apk
            build_26599_v1_effective_short_shared_hdr_tone_outputs/
