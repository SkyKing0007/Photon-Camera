name: Build 26680 R1 Stable Preview

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26680_R1_README_UPLOAD.txt'
      - 'R1_26680_*'
      - 'build_26680_r1_stable_preview.sh'
      - 'transform_26680.py'
      - 'validate_26680.py'
      - 'verify_26680_*.py'
      - 'handoff_payload_26680/**'
      - '.github/workflows/build-26680-r1-stable-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26680 handoff and exact successful 26679 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26680_HANDOFF_HASHES.sha256
          bash -n build_26680_r1_stable_preview.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26680.py','validate_26680.py','verify_26680_authority.py','verify_26680_infrastructure.py','verify_26680_patches.py','verify_26680_regressions.py','verify_26680_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26680 candidate from successful 26679 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26680_r1_stable_preview.sh
      - name: Verify exact 26680 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726680-26680-r1-stable-preview-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726680-26680-r1-stable-preview-debug.apk" build_26680_r1_stable_preview_outputs/26680_R1_APK.sha256
      - name: Upload 26680 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26680-r1-stable-preview
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726680-26680-r1-stable-preview-debug.apk
            build_26680_r1_stable_preview_outputs/
