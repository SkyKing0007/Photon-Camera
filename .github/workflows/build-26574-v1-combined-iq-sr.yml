name: Build 26574 V1 Combined Foliage-Sky + SR Alignment

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26574_*'
      - 'REGRESSION_V1_26574_*'
      - 'build_26574_v1_combined_iq_sr.sh'
      - 'transform_26574_v1.py'
      - 'validate_26574_v1.py'
      - 'verify_26574_v1_authority.py'
      - 'verify_26574_v1_patches.py'
      - 'verify_26574_v1_shaders.py'
      - 'handoff_payload_26574_v1/**'
      - '.github/workflows/build-26574-v1-combined-iq-sr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26574 V1 package and mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26574_HANDOFF_HASHES.sha256
          bash -n build_26574_v1_combined_iq_sr.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26574_v1.py',
              'validate_26574_v1.py',
              'verify_26574_v1_authority.py',
              'verify_26574_v1_patches.py',
              'verify_26574_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26574_v1_combined_iq_sr.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="33e40571b62f734b9720cd4a993c42900806793e"' in s
          assert 'HANDOFF_PARENT_COMMIT="33e40571b62f734b9720cd4a993c42900806793e"' in s
          assert 'BASE_RUN_ID="33467423463"' in s
          assert 'BASE_JOB_ID="99730063573"' in s
          assert 'BASE_ARTIFACT_ID="9785409671"' in s
          assert 'BASE_ARTIFACT_SHA="9335551157a04b0fef03c4d45baf0b4cf5753228c191445b081375c411bf9e91"' in s
          assert 'BASE_TAR_SHA="e6c9815c9e17a1ccbc271b3680fe9d8491e140675dba74c9bba52e61c9bfbd13"' in s
          assert 'VERSION_NAME="0.9726574"' in s and 'VERSION_BUILD="26574"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          assert 'BACKUP_BRANCH="backup-26573-pre-combined-iq-sr"' in s
          assert 'BACKUP_COMMIT="33e40571b62f734b9720cd4a993c42900806793e"' in s
          assert 'git ls-remote origin "refs/heads/$BACKUP_BRANCH"' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26574 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          expected="""snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26573 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }"""
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          print('PASS sealed Python syntax + exact successful 26573 authority-seeded verification order inheritance')
          PY
          grep -F 'IRIS_26574_TOPOLOGY_PRESERVED_BRIGHT_SURFACE' REGRESSION_V1_26574_COMBINED_IQ_SR_CONTRACT.txt >/dev/null
          grep -F 'IRIS_26574_JPEG_RETAINED_FLOW_REFINEMENT_ONLY' REGRESSION_V1_26574_COMBINED_IQ_SR_CONTRACT.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26574_CARRIED_FAILURES.txt >/dev/null
          grep -F 'No verification order is weakened' V1_26574_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26574_' .github/workflows --exclude='build-26574-v1-combined-iq-sr.yml'
          ! grep -R -F 'handoff_payload_26574_v1' .github/workflows --exclude='build-26574-v1-combined-iq-sr.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26574 candidate from successful compiled 26573 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26574_v1_combined_iq_sr.sh
          ./build_26574_v1_combined_iq_sr.sh

      - name: Upload 26574 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26574-v1-combined-iq-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726574-26574-v1-combined-iq-sr-debug.apk
            build_26574_v1_combined_iq_sr_outputs/
