name: Build 26768 IIR3 Chroma Ownership
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26768_README_UPLOAD.txt'
      - '26768_*'
      - 'build_26768_iir3_chroma_ownership.sh'
      - 'transform_26768.py'
      - 'validate_26768.py'
      - 'verify_26768_*.py'
      - 'handoff_payload_26768/**'
      - '.github/workflows/build-26768-iir3-chroma-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26768 handoff and successful 26767/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26768_HANDOFF_HASHES.sha256
          bash -n build_26768_iir3_chroma_ownership.sh
          python3 -S -m py_compile transform_26768.py validate_26768.py verify_26768_patches.py verify_26768_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26768 candidate from exact successful 26767 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26768_iir3_chroma_ownership.sh
      - name: Verify exact 26768 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726768-26768-iir3-chroma-ownership-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726768-26768-iir3-chroma-ownership-debug.apk' build_26768_iir3_chroma_ownership_outputs/26768_APK.sha256
      - name: Upload 26768 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26768-iir3-chroma-ownership
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726768-26768-iir3-chroma-ownership-debug.apk
            build_26768_iir3_chroma_ownership_outputs/
