name: Build 26487 Reconstruction Correctness Latency V2

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26483_successful_source.patch'
      - '26483_successful_after.sha256'
      - '26484_delta_from_26483.patch'
      - 'transform_26485_runtime_shutter_full_fix_v1.py'
      - 'transform_26486_full_bjzhou_censored_opponent_latency_v1.py'
      - 'transform_26487_reconstruction_correctness_latency_v2.py'
      - 'build_26487_reconstruction_correctness_latency_v2.sh'
      - '.github/workflows/build-26487-reconstruction-correctness-latency-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Strict 26487 infrastructure identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum build_26487_reconstruction_correctness_latency_v2.sh | awk '{print $1}')" = "17cb221ab23fd5b3d33105eb49aa849588a9a856a2064752b121bf806954eac8"
          test "$(sha256sum transform_26487_reconstruction_correctness_latency_v2.py | awk '{print $1}')" = "3e6413d3711e3fb570c0514cffd6bae6bad6e6864cf68de9b3df388ef6238654"
          test "$(sha256sum transform_26486_full_bjzhou_censored_opponent_latency_v1.py | awk '{print $1}')" = "3030fa2543c6593711f8822a770c78de25e9347c65717420ffde291c1aad0eca"
          test "$(sha256sum transform_26485_runtime_shutter_full_fix_v1.py | awk '{print $1}')" = "2e04a8e250d0fb64ca3e4a7763ed4943203d7f1ae740283018a7fb1b90c9a461"
          test "$(sha256sum 26483_successful_source.patch | awk '{print $1}')" = "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          test "$(sha256sum 26483_successful_after.sha256 | awk '{print $1}')" = "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          test "$(sha256sum 26484_delta_from_26483.patch | awk '{print $1}')" = "18fbb861c3c49f4ad8399f29aa60ca3e85df57ffacc794b8b6a2206b42197ac3"
          bash -n build_26487_reconstruction_correctness_latency_v2.sh
          python3 -m py_compile \
            transform_26485_runtime_shutter_full_fix_v1.py \
            transform_26486_full_bjzhou_censored_opponent_latency_v1.py \
            transform_26487_reconstruction_correctness_latency_v2.py
          python3 transform_26487_reconstruction_correctness_latency_v2.py --self-test
          echo "PASS: 26487 workflow infrastructure identity"

      - name: Build guarded 26487 candidate and APK
        shell: bash
        run: |
          chmod +x build_26487_reconstruction_correctness_latency_v2.sh
          ./build_26487_reconstruction_correctness_latency_v2.sh

      - name: Upload 26487 artifact and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26487-reconstruction-correctness-latency-v2
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726487-26487-reconstruction-correctness-latency-debug.apk
            build_26487_outputs/**
