name: Build 26752 IPOL Plan B Translational SR
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26752_README_UPLOAD.txt'
      - '26752_*'
      - 'build_26752_ipol_plan_b_translational_sr.sh'
      - 'transform_26752.py'
      - 'validate_26752.py'
      - 'verify_26752_*.py'
      - 'handoff_payload_26752/**'
      - '.github/workflows/build-26752-ipol-plan-b-translational-sr.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26752 handoff and exact successful 26751 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26752_HANDOFF_HASHES.sha256
          python3 -S verify_26752_infrastructure.py build_26752_ipol_plan_b_translational_sr.sh .github/workflows/build-26752-ipol-plan-b-translational-sr.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26752 candidate from exact successful 26733 Actions runtime authority using successful 26751 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26752_ipol_plan_b_translational_sr.sh
      - name: Verify exact 26752 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726752-26752-ipol-plan-b-translational-sr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726752-26752-ipol-plan-b-translational-sr-debug.apk' build_26752_ipol_plan_b_translational_sr_outputs/26752_APK.sha256
      - name: Upload 26752 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26752-ipol-plan-b-translational-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726752-26752-ipol-plan-b-translational-sr-debug.apk
            build_26752_ipol_plan_b_translational_sr_outputs/
