name: Photon 26926 - 26923 V4 authority, B OFF halo guard, B ON RAW support and lens fallback
on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - TRIGGER_26926.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Prepare pinned JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove complete three-stage upload and reject missing historical executables
        run: |
          python3 -S test_26926_workflow_refs.py --all
          python3 -S build_26926_incremental.py seal
          python3 -S test_26926_sealed_negatives.py
          python3 -S test_26926_source.py --payload
          python3 -S test_26926_math_host.py --payload
          python3 -S test_26926_shader_contract.py --payload
          python3 -S test_26926_shader_shadow.py --payload
          python3 -S test_26926_patch_proof.py
      - name: Inherit successful 26923 and original 26925 V1 coherent V2 precision V3 native recorder regression receipts
        run: |
          python3 -S test_26923_workflow_refs.py
          python3 -S build_26923_incremental.py seal
          python3 -S test_26923_sealed_negatives.py
          python3 -S test_26923_source.py --payload
          python3 -S test_26923_math_host.py
          python3 -S test_26925_workflow_refs.py
          python3 -S build_26925_incremental.py seal
          python3 -S test_26925_sealed_negatives.py
          python3 -S test_26925_shader_contract.py --payload
          python3 -S test_26925_shader_abi.py --payload
          python3 -S test_26925_shader_shadow.py --payload
          python3 -S test_26925_source.py --payload
          python3 -S test_26925_math_host.py --payload
      - name: Preserve 26904 V1 optimizer V2 packaging V3 pinned CMake, Night 26903 and native-cache regressions
        run: |
          python3 -S verify_26904_v3_safety.py
          python3 -S verify_26904_v2_safety.py
          python3 -S build_26904_incremental.py seal
          python3 -S test_26904_changeaware.py . --with-javac
          python3 -S test_26906_native_cache.py
          python3 -S test_26903_v3_archive_receipt.py
          python3 -S test_26903_v3_sealed_negatives.py
          python3 -S test_26917_border.py --payload
      - name: Restore Gradle dependency and task cache without changing source
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
          restore-keys: |
            photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-
      - name: Download and SHA-verify original published successful 26923 V4 compiled candidate and runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26926_incremental.py fetch
      - name: Seed EXACT 26923 V4 2039-file source and overlay ONLY 13 changed plus 2 new, 2026 protected
        run: python3 -S build_26926_incremental.py prepare
      - name: Prove 26926 immutable source, per-lens frozen settings, ON noise continuity and OFF boundary safeguards
        run: |
          python3 -S test_26926_source.py --live
          python3 -S test_26926_math_host.py --live
          python3 -S test_26926_shader_shadow.py --live
          python3 -S test_26926_shader_contract.py --live
          python3 -S test_26926_patch_proof.py --live
          python3 -S test_26903_modes.py .
          python3 -S test_26917_border.py --live
          python3 -S test_26920_math_host.py
          python3 -S test_26920_vulkan_abi.py --payload
          python3 -S build_26926_incremental.py regress
      - name: Record runner image used in actual native-cache key
        id: runner_image
        shell: bash
        run: |
          set -euo pipefail
          : "${ImageOS:?runner OS missing}"
          : "${ImageVersion:?runner image revision missing}"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # Never restore native CMake output before authoritative 26923 candidate is seeded.
      - name: Restore native CMake only for original 26923-seeded 26926 source fingerprint
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify source-matched native cache and pinned libheif patch replay
        env:
          PHOTON_26906_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: python3 -S verify_26906_native_cache.py preflight
      - name: Real pinned original glslang16.5 ESSL Vulkan optimizer and dual validator before NDK
        run: bash compile_26904_shaders_v2.sh
      - name: Propagate exact pinned glslang into both Android CMake compiler ABIs
        run: python3 -S verify_26904_v3_cmake_handoff.py --handoff
      - name: Compile and validate three 26926 inline GLES 300 and 310 post-AMaZE/FCC shaders plus inherited 26906 full renderer
        run: bash compile_26926_shaders.sh
      - name: Compile and validate 26926 Wronski source support, native AMaZE guide and wavelet alpha, prod and trace Vulkan SPIR-V
        run: bash compile_26926_hr_spirv.sh
      - name: Recompile existing real pinned hue, display renderer, native AMaZE and original 26923 LK shader contracts
        run: |
          bash compile_26907_hue_glsl.sh
          bash compile_26908_render_glsl.sh
          bash compile_26917_amaze_import.sh
          python3 -S compile_26923_lk_shaders.py
      - name: Freeze unchanged 2026 protected source bytes after all real pinned shader compilers
        run: python3 -S build_26926_incremental.py verify-compiled
      - name: Build complete Android debug APK using real NDK CMake both ABIs Kotlin Java and assembly
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache :app:assembleDebug --stacktrace 2>&1 | tee photon_26926_outputs/26926_gradle_assemble.log
      - name: Verify compiled Vulkan descriptor and original CMake shadow bytes in BOTH Android ABIs
        run: |
          python3 -S test_26920_vulkan_abi.py --live --cmake
          python3 -S test_26926_shader_shadow.py --live --cmake
          python3 -S verify_26906_native_cache.py postflight
      - name: Final exact 26926 source protected count one assembled APK and executed builder workflow source receipts
        run: python3 -S build_26926_incremental.py finalize
      - name: Save source-matched native CMake cache ONLY after successful APK
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Save Gradle content-addressed cache ONLY after successful APK
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
      - name: Publish ONE 26926 Android APK plus complete source, actual compiler and executable provenance only after verified success
        uses: actions/upload-artifact@v4
        with:
          name: photon-26926-26923-source-frozen-raw-burst-shadow-chroma-off-halo
          path: |
            IrisCamera-0.9726926-26926-iris-rawr-debug.apk
            photon_26926_outputs/
          if-no-files-found: error
          retention-days: 90
