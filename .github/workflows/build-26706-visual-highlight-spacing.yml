name: Build 26706 Visual Highlight Spacing

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26706_README_UPLOAD.txt'
      - '26706_*'
      - 'build_26706_visual_highlight_spacing.sh'
      - 'transform_26706.py'
      - 'validate_26706.py'
      - 'verify_26706_*.py'
      - 'handoff_payload_26706/**'
      - '.github/workflows/build-26706-visual-highlight-spacing.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26706 handoff and exact successful 26704 mechanics + 26705 R1 regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26706_HANDOFF_HASHES.sha256
          bash -n build_26706_visual_highlight_spacing.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26706.py','validate_26706.py','verify_26706_authority.py','verify_26706_infrastructure.py','verify_26706_patches.py','verify_26706_regressions.py','verify_26706_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26706 candidate from successful 26705 R1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26706_visual_highlight_spacing.sh
      - name: Verify exact 26706 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726706-26706-visual-highlight-spacing-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726706-26706-visual-highlight-spacing-debug.apk" build_26706_visual_highlight_spacing_outputs/26706_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26706_visual_highlight_spacing_outputs/26706_apk_jni_contract.txt
      - name: Upload 26706 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26706-visual-highlight-spacing
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726706-26706-visual-highlight-spacing-debug.apk
            build_26706_visual_highlight_spacing_outputs/
