name: Build 26578 V1 Fail-Closed Real-Color Gate

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26578_*'
      - 'REGRESSION_V1_26578_*'
      - 'build_26578_v1_fail_closed_real_color_gate.sh'
      - 'transform_26578_v1.py'
      - 'validate_26578_v1.py'
      - 'verify_26578_v1_authority.py'
      - 'verify_26578_v1_gate_regressions.py'
      - 'verify_26578_v1_patches.py'
      - 'verify_26578_v1_shaders.py'
      - 'handoff_payload_26578_v1/**'
      - '.github/workflows/build-26578-v1-fail-closed-real-color-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26578 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26578_HANDOFF_HASHES.sha256
          bash -n build_26578_v1_fail_closed_real_color_gate.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26578_v1.py',
              'validate_26578_v1.py',
              'verify_26578_v1_authority.py',
              'verify_26578_v1_gate_regressions.py',
              'verify_26578_v1_patches.py',
              'verify_26578_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26578_v1_fail_closed_real_color_gate.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="bbbd591342c0ce2aaec16952ba4441da90d7244b"' in s
          assert 'HANDOFF_PARENT_COMMIT="bbbd591342c0ce2aaec16952ba4441da90d7244b"' in s
          assert 'BASE_RUN_ID="33573748892"' in s
          assert 'BASE_JOB_ID="100073091585"' in s
          assert 'BASE_ARTIFACT_ID="9825944578"' in s
          assert 'BASE_ARTIFACT_SHA="aa31e1b475fe9eb2e8db34de246a0a7b99f42ec5980aa5576dfec3dd9b7bcc95"' in s
          assert 'BASE_TAR_SHA="efca4379681b0fecbff1ee0c8f7541e3ee129c370409191868f8ffe11cf03cca"' in s
          assert 'VERSION_NAME="0.9726578"' in s and 'VERSION_BUILD="26578"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26577 compiler/build ordering remains unchanged.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26578 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          main='\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n'
          assert main in s
          snap='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert snap in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          print('PASS sealed Python syntax + exact successful 26577 authority-seeded verification order inheritance')
          PY
          grep -F 'Isolation alone NEVER authorizes correction' REGRESSION_V1_26578_FAIL_CLOSED_REAL_COLOR.txt >/dev/null
          grep -F 'foliage versus blue sky material boundary' REGRESSION_V1_26578_FAIL_CLOSED_REAL_COLOR.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26578_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26578_' .github/workflows --exclude='build-26578-v1-fail-closed-real-color-gate.yml'
          ! grep -R -F 'handoff_payload_26578_v1' .github/workflows --exclude='build-26578-v1-fail-closed-real-color-gate.yml'
          ! find . -type d -name '__pycache__' -o -type f -name '*.pyc' | grep -q .

      - name: Build exact 26578 candidate from successful compiled 26577 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26578_v1_fail_closed_real_color_gate.sh

      - name: Upload 26578 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26578-v1-fail-closed-real-color-gate
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726578-26578-v1-fail-closed-real-color-gate-debug.apk
            build_26578_v1_fail_closed_real_color_gate_outputs/
