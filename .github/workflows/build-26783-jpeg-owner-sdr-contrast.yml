name: Build 26783 JPEG Owner SDR Contrast
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26783.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26783 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26783.txt
          grep -Fx 'RUN_26783_JPEG_OWNER_SDR_CONTRAST' TRIGGER_26783.txt
          sha256sum -c 26783_HANDOFF_HASHES.sha256
          bash -n build_26783_jpeg_owner_sdr_contrast.sh
          python3 -S -m py_compile transform_26783.py validate_26783.py verify_26783_patches.py verify_26783_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26783_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26783_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26783 candidate from successful 26782 authority using exact successful 26782 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26783_jpeg_owner_sdr_contrast.sh
      - name: Verify exact 26783 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726783-26783-jpeg-owner-sdr-contrast-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726783-26783-jpeg-owner-sdr-contrast-debug.apk' build_26783_jpeg_owner_sdr_contrast_outputs/26783_APK.sha256
      - name: Upload 26783 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26783-jpeg-owner-sdr-contrast
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726783-26783-jpeg-owner-sdr-contrast-debug.apk
            build_26783_jpeg_owner_sdr_contrast_outputs/
