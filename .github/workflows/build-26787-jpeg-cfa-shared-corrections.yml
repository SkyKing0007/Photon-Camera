name: Build 26787 JPEG CFA Shared Corrections
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26787.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26787 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26787.txt
          grep -Fx 'RUN_26787_JPEG_CFA_SHARED_CORRECTIONS' TRIGGER_26787.txt
          sha256sum -c 26787_HANDOFF_HASHES.sha256
          bash -n build_26787_jpeg_cfa_shared_corrections.sh
          python3 -S -m py_compile transform_26787.py validate_26787.py verify_26787_patches.py verify_26787_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26787_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26787_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26787 candidate from successful 26786 authority using exact successful 26786 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26787_jpeg_cfa_shared_corrections.sh
      - name: Verify exact 26787 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726787-26787-jpeg-cfa-shared-corrections-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726787-26787-jpeg-cfa-shared-corrections-debug.apk' build_26787_jpeg_cfa_shared_corrections_outputs/26787_APK.sha256
      - name: Upload 26787 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26787-jpeg-cfa-shared-corrections
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726787-26787-jpeg-cfa-shared-corrections-debug.apk
            build_26787_jpeg_cfa_shared_corrections_outputs/
