name: Build 26624 R1 Component-Owned SHORT Recovery

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26624_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26624_*'
      - 'R1_26624_*'
      - 'build_26624_r1_component_owned_short_recovery.sh'
      - 'transform_26624_r1.py'
      - 'validate_26624_r1.py'
      - 'verify_26624_r1_*.py'
      - 'handoff_payload_26624_r1/**'
      - '.github/workflows/build-26624-r1-component-owned-short-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26624 package and exact successful 26623 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26624_HANDOFF_HASHES.sha256
          bash -n build_26624_r1_component_owned_short_recovery.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26624_r1.py','validate_26624_r1.py','verify_26624_r1_authority.py','verify_26624_r1_infrastructure.py','verify_26624_r1_patches.py','verify_26624_r1_regressions.py','verify_26624_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26624 candidate from successful compiled 26623 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26624_r1_component_owned_short_recovery.sh
      - name: Upload 26624 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26624-r1-component-owned-short-recovery
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726624-26624-r1-component-owned-short-recovery-debug.apk
            build_26624_r1_component_owned_short_recovery_outputs/
