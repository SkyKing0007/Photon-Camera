name: Build 26552 V1 Dynamic Night + VGN + Shutter Ring

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26552-v1-dynamic-night-vgn-shutter-ring.yml'
      - 'build_26552_v1_dynamic_night_vgn_shutter_ring.sh'
      - 'validate_26552_v1_dynamic_night_vgn_shutter_ring.py'
      - 'extract_26552_embedded_glsl.py'
      - 'V1_26552_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26552-v1-dynamic-night-vgn-shutter-ring
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26552 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26552_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26552_v1_dynamic_night_vgn_shutter_ring.py extract_26552_embedded_glsl.py
          python3 validate_26552_v1_dynamic_night_vgn_shutter_ring.py --self-test
          python3 extract_26552_embedded_glsl.py /dev/null .extractor-selftest-unused --self-test
          rm -rf .extractor-selftest-unused
          bash -n build_26552_v1_dynamic_night_vgn_shutter_ring.sh
          grep -F 'BASE_RUN_ID="33137981208"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9672833483"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="69d7e35e032ac8a68b190eefffe8961897c38751"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'BASE_TAR_SHA="3437de0724fc180b14e6cca3480a0849c77b54c304d626a4cc3be5abe1859924"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726552"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'VERSION_BUILD="26552"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'glslangValidator -S comp "$WORK/26552_runtime_glsl_compiler/directionalSmooth.comp"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F 'glslangValidator -S comp "$WORK/26552_runtime_glsl_compiler/iirRgb.comp"' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26552_v1_dynamic_night_vgn_shutter_ring.sh >/dev/null
          grep -F -- "- 'V1_26551_*'" .github/workflows/build-26551-v1-night-ui-generation-style.yml >/dev/null

      - name: Build exact 26552 candidate from successful compiled 26551 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x build_26552_v1_dynamic_night_vgn_shutter_ring.sh
          ./build_26552_v1_dynamic_night_vgn_shutter_ring.sh

      - name: Upload 26552 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26552-v1-dynamic-night-vgn-shutter-ring
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726552-26552-v1-dynamic-night-vgn-shutter-ring-debug.apk
            build_26552_v1_dynamic_night_vgn_shutter_ring_outputs/
