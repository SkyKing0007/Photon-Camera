name: Build 26478 Authoritative Pure Wronski V6

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26478_authoritative_pure_wronski_v6.sh
      - transform_26478_speaker_support_diagnostic_v2.py
      - .github/workflows/build-26478-authoritative-pure-wronski-v6.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded authoritative 26478 V6
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard exact V6 infrastructure scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "fbf480d37c5213f72697170ae356493570ab3cc4"
          test "$(git rev-parse HEAD~2)" = "87de69aff3d927be9c031c2fce476dffe88e4d71"
          test "$(git rev-parse HEAD~3)" = "62fed09aa61ac963f951fd39b1a62be870d75654"
          test "$(git rev-parse HEAD~4)" = "a5fa756f8b5cf1101e807b776728d08225f3e53e"
          test "$(git rev-parse HEAD~5)" = "be24c16cb091e753852b900384dbde6f8d32744e"

          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 V6 infrastructure commit changed app source directly"
            exit 1
          }

          expected_current="$(printf '%s\n' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v6.yml' \
            'build_26478_authoritative_pure_wronski_v6.sh' \
            'transform_26478_speaker_support_diagnostic_v2.py' | sort)"
          actual_current="$(git diff --name-only HEAD^ HEAD | sort)"
          test "$actual_current" = "$expected_current" || {
            echo "26478 V6 commit must contain exactly the three V6 infrastructure files"
            echo "ACTUAL:"
            printf '%s\n' "$actual_current"
            echo "EXPECTED:"
            printf '%s\n' "$expected_current"
            exit 1
          }

          test "$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 infrastructure chain changed committed app source"
            exit 1
          }

          bash -n ./build_26478_authoritative_pure_wronski_v6.sh
          python3 -m py_compile ./transform_26478_pure_wronski_highlight_safe_v1.py
          python3 -m py_compile ./transform_26478_speaker_support_diagnostic_v2.py
          grep -q 'IRIS_26478_SPEAKER_SUPPORT_DIAGNOSTIC_ANCHOR_V2' \
            ./transform_26478_speaker_support_diagnostic_v2.py
          echo "26478 V6 infrastructure scope + syntax PASS"

      - name: Create exact pre-V6 backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-26478-v5-before-26478-v6-speaker-anchor-fix"
          TARGET="fbf480d37c5213f72697170ae356493570ab3cc4"

          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [ -n "$remote" ]; then
            test "$remote" = "$TARGET" || {
              echo "Existing V6 backup branch points to wrong commit: $remote"
              exit 1
            }
          else
            git push origin "$TARGET:refs/heads/$BACKUP"
          fi

          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          test "$remote" = "$TARGET"
          echo "V6 backup branch exact pre-modification state PASS"

      - name: Run guarded 26478 V6 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26478_authoritative_pure_wronski_v6.sh
          ./build_26478_authoritative_pure_wronski_v6.sh

      - name: Upload 26478 V6 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26478-authoritative-pure-wronski-v6
          if-no-files-found: error
          path: |
            build_26478_outputs/**
            IrisCamera-0.9726478-26478-pure-wronski-highlight-safe-speaker-diag-debug.apk
