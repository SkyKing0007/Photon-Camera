name: Build 26479 V9 Stale Version Gate Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26479_authoritative_v9_stale_version_gate_fix.sh
      - .github/workflows/build-26479-authoritative-v9-stale-version-gate-fix.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded 26479 V9
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard exact V9 infrastructure scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "fea487b2c9f6d41d630f78c8e4e1406ac3ccde7b"
          test "$(git rev-parse HEAD~2)" = "5755b1a05777423b5af9f803a57235ac73efdf68"
          test "$(git rev-parse HEAD~8)" = "be24c16cb091e753852b900384dbde6f8d32744e"
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || { echo "26479 V9 infrastructure commit changed app source directly"; exit 1; }
          expected_current="$(printf '%s\n' '.github/workflows/build-26479-authoritative-v9-stale-version-gate-fix.yml' 'build_26479_authoritative_v9_stale_version_gate_fix.sh' | sort)"
          actual_current="$(git diff --name-only HEAD^ HEAD | sort)"
          test "$actual_current" = "$expected_current" || { echo "26479 V9 commit must contain exactly the two V9 infrastructure files"; echo "ACTUAL:"; printf '%s\n' "$actual_current"; echo "EXPECTED:"; printf '%s\n' "$expected_current"; exit 1; }
          test "$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || { echo "26479 infrastructure chain changed committed app source"; exit 1; }
          test -f transform_26479_adreno_sample_keyword_portability_v1.py
          test "$(git hash-object transform_26479_adreno_sample_keyword_portability_v1.py)" = "$(git hash-object HEAD^:transform_26479_adreno_sample_keyword_portability_v1.py)"
          bash -n ./build_26479_authoritative_v9_stale_version_gate_fix.sh
          old_final_version_checks="$(grep -Ec "grep -q '\^VERSION_NAME=0\\.9726478\$' app/version.properties|grep -q '\^VERSION_BUILD=26478\$' app/version.properties" build_26479_authoritative_v9_stale_version_gate_fix.sh || true)"
          test "$old_final_version_checks" -eq 0
          grep -Fq "grep -q '^VERSION_NAME=0\.9726479$' app/version.properties || fail "wrong version"" build_26479_authoritative_v9_stale_version_gate_fix.sh
          grep -Fq "grep -q '^VERSION_BUILD=26479$' app/version.properties || fail "wrong build"" build_26479_authoritative_v9_stale_version_gate_fix.sh
          echo "26479 V9 exact infrastructure + corrected version-gate audit PASS"

      - name: Create exact pre-V9 backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-26479-v8-before-v9-stale-version-gate-fix"
          TARGET="fea487b2c9f6d41d630f78c8e4e1406ac3ccde7b"
          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [ -n "$remote" ]; then test "$remote" = "$TARGET"; else git push origin "$TARGET:refs/heads/$BACKUP"; fi
          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          test "$remote" = "$TARGET"
          echo "V9 backup branch exact V8 pre-modification state PASS"

      - name: Run guarded 26479 V9 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26479_authoritative_v9_stale_version_gate_fix.sh
          ./build_26479_authoritative_v9_stale_version_gate_fix.sh

      - name: Upload 26479 V9 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26479-v9-adreno-sample-keyword-fix
          if-no-files-found: error
          path: |
            build_26479_outputs/**
            IrisCamera-0.9726479-26479-pure-wronski-highlight-safe-speaker-diag-adreno-portability-debug.apk
