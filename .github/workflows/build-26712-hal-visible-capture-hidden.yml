name: Build 26712 HAL Visible + Capture Hidden
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26712_README_UPLOAD.txt'
      - '26712_*'
      - 'build_26712_hal_visible_capture_hidden.sh'
      - 'transform_26712.py'
      - 'validate_26712.py'
      - 'verify_26712_*.py'
      - 'handoff_payload_26712/**'
      - '.github/workflows/build-26712-hal-visible-capture-hidden.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26712 handoff and exact successful 26711 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26712_HANDOFF_HASHES.sha256
          bash -n build_26712_hal_visible_capture_hidden.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26712.py','validate_26712.py','verify_26712_authority.py','verify_26712_patches.py','verify_26712_regressions.py','verify_26712_shaders.py','verify_26712_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26712_infrastructure.py build_26712_hal_visible_capture_hidden.sh .github/workflows/build-26712-hal-visible-capture-hidden.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26712 candidate from successful 26711 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26712_hal_visible_capture_hidden.sh
      - name: Verify exact 26712 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726712-26712-hal-visible-capture-hidden-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726712-26712-hal-visible-capture-hidden-debug.apk' build_26712_hal_visible_capture_hidden_outputs/26712_APK.sha256
      - name: Upload 26712 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26712-hal-visible-capture-hidden
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726712-26712-hal-visible-capture-hidden-debug.apk
            build_26712_hal_visible_capture_hidden_outputs/
