name: Build 26634 R1 Local Residual Noise + Metadata Cleanup

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26634_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26634_*'
      - 'R1_26634_*'
      - 'build_26634_r1_local_residual_noise_metadata.sh'
      - 'transform_26634_r1.py'
      - 'validate_26634_r1.py'
      - 'verify_26634_r1_*.py'
      - 'handoff_payload_26634_r1/**'
      - '.github/workflows/build-26634-r1-local-residual-noise-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26634 R1 package and exact successful 26633 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26634_HANDOFF_HASHES.sha256
          bash -n build_26634_r1_local_residual_noise_metadata.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26634_r1.py','validate_26634_r1.py','verify_26634_r1_authority.py','verify_26634_r1_infrastructure.py','verify_26634_r1_patches.py','verify_26634_r1_regressions.py','verify_26634_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26634 R1 candidate from successful compiled 26633 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26634_r1_local_residual_noise_metadata.sh
      - name: Upload 26634 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26634-r1-local-residual-noise-metadata
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726634-26634-r1-local-residual-noise-metadata-debug.apk
            build_26634_r1_local_residual_noise_metadata_outputs/
