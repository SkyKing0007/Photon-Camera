name: Build 26711 Locked Reference Lifecycle
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26711_README_UPLOAD.txt'
      - '26711_*'
      - 'build_26711_locked_reference_lifecycle.sh'
      - 'transform_26711.py'
      - 'validate_26711.py'
      - 'verify_26711_*.py'
      - 'handoff_payload_26711/**'
      - '.github/workflows/build-26711-locked-reference-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26711 handoff and exact successful 26710 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26711_HANDOFF_HASHES.sha256
          bash -n build_26711_locked_reference_lifecycle.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26711.py','validate_26711.py','verify_26711_authority.py','verify_26711_patches.py','verify_26711_regressions.py','verify_26711_shaders.py','verify_26711_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26711_infrastructure.py build_26711_locked_reference_lifecycle.sh .github/workflows/build-26711-locked-reference-lifecycle.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26711 candidate from successful 26710 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26711_locked_reference_lifecycle.sh
      - name: Verify exact 26711 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726711-26711-locked-reference-lifecycle-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726711-26711-locked-reference-lifecycle-debug.apk' build_26711_locked_reference_lifecycle_outputs/26711_APK.sha256
      - name: Upload 26711 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26711-locked-reference-lifecycle
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726711-26711-locked-reference-lifecycle-debug.apk
            build_26711_locked_reference_lifecycle_outputs/
