name: Build 26767 VGN Chroma Topology
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26767_README_UPLOAD.txt'
      - '26767_*'
      - 'build_26767_vgn_chroma_topology.sh'
      - 'transform_26767.py'
      - 'validate_26767.py'
      - 'verify_26767_*.py'
      - 'handoff_payload_26767/**'
      - '.github/workflows/build-26767-vgn-chroma-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26767 handoff and successful 26766/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26767_HANDOFF_HASHES.sha256
          bash -n build_26767_vgn_chroma_topology.sh
          python3 -S -m py_compile transform_26767.py validate_26767.py verify_26767_patches.py verify_26767_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26767 candidate from exact successful 26766 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26767_vgn_chroma_topology.sh
      - name: Verify exact 26767 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726767-26767-vgn-chroma-topology-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726767-26767-vgn-chroma-topology-debug.apk' build_26767_vgn_chroma_topology_outputs/26767_APK.sha256
      - name: Upload 26767 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26767-vgn-chroma-topology
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726767-26767-vgn-chroma-topology-debug.apk
            build_26767_vgn_chroma_topology_outputs/
