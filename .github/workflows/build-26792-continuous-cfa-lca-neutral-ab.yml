name: Build 26792 Continuous CFA LCA Neutral AB
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26792.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26792 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26792.txt
          grep -Fx 'RUN_26792_CONTINUOUS_CFA_LCA_NEUTRAL_AB' TRIGGER_26792.txt
          sha256sum -c 26792_HANDOFF_HASHES.sha256
          bash -n build_26792_continuous_cfa_lca_neutral_ab.sh
          python3 -S -m py_compile transform_26792.py validate_26792.py verify_26792_patches.py verify_26792_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26792_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26792_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26792 candidate from successful 26791 authority using exact successful 26791 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26792_continuous_cfa_lca_neutral_ab.sh
      - name: Verify exact 26792 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726792-26792-continuous-cfa-lca-neutral-ab-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726792-26792-continuous-cfa-lca-neutral-ab-debug.apk' build_26792_continuous_cfa_lca_neutral_ab_outputs/26792_APK.sha256
      - name: Upload 26792 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26792-continuous-cfa-lca-neutral-ab
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726792-26792-continuous-cfa-lca-neutral-ab-debug.apk
            build_26792_continuous_cfa_lca_neutral_ab_outputs/
