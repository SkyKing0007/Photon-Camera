name: Build 26492 Authority Provenance Contract

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26490_successful_source.patch'
      - '26490_successful_after.sha256'
      - 'transform_26491_complete_highlight_exposure_v4.py'
      - 'transform_26492_authority_provenance_v1.py'
      - 'build_26492_authority_provenance_v1.sh'
      - '.github/workflows/build-26492-authority-provenance-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26492 infrastructure identity and semantic preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha build_26492_authority_provenance_v1.sh "f010bddfcbca57094f6904fb244275d2b928d077d984fbffe3028c08ddd3f093"
          check_sha transform_26492_authority_provenance_v1.py "43edbd89b8cc82a2982b58e1ca0a50165fbf74b43b1988f48c8efd0b1968cfa5"
          check_sha transform_26491_complete_highlight_exposure_v4.py "82b78d994b9657e36b202849f465061b2a4ada66822fa9f6b82d013935e37ed5"
          check_sha 26490_successful_source.patch "c589cc000047da6dd19c7b1ac71405fa635d75db37007fa526c60368001433ba"
          check_sha 26490_successful_after.sha256 "431a62d9e23cd17d71388d4b79ad0a0c548c58ae9eabb2ad1894ba9cad34322f"
          bash -n build_26492_authority_provenance_v1.sh
          python3 -m py_compile transform_26491_complete_highlight_exposure_v4.py transform_26492_authority_provenance_v1.py
          python3 transform_26491_complete_highlight_exposure_v4.py --self-test
          python3 transform_26492_authority_provenance_v1.py --self-test
          echo "PASS: 26492 infrastructure + semantic preflight"

      - name: Build guarded 26492 candidate and APK
        shell: bash
        run: |
          chmod +x build_26492_authority_provenance_v1.sh
          ./build_26492_authority_provenance_v1.sh

      - name: Upload 26492 APK and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26492-authority-provenance
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726492-26492-authority-provenance-debug.apk
            build_26492_outputs/**
