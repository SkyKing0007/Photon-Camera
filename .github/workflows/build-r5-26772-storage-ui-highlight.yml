name: Build 26772 R5 Strict Mechanics Patch-Proof Repair
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_R5_26772.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R5 trigger and sealed infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_R5_26772.txt
          grep -Fx 'RUN_26772_R5_STRICT_PATCH_PROOF_REPAIR' TRIGGER_R5_26772.txt
          sha256sum -c r5_26772_HANDOFF_HASHES.sha256
          sha256sum -c r3_26772_HANDOFF_HASHES.sha256
          bash -n build_r5_26772_storage_ui_highlight.sh
          python3 -S -m py_compile r5_26772_make_patches.py
          rm -rf __pycache__
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact repaired 26772 candidate from successful 26771 R2 authority using successful 26752 and 26771 mechanics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_r5_26772_storage_ui_highlight.sh
      - name: Verify exact R5 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726772-26772-R5-storage-ui-highlight-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726772-26772-R5-storage-ui-highlight-debug.apk' build_r5_26772_storage_ui_highlight_outputs/r5_26772_APK.sha256
      - name: Upload 26772 R5 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26772-r5-strict-patch-proof-repair
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726772-26772-R5-storage-ui-highlight-debug.apk
            build_r5_26772_storage_ui_highlight_outputs/
