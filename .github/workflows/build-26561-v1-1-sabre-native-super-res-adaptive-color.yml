name: Build 26561 V1.1 Sabre Native Super Res Adaptive Color

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_1_26561_*'
      - 'build_26561_v1_1_sabre_native_super_res_adaptive_color.sh'
      - 'transform_26561_v1_1_sabre_native_super_res_adaptive_color.py'
      - 'validate_26561_v1_1_sabre_native_super_res_adaptive_color.py'
      - 'extract_26561_v1_1_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26561_v1_1.py'
      - '.github/workflows/build-26561-v1-1-sabre-native-super-res-adaptive-color.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26561 V1.1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_1_26561_HANDOFF_HASHES.sha256
          python3 -m py_compile transform_26561_v1_1_sabre_native_super_res_adaptive_color.py validate_26561_v1_1_sabre_native_super_res_adaptive_color.py extract_26561_v1_1_runtime_glsl.py scan_glsl_reserved_identifiers_26561_v1_1.py
          python3 validate_26561_v1_1_sabre_native_super_res_adaptive_color.py --self-test
          python3 extract_26561_v1_1_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26561_v1_1.py --self-test
          bash -n build_26561_v1_1_sabre_native_super_res_adaptive_color.sh
          grep -F 'BASE_SUCCESS_COMMIT="40714fc8077b66b8a9f04adaff6cff212c02f644"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'HANDOFF_PARENT_COMMIT="1dd9907234e82235dc9f418418e36fbad2b97221"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26560-v1-before-26561-sabre-sr-universal-color"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'BASE_RUN_ID="33257466556"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9716289696"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="f9c3329820270c686b401e62752b364b89e04f0d19aabff2e4a3fea810c641a8"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'BASE_TAR_SHA="932dd616e6f1dde527afe9e909783c869e62940572f56eb6a5dba625616fcb22"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726561"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'VERSION_BUILD="26561"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'run_preinstall_vendor_authority_regression' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          grep -F 'install_frozen_candidate_into_live_root "$ROOT" "repository"' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh >/dev/null
          ! grep -F 'repository native/vendor drift before install' build_26561_v1_1_sabre_native_super_res_adaptive_color.sh
          ! grep -F 'V1_1_26561_' .github/workflows/build-26560-v1-sabre-only-spatial-rgb-cleanup.yml

      - name: Build exact 26561 candidate from successful compiled 26560 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26561_v1_1_sabre_native_super_res_adaptive_color.sh
          ./build_26561_v1_1_sabre_native_super_res_adaptive_color.sh

      - name: Upload 26561 V1.1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26561-v1-1-sabre-native-super-res-adaptive-color
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726561-26561-v1-1-sabre-native-super-res-adaptive-color-debug.apk
            build_26561_v1_1_sabre_native_super_res_adaptive_color_outputs/
