name: Build 26496 Corrective HDR Chroma Gainmap

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26494_successful_app_source.tar.gz'
      - '26494_successful_after.sha256'
      - '26496_source_delta_from_exact_26494.patch'
      - 'validate_26496_corrective_hdr_gain.py'
      - 'build_26496_corrective_hdr_chroma_gainmap_v1.sh'
      - '.github/workflows/build-26496-corrective-hdr-chroma-gainmap-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create exact pre-26496 26495 V1.2 backup branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="a57f40de471b3210184483d17c744b24573ef113"
          BACKUP="backup-26495-v1.2-before-26496-corrective-hdr-chroma-gainmap"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          existing="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$EXPECTED" ]] || { echo "::error::backup branch moved: $existing expected=$EXPECTED"; exit 1; }
            echo "PASS: exact pre-26496 backup already exists $BACKUP=$existing"
          else
            git push origin "$EXPECTED:refs/heads/$BACKUP"
            actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$EXPECTED" ]] || { echo "::error::backup branch verification failed"; exit 1; }
            echo "PASS: exact pre-26496 backup created $BACKUP=$actual"
          fi

      - name: Create exact failed 26496 V1 backup before V1.1 fix
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="9ba05fb0e06ce61fb89db3c9c72565e04a4103d0"
          BACKUP="backup-26496-v1-failed-before-v1.1-java-import-fix"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          existing="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then [[ "$existing" == "$EXPECTED" ]] || exit 1; else git push origin "$EXPECTED:refs/heads/$BACKUP"; fi
          actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED" ]] || exit 1
          echo "PASS: failed 26496 V1 backup $BACKUP=$actual"

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26496 package identity and math preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26494_successful_app_source.tar.gz "ee4ccb614d9cb216e2e39a76adc8f72ce9fe2a07daa75eb6f705e958502e010b"
          check_sha 26494_successful_after.sha256 "939a7555adaf1b9859e8fc9e40798b38ac5b85343dfbdb45cfe34a4a88b500c7"
          check_sha 26496_source_delta_from_exact_26494.patch "bcaa3a59c3e700356eed72f27c5cc82714f82c5425eb3661fee88654ab572fdb"
          check_sha validate_26496_corrective_hdr_gain.py "c53477685f6e33b5aca039c1ed819413e782c70213a9440e175ff5ad1ba9e97b"
          check_sha build_26496_corrective_hdr_chroma_gainmap_v1.sh "504cb4999608a16472048f5945db46f78e9e10a4192d44993471c44af2df3126"
          bash -n build_26496_corrective_hdr_chroma_gainmap_v1.sh
          python3 -m py_compile validate_26496_corrective_hdr_gain.py
          python3 validate_26496_corrective_hdr_gain.py
          [[ "$(wc -l < 26494_successful_after.sha256)" -eq 856 ]]
          echo "PASS: 26496 package identity + syntax + math preflight"

      - name: Build guarded 26496 APK
        shell: bash
        run: |
          chmod +x build_26496_corrective_hdr_chroma_gainmap_v1.sh
          ./build_26496_corrective_hdr_chroma_gainmap_v1.sh

      - name: Upload 26496 APK and complete next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26496-corrective-hdr-chroma-gainmap
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726496-26496-corrective-hdr-chroma-gainmap-debug.apk
            build_26496_outputs/**
