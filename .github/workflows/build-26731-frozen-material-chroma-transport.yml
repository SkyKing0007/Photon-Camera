name: Build 26731 Frozen Material Chroma Transport
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26731_README_UPLOAD.txt'
      - '26731_*'
      - 'build_26731_frozen_material_chroma_transport.sh'
      - 'transform_26731.py'
      - 'validate_26731.py'
      - 'verify_26731_*.py'
      - 'handoff_payload_26731/**'
      - '.github/workflows/build-26731-frozen-material-chroma-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26731 handoff and exact successful 26729 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26731_HANDOFF_HASHES.sha256
          python3 -S verify_26731_infrastructure.py build_26731_frozen_material_chroma_transport.sh .github/workflows/build-26731-frozen-material-chroma-transport.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26731 candidate with successful 26729 procedure from successful 26730 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26731_frozen_material_chroma_transport.sh
      - name: Verify exact 26731 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726731-26731-frozen-material-chroma-transport-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726731-26731-frozen-material-chroma-transport-debug.apk' build_26731_frozen_material_chroma_transport_outputs/26731_APK.sha256
      - name: Upload 26731 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26731-frozen-material-chroma-transport
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726731-26731-frozen-material-chroma-transport-debug.apk
            build_26731_frozen_material_chroma_transport_outputs/
