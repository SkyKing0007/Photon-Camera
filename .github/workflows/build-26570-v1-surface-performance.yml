name: Build 26570 V1.2 Surface Continuity + True2X Performance

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26570_*'
      - 'REGRESSION_V1_26570_*'
      - 'build_26570_v1_surface_performance.sh'
      - 'transform_26570_v1.py'
      - 'validate_26570_v1.py'
      - 'verify_26570_v1_authority.py'
      - 'verify_26570_v1_patches.py'
      - 'verify_26570_v1_shaders.py'
      - 'handoff_payload_26570_v1/**'
      - '.github/workflows/build-26570-v1-surface-performance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26570 V1.2 package and mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26570_HANDOFF_HASHES.sha256
          bash -n build_26570_v1_surface_performance.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26570_v1.py',
              'validate_26570_v1.py',
              'verify_26570_v1_authority.py',
              'verify_26570_v1_patches.py',
              'verify_26570_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26570_v1_surface_performance.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="cd57770a427f63a3000a6b7d594fcda425fcd351"' in s
          assert 'HANDOFF_PARENT_COMMIT="1caa0879bebc29802dabfe71b64dcdc73f5e0d1c"' in s
          assert 'BASE_RUN_ID="33410892866"' in s
          assert 'BASE_ARTIFACT_ID="9765167937"' in s
          assert 'BASE_ARTIFACT_SHA="9cefd4d7a8e35c5f1c9f54c5e7e66ab165208edaca8e9f66ad2a7b4c7e528575"' in s
          assert 'BASE_TAR_SHA="5cefcc1b02367bfa2e285ba54c48a62594cf367cda5f41543dfb4a94f9a40c82"' in s
          assert 'VERSION_NAME="0.9726570"' in s and 'VERSION_BUILD="26570"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26569 compiler/build order is inherited.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26570 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          expected='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26569 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          print('PASS sealed Python syntax + exact 26569 authority-seeded verification order inheritance + V1.2 retry parent')
          PY
          grep -F 'IRIS_26570_SURFACE_CONTINUITY_ILLUMINATION_INDEPENDENT' REGRESSION_V1_26570_SURFACE_PERFORMANCE_CONTRACT.txt >/dev/null
          grep -F 'IRIS_26570_TRUE2X_ENCODER_TIMING' REGRESSION_V1_26570_SURFACE_PERFORMANCE_CONTRACT.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26570_CARRIED_FAILURES.txt >/dev/null
          grep -F 'No verification order is weakened' V1_26570_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26570_' .github/workflows --exclude='build-26570-v1-surface-performance.yml'
          ! grep -R -F 'handoff_payload_26570_v1' .github/workflows --exclude='build-26570-v1-surface-performance.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26570 candidate from successful compiled 26569 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26570_v1_surface_performance.sh
          ./build_26570_v1_surface_performance.sh

      - name: Upload 26570 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26570-v1-surface-performance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726570-26570-v1-surface-performance-debug.apk
            build_26570_v1_surface_performance_outputs/
