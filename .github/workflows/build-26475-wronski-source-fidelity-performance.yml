name: Build 26475 Wronski Source Fidelity Performance

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26475_wronski_source_fidelity_performance.sh
      - .github/workflows/build-26475-wronski-source-fidelity-performance.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26475 Wronski source fidelity performance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard 26475 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "e47b4071dc30737abcc0ab21276a10000ac9de4f" || {
            echo "26475 infrastructure commit must be directly based on successful 26474 V3"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26475 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26475 workflow lineage gate PASS"

      - name: Run guarded 26475 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26475_wronski_source_fidelity_performance.sh
          ./build_26475_wronski_source_fidelity_performance.sh

      - name: Upload 26475 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26475-wronski-source-fidelity-performance
          if-no-files-found: error
          path: |
            build_26475_outputs/**
            IrisCamera-0.9726475-26475-wronski-source-fidelity-performance-debug.apk
