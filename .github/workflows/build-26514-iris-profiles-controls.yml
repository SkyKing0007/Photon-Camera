name: Build 26514 Iris Profiles + Native Controls

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26514_iris_profiles_controls.py
      - validate_26514_iris_profiles_controls.py
      - build_26514_iris_profiles_controls.sh
      - 26514_BASE_26513_COMMIT.txt
      - 26514_README_UPLOAD.txt
      - 26514_HANDOFF_HASHES.sha256
      - .github/workflows/build-26514-iris-profiles-controls.yml

permissions:
  contents: read

concurrency:
  group: photon-26514-iris-profiles-controls
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26514 from tested 26513
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26514 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26514_HANDOFF_HASHES.sha256
          bash -n build_26514_iris_profiles_controls.sh
          python3 -m py_compile apply_26514_iris_profiles_controls.py validate_26514_iris_profiles_controls.py
          [[ "$(tr -d '\r\n' < 26514_BASE_26513_COMMIT.txt)" == "3601f39b8e4d7ebd4776edbcae6e56f4514eea54" ]]
          grep -F 'SUCCESSFUL_26513_HEAD="3601f39b8e4d7ebd4776edbcae6e56f4514eea54"' build_26514_iris_profiles_controls.sh >/dev/null
          grep -F 'BACKUP_26513="backup-26513-success-before-26514-20260819"' build_26514_iris_profiles_controls.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726514"' build_26514_iris_profiles_controls.sh >/dev/null
          grep -F 'VERSION_BUILD="26514"' build_26514_iris_profiles_controls.sh >/dev/null
          grep -F '26514_RUNTIME_DELTA_FROM_GOLDEN_26513.patch' build_26514_iris_profiles_controls.sh >/dev/null
          grep -F 'IRIS_26514_STRICT_NOISE_AUTHORITY' apply_26514_iris_profiles_controls.py >/dev/null
          grep -F 'IRIS_26514_PER_LENS_LEGACY_JSON_DEFAULTS' apply_26514_iris_profiles_controls.py >/dev/null
          grep -F 'IRIS_26514_LINEAR_PRESENTATION_CONTROLS' apply_26514_iris_profiles_controls.py >/dev/null
          grep -F 'pinned bjzhou/MGC source, tuning assets and native closure remain byte-identical' validate_26514_iris_profiles_controls.py >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          a=Path('apply_26514_iris_profiles_controls.py').read_text()
          v=Path('validate_26514_iris_profiles_controls.py').read_text()
          b=Path('build_26514_iris_profiles_controls.sh').read_text()
          assert 'lumaStrengthScale = lumaScale' in a and 'chromaStrengthScale = chromaScale' in a
          assert 'frame.motionV2NoiseProfileSource != "CAMERA2_PER_FRAME"' in a
          assert 'RawNoiseProfileSelection.Calibrated(profile)' in a
          assert 'rgb *= exp2(exposureEv);' in a
          assert 'if (irisMotionSettings.hasToneAdjustment())' in a
          assert 'IRIS_26513_RGB_DETAIL_SCALE_MULTIPLIER = 1.10f' in v
          assert 'GATE 4.5: reproduce exact tested 26513' in b
          assert 'GATE 4.6: apply only 26514' in b
          print('PASS: 26514 static handoff/no-regression guards')
          PY

      - name: Build guarded 26514
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26514_iris_profiles_controls.sh apply_26514_iris_profiles_controls.py validate_26514_iris_profiles_controls.py
          ./build_26514_iris_profiles_controls.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26514-iris-profiles-controls
          path: |
            IrisCamera-0.9726514-26514-iris-profiles-controls-debug.apk
            build_26514_iris_profiles_controls_outputs/
          if-no-files-found: warn
