name: Build 26893 Calibrated SDR Foreground and Darken Only Contrast
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26893_RETRY_V2.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay SHA-pinned successful 26892 historical runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26893_replay_exact_26892_workflow.py
          test "$(sha256sum build_26892_iris_rawr.sh | awk '{print $1}')" = '37b12a9cbb5918b49d279d40d51f11fa086a0682dd487f88b6ecc7f17313069d'
          sha256sum -c 26892_GENERATED_BUILD_SHA256.txt
      - name: Derive SHA-sealed 26893 successor guarded runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26893.txt && grep -Fx 'RUN_26893_BACKLIT_FOREGROUND_DARKEN_ONLY_CONTRAST_V1' TRIGGER_26893.txt
          test -f TRIGGER_26893_RETRY_V2.txt && grep -Fx 'RUN_26893_BACKLIT_FOREGROUND_DARKEN_ONLY_CONTRAST_V2' TRIGGER_26893_RETRY_V2.txt
          python3 -S stage_26893_root.py
          sha256sum -c 26893_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26893_build.py verify_26893_candidate.py verify_26893_semantics.py verify_26893_patches.py verify_26893_expanded_glsl.py stage_26893_root.py test_26893_negative_tamper.py test_26893_three_stage_negatives.py test_26893_tone_math.py photon_26893_replay_exact_26892_workflow.py
          python3 -S test_26893_three_stage_negatives.py
          python3 -S test_26893_tone_math.py
          python3 -S generate_26893_build.py .
          cp build_26893_iris_rawr.sh /tmp/26893_first_generation.sh
          python3 -S generate_26893_build.py .
          cmp /tmp/26893_first_generation.sh build_26893_iris_rawr.sh
          sha256sum -c 26893_GENERATED_BUILD_SHA256.txt
          bash -n build_26893_iris_rawr.sh
          python3 -S stage_26893_root.py
          test "$(find handoff_payload_26893 -type f | wc -l)" -eq 4
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited 17-stage 26893 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26893_iris_rawr.sh
      - name: Prove single intended 26893 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726893-26893-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726893-26893-iris-rawr-debug.apk' build_26893_iris_rawr_outputs/26893_APK.sha256
      - name: Seal exact EXECUTED 26893 runner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26893_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26893 --root . --expected-sha256 9a70b375fd5f0a1e5148cef7e4640b4014fe0a24d8e5f38fcada15bbc0713956
          test -f build_26893_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26893_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26893 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26893-sdr-backlit-foreground-contrast-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726893-26893-iris-rawr-debug.apk
            build_26893_iris_rawr_outputs/
