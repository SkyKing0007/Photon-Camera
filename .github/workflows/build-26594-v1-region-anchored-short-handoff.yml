name: Build 26594 V1 Region-Anchored SHORT Handoff

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26594_README_UPLOAD.txt'
      - 'REGRESSION_V1_26594_*'
      - 'V1_26594_*'
      - 'build_26594_v1_region_anchored_short_handoff.sh'
      - 'transform_26594_v1.py'
      - 'validate_26594_v1.py'
      - 'verify_26594_v1_*.py'
      - 'handoff_payload_26594_v1/**'
      - '.github/workflows/build-26594-v1-region-anchored-short-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26594 package and exact successful 26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26594_HANDOFF_HASHES.sha256
          bash -n build_26594_v1_region_anchored_short_handoff.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26594_v1.py','validate_26594_v1.py','verify_26594_v1_authority.py','verify_26594_v1_infrastructure.py','verify_26594_v1_patches.py','verify_26594_v1_regressions.py','verify_26594_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26594 candidate from successful compiled 26593 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26594_v1_region_anchored_short_handoff.sh
      - name: Upload 26594 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26594-v1-region-anchored-short-handoff
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726594-26594-v1-region-anchored-short-handoff-debug.apk
            build_26594_v1_region_anchored_short_handoff_outputs/
