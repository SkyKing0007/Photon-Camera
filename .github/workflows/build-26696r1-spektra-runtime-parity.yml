name: Build 26696 R1 Spektra Runtime Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26696R1_README_UPLOAD.txt'
      - '26696R1_*'
      - 'build_26696r1_spektra_runtime_parity.sh'
      - 'transform_26696r1.py'
      - 'validate_26696r1.py'
      - 'repair_26696r1_*.py'
      - 'handoff_payload_26696r1/**'
      - '.github/workflows/build-26696r1-spektra-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26696 R1 handoff and exact successful 26695 mechanics + compiled 26694 rollback reference
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26696R1_HANDOFF_HASHES.sha256
          bash -n build_26696r1_spektra_runtime_parity.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26696r1.py','validate_26696r1.py','repair_26696r1_authority.py','repair_26696r1_infrastructure.py','repair_26696r1_patches.py','repair_26696r1_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26696 R1 candidate from successful 26695 compiled authority with exact targeted 26694 runtime restore
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26696r1_spektra_runtime_parity.sh
      - name: Verify exact 26696 R1 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726696-26696-spektra-runtime-parity-r1-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726696-26696-spektra-runtime-parity-r1-debug.apk" build_26696r1_spektra_runtime_parity_outputs/26696R1_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26696r1_spektra_runtime_parity_outputs/26696R1_apk_jni_contract.txt
      - name: Upload 26696 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26696-r1-spektra-runtime-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726696-26696-spektra-runtime-parity-r1-debug.apk
            build_26696r1_spektra_runtime_parity_outputs/
