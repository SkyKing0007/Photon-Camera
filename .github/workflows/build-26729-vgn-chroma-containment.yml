name: Build 26729 VGN Chroma Containment
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26729_README_UPLOAD.txt'
      - '26729_*'
      - 'build_26729_vgn_chroma_containment.sh'
      - 'transform_26729.py'
      - 'validate_26729.py'
      - 'verify_26729_*.py'
      - 'handoff_payload_26729/**'
      - '.github/workflows/build-26729-vgn-chroma-containment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26729 handoff and exact successful 26728 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26729_HANDOFF_HASHES.sha256
          python3 -S verify_26729_infrastructure.py build_26729_vgn_chroma_containment.sh .github/workflows/build-26729-vgn-chroma-containment.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26729 candidate with successful 26728 procedure from successful 26728 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26729_vgn_chroma_containment.sh
      - name: Verify exact 26729 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726729-26729-vgn-chroma-containment-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726729-26729-vgn-chroma-containment-debug.apk' build_26729_vgn_chroma_containment_outputs/26729_APK.sha256
      - name: Upload 26729 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26729-vgn-chroma-containment
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726729-26729-vgn-chroma-containment-debug.apk
            build_26729_vgn_chroma_containment_outputs/
