name: Build 26520 ZSL Shared-Batch Stacked DNG
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26520_zsl_stacked_dng.py
      - validate_26520_zsl_stacked_dng.py
      - build_26520_zsl_stacked_dng.sh
      - 26520_BASE_26519_COMMIT.txt
      - 26520_BJZHOU_RELEASE_SPATIAL_REF.txt
      - 26520_README_UPLOAD.txt
      - 26520_HANDOFF_HASHES.sha256
      - .github/workflows/build-26520-zsl-stacked-dng.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26520-zsl-stacked-dng-v1
  cancel-in-progress: false
jobs:
  build:
    name: Direct tested 26519 to shared-batch stacked-DNG 26520
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify 26520 handoff invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26520_HANDOFF_HASHES.sha256
          bash -n build_26520_zsl_stacked_dng.sh
          python3 -m py_compile apply_26520_zsl_stacked_dng.py validate_26520_zsl_stacked_dng.py
          [[ "$(tr -d '\r\n' < 26520_BASE_26519_COMMIT.txt)" == "9b59a27235747733bacdde68bf6a888ebffefa18" ]]
          grep -F 'SUCCESSFUL_26519_HEAD="9b59a27235747733bacdde68bf6a888ebffefa18"' build_26520_zsl_stacked_dng.sh >/dev/null
          grep -F 'BACKUP_26519="backup-26519-before-26520-zsl-stacked-dng"' build_26520_zsl_stacked_dng.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26519-per-lens-viewfinder-response-v2"' build_26520_zsl_stacked_dng.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726520"; VERSION_BUILD="26520"' build_26520_zsl_stacked_dng.sh >/dev/null
          grep -F 'IRIS_26520_FROZEN_METADATA_GRACE' apply_26520_zsl_stacked_dng.py >/dev/null
          grep -F 'IRIS_26520_NORMAL_ONLY_FUSED_BAYER_DNG' apply_26520_zsl_stacked_dng.py >/dev/null
          grep -F 'IRIS_26520_V3_EXACT_26519_ARTIFACT_CALL_DISCOVERY' apply_26520_zsl_stacked_dng.py >/dev/null
          grep -F '26520 GATE 1B: prove complete transform against ACTUAL successful 26519 artifact BEFORE writes' build_26520_zsl_stacked_dng.sh >/dev/null
          grep -F 'repository app/src is not used as 26520 runtime authority' build_26520_zsl_stacked_dng.sh >/dev/null
          echo "PASS: 26520 handoff scope verified"
      - name: Build guarded 26520 from successful 26519 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26520_zsl_stacked_dng.sh apply_26520_zsl_stacked_dng.py validate_26520_zsl_stacked_dng.py
          ./build_26520_zsl_stacked_dng.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26520-zsl-stacked-dng-v1
          path: |
            IrisCamera-0.9726520-26520-zsl-stacked-dng-debug.apk
            build_26520_zsl_stacked_dng_outputs/
          if-no-files-found: warn
