name: Build Motion Color Fix 26163

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-effective-stack
    paths:
      - ".github/workflows/build-motion-color-fix-26163.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: experimental-effective-stack

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply color correction
        shell: bash
        run: |
          set -euo pipefail

          SHADER="app/src/main/assets/shaders/initial.glsl"
          VERSION_FILE="app/version.properties"

          OLD_LINE='pRGB = corr*sensorToIntermediate*(pRGB*neutralPoint);'
          NEW_LINE='pRGB = corr*sensorToIntermediate*pRGB;'

          grep -Fq "$OLD_LINE" "$SHADER"
          sed -i "s|$OLD_LINE|$NEW_LINE|" "$SHADER"

          grep -Fq "$NEW_LINE" "$SHADER"
          ! grep -Fq "$OLD_LINE" "$SHADER"

          grep -q '^VERSION_BUILD=26157$' "$VERSION_FILE"
          sed -i 's/^VERSION_BUILD=26157$/VERSION_BUILD=26163/' "$VERSION_FILE"
          grep -q '^VERSION_BUILD=26163$' "$VERSION_FILE"

          git diff --check
          git diff -- "$SHADER" "$VERSION_FILE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          mkdir -p artifact
          cp "$APK" "artifact/PhotonCamera-0.9726163-motion-color-fix-debug.apk"
          sha256sum "artifact/PhotonCamera-0.9726163-motion-color-fix-debug.apk" > artifact/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCamera-0.9726163-motion-color-fix
          path: artifact
          if-no-files-found: error
          retention-days: 14
