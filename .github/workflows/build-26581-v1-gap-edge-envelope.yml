name: Build 26581 V1 Gap Edge Envelope

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26581_*'
      - 'REGRESSION_V1_26581_*'
      - 'build_26581_v1_gap_edge_envelope.sh'
      - 'transform_26581_v1.py'
      - 'validate_26581_v1.py'
      - 'verify_26581_v1_authority.py'
      - 'verify_26581_v1_regressions.py'
      - 'verify_26581_v1_patches.py'
      - 'verify_26581_v1_shaders.py'
      - 'handoff_payload_26581_v1/**'
      - '.github/workflows/build-26581-v1-gap-edge-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26581 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26581_HANDOFF_HASHES.sha256
          bash -n build_26581_v1_gap_edge_envelope.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26581_v1.py',
              'validate_26581_v1.py',
              'verify_26581_v1_authority.py',
              'verify_26581_v1_regressions.py',
              'verify_26581_v1_patches.py',
              'verify_26581_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26581_v1_gap_edge_envelope.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="a59edaf3cb9f3a476c62e807415bf1c6595aaf84"' in s
          assert 'HANDOFF_PARENT_COMMIT="a59edaf3cb9f3a476c62e807415bf1c6595aaf84"' in s
          assert 'BASE_RUN_ID="33631623625"' in s
          assert 'BASE_JOB_ID="100252212772"' in s
          assert 'BASE_ARTIFACT_ID="9847163972"' in s
          assert 'BASE_ARTIFACT_SHA="90fc486f8510735acd68c01939cf49a4c9ad5e0d88767867770a3cb408b06c26"' in s
          assert 'BASE_TAR_SHA="97b436af3f3e8c23672b5d43461bae62cfda6fa68a5a28e7861f443ea7b458c8"' in s
          assert 'VERSION_NAME="0.9726581"' in s and 'VERSION_BUILD="26581"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26581 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          main='\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n'
          assert main in s
          snap='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert snap in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 3 ]]' in s
          print('PASS sealed Python syntax + exact successful 26580 authority-seeded verification order inheritance')
          PY
          grep -F 'tiny bright sky opening between darker leaves/needles must inherit only supported background sky chroma' REGRESSION_V1_26581_GAP_EDGE_ENVELOPE.txt >/dev/null
          grep -F 'motionv2_jpeg444_jni.cpp must remain byte-identical SHA-256 d73cd24452280958f089e9124545a81461939e8fa0c9c95272b2825942e4b43d' REGRESSION_V1_26581_CARRIED_FAILURES.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26581_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26581_' .github/workflows --exclude='build-26581-v1-gap-edge-envelope.yml'
          ! grep -R -F 'handoff_payload_26581_v1' .github/workflows --exclude='build-26581-v1-gap-edge-envelope.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26581 candidate from successful compiled 26580 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26581_v1_gap_edge_envelope.sh

      - name: Upload 26581 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26581-v1-gap-edge-envelope
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726581-26581-v1-gap-edge-envelope-debug.apk
            build_26581_v1_gap_edge_envelope_outputs/
