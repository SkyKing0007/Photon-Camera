name: Build 26556 V1 Motion30 + Natural1x + Jin Guided

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26556_*'
      - 'build_26556_v1_motion30_natural1x_jin_guided.sh'
      - 'validate_26556_v1_motion30_natural1x_jin_guided.py'
      - '.github/workflows/build-26556-v1-motion30-natural1x-jin-guided.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26556 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26556_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26556_v1_motion30_natural1x_jin_guided.py
          python3 validate_26556_v1_motion30_natural1x_jin_guided.py --self-test
          bash -n build_26556_v1_motion30_natural1x_jin_guided.sh
          grep -F 'BASE_SUCCESS_COMMIT="45baab3044b95be7c60638b5404c53f02966128f"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BASE_RUN_ID="33205216686"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9699482627"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="622a3b163f41ad2f2b95a87955fe2ddad8296504aab15f17efecbd17f7f78220"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BASE_TAR_SHA="7ed49f3cdccb7076b1ca25c480fcc80752f820633b3ba9dd1954d2bb1b63ca98"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="fac620a2decc10bc23d22531236a0eef589d8f9778f6be3bec529c8c48b8339f"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="aa0a28cbe2cb7a71943e35f8ba715190b6011e34e07c74cd08cc6bd034ccd500"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726556"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'VERSION_BUILD="26556"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26555-v1-before-26556-frames-zoom-jin-guidance"' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26556_v1_motion30_natural1x_jin_guided.sh >/dev/null
          # Trigger isolation against the immediately preceding successful workflow.
          ! grep -F 'V1_26556_' .github/workflows/build-26555-v1-jin-reference-preview-recovery.yml

      - name: Build exact 26556 candidate from successful compiled 26555 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26556_v1_motion30_natural1x_jin_guided.sh
          ./build_26556_v1_motion30_natural1x_jin_guided.sh

      - name: Upload 26556 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26556-v1-motion30-natural1x-jin-guided
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726556-26556-v1-motion30-natural1x-jin-guided-debug.apk
            build_26556_v1_motion30_natural1x_jin_guided_outputs/
