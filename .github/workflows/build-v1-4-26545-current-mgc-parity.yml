name: Build 26545 V1.4 Current MGC Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-v1-4-26545-current-mgc-parity.yml'
      - 'build_v1_4_26545_current_mgc_parity.sh'
      - 'validate_v1_4_26545_current_mgc_parity.py'
      - 'preflight_v1_4_26545_glsl.py'
      - 'V1_4_26545_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-v1-4-26545-current-mgc-parity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26545 V1.4 package before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_4_26545_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_v1_4_26545_current_mgc_parity.py preflight_v1_4_26545_glsl.py
          python3 validate_v1_4_26545_current_mgc_parity.py --self-test
          python3 preflight_v1_4_26545_glsl.py --self-test
          bash -n build_v1_4_26545_current_mgc_parity.sh
          B=build_v1_4_26545_current_mgc_parity.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'REPO_BASE_HEAD="256e3ce20ca4e65be7a5243f6b52d25edb44a9cb"' "$B" >/dev/null
          grep -F 'RUNTIME_BASE_HEAD="801e16582656dc6f672d1a292f8375b1046d0fbf"' "$B" >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26545-v1-3-failed-before-v1-4-compiler-fix"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="33006824714"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9621002273"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="eb924aa95cb790b4c801bf7afa4eeb092b02faf468b990197c53e602f7262bd4"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="230627af3b0c12bf297eaae7e9b7efac7e1972d6b9fbefecb3b89e6dd1df69bb"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="a923dc9730a7402702cfd7feeb9e6d5d28dd95743e76ee08e96bcbbc2da93da1"' "$B" >/dev/null
          grep -F 'CAND_MANIFEST_SHA="cf50d39250c22875d489f8432c4a10be72085e250d63866c91a763482a46df02"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726545"' "$B" >/dev/null
          grep -F 'VERSION_BUILD="26545"' "$B" >/dev/null
          grep -F 'REVISION="V1.4"' "$B" >/dev/null
          grep -F 'MGC_SOURCE_HEAD="8e37909035b51b82ab54941dba390427478899b7"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F '18 V1.4 active/changed shaders' "$B" >/dev/null
          grep -F 'bentoFlowTexture = flow.texture' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'private val sabreMergeGradientThreshold: Float? = null' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'mergeGradientThreshold = sabreMergeGradientThreshold' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          ! grep -F 'mergeGradientThreshold = coreImagingTuning.fusion.mergeGradientThreshold' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'outputPixel * 4 + ivec2(2)' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'vec2 warpedUv = mirrorUv(uv + flow.xy)' V1_4_26545_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          # V1.4 root names intentionally do not match the obsolete V1.2 workflow's 26545_* path glob.
          ! find . -maxdepth 1 -type f -name '26545_V1_4_*' -print -quit | grep . >/dev/null
          echo 'PASS: 26545 V1.4 package pins failed-V1.3 checkpoint + exact successful V1.2 runtime authority + compiler corrections + all real compiler/patch/invariance gates'

      - name: Guarded 26545 V1.4 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_v1_4_26545_current_mgc_parity.sh
          ./build_v1_4_26545_current_mgc_parity.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26545-v1-4-current-mgc-parity
          path: |
            IrisCamera-0.9726545-26545-v1-4-current-mgc-parity-debug.apk
            build_v1_4_26545_current_mgc_parity_outputs/
          if-no-files-found: warn
