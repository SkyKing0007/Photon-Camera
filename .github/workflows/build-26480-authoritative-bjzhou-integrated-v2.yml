name: Build 26480 Bjzhou Integrated Motion V2

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26480_authoritative_bjzhou_integrated_v2.sh
      - transform_26480_bjzhou_integrated_v2.py
      - transform_26480_bjzhou_integrated_v2_post.py
      - transform_26480_precursor_v1.py
      - 26479_successful_source.patch
      - 26479_successful_after.sha256
      - .github/workflows/build-26480-authoritative-bjzhou-integrated-v2.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded 26480 integrated V2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v glslangValidator >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq glslang-tools
          fi
          glslangValidator --version

      - name: Run single guarded 26480 build operation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26480_authoritative_bjzhou_integrated_v2.sh
          ./build_26480_authoritative_bjzhou_integrated_v2.sh

      - name: Upload 26480 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26480-bjzhou-integrated-v2
          if-no-files-found: warn
          path: |
            build_26480_outputs/**
            IrisCamera-0.9726480-26480-bjzhou-integrated-motion-v2-debug.apk
