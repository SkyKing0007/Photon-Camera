name: Build 26687 R1 Spektra Isolated Mode Owner

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26687_R1_README_UPLOAD.txt'
      - 'R1_26687_*'
      - 'build_26687_r1_spektra_isolated_mode_owner.sh'
      - 'transform_26687.py'
      - 'validate_26687.py'
      - 'verify_26687_*.py'
      - 'handoff_payload_26687/**'
      - '.github/workflows/build-26687-r1-spektra-isolated-mode-owner.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26687 handoff and exact successful 26686 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26687_HANDOFF_HASHES.sha256
          bash -n build_26687_r1_spektra_isolated_mode_owner.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26687.py','validate_26687.py','verify_26687_authority.py','verify_26687_infrastructure.py','verify_26687_patches.py','verify_26687_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26687 candidate from successful 26686 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26687_r1_spektra_isolated_mode_owner.sh
      - name: Verify exact 26687 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726687-26687-r1-spektra-isolated-mode-owner-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726687-26687-r1-spektra-isolated-mode-owner-debug.apk" build_26687_r1_spektra_isolated_mode_owner_outputs/26687_R1_APK.sha256
      - name: Upload 26687 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26687-r1-spektra-isolated-mode-owner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726687-26687-r1-spektra-isolated-mode-owner-debug.apk
            build_26687_r1_spektra_isolated_mode_owner_outputs/
