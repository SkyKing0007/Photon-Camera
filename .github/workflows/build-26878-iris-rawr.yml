name: Build 26878 B Super Res and Spektra Full-Active Preview
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26878.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact successful 26877 mechanics and generate guarded 26878 build
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26878.txt
          grep -Fx 'RUN_26878_B_SR_GUIDE_SPEKTRA_FULL_ACTIVE_V1' TRIGGER_26878.txt
          # IRIS_26878_ROOT_ONLY_HISTORY_PIN: one exact file-domain transfer;
          # never write app/src or replace a compiled-candidate source directly.
          python3 -S stage_26878_root.py
          sha256sum -c 26878_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py generate_26872_build.py generate_26873_build.py generate_26874_build.py generate_26875_build.py generate_26876_build.py generate_26877_build.py generate_26878_build.py verify_26878_candidate.py verify_26878_patches.py verify_26876_expanded_shaders.py regressions/26877_runtime_ownership_spektra.py regressions/26878_runtime_ownership_spektra.py stage_26878_root.py
          python3 -S generate_26871_build.py .
          test "$(sha256sum build_26871_iris_rawr.sh | awk '{print $1}')" = 'ca2d99d38c1de9a310205ba2c2af0fd7b49399f506e39a24fa94a6f15a338e0e'
          python3 -S generate_26872_build.py .
          test "$(sha256sum build_26872_iris_rawr.sh | awk '{print $1}')" = '042f4550b60ba7efb8e363230a76931969e98c2ffacda3fa310895e98f40b7db'
          python3 -S generate_26873_build.py .
          test "$(sha256sum build_26873_iris_rawr.sh | awk '{print $1}')" = '121323a5eba3dca75ffb6f05089f73b180a6e692015895237cd780babb92aaa4'
          python3 -S generate_26874_build.py .
          test "$(sha256sum build_26874_iris_rawr.sh | awk '{print $1}')" = '3b48818fd6cd6376f97cecca5a34b85ce4788e10a37435e3273beb2eddf3282a'
          python3 -S generate_26875_build.py .
          test "$(sha256sum build_26875_iris_rawr.sh | awk '{print $1}')" = 'b6c6f1db9f9910a0bff2175af756e3e92896d33eb6a82776de746eda645fa7a1'
          python3 -S generate_26876_build.py .
          test "$(sha256sum build_26876_iris_rawr.sh | awk '{print $1}')" = '525ce763e63ae2b8aa0a9a27d1da810e8969d855ea930552e45976d741c3b912'
          python3 -S generate_26877_build.py .
          test "$(sha256sum build_26877_iris_rawr.sh | awk '{print $1}')" = 'bbda162004a0aa4b262a3df3547c47601df5ccb93cfb966a2dbd0a78a09e7dff'
          python3 -S generate_26878_build.py .
          sha256sum -c 26878_GENERATED_BUILD_SHA256.txt
          bash -n build_26878_iris_rawr.sh
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26878_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26878_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact inherited GLSL cleanup guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26878 B and Spektra build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26878_iris_rawr.sh
      - name: Verify exactly one intended 26878 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726878-26878-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726878-26878-iris-rawr-debug.apk' build_26878_iris_rawr_outputs/26878_APK.sha256
      - name: Upload authoritative 26878 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26878-b-sr-guide-spektra-full-active
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726878-26878-iris-rawr-debug.apk
            build_26878_iris_rawr_outputs/
