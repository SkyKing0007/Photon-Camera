name: Build 26666 R1 High DR Body SNR

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26666_R1_README_UPLOAD.txt'
      - 'R1_26666_*'
      - 'build_26666_r1_high_dr_body_snr.sh'
      - 'transform_26666.py'
      - 'validate_26666.py'
      - 'verify_26666_*.py'
      - 'handoff_payload_26666/**'
      - '.github/workflows/build-26666-r1-high-dr-body-snr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26666 handoff and exact successful 26665 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26666_HANDOFF_HASHES.sha256
          bash -n build_26666_r1_high_dr_body_snr.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26666.py','validate_26666.py','verify_26666_authority.py','verify_26666_infrastructure.py','verify_26666_patches.py','verify_26666_regressions.py','verify_26666_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26666 candidate from successful 26665 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26666_r1_high_dr_body_snr.sh
      - name: Verify exact 26666 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726666-26666-r1-high-dr-body-snr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726666-26666-r1-high-dr-body-snr-debug.apk" build_26666_r1_high_dr_body_snr_outputs/26666_R1_APK.sha256
      - name: Upload 26666 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26666-r1-high-dr-body-snr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726666-26666-r1-high-dr-body-snr-debug.apk
            build_26666_r1_high_dr_body_snr_outputs/
