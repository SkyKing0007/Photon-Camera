name: Build 26494 HDR Phase Validity UHDR Footprint AA

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26492_successful_app_source.tar.gz'
      - '26492_successful_after.sha256'
      - 'transform_26494_hdr_phase_validity_uhdr_aa_v1.py'
      - 'build_26494_hdr_phase_validity_uhdr_aa_v1.sh'
      - '.github/workflows/build-26494-hdr-phase-validity-uhdr-aa-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create exact pre-26494 tested V5B backup branch
        shell: bash
        run: |
          set -euo pipefail
          V5B="a424653a42923b02bd3a9f303da05d7a7e43409c"
          BACKUP="backup-26492-v5b-before-26494-hdr-phase-validity-uhdr-aa"
          REJECTED_26493="4aedd435f72f68b268cbbbe65470260827a9f7f5"
          git cat-file -e "$V5B^{commit}"
          git cat-file -e "$REJECTED_26493^{commit}"
          git merge-base --is-ancestor "$REJECTED_26493" HEAD
          existing="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$V5B" ]] || { echo "::error::backup branch moved: $existing expected $V5B"; exit 1; }
            echo "PASS: exact pre-26494 V5B backup already exists $BACKUP=$existing"
          else
            git push origin "$V5B:refs/heads/$BACKUP"
            actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$V5B" ]] || { echo "::error::backup branch verification failed"; exit 1; }
            echo "PASS: exact pre-26494 V5B backup created $BACKUP=$actual"
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26494 package identity and canonical baseline preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26492_successful_app_source.tar.gz "4636f22d1ea417b9b3c5380025abc502971c3f334c78b3f7c199570ad72d98a9"
          check_sha 26492_successful_after.sha256 "dc19b4eba0fbeab493476383f5b148d9258103ab7d9e3d71e4e9e2915d149bef"
          check_sha transform_26494_hdr_phase_validity_uhdr_aa_v1.py "f3848c111943624a4699c077083f31b3c8190f22a370f61d383549dc1eb39773"
          check_sha build_26494_hdr_phase_validity_uhdr_aa_v1.sh "36ad471b86a570d6446d43c3e97d678082760414d919326fc5a1be900aa03a70"
          bash -n build_26494_hdr_phase_validity_uhdr_aa_v1.sh
          python3 -m py_compile transform_26494_hdr_phase_validity_uhdr_aa_v1.py
          python3 transform_26494_hdr_phase_validity_uhdr_aa_v1.py --self-test
          python3 - <<'PY_BUNDLE'
          import tarfile
          with tarfile.open('26492_successful_app_source.tar.gz','r:gz') as tf:
              files=[m.name for m in tf.getmembers() if m.isfile() and (m.name.startswith('app/src/main/') or m.name=='app/version.properties')]
          if len(files)!=856:
              raise SystemExit(f'V5B canonical bundle file count={len(files)} expected=856')
          print('PASS: V5B complete canonical bundle carries all 856 files')
          PY_BUNDLE

      - name: Build guarded 26494 APK
        shell: bash
        run: |
          chmod +x build_26494_hdr_phase_validity_uhdr_aa_v1.sh
          ./build_26494_hdr_phase_validity_uhdr_aa_v1.sh

      - name: Upload 26494 APK and complete next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26494-hdr-phase-validity-uhdr-footprint-aa
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726494-26494-hdr-phase-validity-uhdr-footprint-aa-debug.apk
            build_26494_outputs/**
