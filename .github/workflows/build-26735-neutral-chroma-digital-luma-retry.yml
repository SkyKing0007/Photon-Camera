name: Build 26735 Neutral Chroma Digital Luma Retry
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26735_README_UPLOAD.txt'
      - '26735_*'
      - 'build_26735_neutral_chroma_digital_luma_retry.sh'
      - 'transform_26735.py'
      - 'validate_26735.py'
      - 'verify_26735_*.py'
      - 'handoff_payload_26735/**'
      - '.github/workflows/build-26735-neutral-chroma-digital-luma-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26735 handoff and exact successful 26734 R1 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26735_HANDOFF_HASHES.sha256
          python3 -S verify_26735_infrastructure.py build_26735_neutral_chroma_digital_luma_retry.sh .github/workflows/build-26735-neutral-chroma-digital-luma-retry.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26735 candidate with successful 26734 R1 procedure from successful 26734 R1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26735_neutral_chroma_digital_luma_retry.sh
      - name: Verify exact 26735 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726735-26735-neutral-chroma-digital-luma-retry-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726735-26735-neutral-chroma-digital-luma-retry-debug.apk' build_26735_neutral_chroma_digital_luma_retry_outputs/26735_APK.sha256
      - name: Upload 26735 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26735-neutral-chroma-digital-luma-retry
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726735-26735-neutral-chroma-digital-luma-retry-debug.apk
            build_26735_neutral_chroma_digital_luma_retry_outputs/
