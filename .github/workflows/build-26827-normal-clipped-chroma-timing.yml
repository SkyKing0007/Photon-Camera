name: Build 26827 Normal Clipped Chroma Timing
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26827.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26827 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26827.txt
          grep -Fx 'RUN_26827_NORMAL_CLIPPED_CHROMA_TIMING' TRIGGER_26827.txt
          sha256sum -c 26827_HANDOFF_HASHES.sha256
          bash -n build_26827_normal_clipped_chroma_timing.sh
          python3 -S -m py_compile transform_26827.py validate_26827.py verify_26827_patches.py verify_26827_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26827_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26827_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26827 candidate from successful 26826 authority using exact successful 26826 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26827_normal_clipped_chroma_timing.sh
      - name: Verify exact 26827 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726827-26827-normal-clipped-chroma-timing-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726827-26827-normal-clipped-chroma-timing-debug.apk' build_26827_normal_clipped_chroma_timing_outputs/26827_APK.sha256
      - name: Upload 26827 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26827-normal-clipped-chroma-timing
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726827-26827-normal-clipped-chroma-timing-debug.apk
            build_26827_normal_clipped_chroma_timing_outputs/
