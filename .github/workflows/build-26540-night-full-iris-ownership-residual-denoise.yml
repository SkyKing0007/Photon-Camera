name: Build 26540 V1.1 Compile Correction
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26540_night_full_iris_ownership_residual_denoise.py
      - validate_26540_night_full_iris_ownership_residual_denoise.py
      - preflight_26540_changed_syntax.py
      - preflight_26540_v11_java_compile_contracts.py
      - build_26540_night_full_iris_ownership_residual_denoise.sh
      - 26540_HANDOFF_HASHES.sha256
      - 26540_BASE_26539_CANDIDATE_SOURCE.sha256
      - 26540_BASE_26539_CANDIDATE_SOURCE_FILE.sha256
      - 26540_BASE_26539_HANDOFF_HEAD.txt
      - 26540_PROTECTED_26539_RUNTIME_ANCHORS.sha256
      - 26540_RUNTIME_FILES.txt
      - 26540_RUNTIME_SHA256.json
      - 26540_RUNTIME_PAYLOAD.tar.gz
      - 26540_RUNTIME_PAYLOAD.tar.gz.sha256
      - 26540_RUNTIME_DELTA_FROM_26539.patch
      - 26540_RUNTIME_DELTA_FROM_26539.patch.sha256
      - 26540_RUNTIME_ROLLBACK_TO_26539.patch
      - 26540_RUNTIME_ROLLBACK_TO_26539.patch.sha256
      - 26540_UPLOAD_INSTRUCTIONS.md
      - 26540_LOCAL_VALIDATION.txt
      - 26540_V11_COMPILE_CORRECTION_SCOPE.txt
      - .github/workflows/build-26540-night-full-iris-ownership-residual-denoise.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26540-v1-1-compile-correction
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26540 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26540_HANDOFF_HASHES.sha256
          sha256sum -c 26540_BASE_26539_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26540_RUNTIME_PAYLOAD.tar.gz.sha256
          sha256sum -c 26540_RUNTIME_DELTA_FROM_26539.patch.sha256
          sha256sum -c 26540_RUNTIME_ROLLBACK_TO_26539.patch.sha256
          python3 -m py_compile apply_26540_night_full_iris_ownership_residual_denoise.py validate_26540_night_full_iris_ownership_residual_denoise.py preflight_26540_changed_syntax.py preflight_26540_v11_java_compile_contracts.py
          python3 apply_26540_night_full_iris_ownership_residual_denoise.py --self-test
          python3 validate_26540_night_full_iris_ownership_residual_denoise.py --self-test
          python3 preflight_26540_changed_syntax.py --self-test
          python3 preflight_26540_v11_java_compile_contracts.py --self-test
          bash -n build_26540_night_full_iris_ownership_residual_denoise.sh
          B=build_26540_night_full_iris_ownership_residual_denoise.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26539_HANDOFF_HEAD="21a485d4e7ed11b223d94b34e412635f55e2fd90"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26539-v1-1-night-owned-lifecycle-publication-pecan"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9563581076"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="194ef922a587d81b8894a127966c7d59dd180093c50e1d44cdeb37e722426b14"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="10b9c5f491652aae56449883004439f6d259b2a0ca53eb25eb36c091986a76cd"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=965' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=967' "$B" >/dev/null
          grep -F 'runtime file inventory is not exactly eighteen' "$B" >/dev/null
          grep -F 'JAVA_CONTRACT="$ROOT/preflight_26540_v11_java_compile_contracts.py"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726540"; VERSION_BUILD="26540"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F 'python3 "$JAVA_CONTRACT" --root "$AFTER"' "$B" >/dev/null
          grep -F 'python3 "$JAVA_CONTRACT" --root "$ROOT"' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'NIGHT_CAPTURE_OWNER=IRIS_NIGHT_BATCH' "$B" >/dev/null
          grep -F 'NIGHT_STATIC_IMAGE_BUFFER=false' "$B" >/dev/null
          grep -F 'NIGHT_DEFAULT_SAVER=false' "$B" >/dev/null
          grep -F 'NIGHT_HDRX_RUN=false' "$B" >/dev/null
          grep -F 'NIGHT_CAMERA2_AUTOFIX_APPLYRES=false' "$B" >/dev/null
          grep -F 'NIGHT_FILL_DYNAMIC_PARAMETERS=false' "$B" >/dev/null
          grep -F 'NIGHT_PHOTON_NOISE_MODELER=false' "$B" >/dev/null
          grep -F 'NIGHT_LIVE_TUNABLE_INJECTION=false' "$B" >/dev/null
          grep -F 'PECAN_PROFILE_SNR=PREMERGE_REFERENCE_SOURCE_SNR' "$B" >/dev/null
          grep -F 'DENOISE_MAGNITUDE=PROPAGATED_POSTSTACK_READ_SHOT_CORRELATION_STRENGTH' "$B" >/dev/null
          grep -F 'AUTO_LOW_LIGHT_LUMA_FLOOR=false' "$B" >/dev/null
          grep -F 'ISO_DENOISE_STRENGTH_AUTHORITY=false' "$B" >/dev/null
          grep -F 'SCENE_DARKNESS_DENOISE_STRENGTH_AUTHORITY=false' "$B" >/dev/null
          grep -F 'PHOTON_NIGHT_FALLBACK=false' "$B" >/dev/null
          grep -F 'SINGLE_FRAME_FALLBACK=false' "$B" >/dev/null
          python3 - "$B" <<'PY'
          from pathlib import Path
          s=Path(__import__('sys').argv[1]).read_text().splitlines()
          bad=[x for x in s if 'git branch ' in x and 'git branch --show-current' not in x]
          assert not bad,bad
          print('PASS: no backup/local branch creation in 26540 build script')
          PY
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: 26540 V1.1 handoff mirrors successful 26539 V1.1 strict procedure + failed-V1 Java compile regression guards'
      - name: Guarded 26540 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26540_night_full_iris_ownership_residual_denoise.sh
          ./build_26540_night_full_iris_ownership_residual_denoise.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26540-v1-1-night-full-iris-ownership-residual-denoise
          path: |
            IrisCamera-0.9726540-26540-night-full-iris-ownership-residual-denoise-debug.apk
            build_26540_night_full_iris_ownership_residual_denoise_outputs/
          if-no-files-found: warn
