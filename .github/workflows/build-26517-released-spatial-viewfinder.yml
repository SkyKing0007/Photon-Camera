name: Build 26517 v1 Released-1.27.1 Spatial + Viewfinder

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26517_released_spatial_viewfinder.py
      - validate_26517_released_spatial_viewfinder.py
      - build_26517_released_spatial_viewfinder.sh
      - 26517_BASE_26516_COMMIT.txt
      - 26517_BJZHOU_RELEASE_SPATIAL_REF.txt
      - 26517_README_UPLOAD.txt
      - 26517_HANDOFF_HASHES.sha256
      - .github/workflows/build-26517-released-spatial-viewfinder.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26517-released-spatial-viewfinder-v1
  cancel-in-progress: false

jobs:
  build:
    name: Direct tested 26516 to released Spatial 26517
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify direct-26516 released-Spatial handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26517_HANDOFF_HASHES.sha256
          bash -n build_26517_released_spatial_viewfinder.sh
          python3 -m py_compile apply_26517_released_spatial_viewfinder.py validate_26517_released_spatial_viewfinder.py
          [[ "$(tr -d '\r\n' < 26517_BASE_26516_COMMIT.txt)" == "ba6d23006dfb8aceb366e3f2bac72676b398afda" ]]
          grep -F 'SUCCESSFUL_26516_V4_HEAD="ba6d23006dfb8aceb366e3f2bac72676b398afda"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'BACKUP_26516="backup-26516-before-26517-released-spatial"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26516-profile-viewfinder-match.yml"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26516-profile-viewfinder-match-v4"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'gh run download' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_SPATIAL_HEAD="c4ff5a3e99b5f9f6027ba1c038eb7cc850bb9b01"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_STACKER_BLOB="24613918b7d830f19b573346ab02c9684e92eb6f"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_SHADERS_BLOB="2d6aea082730d2f6d10f5c6e0930d6e2199006cc"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_DIAGNOSTIC_GEOMETRY_BLOB="100420a4c0b0ea50e3c187889d1583fb50979480"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_RGB_TILE_PLANNER_BLOB="5251813e721c1a81e9bde462296e26ae4cca24b2"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_OUTPUT_EXPOSURE_BLOB="8d2bccc7816e1fa5873aa0ba0f390d477dcb15d5"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'RELEASE_STRENGTH_GENERATOR_BLOB="ecd98a1cdefe2abc61fd5edc4209c07c295fef42"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726517"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'VERSION_BUILD="26517"' build_26517_released_spatial_viewfinder.sh >/dev/null
          grep -F 'IRIS_26517_RELEASED_1271_SPATIAL_RGB_OWNER' apply_26517_released_spatial_viewfinder.py >/dev/null
          grep -F 'IRIS_26517_SYMMETRIC_VIEWFINDER_PRESENTATION_SOLVER' apply_26517_released_spatial_viewfinder.py >/dev/null
          grep -F 'IRIS_26516_VIEWFINDER_PRESENTATION_AUTHORITY' build_26517_released_spatial_viewfinder.sh >/dev/null
          ! grep -F '26516 bridge V4 owner missing' build_26517_released_spatial_viewfinder.sh >/dev/null
          ! grep -F 'IRIS_26517_HIGHLIGHT_OPPONENT_SUPPORT_CONFIDENCE' apply_26517_released_spatial_viewfinder.py >/dev/null
          ! grep -F 'presentation_exposure_26517' apply_26517_released_spatial_viewfinder.py >/dev/null
          echo 'PASS: 26517 handoff preserves successful 26516 artifact procedure and contains no withdrawn chroma/tone patch'
      - name: Build guarded 26517 from successful 26516 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26517_released_spatial_viewfinder.sh apply_26517_released_spatial_viewfinder.py validate_26517_released_spatial_viewfinder.py
          ./build_26517_released_spatial_viewfinder.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26517-released-spatial-viewfinder-v1
          path: |
            IrisCamera-0.9726517-26517-released-spatial-viewfinder-debug.apk
            build_26517_released_spatial_viewfinder_outputs/
          if-no-files-found: warn
