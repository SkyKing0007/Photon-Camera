name: Build 26831 Phase Valid Thin Neutral
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26831.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26831 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26831.txt
          grep -Fx 'RUN_26831_PHASE_VALID_THIN_NEUTRAL' TRIGGER_26831.txt
          sha256sum -c 26831_HANDOFF_HASHES.sha256
          bash -n build_26831_phase_valid_thin_neutral.sh
          python3 -S -m py_compile transform_26831.py validate_26831.py verify_26831_patches.py verify_26831_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26831_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26831_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26831 candidate from successful 26830 authority using exact successful 26830 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26831_phase_valid_thin_neutral.sh
      - name: Verify exact 26831 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726831-26831-phase-valid-thin-neutral-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726831-26831-phase-valid-thin-neutral-debug.apk' build_26831_phase_valid_thin_neutral_outputs/26831_APK.sha256
      - name: Upload 26831 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26831-phase-valid-thin-neutral
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726831-26831-phase-valid-thin-neutral-debug.apk
            build_26831_phase_valid_thin_neutral_outputs/
