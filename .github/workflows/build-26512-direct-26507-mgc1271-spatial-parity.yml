name: Build 26512 Direct 26507 MGC1271 Spatial Parity

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 26507_successful_app_source.tar.gz
      - 26507_SUCCESSFUL_SOURCE.sha256
      - 26507_SUCCESSFUL_SOURCE_ARCHIVE.sha256
      - 26507_BJZHOU_NATIVE_DEPENDENCIES.sha256
      - 26507_BJZHOU_DEPENDENCY_COMMIT.txt
      - 26512_EXACT_ADAPTER_DELTA_FROM_SUCCESSFUL_26507.patch
      - 26512_EXACT_ADAPTER_DELTA_FROM_SUCCESSFUL_26507.patch.sha256
      - 26512_RESTORE_TO_SUCCESSFUL_26507.patch
      - 26512_RESTORE_TO_SUCCESSFUL_26507.patch.sha256
      - import_bjzhou_1271_spatial_parity.py
      - validate_26512_mgc1271_spatial_parity.py
      - preflight_mgc1271_embedded_shaders.py
      - build_26512_direct_26507_mgc1271_spatial_parity.sh
      - 26512_README_UPLOAD.txt
      - 26512_HANDOFF_HASHES.sha256
      - .github/workflows/build-26512-direct-26507-mgc1271-spatial-parity.yml

permissions:
  contents: read

concurrency:
  group: photon-26512-direct-26507-mgc1271-spatial-parity
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26512 exact bjzhou 1.27.1 Spatial owner on 26507
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26512 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26512_HANDOFF_HASHES.sha256
          bash -n build_26512_direct_26507_mgc1271_spatial_parity.sh
          python3 -m py_compile import_bjzhou_1271_spatial_parity.py validate_26512_mgc1271_spatial_parity.py preflight_mgc1271_embedded_shaders.py
          grep -F 'SOURCE_TAR_SHA="3165a63224fc99652504113c312827b4af823eb643567f3678bfd938ad2c0082"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26511-rejected-before-26512-20260819"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'REJECTED_26511_HEAD="9d4fecd69a0b3549f3599f2efb07ad2c8fd740fe"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'BJZHOU_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726512"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'VERSION_BUILD="26512"' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26512_direct_26507_mgc1271_spatial_parity.sh >/dev/null
          grep -F 'IRIS_26512_MGC1271_SPATIAL_RGB_PARITY_OWNER' 26512_EXACT_ADAPTER_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26512_MGC1271_IMMUTABLE_RAW_PLANE_CONTRACT' 26512_EXACT_ADAPTER_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          grep -F 'IRIS_26512_MGC1271_SPATIAL_NATIVE_PARITY_OWNER' 26512_EXACT_ADAPTER_DELTA_FROM_SUCCESSFUL_26507.patch >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build_26512_direct_26507_mgc1271_spatial_parity.sh').read_text()
          assert '26507_successful_app_source.tar.gz' in s
          assert 'patch -s -d "$AFTER" -p1 < "$DELTA_PATCH"' in s
          assert 'GlesMgcRawFusion' in Path('validate_26512_mgc1271_spatial_parity.py').read_text()
          for bad in ['apply_26502','apply_26503','apply_26504','apply_26505','apply_26506','apply_26507','apply_26508','apply_26509','apply_26510','apply_26511']:
              assert bad not in s,bad
          print('PASS: 26512 is direct successful-26507 + frozen adapter + pinned upstream 1.27.1 import')
          PY
          echo "PASS: 26512 handoff static guards"

      - name: Build guarded 26512 directly from successful 26507 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26512_direct_26507_mgc1271_spatial_parity.sh import_bjzhou_1271_spatial_parity.py validate_26512_mgc1271_spatial_parity.py preflight_mgc1271_embedded_shaders.py
          ./build_26512_direct_26507_mgc1271_spatial_parity.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26512-direct-26507-mgc1271-spatial-parity
          path: |
            IrisCamera-0.9726512-26512-mgc1271-spatial-parity-debug.apk
            build_26512_direct_26507_mgc1271_spatial_parity_outputs/
          if-no-files-found: warn
