name: Build 26894 Spatial Noise-Safe Foreground and Darken-Only Contrast
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26894_RETRY_V2.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay SHA-pinned successful 26893 historical runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26893_replay_exact_26892_workflow.py
          python3 -S generate_26893_build.py .
          test "$(sha256sum build_26893_iris_rawr.sh | awk '{print $1}')" = '9a70b375fd5f0a1e5148cef7e4640b4014fe0a24d8e5f38fcada15bbc0713956'
          sha256sum -c 26893_GENERATED_BUILD_SHA256.txt
      - name: Derive SHA-sealed 26894 successor guarded runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26894.txt && grep -Fx 'RUN_26894_SPATIAL_FOREGROUND_NOISE_SAFE_FLAT_CONTRAST_V1' TRIGGER_26894.txt
          test -f TRIGGER_26894_RETRY_V2.txt && grep -Fx 'RUN_26894_SPATIAL_FOREGROUND_NOISE_SAFE_FLAT_CONTRAST_V2' TRIGGER_26894_RETRY_V2.txt
          python3 -S stage_26894_root.py
          sha256sum -c 26894_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26894_build.py verify_26894.py stage_26894_root.py test_26894_three_stage_negatives.py
          python3 -S test_26894_three_stage_negatives.py
          python3 -S verify_26894.py tone
          python3 -S generate_26894_build.py .
          cp build_26894_iris_rawr.sh /tmp/26894_first_generation.sh
          python3 -S generate_26894_build.py .
          cmp /tmp/26894_first_generation.sh build_26894_iris_rawr.sh
          sha256sum -c 26894_GENERATED_BUILD_SHA256.txt
          bash -n build_26894_iris_rawr.sh
          python3 -S test_26894_three_stage_negatives.py --runner
          python3 -S stage_26894_root.py
          test "$(find handoff_payload_26894 -type f | wc -l)" -eq 5
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited 17-stage 26894 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26894_iris_rawr.sh
      - name: Prove single intended 26894 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726894-26894-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726894-26894-iris-rawr-debug.apk' build_26894_iris_rawr_outputs/26894_APK.sha256
      - name: Seal exact EXECUTED 26894 runner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26894_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26894 --root . --expected-sha256 1f9dcc045b6ca5fa8928443dcc28b98907b7fad152546d802445b74207244be6
          test -f build_26894_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26894_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26894 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26894-spatial-noise-safe-sdr-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726894-26894-iris-rawr-debug.apk
            build_26894_iris_rawr_outputs/
