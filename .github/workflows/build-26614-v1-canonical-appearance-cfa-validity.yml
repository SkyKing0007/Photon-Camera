name: Build 26614 V1 Canonical SDR/UHDR Appearance + CFA Color Validity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26614_V1_README_UPLOAD.txt'
      - 'REGRESSION_V1_26614_*'
      - 'V1_26614_*'
      - 'build_26614_v1_canonical_appearance_cfa_validity.sh'
      - 'transform_26614_v1.py'
      - 'validate_26614_v1.py'
      - 'verify_26614_v1_*.py'
      - 'handoff_payload_26614_v1/**'
      - '.github/workflows/build-26614-v1-canonical-appearance-cfa-validity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26614 package and successful 26613 V1.1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26614_HANDOFF_HASHES.sha256
          bash -n build_26614_v1_canonical_appearance_cfa_validity.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26614_v1.py','validate_26614_v1.py','verify_26614_v1_authority.py','verify_26614_v1_infrastructure.py','verify_26614_v1_patches.py','verify_26614_v1_regressions.py','verify_26614_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26614 candidate from successful compiled 26613 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26614_v1_canonical_appearance_cfa_validity.sh
      - name: Upload 26614 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26614-v1-canonical-appearance-cfa-validity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726614-26614-v1-canonical-appearance-cfa-validity-debug.apk
            build_26614_v1_canonical_appearance_cfa_validity_outputs/
