name: Build 26699 Motion Performance + UI

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26699_README_UPLOAD.txt'
      - '26699_*'
      - 'build_26699_motion_performance_ui.sh'
      - 'transform_26699.py'
      - 'validate_26699.py'
      - 'repair_26699_*.py'
      - 'handoff_payload_26699/**'
      - '.github/workflows/build-26699-motion-performance-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26699 handoff and exact successful 26698 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26699_HANDOFF_HASHES.sha256
          bash -n build_26699_motion_performance_ui.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26699.py','validate_26699.py','repair_26699_authority.py','repair_26699_infrastructure.py','repair_26699_patches.py','repair_26699_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26699 candidate from successful 26698 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26699_motion_performance_ui.sh
      - name: Verify exact 26699 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726699-26699-motion-performance-ui-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726699-26699-motion-performance-ui-debug.apk" build_26699_motion_performance_ui_outputs/26699_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26699_motion_performance_ui_outputs/26699_apk_jni_contract.txt
      - name: Upload 26699 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26699-motion-performance-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726699-26699-motion-performance-ui-debug.apk
            build_26699_motion_performance_ui_outputs/
