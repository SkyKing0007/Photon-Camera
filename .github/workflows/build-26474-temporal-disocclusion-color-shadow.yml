name: Build 26474 Temporal Disocclusion Color Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26474_temporal_disocclusion_color_shadow.sh
      - .github/workflows/build-26474-temporal-disocclusion-color-shadow.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26474 temporal disocclusion color shadow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard 26474 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "e0bd03d64420e888770c56b29ebe92d2c9237523" || {
            echo "26474 infrastructure commit must be directly based on successful 26473 V2"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26474 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26474 workflow lineage gate PASS"
      - name: Run guarded 26474 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26474_temporal_disocclusion_color_shadow.sh
          ./build_26474_temporal_disocclusion_color_shadow.sh
      - name: Upload 26474 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26474-temporal-disocclusion-color-shadow
          if-no-files-found: error
          path: |
            build_26474_outputs/**
            IrisCamera-0.9726474-26474-temporal-disocclusion-color-shadow-debug.apk
