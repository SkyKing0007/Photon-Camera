name: Build 26550 V1 Night Presentation + Ultra HDR + UI

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26550-v1-night-presentation-uhdr-ui.yml'
      - 'build_26550_v1_night_presentation_uhdr_ui.sh'
      - 'validate_26550_v1_night_presentation_uhdr_ui.py'
      - 'V1_26550_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26550-v1-night-presentation-uhdr-ui
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26550 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26550_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26550_v1_night_presentation_uhdr_ui.py
          python3 validate_26550_v1_night_presentation_uhdr_ui.py --self-test
          bash -n build_26550_v1_night_presentation_uhdr_ui.sh
          grep -F 'BASE_RUN_ID="33121971246"' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9666910595"' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726550"' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'VERSION_BUILD="26550"' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'glslangValidator -S frag app/src/main/assets/shaders/motionv2/gainmap.glsl' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26550_v1_night_presentation_uhdr_ui.sh >/dev/null
          grep -F 'chmod +x build_26550_v1_night_presentation_uhdr_ui.sh' .github/workflows/build-26550-v1-night-presentation-uhdr-ui.yml >/dev/null
          grep -F './build_26550_v1_night_presentation_uhdr_ui.sh' .github/workflows/build-26550-v1-night-presentation-uhdr-ui.yml >/dev/null
          # Previous successful handoff is path-scoped to 26549 names and must not overlap 26550.
          grep -F -- "- 'V1_26549_*'" .github/workflows/build-26549-v1-vgn-color-night-jpeg.yml >/dev/null

      - name: Build exact 26550 candidate from successful compiled 26549 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x build_26550_v1_night_presentation_uhdr_ui.sh
          ./build_26550_v1_night_presentation_uhdr_ui.sh

      - name: Upload 26550 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26550-v1-night-presentation-uhdr-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726550-26550-v1-night-presentation-uhdr-ui-debug.apk
            build_26550_v1_night_presentation_uhdr_ui_outputs/
