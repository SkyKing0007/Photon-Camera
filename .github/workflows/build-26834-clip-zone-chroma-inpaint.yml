name: Build 26834 Clip-Zone Chroma Inpaint
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26834.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26834 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26834.txt
          grep -Fx 'RUN_26834_CLIP_ZONE_CHROMA_INPAINT' TRIGGER_26834.txt
          sha256sum -c 26834_HANDOFF_HASHES.sha256
          bash -n build_26834_clip_zone_chroma_inpaint.sh
          python3 -S -m py_compile transform_26834.py validate_26834.py verify_26834_patches.py verify_26834_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26834_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26834_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26834 candidate from successful 26833 authority using exact successful 26833 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26834_clip_zone_chroma_inpaint.sh
      - name: Verify exact 26834 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726834-26834-clip-zone-chroma-inpaint-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726834-26834-clip-zone-chroma-inpaint-debug.apk' build_26834_clip_zone_chroma_inpaint_outputs/26834_APK.sha256
      - name: Upload 26834 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26834-clip-zone-chroma-inpaint
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726834-26834-clip-zone-chroma-inpaint-debug.apk
            build_26834_clip_zone_chroma_inpaint_outputs/
