name: Build 26702 Laplacian A/B + Spektra Orientation

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26702_README_UPLOAD.txt'
      - '26702_*'
      - 'build_26702_laplacian_ab_spektra_orientation.sh'
      - 'transform_26702.py'
      - 'validate_26702.py'
      - 'verify_26702_*.py'
      - 'handoff_payload_26702/**'
      - '.github/workflows/build-26702-laplacian-ab-spektra-orientation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26702 handoff and exact successful 26701 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26702_HANDOFF_HASHES.sha256
          bash -n build_26702_laplacian_ab_spektra_orientation.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26702.py','validate_26702.py','verify_26702_authority.py','verify_26702_infrastructure.py','verify_26702_patches.py','verify_26702_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26702 candidate from successful 26701 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26702_laplacian_ab_spektra_orientation.sh
      - name: Verify exact 26702 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726702-26702-laplacian-ab-spektra-orientation-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726702-26702-laplacian-ab-spektra-orientation-debug.apk" build_26702_laplacian_ab_spektra_orientation_outputs/26702_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26702_laplacian_ab_spektra_orientation_outputs/26702_apk_jni_contract.txt
      - name: Upload 26702 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26702-laplacian-ab-spektra-orientation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726702-26702-laplacian-ab-spektra-orientation-debug.apk
            build_26702_laplacian_ab_spektra_orientation_outputs/
