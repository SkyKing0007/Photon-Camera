name: Build 26529 V2 Manual 30x + Iris Spatial RGB
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26529_manual_30x_iris_spatial_rgb_v2.py
      - validate_26529_manual_30x_iris_spatial_rgb_v2.py
      - audit_26529_bjzhou_semantic_reference_v2.py
      - preflight_26529_iris_embedded_shaders_v2.py
      - build_26529_manual_30x_iris_spatial_rgb_v2.sh
      - 26529_IRIS_SPATIAL_RGB_CHROMA_REWRITE.kt
      - 26529_V2_RUNTIME_DELTA_FROM_SUCCESSFUL_26528.patch
      - 26529_V2_RUNTIME_DELTA_FROM_SUCCESSFUL_26528.patch.sha256
      - 26529_V2_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26528.patch
      - 26529_V2_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26528.patch.sha256
      - 26529_BASE_26528_HEAD.txt
      - 26529_V2_SCOPE_PROVENANCE.txt
      - 26529_V2_PROJECT_RULES.txt
      - 26529_V2_PREHANDOFF_STATIC_AUDIT.txt
      - 26529_V2_README_UPLOAD.txt
      - 26529_V2_HANDOFF_HASHES.sha256
      - .github/workflows/build-26529-manual-30x-iris-spatial-rgb-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26529-manual-30x-iris-spatial-rgb-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26529 V2 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26529_V2_HANDOFF_HASHES.sha256
          sha256sum -c 26529_V2_RUNTIME_DELTA_FROM_SUCCESSFUL_26528.patch.sha256
          sha256sum -c 26529_V2_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26528.patch.sha256
          python3 -m py_compile \
            apply_26529_manual_30x_iris_spatial_rgb_v2.py \
            validate_26529_manual_30x_iris_spatial_rgb_v2.py \
            audit_26529_bjzhou_semantic_reference_v2.py \
            preflight_26529_iris_embedded_shaders_v2.py
          python3 apply_26529_manual_30x_iris_spatial_rgb_v2.py --self-test
          bash -n build_26529_manual_30x_iris_spatial_rgb_v2.sh
          [[ "$(tr -d '\r\n' < 26529_BASE_26528_HEAD.txt)" == "2b1d34f64b86fc39820aaa8ed0c96cad24c77bd9" ]]
          [[ "$(sha256sum 26529_IRIS_SPATIAL_RGB_CHROMA_REWRITE.kt | awk '{print $1}')" == "5e112314f0795e4294e3af9e8b127d7d86cdfa494cd8df042fd5c6ba9d7949a4" ]]
          grep -F 'VERSION_NAME="0.9726529"; VERSION_BUILD="26529"' build_26529_manual_30x_iris_spatial_rgb_v2.sh >/dev/null
          grep -F 'BJZHOU / MGC REFERENCE RULE — STRICT' 26529_V2_PROJECT_RULES.txt >/dev/null
          grep -F 'SPATIAL_RGB_REFERENCE=BJZHOU_C317_SEMANTICS_ONLY' build_26529_manual_30x_iris_spatial_rgb_v2.sh >/dev/null
          grep -F 'SPATIAL_RGB_RUNTIME_OWNER=IRIS_REWRITE' build_26529_manual_30x_iris_spatial_rgb_v2.sh >/dev/null
          grep -F 'DNG_RUNTIME_CHANGED=false' build_26529_manual_30x_iris_spatial_rgb_v2.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26529_manual_30x_iris_spatial_rgb_v2.sh >/dev/null
          ! grep -F -- '--bjzhou-postprocessor' apply_26529_manual_30x_iris_spatial_rgb_v2.py >/dev/null
          ! grep -F 'write(root,POST,vendor)' apply_26529_manual_30x_iris_spatial_rgb_v2.py >/dev/null
          ! grep -F 'GlesMgcSpatialRgbChromaPostprocessor.kt' 26529_V2_RUNTIME_DELTA_FROM_SUCCESSFUL_26528.patch >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26529 V2 handoff static guards verified"

      - name: Guarded 26529 V2 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26529_manual_30x_iris_spatial_rgb_v2.sh
          ./build_26529_manual_30x_iris_spatial_rgb_v2.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26529-manual-30x-iris-spatial-rgb-v2
          path: |
            IrisCamera-0.9726529-26529-manual-30x-iris-spatial-rgb-v2-debug.apk
            build_26529_manual_30x_iris_spatial_rgb_v2_outputs/
          if-no-files-found: warn
