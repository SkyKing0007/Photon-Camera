name: Build 26676 R1 Fast HDR WYSIWYG + Iris Watermark

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26676_R1_README_UPLOAD.txt'
      - 'R1_26676_*'
      - 'build_26676_r1_fast_hdr_wysiwyg_iris_watermark.sh'
      - 'transform_26676.py'
      - 'validate_26676.py'
      - 'verify_26676_*.py'
      - 'handoff_payload_26676/**'
      - '.github/workflows/build-26676-r1-fast-hdr-wysiwyg-iris-watermark.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26676 handoff and exact successful 26675 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26676_HANDOFF_HASHES.sha256
          bash -n build_26676_r1_fast_hdr_wysiwyg_iris_watermark.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26676.py','validate_26676.py','verify_26676_authority.py','verify_26676_infrastructure.py','verify_26676_patches.py','verify_26676_regressions.py','verify_26676_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26676 candidate from successful 26675 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26676_r1_fast_hdr_wysiwyg_iris_watermark.sh
      - name: Verify exact 26676 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726676-26676-r1-fast-hdr-wysiwyg-iris-watermark-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726676-26676-r1-fast-hdr-wysiwyg-iris-watermark-debug.apk" build_26676_r1_fast_hdr_wysiwyg_iris_watermark_outputs/26676_R1_APK.sha256
      - name: Upload 26676 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26676-r1-fast-hdr-wysiwyg-iris-watermark
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726676-26676-r1-fast-hdr-wysiwyg-iris-watermark-debug.apk
            build_26676_r1_fast_hdr_wysiwyg_iris_watermark_outputs/
