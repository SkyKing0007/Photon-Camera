name: Build 26887 B OFF RAW Witness and HDRQ Motion
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26887.txt'
      - 'generate_26887_build.py'
      - '.github/workflows/build-26887-iris-rawr.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct the exact successful 26881 runner then derive 26882
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26882.txt
          grep -Fx 'RUN_26882_SPEKTRA_ROTATED_RAW_B_WHITE_OFF_V1' TRIGGER_26882.txt
          test -f TRIGGER_26881.txt
          grep -Fx 'RUN_26881_SPEKTRA112_FOV_CHROMA_HIGHLIGHT_R6' TRIGGER_26881.txt
          # Original 26880 SHA-pinned staging; retains corrected nested historical
          # regressions and original 26880 attempt-4 shader-scope guards.
          python3 -S stage_26880_root.py
          sha256sum -c 26880_HANDOFF_HASHES.sha256
          python3 -S stage_26881_root.py
          sha256sum -c 26881_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py generate_26872_build.py generate_26873_build.py generate_26874_build.py generate_26875_build.py generate_26876_build.py generate_26877_build.py generate_26878_build.py generate_26879_build.py generate_26880_build.py generate_26881_build.py verify_26881_candidate.py verify_26881_patches.py verify_26881_expanded_glsl.py regressions/26881_spektra_chroma_clip.py regressions/26881_actual_generator_artifact_identity.py regressions/26881_no_crossstage_local.py regressions/26881_trigger_contract.py regressions/26881_historical_output_contract.py stage_26881_root.py
          python3 -S generate_26871_build.py .
          test "$(sha256sum build_26871_iris_rawr.sh | awk '{print $1}')" = 'ca2d99d38c1de9a310205ba2c2af0fd7b49399f506e39a24fa94a6f15a338e0e'
          python3 -S generate_26872_build.py .
          test "$(sha256sum build_26872_iris_rawr.sh | awk '{print $1}')" = '042f4550b60ba7efb8e363230a76931969e98c2ffacda3fa310895e98f40b7db'
          python3 -S generate_26873_build.py .
          test "$(sha256sum build_26873_iris_rawr.sh | awk '{print $1}')" = '121323a5eba3dca75ffb6f05089f73b180a6e692015895237cd780babb92aaa4'
          python3 -S generate_26874_build.py .
          test "$(sha256sum build_26874_iris_rawr.sh | awk '{print $1}')" = '3b48818fd6cd6376f97cecca5a34b85ce4788e10a37435e3273beb2eddf3282a'
          python3 -S generate_26875_build.py .
          test "$(sha256sum build_26875_iris_rawr.sh | awk '{print $1}')" = 'b6c6f1db9f9910a0bff2175af756e3e92896d33eb6a82776de746eda645fa7a1'
          python3 -S generate_26876_build.py .
          test "$(sha256sum build_26876_iris_rawr.sh | awk '{print $1}')" = '525ce763e63ae2b8aa0a9a27d1da810e8969d855ea930552e45976d741c3b912'
          python3 -S generate_26877_build.py .
          test "$(sha256sum build_26877_iris_rawr.sh | awk '{print $1}')" = 'bbda162004a0aa4b262a3df3547c47601df5ccb93cfb966a2dbd0a78a09e7dff'
          python3 -S generate_26878_build.py .
          test "$(sha256sum build_26878_iris_rawr.sh | awk '{print $1}')" = '53e570e4cc92ef5050f5f15953dd0fba88ec41cc2707c5eb79f1bc5994a531bb'
          python3 -S generate_26879_build.py .
          test "$(sha256sum build_26879_iris_rawr.sh | awk '{print $1}')" = '985e5f03c620deef3a42b0b50424776e6208e85b62ff5d26e16a7579940d0c19'
          python3 -S generate_26880_build.py .
          # Exact failed 40392745967 assertion, replayed before reentering
          # the guarded 26881 generator on the successful 26880 parent.
          python3 -S regressions/26881_actual_generator_artifact_identity.py
          test "$(sha256sum build_26880_iris_rawr.sh | awk '{print $1}')" = '312bc023047ea13752efc46c6ad030e34d63441c807f55873266417fa113c21a'
          python3 -S generate_26881_build.py .
          # The successor runner changes intentionally for the real Bash H79
          # bug fix. Pin its successful 26880 input and sealed generator, then
          # prove reproducibility by regenerating and comparing exact bytes.
          cp build_26881_iris_rawr.sh /tmp/26881_first_generation.sh
          python3 -S generate_26881_build.py .
          cmp /tmp/26881_first_generation.sh build_26881_iris_rawr.sh
          sha256sum -c 26881_GENERATED_BUILD_SHA256.txt
          python3 -S regressions/26881_actual_generator_artifact_identity.py build_26881_iris_rawr.sh
          python3 -S regressions/26881_no_crossstage_local.py
          python3 -S regressions/26881_trigger_contract.py build_26881_iris_rawr.sh
          python3 -S regressions/26881_historical_output_contract.py build_26881_iris_rawr.sh
          sha256sum -c 26881_GENERATED_BUILD_SHA256.txt
          bash -n build_26881_iris_rawr.sh
          # The preceding reconstruction is the exact GitHub-successful 26881
          # implementation (run 40415858178), not stale repository app/src.
          test "$(sha256sum build_26881_iris_rawr.sh | awk '{print $1}')" = '8e9d44d66e4c955c105d136a1c380206ae93b671b9e57806412c2c991a791fc5'
          grep -Fx 'RUN_26882_SPEKTRA_ROTATED_RAW_B_WHITE_OFF_V1' TRIGGER_26882.txt
          python3 -S stage_26882_root.py
          sha256sum -c 26882_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26882_build.py verify_26882_candidate.py verify_26882_patches.py verify_26882_expanded_glsl.py verify_26882_semantics.py stage_26882_root.py regressions/26882_actual_successor_contract.py
          python3 -S regressions/26882_actual_successor_contract.py
          python3 -S generate_26882_build.py .
          cp build_26882_iris_rawr.sh /tmp/26882_first_generation.sh
          python3 -S generate_26882_build.py .
          cmp /tmp/26882_first_generation.sh build_26882_iris_rawr.sh
          sha256sum -c 26882_GENERATED_BUILD_SHA256.txt
          bash -n build_26882_iris_rawr.sh
          # Exact successful 26882 runner above is the only verification authority.
          test "$(sha256sum build_26882_iris_rawr.sh | awk '{print $1}')" = '8bbdf3738e8a8b17f236db6c43f8273b2a24e164b847963aa9c749da7707251c'
          test -f TRIGGER_26883.txt && grep -Fx 'RUN_26883_SPEKTRA_FULL_FOV_1920_B_EARLY_WHITE_ON_OFF_V1' TRIGGER_26883.txt
          python3 -S stage_26883_root.py
          sha256sum -c 26883_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26883_build.py verify_26883_candidate.py verify_26883_patches.py verify_26883_semantics.py verify_26883_expanded_glsl.py stage_26883_root.py regressions/26883_successor_contract.py
          python3 -S regressions/26883_successor_contract.py
          python3 -S generate_26883_build.py .
          cp build_26883_iris_rawr.sh /tmp/26883_first_generation.sh
          python3 -S generate_26883_build.py .
          cmp /tmp/26883_first_generation.sh build_26883_iris_rawr.sh
          sha256sum -c 26883_GENERATED_BUILD_SHA256.txt
          bash -n build_26883_iris_rawr.sh
          test "$(find handoff_payload_26883 -type f | wc -l)" -eq 4
          ! find . -type f -name '*.apk' | grep -q .
          # Historical failing triggers (26881 R1..R5) are already replayed
          # by the proven 26881 generation block above. New trigger is exact.
          test "$(find handoff_payload_26882 -type f | wc -l)" -eq 3
          ! find . -type f -name '*.apk' | grep -q .
          # The exact successful 26883 SHA-pinned runner and historical source
          # validators above remain untouched. Extend, do not replace them.
          test -f TRIGGER_26884.txt && grep -Fx 'RUN_26884_RAWR_HIGHLIGHT_OFF_SHARED_B_V1' TRIGGER_26884.txt
          python3 -S stage_26884_root.py
          sha256sum -c 26884_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26884_build.py verify_26884_candidate.py verify_26884_patches.py verify_26884_expanded_glsl.py verify_26884_semantics.py stage_26884_root.py regressions/26884_successor_contract.py regressions/26884_rawr_off_math.py
          python3 -S regressions/26884_successor_contract.py
          python3 -S generate_26884_build.py .
          cp build_26884_iris_rawr.sh /tmp/26884_first_generation.sh
          python3 -S generate_26884_build.py .
          cmp /tmp/26884_first_generation.sh build_26884_iris_rawr.sh
          sha256sum -c 26884_GENERATED_BUILD_SHA256.txt
          bash -n build_26884_iris_rawr.sh
          test "$(sha256sum build_26883_iris_rawr.sh | awk '{print $1}')" = '7799509f64c7f84c2223f7014dac925b2f6f31ed96667d754d0b1c0df29e979f'
          test "$(find handoff_payload_26884 -type f | wc -l)" -eq 3
          ! find . -type f -name '*.apk' | grep -q .
          # 26885 successor only AFTER exact successful 26884 runner reconstruction.
          test "$(sha256sum build_26884_iris_rawr.sh | awk '{print $1}')" = 'f8aff63b074ee6195d6b137858ad5a3f23cb149a40c9f72cb69b51f315b4679f'
          test -f TRIGGER_26885.txt && grep -Fx 'RUN_26885_B_ON_WRONSKI_RGB_CHROMA_CONSISTENCY_V2_SCOPE_REPAIR' TRIGGER_26885.txt
          python3 -S stage_26885_root.py
          sha256sum -c 26885_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26885_build.py verify_26885_candidate.py verify_26885_patches.py verify_26885_expanded_glsl.py verify_26885_semantics.py stage_26885_root.py regressions/26885_successor_contract.py regressions/26885_actions_40604341240_historical_scope.py regressions/26885_wronski_chroma_evidence.py regressions/26885_universal_pattern_controls.py regressions/26885_chroma_controls.py regressions/_26885_vector_math.py
          python3 -S regressions/26885_successor_contract.py
          python3 -S generate_26885_build.py .
          cp build_26885_iris_rawr.sh /tmp/26885_first_generation.sh
          python3 -S generate_26885_build.py .
          cmp /tmp/26885_first_generation.sh build_26885_iris_rawr.sh
          sha256sum -c 26885_GENERATED_BUILD_SHA256.txt
          bash -n build_26885_iris_rawr.sh
          test "$(find handoff_payload_26885 -type f | wc -l)" -eq 8
          ! find . -type f -name '*.apk' | grep -q .
          # Completed 26885 V2 runner is verification-mechanics authority;
          # all 26871..26885 reconstruction, exact hashes, historical
          # regressions and original compiler/packaging gates above remain.
          test "$(sha256sum build_26885_iris_rawr.sh | awk '{print $1}')" = '2138db01cbfb3a8421c12e54ba29d4f0a893d1cdd4a219ee34a40a4dc0c54379'
          test -f TRIGGER_26886.txt && grep -Fx 'RUN_26886_B_ON_WRONSKI_CHROMA_NOISE_ALIAS_V1' TRIGGER_26886.txt
          python3 -S stage_26886_root.py
          sha256sum -c 26886_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26886_build.py verify_26886_candidate.py verify_26886_patches.py verify_26886_expanded_glsl.py verify_26886_semantics.py stage_26886_root.py regressions/26886_successor_contract.py regressions/26886_historical_scope_all_stages.py regressions/26886_chroma_controls.py
          python3 -S regressions/26886_successor_contract.py
          python3 -S generate_26886_build.py .
          cp build_26886_iris_rawr.sh /tmp/26886_first_generation.sh
          python3 -S generate_26886_build.py .
          cmp /tmp/26886_first_generation.sh build_26886_iris_rawr.sh
          sha256sum -c 26886_GENERATED_BUILD_SHA256.txt
          bash -n build_26886_iris_rawr.sh
          test "$(find handoff_payload_26886 -type f | wc -l)" -eq 2
          ! find . -type f -name '*.apk' | grep -q .
          # The exact successful 26886 V6 runner and its historical regressions
          # above remain byte-for-byte intact. Derive the 26887 successor only
          # after validating that recorded successful 26886 SHA-256.
          test "$(sha256sum build_26886_iris_rawr.sh | awk '{print $1}')" = '3f816088f564bfd575d5dc8e1681b9b1b18ec435de41ed34f2c22df866c5e8fa'
          test -f TRIGGER_26887.txt && grep -Fx 'RUN_26887_B_OFF_RAW_WITNESS_HDRQ_MOTION_V1' TRIGGER_26887.txt
          python3 -S stage_26887_root.py
          sha256sum -c 26887_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26887_build.py verify_26887_candidate.py verify_26887_patches.py verify_26887_expanded_glsl.py verify_26887_semantics.py stage_26887_root.py regressions/26887_successor_contract.py
          python3 -S regressions/26887_successor_contract.py
          python3 -S generate_26887_build.py .
          cp build_26887_iris_rawr.sh /tmp/26887_first_generation.sh
          python3 -S generate_26887_build.py .
          cmp /tmp/26887_first_generation.sh build_26887_iris_rawr.sh
          sha256sum -c 26887_GENERATED_BUILD_SHA256.txt
          bash -n build_26887_iris_rawr.sh
          python3 -S regressions/26887_successor_contract.py --generated
          test "$(find handoff_payload_26887 -type f | wc -l)" -eq 17
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact inherited GLSL cleanup guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26887 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26887_iris_rawr.sh
      - name: Verify exactly one intended 26887 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726887-26887-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726887-26887-iris-rawr-debug.apk' build_26887_iris_rawr_outputs/26887_APK.sha256
      - name: Upload authoritative 26887 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26887-b-off-raw-witness-hdrq-motion
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726887-26887-iris-rawr-debug.apk
            build_26887_iris_rawr_outputs/
