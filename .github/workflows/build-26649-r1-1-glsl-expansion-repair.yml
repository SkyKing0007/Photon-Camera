name: Build 26649 R1.1 GLSL Expansion Repair

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26649_R1_1_README_UPLOAD.txt'
      - 'R1_1_26649_*'
      - 'build_r1_1_26649_glsl_expansion_repair.sh'
      - 'verify_r1_1_26649_*.py'
      - '.github/workflows/build-26649-r1-1-glsl-expansion-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26649 R1.1 GLSL expansion repair and inherited successful mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_1_26649_HANDOFF_HASHES.sha256
          bash -n build_r1_1_26649_glsl_expansion_repair.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['verify_r1_1_26649_shaders.py','verify_r1_1_26649_infrastructure.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed R1.1 Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26649 candidate with corrected runtime-expanded GLSL compiler gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_r1_1_26649_glsl_expansion_repair.sh
      - name: Verify exact 26649 R1.1 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726649-26649-r1-1-photon-highlight-compression-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726649-26649-r1-1-photon-highlight-compression-debug.apk" build_r1_1_26649_glsl_expansion_repair_outputs/26649_R1_1_APK.sha256
      - name: Upload 26649 R1.1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26649-r1-1-photon-highlight-compression
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726649-26649-r1-1-photon-highlight-compression-debug.apk
            build_r1_1_26649_glsl_expansion_repair_outputs/
