name: Build 26522 Full-Range Stacked DNG
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26522_fullrange_stacked_dng.py
      - validate_26522_fullrange_stacked_dng.py
      - preflight_26522_iris_embedded_shaders.py
      - build_26522_fullrange_stacked_dng.sh
      - 26522_BASE_26521_HEAD.txt
      - 26522_STACKED_DNG_PROVENANCE.txt
      - 26522_README_UPLOAD.txt
      - 26522_HANDOFF_HASHES.sha256
      - .github/workflows/build-26522-fullrange-stacked-dng.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26522-fullrange-stacked-dng-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          expected=digest.split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert expected==actual
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26522 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26522_HANDOFF_HASHES.sha256
          python3 -m py_compile \
            apply_26522_fullrange_stacked_dng.py \
            validate_26522_fullrange_stacked_dng.py \
            preflight_26522_iris_embedded_shaders.py
          bash -n build_26522_fullrange_stacked_dng.sh
          [[ "$(tr -d '\r\n' < 26522_BASE_26521_HEAD.txt)" == \
             "f7ed175670c10ff6bcdcd3df3b2568d86237acd6" ]]
          grep -F 'SUCCESSFUL_26521_HEAD="f7ed175670c10ff6bcdcd3df3b2568d86237acd6"' build_26522_fullrange_stacked_dng.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26521-v5-iris-spatial-rgb-v1"' build_26522_fullrange_stacked_dng.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726522"; VERSION_BUILD="26522"' build_26522_fullrange_stacked_dng.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26522_fullrange_stacked_dng.sh >/dev/null
          grep -F 'IRIS_26522_NORMALIZED16_DNG_FULL_PRECISION' apply_26522_fullrange_stacked_dng.py >/dev/null
          grep -F 'IRIS_26522_DNG_EFFECTIVE_SUPPORT_ACCUMULATOR' apply_26522_fullrange_stacked_dng.py >/dev/null
          grep -F 'dngCreator.setWhiteLevel(65535.0)' apply_26522_fullrange_stacked_dng.py >/dev/null
          grep -F 'dngCreator.setBlackLevel(new short[]{0, 0, 0, 0})' apply_26522_fullrange_stacked_dng.py >/dev/null
          ! grep -F 'MgcSabre' apply_26522_fullrange_stacked_dng.py
          ! grep -F 'PyramidAlignment' apply_26522_fullrange_stacked_dng.py
          glslangValidator --version | head -1 | grep -F 16.5.0
          echo "PASS: 26522 handoff static guards verified"
      - name: Guarded 26522 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26522_fullrange_stacked_dng.sh
          ./build_26522_fullrange_stacked_dng.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26522-fullrange-stacked-dng-v1
          path: |
            IrisCamera-0.9726522-26522-fullrange-stacked-dng-debug.apk
            build_26522_fullrange_stacked_dng_outputs/
          if-no-files-found: warn
