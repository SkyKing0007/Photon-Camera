name: Build 26612 V1 Universal HDR Presentation

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26612_V1_README_UPLOAD.txt'
      - 'REGRESSION_V1_26612_*'
      - 'V1_26612_*'
      - 'build_26612_v1_short_protection_rendition_parity.sh'
      - 'transform_26612_v1.py'
      - 'validate_26612_v1.py'
      - 'verify_26612_v1_*.py'
      - 'handoff_payload_26612_v1/**'
      - '.github/workflows/build-26612-v1-short-protection-rendition-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26612 V1 package and exact successful 26611 V1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26612_HANDOFF_HASHES.sha256
          bash -n build_26612_v1_short_protection_rendition_parity.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26612_v1.py','validate_26612_v1.py','verify_26612_v1_authority.py','verify_26612_v1_infrastructure.py','verify_26612_v1_patches.py','verify_26612_v1_regressions.py','verify_26612_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26612 V1 candidate from successful compiled 26611 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26612_v1_short_protection_rendition_parity.sh
      - name: Upload 26612 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26612-v1-universal-hdr-presentation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726612-26612-v1-universal-presentation-debug.apk
            build_26612_v1_short_protection_rendition_parity_outputs/
