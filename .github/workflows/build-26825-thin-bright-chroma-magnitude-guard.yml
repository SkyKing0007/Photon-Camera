name: Build 26825 Thin Bright Chroma Magnitude Guard
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26825.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26825 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26825.txt
          grep -Fx 'RUN_26825_THIN_BRIGHT_CHROMA_MAGNITUDE_GUARD' TRIGGER_26825.txt
          sha256sum -c 26825_HANDOFF_HASHES.sha256
          bash -n build_26825_thin_bright_chroma_magnitude_guard.sh
          python3 -S -m py_compile transform_26825.py validate_26825.py verify_26825_patches.py verify_26825_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26825_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26825_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26825 candidate from successful 26824 authority using exact successful 26824 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26825_thin_bright_chroma_magnitude_guard.sh
      - name: Verify exact 26825 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726825-26825-thin-bright-chroma-magnitude-guard-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726825-26825-thin-bright-chroma-magnitude-guard-debug.apk' build_26825_thin_bright_chroma_magnitude_guard_outputs/26825_APK.sha256
      - name: Upload 26825 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26825-thin-bright-chroma-magnitude-guard
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726825-26825-thin-bright-chroma-magnitude-guard-debug.apk
            build_26825_thin_bright_chroma_magnitude_guard_outputs/
