name: Build 26568 V1 Fused SR Performance + Detail

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26568_*'
      - 'REGRESSION_26568_*'
      - 'build_26568_v1_fused_sr_performance_detail.sh'
      - 'transform_26568_v1.py'
      - 'validate_26568_v1.py'
      - 'verify_26568_authority.py'
      - 'verify_26568_patches.py'
      - 'verify_26568_shaders.py'
      - 'handoff_payload_26568/**'
      - '.github/workflows/build-26568-v1-fused-sr-performance-detail.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26568 V1 package
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26568_HANDOFF_HASHES.sha256
          test "$(wc -l < V1_26568_HANDOFF_HASHES.sha256)" -eq 30
          bash -n build_26568_v1_fused_sr_performance_detail.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26568_v1.py',
              'validate_26568_v1.py',
              'verify_26568_authority.py',
              'verify_26568_patches.py',
              'verify_26568_shaders.py',
          ]
          for name in files:
              source = Path(name).read_text()
              compile(source, name, 'exec')
          print('PASS sealed Python in-memory syntax gate')
          PY
          grep -F 'BASE_SUCCESS_COMMIT="858d7450e735c0679f29066e268db588a94e42e3"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'BASE_RUN_ID="33350919492"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9743630741"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="83849c3b4631dcdf556f772af8046e822f4b7e25ca065250072d99c0ad92a19b"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'BASE_TAR_SHA="052f5597e993b6faefd29bbc400910d73059368e1ac0672d86b67c5dc779df1d"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26567-v1-4-before-26568-fused-sr-performance-detail"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726568"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'VERSION_BUILD="26568"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'GLSLANG_VERSION="16.5.0"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'run 33340661287, job 99335599790' REGRESSION_26568_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33350507622, job 99362814146' REGRESSION_26568_CARRIED_FAILURES.txt >/dev/null
          grep -F 'phase telemetry must piggyback' REGRESSION_26568_CARRIED_FAILURES.txt >/dev/null
          grep -F 'snapshot_candidate_from_authority "$BASE" "$ROOT" "$LIVE_CANON"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          grep -F 'snapshot_candidate_from_authority "$BASE" "$ROOT" "$POST"' build_26568_v1_fused_sr_performance_detail.sh >/dev/null
          python3 -S - <<'PY'
          from pathlib import Path
          s=Path('build_26568_v1_fused_sr_performance_detail.sh').read_text()
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          p=s.index('  verify_candidate_patches', k)
          b=s.index('pass "26568 PRE-BUILD SAFETY PROOF PASSED"', p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace', b)
          assert k < p < b < a, 'real Kotlin/Java -> patch proof -> PRE-BUILD marker -> assemble order violated'
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s, 'pre-compiler semantic validation must use authority-seeded canonical snapshot'
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s, 'pre-compiler authority must use authority-seeded canonical snapshot'
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s, 'post-build semantic validation must use authority-seeded canonical snapshot'
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s, 'post-build authority must use authority-seeded canonical snapshot'
          assert 'cp -a "$authority_root/." "$dest_root/"' in s, 'canonical snapshot must preserve exact authority file universe'
          print('PASS 26568 inherits V1.4 compiler order + canonical authority snapshot contract')
          PY
          ! grep -R -F 'V1_26568_' .github/workflows --exclude='build-26568-v1-fused-sr-performance-detail.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26568 candidate from successful compiled 26567 V1.4 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26568_v1_fused_sr_performance_detail.sh
          ./build_26568_v1_fused_sr_performance_detail.sh

      - name: Upload 26568 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26568-v1-fused-sr-performance-detail
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726568-26568-v1-fused-sr-performance-detail-debug.apk
            build_26568_v1_fused_sr_performance_detail_outputs/
