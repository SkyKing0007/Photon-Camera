name: Build 26820 Connected False Color + DNG Phase Coherence
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26820.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26820 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26820.txt
          grep -Fx 'RUN_26820_CONNECTED_FALSE_COLOR_DNG_PHASE_COHERENCE' TRIGGER_26820.txt
          sha256sum -c 26820_HANDOFF_HASHES.sha256
          bash -n build_26820_connected_false_color_dng_phase_coherence.sh
          python3 -S -m py_compile transform_26820.py validate_26820.py verify_26820_patches.py verify_26820_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26820_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26820_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26820 candidate from successful 26819 authority using exact successful 26819 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26820_connected_false_color_dng_phase_coherence.sh
      - name: Verify exact 26820 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726820-26820-connected-false-color-dng-phase-coherence-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726820-26820-connected-false-color-dng-phase-coherence-debug.apk' build_26820_connected_false_color_dng_phase_coherence_outputs/26820_APK.sha256
      - name: Upload 26820 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26820-connected-false-color-dng-phase-coherence
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726820-26820-connected-false-color-dng-phase-coherence-debug.apk
            build_26820_connected_false_color_dng_phase_coherence_outputs/
