name: Build 26743 Visible Highlight Neutrality
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26743_README_UPLOAD.txt'
      - '26743_*'
      - 'build_26743_visible_highlight_neutrality.sh'
      - 'transform_26743.py'
      - 'validate_26743.py'
      - 'verify_26743_*.py'
      - 'handoff_payload_26743/**'
      - '.github/workflows/build-26743-visible-highlight-neutrality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26743 handoff and exact successful 26742 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26743_HANDOFF_HASHES.sha256
          python3 -S verify_26743_infrastructure.py build_26743_visible_highlight_neutrality.sh .github/workflows/build-26743-visible-highlight-neutrality.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26743 candidate with successful 26742 procedure from exact successful 26742 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26743_visible_highlight_neutrality.sh
      - name: Verify exact 26743 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726743-26743-visible-highlight-neutrality-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726743-26743-visible-highlight-neutrality-debug.apk' build_26743_visible_highlight_neutrality_outputs/26743_APK.sha256
      - name: Upload 26743 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26743-visible-highlight-neutrality
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726743-26743-visible-highlight-neutrality-debug.apk
            build_26743_visible_highlight_neutrality_outputs/
