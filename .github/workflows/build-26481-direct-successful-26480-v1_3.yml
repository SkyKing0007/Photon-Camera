name: Build 26481 Direct Successful 26480 Root Cause V1.3

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26481_direct_successful_26480_v1_3.sh
      - transform_26481_direct_26480_rootcause_v1.py
      - 26480_successful_source.patch
      - 26480_successful_after.sha256
      - .github/workflows/build-26481-direct-successful-26480-v1_3.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded direct 26480 to 26481
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout experimental infrastructure only
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify committed canonical 26480 inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f 26480_successful_source.patch
          test -f 26480_successful_after.sha256
          test -f transform_26481_direct_26480_rootcause_v1.py
          test -f build_26481_direct_successful_26480_v1_3.sh
          test "$(sha256sum 26480_successful_source.patch | awk '{print $1}')" = "e9f2b9987a84075160f2e6aad62a9983d5b9920b065b77febc83e705aa859975"
          test "$(sha256sum 26480_successful_after.sha256 | awk '{print $1}')" = "b34a13173d3ddd37d5b3ef94241fb3e4d068766e9e7893396b76a097f2b06ebb"
          test "$(sha256sum transform_26481_direct_26480_rootcause_v1.py | awk '{print $1}')" = "fb9cc02f8a8af64c531a383055d3a2b254a4517fb78fdbfcc68089ede54ac560"
          python3 -m py_compile transform_26481_direct_26480_rootcause_v1.py
          bash -n build_26481_direct_successful_26480_v1_3.sh
          echo "canonical successful-26480 source package identity PASS"

      - name: Install runtime GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version

      - name: Run strict direct-successful-26480 procedure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26481_direct_successful_26480_v1_3.sh
          ./build_26481_direct_successful_26480_v1_3.sh

      - name: Upload complete 26481 next-baseline package and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26481-direct-successful-26480-v1-3
          if-no-files-found: warn
          path: |
            build_26481_outputs/**
            IrisCamera-0.9726481-26481-direct-26480-rootcause-debug.apk
