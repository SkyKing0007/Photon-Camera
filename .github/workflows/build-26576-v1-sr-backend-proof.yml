name: Build 26576 V1 Persistent SR Backend Proof

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26576_*'
      - 'REGRESSION_V1_26576_*'
      - 'build_26576_v1_sr_backend_proof.sh'
      - 'transform_26576_v1.py'
      - 'validate_26576_v1.py'
      - 'verify_26576_v1_authority.py'
      - 'verify_26576_v1_patches.py'
      - 'verify_26576_v1_shaders.py'
      - 'handoff_payload_26576_v1/**'
      - '.github/workflows/build-26576-v1-sr-backend-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26576 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26576_HANDOFF_HASHES.sha256
          bash -n build_26576_v1_sr_backend_proof.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26576_v1.py',
              'validate_26576_v1.py',
              'verify_26576_v1_authority.py',
              'verify_26576_v1_patches.py',
              'verify_26576_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26576_v1_sr_backend_proof.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="167082200445143c8617343ff75f5531af59729f"' in s
          assert 'HANDOFF_PARENT_COMMIT="167082200445143c8617343ff75f5531af59729f"' in s
          assert 'BASE_RUN_ID="33546220528"' in s
          assert 'BASE_JOB_ID="99984254916"' in s
          assert 'BASE_ARTIFACT_ID="9815705590"' in s
          assert 'BASE_ARTIFACT_SHA="ecfa027dd9f379f7275701e7c6134f3ea9451fae437be3b02dbbeb9c5cbd949d"' in s
          assert 'BASE_TAR_SHA="a8392bb12057d614b75b7e64d7e33db44683e35488a8d0c27a6db4db07c8d459"' in s
          assert 'VERSION_NAME="0.9726576"' in s and 'VERSION_BUILD="26576"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26575 verification/build ordering remains unchanged.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26576 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          expected="""snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26575 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }"""
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          print('PASS sealed Python syntax + exact successful 26575 authority-seeded verification order inheritance')
          PY
          grep -F 'IRIS_26575_MOTION_SUPER_RES_SHUTTER_OWNER' REGRESSION_V1_26576_SR_TELEMETRY_CONTRACT.txt >/dev/null
          grep -F 'IRIS_26576_SR_PUBLICATION_BACKEND' REGRESSION_V1_26576_SR_TELEMETRY_CONTRACT.txt >/dev/null
          grep -F 'IRIS_26576_SR_FINAL_DIMENSIONS' REGRESSION_V1_26576_SR_TELEMETRY_CONTRACT.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26576_CARRIED_FAILURES.txt >/dev/null
          grep -F 'No verification order is weakened' V1_26576_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26576_' .github/workflows --exclude='build-26576-v1-sr-backend-proof.yml'
          ! grep -R -F 'handoff_payload_26576_v1' .github/workflows --exclude='build-26576-v1-sr-backend-proof.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26576 candidate from successful compiled 26575 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26576_v1_sr_backend_proof.sh
          ./build_26576_v1_sr_backend_proof.sh

      - name: Upload 26576 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26576-v1-sr-backend-proof
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726576-26576-v1-sr-backend-proof-debug.apk
            build_26576_v1_sr_backend_proof_outputs/
