name: Build 26565 V1 Display-P3 True2X Fast Publication

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26565_*'
      - 'REGRESSION_26565_*'
      - 'build_26565_v1_display_p3_fast_sr.sh'
      - 'transform_26565_v1_display_p3_fast_sr.py'
      - 'validate_26565_v1_display_p3_fast_sr.py'
      - 'verify_26565_authority.py'
      - 'verify_26565_patches.py'
      - 'compile_26565_cpp_contract.py'
      - '.github/workflows/build-26565-v1-display-p3-fast-sr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26565 V1 package
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26565_HANDOFF_HASHES.sha256
          bash -n build_26565_v1_display_p3_fast_sr.sh
          grep -F 'BASE_SUCCESS_COMMIT="d0e9f1660140eaa8cb695f3e76805ba6f80cf79f"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'BASE_RUN_ID="33286029778"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9724492359"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="db8e558d8d0b6b612b8285c0c47b1ac613dcf4f6d14131bd04eb9261047e4e27"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'BASE_TAR_SHA="e8566618b98d3a35c097ea14c6e227e7cad25be36c734e70a6b0346ece533a77"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26563-v1-before-26564-true-2x-sr"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726565"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'VERSION_BUILD="26565"' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26565_v1_display_p3_fast_sr.sh >/dev/null
          grep -F 'run 33283538711, job 99182648927' REGRESSION_26565_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33284071958, job 99184083108' REGRESSION_26565_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33284552163, job 99185364515' REGRESSION_26565_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33285297620, job 99187338833' REGRESSION_26565_CARRIED_FAILURES.txt >/dev/null
          ! grep -R -F 'V1_26565_' .github/workflows --exclude='build-26565-v1-display-p3-fast-sr.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26565 candidate from successful compiled 26564 V1.4 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26565_v1_display_p3_fast_sr.sh
          ./build_26565_v1_display_p3_fast_sr.sh

      - name: Upload 26565 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26565-v1-display-p3-fast-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726565-26565-v1-display-p3-fast-sr-debug.apk
            build_26565_v1_display_p3_fast_sr_outputs/
