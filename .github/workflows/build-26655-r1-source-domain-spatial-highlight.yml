name: Build 26655 R1 Source-Domain Spatial Highlight

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26655_R1_README_UPLOAD.txt'
      - 'R1_26655_*'
      - 'build_26655_r1_source_domain_spatial_highlight.sh'
      - 'transform_26655.py'
      - 'validate_26655.py'
      - 'verify_26655_*.py'
      - 'handoff_payload_26655/**'
      - '.github/workflows/build-26655-r1-source-domain-spatial-highlight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26655 handoff and exact successful 26654 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26655_HANDOFF_HASHES.sha256
          bash -n build_26655_r1_source_domain_spatial_highlight.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26655.py','validate_26655.py','verify_26655_authority.py','verify_26655_infrastructure.py','verify_26655_patches.py','verify_26655_regressions.py','verify_26655_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26655 candidate from successful 26654 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26655_r1_source_domain_spatial_highlight.sh
      - name: Verify exact 26655 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726655-26655-r1-source-domain-spatial-highlight-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726655-26655-r1-source-domain-spatial-highlight-debug.apk" build_26655_r1_source_domain_spatial_highlight_outputs/26655_R1_APK.sha256
      - name: Upload 26655 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26655-r1-source-domain-spatial-highlight
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726655-26655-r1-source-domain-spatial-highlight-debug.apk
            build_26655_r1_source_domain_spatial_highlight_outputs/
