name: Build 26653 R1 Final Highlight Tone + Fine Structure

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26653_R1_README_UPLOAD.txt'
      - 'R1_26653_*'
      - 'build_26653_r1_final_highlight_tone_fine_structure.sh'
      - 'transform_26653.py'
      - 'validate_26653.py'
      - 'verify_26653_*.py'
      - 'handoff_payload_26653/**'
      - '.github/workflows/build-26653-r1-final-highlight-tone-fine-structure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26653 handoff and exact successful 26652 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26653_HANDOFF_HASHES.sha256
          bash -n build_26653_r1_final_highlight_tone_fine_structure.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26653.py','validate_26653.py','verify_26653_authority.py','verify_26653_infrastructure.py','verify_26653_patches.py','verify_26653_regressions.py','verify_26653_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26653 candidate from successful 26652 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26653_r1_final_highlight_tone_fine_structure.sh
      - name: Verify exact 26653 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726653-26653-r1-final-highlight-tone-fine-structure-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726653-26653-r1-final-highlight-tone-fine-structure-debug.apk" build_26653_r1_final_highlight_tone_fine_structure_outputs/26653_R1_APK.sha256
      - name: Upload 26653 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26653-r1-final-highlight-tone-fine-structure
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726653-26653-r1-final-highlight-tone-fine-structure-debug.apk
            build_26653_r1_final_highlight_tone_fine_structure_outputs/
