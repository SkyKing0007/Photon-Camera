name: Build 26554 V1 Night Recovery + Jin Bypass + Processing Guard

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26554_*'
      - 'build_26554_v1_night_recovery_jin_processing_guard.sh'
      - 'validate_26554_v1_night_recovery_jin_ui.py'
      - 'extract_26554_protected_glsl.py'
      - 'scan_glsl_reserved_identifiers_26554.py'
      - '.github/workflows/build-26554-v1-night-recovery-jin-processing-guard.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26554 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26554_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26554_v1_night_recovery_jin_ui.py extract_26554_protected_glsl.py scan_glsl_reserved_identifiers_26554.py
          python3 validate_26554_v1_night_recovery_jin_ui.py --self-test
          python3 extract_26554_protected_glsl.py /dev/null .extractor-selftest-unused --self-test
          rm -rf .extractor-selftest-unused
          python3 scan_glsl_reserved_identifiers_26554.py --self-test
          bash -n build_26554_v1_night_recovery_jin_processing_guard.sh
          grep -F 'BASE_RUN_ID="33176439804"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9687928835"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="857dcc776a7d2fc1328f1e7b9a32383b82de8c2f"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26553-v1-1-before-26554-night-role-recovery"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'BASE_TAR_SHA="9963e1ed5c041199f996c4e65cbf4682685719530717948166913abc128e7419"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726554"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'VERSION_BUILD="26554"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26554_v1_night_recovery_jin_processing_guard.sh >/dev/null
          # Trigger isolation: the prior 26553 workflow must not react to V1_26554 files.
          ! grep -F "V1_26554_" .github/workflows/build-26553-v1-shutter-night-vgn-moto-diagnostic.yml

      - name: Build exact 26554 V1 candidate from successful compiled 26553 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26554_v1_night_recovery_jin_processing_guard.sh
          ./build_26554_v1_night_recovery_jin_processing_guard.sh

      - name: Upload 26554 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26554-v1-night-recovery-jin-processing-guard
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726554-26554-v1-night-recovery-jin-processing-guard-debug.apk
            build_26554_v1_night_recovery_jin_processing_guard_outputs/
