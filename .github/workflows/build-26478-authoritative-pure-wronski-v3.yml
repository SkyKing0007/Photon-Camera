name: Build 26478 Authoritative Pure Wronski V3 Corrected

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26478_authoritative_pure_wronski_v3.sh
      - transform_26478_pure_wronski_highlight_safe_v1.py
      - transform_26478_speaker_support_diagnostic_v1.py
      - .github/workflows/build-26478-authoritative-pure-wronski-v3.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded authoritative 26478 corrected
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard and syntax-check 26478 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "a5fa756f8b5cf1101e807b776728d08225f3e53e" || {
            echo "26478 correction commit must be direct child of exact failed infrastructure commit"
            git log -5 --oneline
            exit 1
          }
          test "$(git rev-parse HEAD~2)" = "be24c16cb091e753852b900384dbde6f8d32744e" || {
            echo "26478 correction chain must descend exactly from 26477 V3"
            git log -5 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          # This correction commit changes exactly the two guards and adds the
          # previously omitted core transform. Speaker diagnostic remains untouched.
          expected_current="$(printf '%s\n' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v3.yml' \
            'build_26478_authoritative_pure_wronski_v3.sh' \
            'transform_26478_pure_wronski_highlight_safe_v1.py' | sort)"
          actual_current="$(git diff --name-only HEAD^ HEAD | sort)"
          test "$actual_current" = "$expected_current" || {
            echo "26478 correction commit must contain exactly the three correction files"
            echo "ACTUAL:"
            printf '%s\n' "$actual_current"
            echo "EXPECTED:"
            printf '%s\n' "$expected_current"
            exit 1
          }

          # Across both infrastructure commits, the final tree must still represent
          # exactly the original four intended 26478 files and no app-source edit.
          test "$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 infrastructure chain changed app source directly"
            git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties
            exit 1
          }

          expected_combined="$(printf '%s\n' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v3.yml' \
            'build_26478_authoritative_pure_wronski_v3.sh' \
            'transform_26478_pure_wronski_highlight_safe_v1.py' \
            'transform_26478_speaker_support_diagnostic_v1.py' | sort)"
          actual_combined="$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD | sort)"
          test "$actual_combined" = "$expected_combined" || {
            echo "final 26478 two-commit infrastructure scope is not exactly four intended files"
            echo "ACTUAL:"
            printf '%s\n' "$actual_combined"
            echo "EXPECTED:"
            printf '%s\n' "$expected_combined"
            exit 1
          }
          bash -n ./build_26478_authoritative_pure_wronski_v3.sh
          python3 -m py_compile ./transform_26478_pure_wronski_highlight_safe_v1.py
          python3 -m py_compile ./transform_26478_speaker_support_diagnostic_v1.py
          echo "26478 corrected two-commit infrastructure lineage + syntax PASS"

      - name: Run guarded 26478 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26478_authoritative_pure_wronski_v3.sh
          ./build_26478_authoritative_pure_wronski_v3.sh

      - name: Upload 26478 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26478-authoritative-pure-wronski-v3
          if-no-files-found: error
          path: |
            build_26478_outputs/**
            IrisCamera-0.9726478-26478-pure-wronski-highlight-safe-speaker-diag-debug.apk
