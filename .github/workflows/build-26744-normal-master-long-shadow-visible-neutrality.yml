name: Build 26744 NORMAL Master Long Shadow Visible Neutrality
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26744_README_UPLOAD.txt'
      - '26744_*'
      - 'build_26744_normal_master_long_shadow_visible_neutrality.sh'
      - 'transform_26744.py'
      - 'validate_26744.py'
      - 'verify_26744_*.py'
      - 'handoff_payload_26744/**'
      - '.github/workflows/build-26744-normal-master-long-shadow-visible-neutrality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26744 handoff and exact successful 26743 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26744_HANDOFF_HASHES.sha256
          python3 -S verify_26744_infrastructure.py build_26744_normal_master_long_shadow_visible_neutrality.sh .github/workflows/build-26744-normal-master-long-shadow-visible-neutrality.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26744 candidate with successful 26743 procedure from exact successful 26743 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26744_normal_master_long_shadow_visible_neutrality.sh
      - name: Verify exact 26744 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726744-26744-normal-master-long-shadow-visible-neutrality-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726744-26744-normal-master-long-shadow-visible-neutrality-debug.apk' build_26744_normal_master_long_shadow_visible_neutrality_outputs/26744_APK.sha256
      - name: Upload 26744 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26744-normal-master-long-shadow-visible-neutrality
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726744-26744-normal-master-long-shadow-visible-neutrality-debug.apk
            build_26744_normal_master_long_shadow_visible_neutrality_outputs/
