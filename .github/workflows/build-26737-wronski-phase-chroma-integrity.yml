name: Build 26737 Wronski Phase Chroma Integrity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26737_README_UPLOAD.txt'
      - '26737_*'
      - 'build_26737_wronski_phase_chroma_integrity.sh'
      - 'transform_26737.py'
      - 'validate_26737.py'
      - 'verify_26737_*.py'
      - 'handoff_payload_26737/**'
      - 'authority_payload_26736/**'
      - '.github/workflows/build-26737-wronski-phase-chroma-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26737 handoff and exact 26736 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26737_HANDOFF_HASHES.sha256
          python3 -S verify_26737_infrastructure.py build_26737_wronski_phase_chroma_integrity.sh .github/workflows/build-26737-wronski-phase-chroma-integrity.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26737 candidate with successful 26736 procedure from sealed exact 26736 candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26737_wronski_phase_chroma_integrity.sh
      - name: Verify exact 26737 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726737-26737-wronski-phase-chroma-integrity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726737-26737-wronski-phase-chroma-integrity-debug.apk' build_26737_wronski_phase_chroma_integrity_outputs/26737_APK.sha256
      - name: Upload 26737 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26737-wronski-phase-chroma-integrity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726737-26737-wronski-phase-chroma-integrity-debug.apk
            build_26737_wronski_phase_chroma_integrity_outputs/
