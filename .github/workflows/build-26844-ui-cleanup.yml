name: Build 26844 UI Cleanup
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26844.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26844 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26844.txt
          grep -Fx 'RUN_26844_UI_CLEANUP' TRIGGER_26844.txt
          sha256sum -c 26844_HANDOFF_HASHES.sha256
          bash -n build_26844_ui_cleanup.sh
          python3 -S -m py_compile transform_26844.py validate_26844.py verify_26844_patches.py verify_26844_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26844_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26844_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26844 candidate from successful 26843 authority using exact successful 26843 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26844_ui_cleanup.sh
      - name: Verify exact 26844 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726844-26844-ui-cleanup-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726844-26844-ui-cleanup-debug.apk' build_26844_ui_cleanup_outputs/26844_APK.sha256
      - name: Upload 26844 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26844-ui-cleanup
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726844-26844-ui-cleanup-debug.apk
            build_26844_ui_cleanup_outputs/
