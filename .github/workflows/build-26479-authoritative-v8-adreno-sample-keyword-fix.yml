name: Build 26479 V8 Adreno Sample Keyword Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26479_authoritative_v8_adreno_sample_keyword_fix.sh
      - transform_26479_adreno_sample_keyword_portability_v1.py
      - .github/workflows/build-26479-authoritative-v8-adreno-sample-keyword-fix.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded 26479 V8 runtime shader portability
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard exact V8 infrastructure scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "5755b1a05777423b5af9f803a57235ac73efdf68"

          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26479 V8 infrastructure commit changed app source directly"
            exit 1
          }

          expected_current="$(printf '%s\n' \
            '.github/workflows/build-26479-authoritative-v8-adreno-sample-keyword-fix.yml' \
            'build_26479_authoritative_v8_adreno_sample_keyword_fix.sh' \
            'transform_26479_adreno_sample_keyword_portability_v1.py' | sort)"
          actual_current="$(git diff --name-only HEAD^ HEAD | sort)"
          test "$actual_current" = "$expected_current" || {
            echo "26479 V8 commit must contain exactly the three V8 infrastructure files"
            echo "ACTUAL:"
            printf '%s\n' "$actual_current"
            echo "EXPECTED:"
            printf '%s\n' "$expected_current"
            exit 1
          }

          test "$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26479 infrastructure chain changed committed app source"
            exit 1
          }

          test "$(git hash-object build_26478_authoritative_pure_wronski_v7.sh)" = "455f15e5f9c728565fa5beb868e180b3785e5626"
          test "$(git hash-object transform_26478_pure_wronski_highlight_safe_v1.py)" = "3ccd4492fcf23bf5af3ef39f68a142c713faa18c"
          test "$(git hash-object transform_26478_speaker_support_diagnostic_v2.py)" = "bc9fe5b72189b9b66025d5a12b8f1e6602b9d426"

          bash -n ./build_26479_authoritative_v8_adreno_sample_keyword_fix.sh
          python3 -m py_compile ./transform_26479_adreno_sample_keyword_portability_v1.py
          echo "26479 V8 exact infrastructure scope + precursor identities + syntax PASS"

      - name: Create exact pre-V8 backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-26478-v7-before-26479-adreno-sample-keyword-fix"
          TARGET="5755b1a05777423b5af9f803a57235ac73efdf68"
          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [ -n "$remote" ]; then
            test "$remote" = "$TARGET" || {
              echo "Existing V8 backup branch points to wrong commit: $remote"
              exit 1
            }
          else
            git push origin "$TARGET:refs/heads/$BACKUP"
          fi
          remote="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          test "$remote" = "$TARGET"
          echo "V8 backup branch exact successful V7 pre-modification state PASS"

      - name: Run guarded 26479 V8 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26479_authoritative_v8_adreno_sample_keyword_fix.sh
          ./build_26479_authoritative_v8_adreno_sample_keyword_fix.sh

      - name: Upload 26479 V8 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26479-v8-adreno-sample-keyword-fix
          if-no-files-found: error
          path: |
            build_26479_outputs/**
            IrisCamera-0.9726479-26479-pure-wronski-highlight-safe-speaker-diag-adreno-portability-debug.apk
