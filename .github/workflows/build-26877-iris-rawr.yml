name: Build 26877 B SR Ownership and Spektra Viewport
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26877.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact successful 26876 mechanics and generate guarded 26877 build
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26877.txt
          grep -Fx 'RUN_26877_B_SR_OWNER_SPEKTRA_VIEWPORT_V1' TRIGGER_26877.txt
          # Root-drop migration for the five files committed flat in run 40129213306.
          # The original compiled-candidate and strict runtime allowlist are unchanged.
          python3 -S - <<'PY_26877_ROOT_DROP'
          from pathlib import Path
          from hashlib import sha256
          import subprocess
          expected = dict(line.split('  ', 1) for line in Path('26877_HANDOFF_HASHES.sha256').read_text().splitlines())
          paths = {
              'GlesMgcRawSpatialStacker.kt': 'handoff_payload_26877/app/src/main/java/com/hinnka/mycamera/processor/GlesMgcRawSpatialStacker.kt',
              'CameraFragment.java': 'handoff_payload_26877/app/src/main/java/com/particlesdevs/photoncamera/ui/camera/CameraFragment.java',
              'layout_main_viewfinder.xml': 'handoff_payload_26877/app/src/main/res/layout/layout_main_viewfinder.xml',
              'version.properties': 'handoff_payload_26877/app/version.properties',
              '26877_runtime_ownership_spektra.py': 'regressions/26877_runtime_ownership_spektra.py',
          }
          for source, target in paths.items():
              src, dst = Path(source), Path(target)
              assert src.is_file() and not src.is_symlink(), ('missing root upload', source)
              assert not dst.is_symlink(), ('unexpected staged symlink', target)
              expected_sha = next((k for k, v in expected.items() if v == target), None)
              assert expected_sha and sha256(src.read_bytes()).hexdigest() == expected_sha, ('root upload bytes mismatch', source)
              if dst.exists():
                  assert dst.is_file() and dst.read_bytes() == src.read_bytes(), ('staged destination mismatch', target)
              else:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(src.read_bytes())
              assert sha256(dst.read_bytes()).hexdigest() == expected_sha
              print('PASS 26877 canonical root-drop stage:', source, '->', target)
          # Never stage generated payload under app/src or rewrite actual repository app source.
          assert not any(p.startswith('app/src/') or p == 'app/version.properties' for p in paths.values())
          PY_26877_ROOT_DROP
          sha256sum -c 26877_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py generate_26872_build.py generate_26873_build.py generate_26874_build.py generate_26875_build.py generate_26876_build.py generate_26877_build.py verify_26877_candidate.py verify_26877_patches.py verify_26876_expanded_shaders.py regressions/26877_runtime_ownership_spektra.py
          python3 -S generate_26871_build.py .
          test "$(sha256sum build_26871_iris_rawr.sh | awk '{print $1}')" = 'ca2d99d38c1de9a310205ba2c2af0fd7b49399f506e39a24fa94a6f15a338e0e'
          python3 -S generate_26872_build.py .
          test "$(sha256sum build_26872_iris_rawr.sh | awk '{print $1}')" = '042f4550b60ba7efb8e363230a76931969e98c2ffacda3fa310895e98f40b7db'
          python3 -S generate_26873_build.py .
          test "$(sha256sum build_26873_iris_rawr.sh | awk '{print $1}')" = '121323a5eba3dca75ffb6f05089f73b180a6e692015895237cd780babb92aaa4'
          python3 -S generate_26874_build.py .
          test "$(sha256sum build_26874_iris_rawr.sh | awk '{print $1}')" = '3b48818fd6cd6376f97cecca5a34b85ce4788e10a37435e3273beb2eddf3282a'
          python3 -S generate_26875_build.py .
          test "$(sha256sum build_26875_iris_rawr.sh | awk '{print $1}')" = 'b6c6f1db9f9910a0bff2175af756e3e92896d33eb6a82776de746eda645fa7a1'
          python3 -S generate_26876_build.py .
          test "$(sha256sum build_26876_iris_rawr.sh | awk '{print $1}')" = '525ce763e63ae2b8aa0a9a27d1da810e8969d855ea930552e45976d741c3b912'
          python3 -S generate_26877_build.py .
          sha256sum -c 26877_GENERATED_BUILD_SHA256.txt
          bash -n build_26877_iris_rawr.sh
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26877_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26877_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact inherited GLSL cleanup guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26877 native B build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26877_iris_rawr.sh
      - name: Verify exactly one intended 26877 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726877-26877-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726877-26877-iris-rawr-debug.apk' build_26877_iris_rawr_outputs/26877_APK.sha256
      - name: Upload authoritative 26877 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26877-b-sr-owner-spektra-viewfinder
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726877-26877-iris-rawr-debug.apk
            build_26877_iris_rawr_outputs/
