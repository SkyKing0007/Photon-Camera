name: Build 26569 V1.1 Encoder + Adaptive UI

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_1_26569_*'
      - 'REGRESSION_V1_1_26569_*'
      - 'build_26569_v1_1_encoder_ui.sh'
      - 'transform_26569_v1_1.py'
      - 'validate_26569_v1_1.py'
      - 'verify_26569_v1_1_authority.py'
      - 'verify_26569_v1_1_patches.py'
      - 'verify_26569_v1_1_shaders.py'
      - 'handoff_payload_26569_v1_1/**'
      - '.github/workflows/build-26569-v1-1-encoder-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26569 V1.1 package
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_1_26569_HANDOFF_HASHES.sha256
          test "$(wc -l < V1_1_26569_HANDOFF_HASHES.sha256)" -eq 28
          bash -n build_26569_v1_1_encoder_ui.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26569_v1_1.py',
              'validate_26569_v1_1.py',
              'verify_26569_v1_1_authority.py',
              'verify_26569_v1_1_patches.py',
              'verify_26569_v1_1_shaders.py',
          ]
          for name in files:
              source = Path(name).read_text()
              compile(source, name, 'exec')
          print('PASS sealed Python in-memory syntax gate')
          PY
          grep -F 'BASE_SUCCESS_COMMIT="6e1b655a145c8719fd64681fe5ff0e8eb11b8ce3"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'HANDOFF_PARENT_COMMIT="42096f895ef85181faaa70f303f34e1ea586d165"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'BASE_RUN_ID="33358885390"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9746086429"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="224acb3d97ae3387c7f7a2ccfc5a61b29d98c6f89108e2d74f4d1ce7043ead12"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'BASE_TAR_SHA="31274487b56a7770fb729345ade2ed24b86e8f6d0b09e413d40879df3784da19"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726569"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'VERSION_BUILD="26569"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'GLSLANG_VERSION="16.5.0"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F "./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace" build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'run 33357873019, job 99383368441' REGRESSION_V1_1_26569_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33401928594, job 99520075790' REGRESSION_V1_1_26569_CARRIED_FAILURES.txt >/dev/null
          grep -F 'the final sealed payload must be byte-identical to that independently frozen candidate' REGRESSION_V1_1_26569_CARRIED_FAILURES.txt >/dev/null
          grep -F 'IRIS_26569_TRUE2X_ENCODER_TIMING' REGRESSION_V1_1_26569_ENCODER_UI_CONTRACT.txt >/dev/null
          grep -F 'IRIS_26569_UI_COLLISION_GUARD' REGRESSION_V1_1_26569_ENCODER_UI_CONTRACT.txt >/dev/null
          grep -F 'snapshot_candidate_from_authority "$BASE" "$ROOT" "$LIVE_CANON"' build_26569_v1_1_encoder_ui.sh >/dev/null
          grep -F 'snapshot_candidate_from_authority "$BASE" "$ROOT" "$POST"' build_26569_v1_1_encoder_ui.sh >/dev/null
          python3 -S - <<'PY'
          from pathlib import Path
          s=Path('build_26569_v1_1_encoder_ui.sh').read_text()
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace", k)
          p=s.index('  verify_candidate_patches', n)
          b=s.index('pass "26569 PRE-BUILD SAFETY PROOF PASSED"', p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace', b)
          assert k < n < p < b < a, 'real Kotlin/Java -> real NDK -> patch proof -> PRE-BUILD marker -> assemble order violated'
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s, 'pre-compiler semantic validation must use authority-seeded canonical snapshot'
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s, 'pre-compiler authority must use authority-seeded canonical snapshot'
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s, 'post-build semantic validation must use authority-seeded canonical snapshot'
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s, 'post-build authority must use authority-seeded canonical snapshot'
          expected='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"
            mkdir -p "$dest_root"
            # Preserve the exact successful compiled-candidate file universe. Repository-only
            # module scaffolding and generated build outputs must never enter candidate scope.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert expected in s, 'successful authority-seeded snapshot mechanics changed'
          print('PASS 26569 V1.1 inherits canonical authority mechanics and adds required real NDK gate before patch proof')
          PY
          ! grep -R -F 'V1_1_26569_' .github/workflows --exclude='build-26569-v1-1-encoder-ui.yml'
          ! grep -R -F 'handoff_payload_26569_v1_1' .github/workflows --exclude='build-26569-v1-1-encoder-ui.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26569 candidate from successful compiled 26568 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26569_v1_1_encoder_ui.sh
          ./build_26569_v1_1_encoder_ui.sh

      - name: Upload 26569 V1.1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26569-v1-1-encoder-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726569-26569-v1-1-encoder-ui-debug.apk
            build_26569_v1_1_encoder_ui_outputs/
