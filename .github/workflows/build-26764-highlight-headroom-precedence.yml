name: Build 26764 Highlight Headroom Precedence
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26764_README_UPLOAD.txt'
      - '26764_*'
      - 'build_26764_highlight_headroom_precedence.sh'
      - 'transform_26764.py'
      - 'validate_26764.py'
      - 'verify_26764_*.py'
      - 'handoff_payload_26764/**'
      - '.github/workflows/build-26764-highlight-headroom-precedence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26764 handoff and successful 26763/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26764_HANDOFF_HASHES.sha256
          bash -n build_26764_highlight_headroom_precedence.sh
          python3 -S -m py_compile transform_26764.py validate_26764.py verify_26764_patches.py verify_26764_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26764 candidate from exact successful 26763 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26764_highlight_headroom_precedence.sh
      - name: Verify exact 26764 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726764-26764-highlight-headroom-precedence-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726764-26764-highlight-headroom-precedence-debug.apk' build_26764_highlight_headroom_precedence_outputs/26764_APK.sha256
      - name: Upload 26764 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26764-highlight-headroom-precedence
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726764-26764-highlight-headroom-precedence-debug.apk
            build_26764_highlight_headroom_precedence_outputs/
