name: Build 26742 Source-Valid Highlight Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26742_README_UPLOAD.txt'
      - '26742_*'
      - 'build_26742_source_valid_highlight_chroma.sh'
      - 'transform_26742.py'
      - 'validate_26742.py'
      - 'verify_26742_*.py'
      - 'handoff_payload_26742/**'
      - '.github/workflows/build-26742-source-valid-highlight-chroma.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26742 handoff and exact successful 26741 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26742_HANDOFF_HASHES.sha256
          python3 -S verify_26742_infrastructure.py build_26742_source_valid_highlight_chroma.sh .github/workflows/build-26742-source-valid-highlight-chroma.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26742 candidate with successful 26741 procedure from exact successful 26741 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26742_source_valid_highlight_chroma.sh
      - name: Verify exact 26742 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726742-26742-source-valid-highlight-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726742-26742-source-valid-highlight-chroma-debug.apk' build_26742_source_valid_highlight_chroma_outputs/26742_APK.sha256
      - name: Upload 26742 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26742-source-valid-highlight-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726742-26742-source-valid-highlight-chroma-debug.apk
            build_26742_source_valid_highlight_chroma_outputs/
