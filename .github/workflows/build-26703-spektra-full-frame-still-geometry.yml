name: Build 26703 Spektra Full-Frame Still Geometry

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26703_README_UPLOAD.txt'
      - '26703_*'
      - 'build_26703_spektra_full_frame_still_geometry.sh'
      - 'transform_26703.py'
      - 'validate_26703.py'
      - 'verify_26703_*.py'
      - 'handoff_payload_26703/**'
      - '.github/workflows/build-26703-spektra-full-frame-still-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26703 handoff and exact successful 26702 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26703_HANDOFF_HASHES.sha256
          bash -n build_26703_spektra_full_frame_still_geometry.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26703.py','validate_26703.py','verify_26703_authority.py','verify_26703_infrastructure.py','verify_26703_patches.py','verify_26703_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26703 candidate from successful 26702 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26703_spektra_full_frame_still_geometry.sh
      - name: Verify exact 26703 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726703-26703-spektra-full-frame-still-geometry-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726703-26703-spektra-full-frame-still-geometry-debug.apk" build_26703_spektra_full_frame_still_geometry_outputs/26703_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26703_spektra_full_frame_still_geometry_outputs/26703_apk_jni_contract.txt
      - name: Upload 26703 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26703-spektra-full-frame-still-geometry
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726703-26703-spektra-full-frame-still-geometry-debug.apk
            build_26703_spektra_full_frame_still_geometry_outputs/
