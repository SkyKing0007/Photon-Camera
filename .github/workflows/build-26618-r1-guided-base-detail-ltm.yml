name: Build 26618 R1 Guided Base Detail LTM

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26618_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26618_*'
      - 'R1_26618_*'
      - 'build_26618_r1_guided_base_detail_ltm.sh'
      - 'transform_26618_r1.py'
      - 'validate_26618_r1.py'
      - 'verify_26618_r1_*.py'
      - 'handoff_payload_26618/**'
      - '.github/workflows/build-26618-r1-guided-base-detail-ltm.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26618 package and successful 26614 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26618_HANDOFF_HASHES.sha256
          bash -n build_26618_r1_guided_base_detail_ltm.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26618_r1.py','validate_26618_r1.py','verify_26618_r1_authority.py','verify_26618_r1_infrastructure.py','verify_26618_r1_patches.py','verify_26618_r1_regressions.py','verify_26618_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26618 candidate from successful 26614 R1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26618_r1_guided_base_detail_ltm.sh
      - name: Upload 26618 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26618-r1-guided-base-detail-ltm
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726618-26618-r1-guided-base-detail-ltm-debug.apk
            build_26618_r1_guided_base_detail_ltm_outputs/
