name: Build 26765 Exact 26727 VGN Protection
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26765_README_UPLOAD.txt'
      - '26765_*'
      - 'build_26765_exact_26727_vgn_protection.sh'
      - 'transform_26765.py'
      - 'validate_26765.py'
      - 'verify_26765_*.py'
      - 'handoff_payload_26765/**'
      - '.github/workflows/build-26765-exact-26727-vgn-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26765 handoff and successful 26764/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26765_HANDOFF_HASHES.sha256
          bash -n build_26765_exact_26727_vgn_protection.sh
          python3 -S -m py_compile transform_26765.py validate_26765.py verify_26765_patches.py verify_26765_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26765 candidate from exact successful 26764 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26765_exact_26727_vgn_protection.sh
      - name: Verify exact 26765 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726765-26765-exact-26727-vgn-protection-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726765-26765-exact-26727-vgn-protection-debug.apk' build_26765_exact_26727_vgn_protection_outputs/26765_APK.sha256
      - name: Upload 26765 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26765-exact-26727-vgn-protection
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726765-26765-exact-26727-vgn-protection-debug.apk
            build_26765_exact_26727_vgn_protection_outputs/
