name: Build 26828 Chroma Zoom Timing
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26828.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26828 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26828.txt
          grep -Fx 'RUN_26828_CHROMA_ZOOM_TIMING' TRIGGER_26828.txt
          sha256sum -c 26828_HANDOFF_HASHES.sha256
          bash -n build_26828_chroma_zoom_timing.sh
          python3 -S -m py_compile transform_26828.py validate_26828.py verify_26828_patches.py verify_26828_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26828_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26828_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26828 candidate from successful 26827 authority using exact successful 26827 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26828_chroma_zoom_timing.sh
      - name: Verify exact 26828 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726828-26828-chroma-zoom-timing-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726828-26828-chroma-zoom-timing-debug.apk' build_26828_chroma_zoom_timing_outputs/26828_APK.sha256
      - name: Upload 26828 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26828-chroma-zoom-timing
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726828-26828-chroma-zoom-timing-debug.apk
            build_26828_chroma_zoom_timing_outputs/
