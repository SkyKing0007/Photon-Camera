name: Build 26472 Wronski Reference UHDR EdgeAware

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26472_wronski_reference_uhdr_edgeaware.sh
      - .github/workflows/build-26472-wronski-reference-uhdr-edgeaware.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26472 build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard workflow lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "f69206801c95e8095f9cce71ecba351e715a1367" || {
            echo "26472 infrastructure commit is not directly based on protected 26471 head"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26472 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26472 workflow lineage gate PASS"

      - name: Run guarded 26472 operation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26472_wronski_reference_uhdr_edgeaware.sh
          ./build_26472_wronski_reference_uhdr_edgeaware.sh

      - name: Upload 26472 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26472-wronski-reference-uhdr-edgeaware
          if-no-files-found: error
          path: |
            build_26472_outputs/**
            IrisCamera-0.9726472-26472-wronski-reference-uhdr-edgeaware-debug.apk
