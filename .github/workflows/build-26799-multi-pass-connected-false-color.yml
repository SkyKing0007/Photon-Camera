name: Build 26799 Multi Pass Connected False Color
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26799.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26799 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26799.txt
          grep -Fx 'RUN_26799_MULTI_PASS_CONNECTED_FALSE_COLOR' TRIGGER_26799.txt
          sha256sum -c 26799_HANDOFF_HASHES.sha256
          bash -n build_26799_multi_pass_connected_false_color.sh
          python3 -S -m py_compile transform_26799.py validate_26799.py verify_26799_patches.py verify_26799_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26799_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26799_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26799 candidate from successful 26798 authority using exact successful 26798 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26799_multi_pass_connected_false_color.sh
      - name: Verify exact 26799 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726799-26799-multi-pass-connected-false-color-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726799-26799-multi-pass-connected-false-color-debug.apk' build_26799_multi_pass_connected_false_color_outputs/26799_APK.sha256
      - name: Upload 26799 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26799-multi-pass-connected-false-color
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726799-26799-multi-pass-connected-false-color-debug.apk
            build_26799_multi_pass_connected_false_color_outputs/
