name: Build 26548 V1 Integrated Night + Moto Compatibility

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26548-v1-integrated-night-moto-compat.yml'
      - 'build_26548_v1_integrated_night_moto_compat.sh'
      - 'validate_26548_v1_integrated.py'
      - 'V1_26548_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26548-v1-integrated-night-moto-compat
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26548 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26548_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26548_v1_integrated.py
          python3 validate_26548_v1_integrated.py --self-test
          bash -n build_26548_v1_integrated_night_moto_compat.sh
          grep -F 'VERSION_NAME="0.9726548"' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F 'VERSION_BUILD="26548"' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F 'BASE_RUN_ID="33098575745"' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9657611983"' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F 'BACKUP BRANCH: NOT REQUIRED' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26548_v1_integrated_night_moto_compat.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26548_v1_integrated_night_moto_compat.sh >/dev/null

      - name: Build exact 26548 candidate from successful 26547 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build_26548_v1_integrated_night_moto_compat.sh

      - name: Upload 26548 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26548-v1-integrated-night-moto-compat
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726548-26548-v1-integrated-night-moto-compat-debug.apk
            build_26548_v1_integrated_night_moto_compat_outputs/
