name: Build 26819 NORMAL Clipped Chroma Validity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26819.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26819 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26819.txt
          grep -Fx 'RUN_26819_NORMAL_CLIPPED_CHROMA_VALIDITY' TRIGGER_26819.txt
          sha256sum -c 26819_HANDOFF_HASHES.sha256
          bash -n build_26819_normal_clipped_chroma_validity.sh
          python3 -S -m py_compile transform_26819.py validate_26819.py verify_26819_patches.py verify_26819_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26819_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26819_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26819 candidate from successful 26818 authority using exact successful 26818 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26819_normal_clipped_chroma_validity.sh
      - name: Verify exact 26819 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726819-26819-normal-clipped-chroma-validity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726819-26819-normal-clipped-chroma-validity-debug.apk' build_26819_normal_clipped_chroma_validity_outputs/26819_APK.sha256
      - name: Upload 26819 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26819-normal-clipped-chroma-validity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726819-26819-normal-clipped-chroma-validity-debug.apk
            build_26819_normal_clipped_chroma_validity_outputs/
