name: Build 26588 V1 Sabre Short Highlight Compiler Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26588_*'
      - 'REGRESSION_V1_26588_*'
      - 'build_26588_v1_sabre_short_highlight_compiler_fix.sh'
      - 'transform_26588_v1.py'
      - 'validate_26588_v1.py'
      - 'verify_26588_v1_authority.py'
      - 'verify_26588_v1_regressions.py'
      - 'verify_26588_v1_patches.py'
      - 'verify_26588_v1_shaders.py'
      - 'handoff_payload_26588_v1/**'
      - '.github/workflows/build-26588-v1-sabre-short-highlight-compiler-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26588 V1 package and inherited successful 26586 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26588_HANDOFF_HASHES.sha256
          bash -n build_26588_v1_sabre_short_highlight_compiler_fix.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26588_v1.py','validate_26588_v1.py','verify_26588_v1_authority.py','verify_26588_v1_regressions.py','verify_26588_v1_patches.py','verify_26588_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26588_v1_sabre_short_highlight_compiler_fix.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="40f0449cd0281c8b8d25afe2be0d68682afd7077"' in s
          assert 'BASE_RUN_ID="33763063933"' in s
          assert 'BASE_JOB_ID="100673914579"' in s
          assert 'BASE_ARTIFACT_ID="9896466561"' in s
          assert 'BASE_ARTIFACT_SHA="ee04f0e9eda2ccf44c70ea024a631489db098e7044445cc3b576529bee13e2b7"' in s
          assert 'BASE_TAR_SHA="2f91feb5396c5a11341855df39877a94fad37bbfbe920cfc9aa87763b1bbdc22"' in s
          assert 'VERSION_NAME="0.9726588"' in s and 'VERSION_BUILD="26588"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 6 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26588 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert 'HANDOFF_PARENT_COMMIT="c4dbede9db7ebc6a7a99488412e6b67bd3119a1e"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          print('PASS sealed syntax + successful 26586 authority + inherited compiler/build order')
          PY
          grep -F 'Broad pink, pink/green dotted edges, cyan/green speckling, zipper and ghost artifacts are release-blocking regressions.' REGRESSION_V1_26588_SHORT_RESTORE_SAFETY.txt >/dev/null
          grep -F "GlesMgcRawSpatialStacker.kt:779:30 Unresolved reference 'mergedFrameCount'." REGRESSION_V1_26588_KOTLIN_MERGED_FRAME_SCOPE.txt >/dev/null
          grep -F 'viewfinder/body meter authority remains the successful 26584 structured P90 / 0.965 branch' REGRESSION_V1_26588_CARRIED_26586.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26588_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26588_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F 'df9f2194a904e4a0c746ee671312252a90677536' V1_26588_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26586.txt >/dev/null
          grep -F 'c8a9cdd026aced8f6a2726bdb4739ad2eeb32337' V1_26588_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26586.txt >/dev/null
          ! grep -R -F 'V1_26588_' .github/workflows --exclude='build-26588-v1-sabre-short-highlight-compiler-fix.yml'
          ! grep -R -F 'handoff_payload_26588_v1' .github/workflows --exclude='build-26588-v1-sabre-short-highlight-compiler-fix.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact corrected 26588 candidate from successful compiled 26586 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26588_v1_sabre_short_highlight_compiler_fix.sh

      - name: Upload 26588 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26588-v1-sabre-short-highlight-compiler-fix
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726588-26588-v1-sabre-short-highlight-compiler-fix-debug.apk
            build_26588_v1_sabre_short_highlight_compiler_fix_outputs/
