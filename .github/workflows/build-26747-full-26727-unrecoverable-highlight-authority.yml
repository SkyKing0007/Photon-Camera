name: Build 26747 Full 26727 Unrecoverable Highlight Authority
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26747_README_UPLOAD.txt'
      - '26747_*'
      - 'build_26747_full_26727_unrecoverable_highlight_authority.sh'
      - 'transform_26747.py'
      - 'validate_26747.py'
      - 'verify_26747_*.py'
      - 'handoff_payload_26747/**'
      - '.github/workflows/build-26747-full-26727-unrecoverable-highlight-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26747 handoff and exact successful 26746 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26747_HANDOFF_HASHES.sha256
          python3 -S verify_26747_infrastructure.py build_26747_full_26727_unrecoverable_highlight_authority.sh .github/workflows/build-26747-full-26727-unrecoverable-highlight-authority.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26747 candidate with successful 26746 procedure from exact successful 26746 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26747_full_26727_unrecoverable_highlight_authority.sh
      - name: Verify exact 26747 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726747-26747-full-26727-unrecoverable-highlight-authority-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726747-26747-full-26727-unrecoverable-highlight-authority-debug.apk' build_26747_full_26727_unrecoverable_highlight_authority_outputs/26747_APK.sha256
      - name: Upload 26747 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26747-full-26727-unrecoverable-highlight-authority
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726747-26747-full-26727-unrecoverable-highlight-authority-debug.apk
            build_26747_full_26727_unrecoverable_highlight_authority_outputs/
