name: Build 26690 R1 Unspektrawesome JNI Startup Containment

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26690_R1_README_UPLOAD.txt'
      - 'R1_26690_*'
      - 'build_26690_r1_unspektrawesome_jni_startup_containment.sh'
      - 'transform_26690.py'
      - 'validate_26690.py'
      - 'verify_26690_*.py'
      - 'handoff_payload_26690/**'
      - '.github/workflows/build-26690-r1-unspektrawesome-jni-startup-containment.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26690 handoff and exact successful 26689 R1.2 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26690_HANDOFF_HASHES.sha256
          bash -n build_26690_r1_unspektrawesome_jni_startup_containment.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26690.py','validate_26690.py','verify_26690_authority.py','verify_26690_infrastructure.py','verify_26690_patches.py','verify_26690_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26690 candidate from successful 26689 R1.2 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26690_r1_unspektrawesome_jni_startup_containment.sh
      - name: Verify exact 26690 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726690-26690-r1-unspektrawesome-jni-startup-containment-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726690-26690-r1-unspektrawesome-jni-startup-containment-debug.apk" build_26690_r1_unspektrawesome_jni_startup_containment_outputs/26690_R1_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26690_r1_unspektrawesome_jni_startup_containment_outputs/26690_apk_jni_contract.txt
      - name: Upload 26690 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26690-r1-unspektrawesome-jni-startup-containment
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726690-26690-r1-unspektrawesome-jni-startup-containment-debug.apk
            build_26690_r1_unspektrawesome_jni_startup_containment_outputs/
