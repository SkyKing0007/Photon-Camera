name: Build 26774 Histogram Downward Hinge
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26774.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26774 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26774.txt
          grep -Fx 'RUN_26774_HISTOGRAM_DOWNWARD_HINGE' TRIGGER_26774.txt
          sha256sum -c 26774_HANDOFF_HASHES.sha256
          bash -n build_26774_histogram_downward_hinge.sh
          python3 -S -m py_compile transform_26774.py validate_26774.py verify_26774_patches.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26774_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26774_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26774 candidate from successful 26773 authority using unchanged successful procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26774_histogram_downward_hinge.sh
      - name: Verify exact 26774 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726774-26774-histogram-downward-hinge-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726774-26774-histogram-downward-hinge-debug.apk' build_26774_histogram_downward_hinge_outputs/26774_APK.sha256
      - name: Upload 26774 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26774-histogram-downward-hinge
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726774-26774-histogram-downward-hinge-debug.apk
            build_26774_histogram_downward_hinge_outputs/
