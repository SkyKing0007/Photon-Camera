name: Build 26632 R1 Output-Referred UHDR + SDR Rolloff

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26632_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26632_*'
      - 'R1_26632_*'
      - 'build_26632_r1_output_referred_uhdr_sdr_rolloff.sh'
      - 'transform_26632_r1.py'
      - 'validate_26632_r1.py'
      - 'verify_26632_r1_*.py'
      - 'handoff_payload_26632_r1/**'
      - '.github/workflows/build-26632-r1-output-referred-uhdr-sdr-rolloff.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26632 R1 package and exact successful 26631 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26632_HANDOFF_HASHES.sha256
          bash -n build_26632_r1_output_referred_uhdr_sdr_rolloff.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26632_r1.py','validate_26632_r1.py','verify_26632_r1_authority.py','verify_26632_r1_infrastructure.py','verify_26632_r1_patches.py','verify_26632_r1_regressions.py','verify_26632_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26632 R1 candidate from successful compiled 26631 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26632_r1_output_referred_uhdr_sdr_rolloff.sh
      - name: Upload 26632 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26632-r1-output-referred-uhdr-sdr-rolloff
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726632-26632-r1-output-referred-uhdr-sdr-rolloff-debug.apk
            build_26632_r1_output_referred_uhdr_sdr_rolloff_outputs/
