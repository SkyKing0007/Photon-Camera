name: Build 26513 MGC Native Detail + Output Completion

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26513_mgc_native_detail_output_completion.py
      - validate_26513_mgc_native_detail_output_completion.py
      - build_26513_mgc_native_detail_output_completion.sh
      - 26513_BASE_26512_COMMIT.txt
      - 26513_README_UPLOAD.txt
      - 26513_HANDOFF_HASHES.sha256
      - .github/workflows/build-26513-mgc-native-detail-output-completion.yml

permissions:
  contents: read

concurrency:
  group: photon-26513-mgc-native-detail-output-completion
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26513 from golden successful 26512
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26513 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26513_HANDOFF_HASHES.sha256
          bash -n build_26513_mgc_native_detail_output_completion.sh
          python3 -m py_compile apply_26513_mgc_native_detail_output_completion.py validate_26513_mgc_native_detail_output_completion.py
          [[ "$(tr -d '\r\n' < 26513_BASE_26512_COMMIT.txt)" == "0c44699978a5e719b67e541bc73bc2bdb8ff671c" ]]
          grep -F 'SUCCESSFUL_26512_HEAD="0c44699978a5e719b67e541bc73bc2bdb8ff671c"' build_26513_mgc_native_detail_output_completion.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26512-success-before-26513-20260819"' build_26513_mgc_native_detail_output_completion.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726513"' build_26513_mgc_native_detail_output_completion.sh >/dev/null
          grep -F 'VERSION_BUILD="26513"' build_26513_mgc_native_detail_output_completion.sh >/dev/null
          grep -F 'BASE_BUILDER_SHA="e4cae018f5fa19be80016c44b153b6110e5a8de47b191a9aef44fadc1dc7ca87"' build_26513_mgc_native_detail_output_completion.sh >/dev/null
          grep -F 'IRIS_26513_RGB_DETAIL_SCALE_MULTIPLIER = 1.10f' apply_26513_mgc_native_detail_output_completion.py >/dev/null
          grep -F 'IRIS_26513_RGB_DETAIL_SCALE_MAX = 0.40f' apply_26513_mgc_native_detail_output_completion.py >/dev/null
          grep -F 'IRIS_26513_JPEG_COMPLETION_AFTER_SAVE' apply_26513_mgc_native_detail_output_completion.py >/dev/null
          grep -F 'IRIS_26513_GAINMAP_DIAGNOSTIC_DECIMATION' apply_26513_mgc_native_detail_output_completion.py >/dev/null
          grep -F 'IRIS_26513_FAST_HUFFMAN' apply_26513_mgc_native_detail_output_completion.py >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          a=Path('apply_26513_mgc_native_detail_output_completion.py').read_text()
          v=Path('validate_26513_mgc_native_detail_output_completion.py').read_text()
          b=Path('build_26513_mgc_native_detail_output_completion.sh').read_text()
          assert "'app/src/main/java/com/hinnka/mycamera/processor/MgcSpatialMergeTuning.kt'" in a
          assert 'lumaStrengthScale = 1.0f' in v and 'chromaStrengthScale = 1.0f' in v
          assert 'GAINMAP_DOWNSAMPLE = 1' in v and 'TJSAMP_444' in v
          assert 'sha256sum -c "$BASE_HANDOFF"' in b
          assert '26513_RUNTIME_DELTA_FROM_GOLDEN_26512.patch' in b
          for bad in ('apply_26502','apply_26503','apply_26504','apply_26505','apply_26506','apply_26509','apply_26510','apply_26511'):
              assert bad not in b,bad
          print('PASS: 26513 static no-regression handoff guards')
          PY

      - name: Build guarded 26513 from successful 26512
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26513_mgc_native_detail_output_completion.sh apply_26513_mgc_native_detail_output_completion.py validate_26513_mgc_native_detail_output_completion.py
          ./build_26513_mgc_native_detail_output_completion.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26513-mgc-native-detail-output-completion
          path: |
            IrisCamera-0.9726513-26513-mgc-native-detail-output-completion-debug.apk
            build_26513_mgc_native_detail_output_completion_outputs/
          if-no-files-found: warn
