name: Build 26707 Neutral Chroma Leak

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26707_README_UPLOAD.txt'
      - '26707_*'
      - 'build_26707_neutral_chroma_leak.sh'
      - 'transform_26707.py'
      - 'validate_26707.py'
      - 'verify_26707_*.py'
      - 'handoff_payload_26707/**'
      - '.github/workflows/build-26707-neutral-chroma-leak.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26707 handoff and exact successful 26706 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26707_HANDOFF_HASHES.sha256
          bash -n build_26707_neutral_chroma_leak.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26707.py','validate_26707.py','verify_26707_authority.py','verify_26707_infrastructure.py','verify_26707_patches.py','verify_26707_regressions.py','verify_26707_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26707 candidate from successful 26706 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26707_neutral_chroma_leak.sh
      - name: Verify exact 26707 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726707-26707-neutral-chroma-leak-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726707-26707-neutral-chroma-leak-debug.apk" build_26707_neutral_chroma_leak_outputs/26707_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26707_neutral_chroma_leak_outputs/26707_apk_jni_contract.txt
      - name: Upload 26707 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26707-neutral-chroma-leak
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726707-26707-neutral-chroma-leak-debug.apk
            build_26707_neutral_chroma_leak_outputs/
