name: Build 26553 V1 Shutter + Night Single-Flight + VGN + Moto Diagnostics

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26553-v1-shutter-night-vgn-moto-diagnostic.yml'
      - 'build_26553_v1_shutter_night_vgn_moto_diagnostic.sh'
      - 'validate_26553_v1_shutter_night_vgn_moto.py'
      - 'extract_26553_embedded_glsl.py'
      - 'scan_glsl_reserved_identifiers_26553.py'
      - 'V1_26553_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26553 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26553_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26553_v1_shutter_night_vgn_moto.py extract_26553_embedded_glsl.py scan_glsl_reserved_identifiers_26553.py
          python3 validate_26553_v1_shutter_night_vgn_moto.py --self-test
          python3 extract_26553_embedded_glsl.py /dev/null .extractor-selftest-unused --self-test
          rm -rf .extractor-selftest-unused
          python3 scan_glsl_reserved_identifiers_26553.py --self-test
          bash -n build_26553_v1_shutter_night_vgn_moto_diagnostic.sh
          grep -F 'BASE_RUN_ID="33143648461"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9674993907"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="8e4904530e767ac8bdd3fbf3ec8d81e98cd6e8ec"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'BASE_TAR_SHA="98fea536c5a4372e09ec9d6d4af2cc871b3534a90afd678dcd265992ef736068"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726553"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'VERSION_BUILD="26553"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'python3 "$SCAN_GLSL" "$WORK/runtime_glsl_compiler/directionalSmooth.comp" "$WORK/runtime_glsl_compiler/iirRgb.comp"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'glslangValidator -S comp "$WORK/runtime_glsl_compiler/directionalSmooth.comp"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F 'glslangValidator -S comp "$WORK/runtime_glsl_compiler/iirRgb.comp"' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26553_v1_shutter_night_vgn_moto_diagnostic.sh >/dev/null
          grep -F -- "- 'V1_26552_*'" .github/workflows/build-26552-v1-dynamic-night-vgn-shutter-ring.yml >/dev/null

      - name: Build exact 26553 candidate from successful compiled 26552 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26553_v1_shutter_night_vgn_moto_diagnostic.sh
          ./build_26553_v1_shutter_night_vgn_moto_diagnostic.sh

      - name: Upload 26553 V1 proof + APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26553-v1-shutter-night-vgn-moto-diagnostic
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726553-26553-v1-shutter-night-vgn-moto-diagnostic-debug.apk
            build_26553_v1_shutter_night_vgn_moto_diagnostic_outputs/
