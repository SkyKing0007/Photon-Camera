name: Build 26789 JPEG In-RBF LCA Long Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26789.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26789 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26789.txt
          grep -Fx 'RUN_26789_JPEG_IN_RBF_LCA_LONG_CHROMA' TRIGGER_26789.txt
          sha256sum -c 26789_HANDOFF_HASHES.sha256
          bash -n build_26789_jpeg_in_rbf_lca_long_chroma.sh
          python3 -S -m py_compile transform_26789.py validate_26789.py verify_26789_patches.py verify_26789_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26789_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26789_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26789 candidate from successful 26788 authority using exact successful 26788 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26789_jpeg_in_rbf_lca_long_chroma.sh
      - name: Verify exact 26789 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726789-26789-jpeg-in-rbf-lca-long-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726789-26789-jpeg-in-rbf-lca-long-chroma-debug.apk' build_26789_jpeg_in_rbf_lca_long_chroma_outputs/26789_APK.sha256
      - name: Upload 26789 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26789-jpeg-in-rbf-lca-long-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726789-26789-jpeg-in-rbf-lca-long-chroma-debug.apk
            build_26789_jpeg_in_rbf_lca_long_chroma_outputs/
