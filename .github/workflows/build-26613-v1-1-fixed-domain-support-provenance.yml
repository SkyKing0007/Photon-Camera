name: Build 26613 V1.1 Fixed Domain HDR + Sabre Support

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26613_V1_1_README_UPLOAD.txt'
      - 'REGRESSION_V1_1_26613_*'
      - 'V1_1_26613_*'
      - 'build_26613_v1_1_fixed_domain_support_provenance.sh'
      - 'transform_26613_v1_1.py'
      - 'validate_26613_v1_1.py'
      - 'verify_26613_v1_1_*.py'
      - 'handoff_payload_26613_v1_1/**'
      - '.github/workflows/build-26613-v1-1-fixed-domain-support-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26613 V1.1 package and successful 26612 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_1_26613_HANDOFF_HASHES.sha256
          bash -n build_26613_v1_1_fixed_domain_support_provenance.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26613_v1_1.py','validate_26613_v1_1.py','verify_26613_v1_1_authority.py','verify_26613_v1_1_infrastructure.py','verify_26613_v1_1_patches.py','verify_26613_v1_1_regressions.py','verify_26613_v1_1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26613 V1.1 candidate from successful compiled 26612 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26613_v1_1_fixed_domain_support_provenance.sh
      - name: Upload 26613 V1.1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26613-v1-1-fixed-domain-support-provenance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726613-26613-v1-1-fixed-domain-support-provenance-debug.apk
            build_26613_v1_1_fixed_domain_support_provenance_outputs/
