name: Build 26788 JPEG CFA Phase Residual
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26788.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26788 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26788.txt
          grep -Fx 'RUN_26788_JPEG_CFA_PHASE_RESIDUAL' TRIGGER_26788.txt
          sha256sum -c 26788_HANDOFF_HASHES.sha256
          bash -n build_26788_jpeg_cfa_phase_residual.sh
          python3 -S -m py_compile transform_26788.py validate_26788.py verify_26788_patches.py verify_26788_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26788_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26788_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26788 candidate from successful 26787 authority using exact successful 26787 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26788_jpeg_cfa_phase_residual.sh
      - name: Verify exact 26788 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726788-26788-jpeg-cfa-phase-residual-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726788-26788-jpeg-cfa-phase-residual-debug.apk' build_26788_jpeg_cfa_phase_residual_outputs/26788_APK.sha256
      - name: Upload 26788 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26788-jpeg-cfa-phase-residual
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726788-26788-jpeg-cfa-phase-residual-debug.apk
            build_26788_jpeg_cfa_phase_residual_outputs/
