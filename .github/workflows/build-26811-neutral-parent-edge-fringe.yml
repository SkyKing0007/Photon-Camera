name: Build 26811 Resolve Boundary + Direct Exact Gallery
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26811.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26811 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26811.txt
          grep -Fx 'RUN_26811_RESOLVE_BOUNDARY_GALLERY_DIRECT' TRIGGER_26811.txt
          sha256sum -c 26811_HANDOFF_HASHES.sha256
          bash -n build_26811_neutral_parent_edge_fringe.sh
          python3 -S -m py_compile transform_26811.py validate_26811.py verify_26811_patches.py verify_26811_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26811_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26811_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26811 candidate from successful 26810 authority using exact successful 26810 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26811_neutral_parent_edge_fringe.sh
      - name: Verify exact 26811 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726811-26811-resolve-boundary-gallery-direct-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726811-26811-resolve-boundary-gallery-direct-debug.apk' build_26811_neutral_parent_edge_fringe_outputs/26811_APK.sha256
      - name: Upload 26811 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26811-resolve-boundary-gallery-direct
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726811-26811-resolve-boundary-gallery-direct-debug.apk
            build_26811_neutral_parent_edge_fringe_outputs/
