name: Build 26717 Downloads Iris Log Storage
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26717_README_UPLOAD.txt'
      - '26717_*'
      - 'build_26717_downloads_iris_log_storage.sh'
      - 'transform_26717.py'
      - 'validate_26717.py'
      - 'verify_26717_*.py'
      - 'handoff_payload_26717/**'
      - '.github/workflows/build-26717-downloads-iris-log-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26717 handoff and exact 26716 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26717_HANDOFF_HASHES.sha256
          python3 -S verify_26717_infrastructure.py build_26717_downloads_iris_log_storage.sh .github/workflows/build-26717-downloads-iris-log-storage.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26717 candidate with 26716 procedure from successful 26715 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26717_downloads_iris_log_storage.sh
      - name: Verify exact 26717 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726717-26717-downloads-iris-log-storage-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726717-26717-downloads-iris-log-storage-debug.apk' build_26717_downloads_iris_log_storage_outputs/26717_APK.sha256
      - name: Upload 26717 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26717-downloads-iris-log-storage
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726717-26717-downloads-iris-log-storage-debug.apk
            build_26717_downloads_iris_log_storage_outputs/
