name: Build 26682 R1 Spektra Mode Ownership

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26682_R1_README_UPLOAD.txt'
      - 'R1_26682_*'
      - 'build_26682_r1_spektra_mode_ownership.sh'
      - 'transform_26682.py'
      - 'validate_26682.py'
      - 'verify_26682_*.py'
      - 'handoff_payload_26682/**'
      - '.github/workflows/build-26682-r1-spektra-mode-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26682 handoff and exact successful 26681 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26682_HANDOFF_HASHES.sha256
          bash -n build_26682_r1_spektra_mode_ownership.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26682.py','validate_26682.py','verify_26682_authority.py','verify_26682_infrastructure.py','verify_26682_patches.py','verify_26682_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26682 candidate from successful 26681 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26682_r1_spektra_mode_ownership.sh
      - name: Verify exact 26682 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726682-26682-r1-spektra-mode-ownership-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726682-26682-r1-spektra-mode-ownership-debug.apk" build_26682_r1_spektra_mode_ownership_outputs/26682_R1_APK.sha256
      - name: Upload 26682 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26682-r1-spektra-mode-ownership
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726682-26682-r1-spektra-mode-ownership-debug.apk
            build_26682_r1_spektra_mode_ownership_outputs/
