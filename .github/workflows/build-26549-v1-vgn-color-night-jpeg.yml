name: Build 26549 V1 VGN Color + Night JPEG

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26549-v1-vgn-color-night-jpeg.yml'
      - 'build_26549_v1_vgn_color_night_jpeg.sh'
      - 'validate_26549_v1_vgn_color_night_jpeg.py'
      - 'extract_26549_vgn_shaders.py'
      - 'V1_26549_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26549-v1-vgn-color-night-jpeg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26549 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26549_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26549_v1_vgn_color_night_jpeg.py extract_26549_vgn_shaders.py
          python3 validate_26549_v1_vgn_color_night_jpeg.py --self-test
          bash -n build_26549_v1_vgn_color_night_jpeg.sh
          grep -F 'BASE_RUN_ID="33112963353"' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9663418274"' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726549"' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F 'VERSION_BUILD="26549"' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26549_v1_vgn_color_night_jpeg.sh >/dev/null
          grep -F 'chmod +x build_26549_v1_vgn_color_night_jpeg.sh' .github/workflows/build-26549-v1-vgn-color-night-jpeg.yml >/dev/null
          grep -F './build_26549_v1_vgn_color_night_jpeg.sh' .github/workflows/build-26549-v1-vgn-color-night-jpeg.yml >/dev/null
          # Prior 26548 workflows are scoped to 26548 names and must not overlap this package.
          grep -F -- "- 'V1_2_26548_*'" .github/workflows/build-26548-v1-2-night-owner-contract.yml >/dev/null
          grep -F -- "- 'V1_26548_*'" .github/workflows/build-26548-v1-integrated-night-moto-compat.yml >/dev/null

      - name: Build exact 26549 candidate from successful 26548 V1.2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x build_26549_v1_vgn_color_night_jpeg.sh
          ./build_26549_v1_vgn_color_night_jpeg.sh

      - name: Upload 26549 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26549-v1-vgn-color-night-jpeg
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726549-26549-v1-vgn-color-night-jpeg-debug.apk
            build_26549_v1_vgn_color_night_jpeg_outputs/
