name: Build 26482 Bjzhou CFA Domain and Wronski Performance V1

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 26481_successful_source.patch
      - 26481_successful_after.sha256
      - transform_26482_bjzhou_cfa_performance_v1.py
      - build_26482_bjzhou_cfa_performance_v1.sh
      - .github/workflows/build-26482-bjzhou-cfa-performance-v1.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded direct 26481 to 26482
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout experimental infrastructure only
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify committed 26481 checkpoint inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum 26481_successful_source.patch | awk '{print $1}')" = "65a3859eaba66503dcf98067aed29208e6c2ab7dbb74dc1077004ac03ad8c039"
          test "$(sha256sum 26481_successful_after.sha256 | awk '{print $1}')" = "6d1906925e653e61d3f0368b1f627c1fe204d76586d5265267b4b4109f4f9d95"
          test "$(sha256sum transform_26482_bjzhou_cfa_performance_v1.py | awk '{print $1}')" = "390ec44be747409f13d38eafaa7947c7b5cba8e1920d70d258fa1d608c6339d1"
          test "$(sha256sum build_26482_bjzhou_cfa_performance_v1.sh | awk '{print $1}')" = "a0af3e2df81de82fe8eafec672e52c3039ed5c7f7cd8e2422f4fc6684e220d39"
          python3 -m py_compile transform_26482_bjzhou_cfa_performance_v1.py
          bash -n build_26482_bjzhou_cfa_performance_v1.sh
          echo "26481 checkpoint + 26482 infrastructure identity PASS"

      - name: Install runtime GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version

      - name: Run strict direct-successful-26481 procedure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26482_bjzhou_cfa_performance_v1.sh
          ./build_26482_bjzhou_cfa_performance_v1.sh

      - name: Upload complete 26482 checkpoint and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26482-bjzhou-cfa-performance-v1
          if-no-files-found: warn
          path: |
            build_26482_outputs/**
            IrisCamera-0.9726482-26482-bjzhou-cfa-performance-debug.apk
