name: Build 26745 Bright Fringe Hue Authority
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26745_README_UPLOAD.txt'
      - '26745_*'
      - 'build_26745_bright_fringe_hue_authority.sh'
      - 'transform_26745.py'
      - 'validate_26745.py'
      - 'verify_26745_*.py'
      - 'handoff_payload_26745/**'
      - '.github/workflows/build-26745-bright-fringe-hue-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26745 handoff and exact successful 26743 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26745_HANDOFF_HASHES.sha256
          python3 -S verify_26745_infrastructure.py build_26745_bright_fringe_hue_authority.sh .github/workflows/build-26745-bright-fringe-hue-authority.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26745 candidate with successful 26743 procedure from exact successful 26743 Actions candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26745_bright_fringe_hue_authority.sh
      - name: Verify exact 26745 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726745-26745-bright-fringe-hue-authority-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726745-26745-bright-fringe-hue-authority-debug.apk' build_26745_bright_fringe_hue_authority_outputs/26745_APK.sha256
      - name: Upload 26745 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26745-bright-fringe-hue-authority
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726745-26745-bright-fringe-hue-authority-debug.apk
            build_26745_bright_fringe_hue_authority_outputs/
