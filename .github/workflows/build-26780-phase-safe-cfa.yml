name: Build 26780 Phase Safe CFA
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26780.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26780 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26780.txt
          grep -Fx 'RUN_26780_PHASE_SAFE_CFA' TRIGGER_26780.txt
          sha256sum -c 26780_HANDOFF_HASHES.sha256
          bash -n build_26780_phase_safe_cfa.sh
          python3 -S -m py_compile transform_26780.py validate_26780.py verify_26780_patches.py verify_26780_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26780_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26780_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26780 candidate from successful 26779 authority using exact successful 26778 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26780_phase_safe_cfa.sh
      - name: Verify exact 26780 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726780-26780-phase-safe-cfa-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726780-26780-phase-safe-cfa-debug.apk' build_26780_phase_safe_cfa_outputs/26780_APK.sha256
      - name: Upload 26780 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26780-phase-safe-cfa
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726780-26780-phase-safe-cfa-debug.apk
            build_26780_phase_safe_cfa_outputs/
