name: Build 26571 V1 True2X GPU Publication

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26571_*'
      - 'REGRESSION_V1_26571_*'
      - 'build_26571_v1_gpu_publication.sh'
      - 'transform_26571_v1.py'
      - 'validate_26571_v1.py'
      - 'verify_26571_v1_authority.py'
      - 'verify_26571_v1_patches.py'
      - 'verify_26571_v1_shaders.py'
      - 'handoff_payload_26571_v1/**'
      - '.github/workflows/build-26571-v1-gpu-publication.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26571 V1 package and mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26571_HANDOFF_HASHES.sha256
          bash -n build_26571_v1_gpu_publication.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26571_v1.py',
              'validate_26571_v1.py',
              'verify_26571_v1_authority.py',
              'verify_26571_v1_patches.py',
              'verify_26571_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26571_v1_gpu_publication.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="0c05139fab0240bed159e4250a05bba38c5463dd"' in s
          assert 'HANDOFF_PARENT_COMMIT="0c05139fab0240bed159e4250a05bba38c5463dd"' in s
          assert 'BASE_RUN_ID="33435528495"' in s
          assert 'BASE_ARTIFACT_ID="9774331069"' in s
          assert 'BASE_ARTIFACT_SHA="5295e7899ff0c672681c44746656794d2bae9d52994847d40f74c9c669f6b70f"' in s
          assert 'BASE_TAR_SHA="bc43d4bda1bdd42fa31b4e6988e81b0a76188939a118bf97f9554a6089bdde12"' in s
          assert 'VERSION_NAME="0.9726571"' in s and 'VERSION_BUILD="26571"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26571 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          expected="""snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26570/26569 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }"""
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          print('PASS sealed Python syntax + exact successful 26570 authority-seeded verification order inheritance')
          PY
          grep -F 'IRIS_26571_TRUE2X_GPU_PUBLICATION' REGRESSION_V1_26571_GPU_PUBLICATION_CONTRACT.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26571_CARRIED_FAILURES.txt >/dev/null
          grep -F 'No verification order is weakened' V1_26571_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26571_' .github/workflows --exclude='build-26571-v1-gpu-publication.yml'
          ! grep -R -F 'handoff_payload_26571_v1' .github/workflows --exclude='build-26571-v1-gpu-publication.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26571 candidate from successful compiled 26570 V1.2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26571_v1_gpu_publication.sh
          ./build_26571_v1_gpu_publication.sh

      - name: Upload 26571 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26571-v1-gpu-publication
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726571-26571-v1-gpu-publication-debug.apk
            build_26571_v1_gpu_publication_outputs/
