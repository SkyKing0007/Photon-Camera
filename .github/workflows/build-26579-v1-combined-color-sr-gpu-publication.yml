name: Build 26579 V1 Combined Color SR GPU Publication

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26579_*'
      - 'REGRESSION_V1_26579_*'
      - 'build_26579_v1_combined_color_sr_gpu_publication.sh'
      - 'transform_26579_v1.py'
      - 'validate_26579_v1.py'
      - 'verify_26579_v1_authority.py'
      - 'verify_26579_v1_regressions.py'
      - 'verify_26579_v1_patches.py'
      - 'verify_26579_v1_shaders.py'
      - 'handoff_payload_26579_v1/**'
      - '.github/workflows/build-26579-v1-combined-color-sr-gpu-publication.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26579 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26579_HANDOFF_HASHES.sha256
          bash -n build_26579_v1_combined_color_sr_gpu_publication.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26579_v1.py',
              'validate_26579_v1.py',
              'verify_26579_v1_authority.py',
              'verify_26579_v1_regressions.py',
              'verify_26579_v1_patches.py',
              'verify_26579_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26579_v1_combined_color_sr_gpu_publication.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="2642fd7b0be83ecb9b05018b5d20013f2c64eb78"' in s
          assert 'HANDOFF_PARENT_COMMIT="2642fd7b0be83ecb9b05018b5d20013f2c64eb78"' in s
          assert 'BASE_RUN_ID="33584470035"' in s
          assert 'BASE_JOB_ID="100105580563"' in s
          assert 'BASE_ARTIFACT_ID="9829646159"' in s
          assert 'BASE_ARTIFACT_SHA="2d25eedd77da7bbb212e64b67b930751adec69aded8546c0978318c4733dd61b"' in s
          assert 'BASE_TAR_SHA="5a359f84cd0a84ee74781dccd7dcc9f4c805e9aeca2871abf1fffb31c7e1a84a"' in s
          assert 'VERSION_NAME="0.9726579"' in s and 'VERSION_BUILD="26579"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          # Exact successful 26578 compiler/build ordering remains unchanged.
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26579 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          main='\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n'
          assert main in s
          snap='''snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }'''
          assert snap in s
          assert 'BACKUP_BRANCH=' not in s and 'git ls-remote origin refs/heads/backup-' not in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 4 ]]' in s
          print('PASS sealed Python syntax + exact successful 26578 authority-seeded verification order inheritance')
          PY
          grep -F 'compact multicolor printed objects are protected by 2-D chroma occupancy' REGRESSION_V1_26579_COMBINED_COLOR_SR_GPU.txt >/dev/null
          grep -F 'extension-changing .iris26571_gpu sibling targets are forbidden' REGRESSION_V1_26579_COMBINED_COLOR_SR_GPU.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26579_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26579_' .github/workflows --exclude='build-26579-v1-combined-color-sr-gpu-publication.yml'
          ! grep -R -F 'handoff_payload_26579_v1' .github/workflows --exclude='build-26579-v1-combined-color-sr-gpu-publication.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26579 candidate from successful compiled 26578 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26579_v1_combined_color_sr_gpu_publication.sh

      - name: Upload 26579 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26579-v1-combined-color-sr-gpu-publication
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726579-26579-v1-combined-color-sr-gpu-publication-debug.apk
            build_26579_v1_combined_color_sr_gpu_publication_outputs/
