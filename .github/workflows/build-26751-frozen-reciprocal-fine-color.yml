name: Build 26751 Frozen Reciprocal Fine Color
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26751_README_UPLOAD.txt'
      - '26751_*'
      - 'build_26751_frozen_reciprocal_fine_color.sh'
      - 'transform_26751.py'
      - 'validate_26751.py'
      - 'verify_26751_*.py'
      - 'handoff_payload_26751/**'
      - '.github/workflows/build-26751-frozen-reciprocal-fine-color.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26751 handoff and exact successful 26750 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26751_HANDOFF_HASHES.sha256
          python3 -S verify_26751_infrastructure.py build_26751_frozen_reciprocal_fine_color.sh .github/workflows/build-26751-frozen-reciprocal-fine-color.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26751 candidate from exact successful 26750 Actions candidate using successful 26750 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26751_frozen_reciprocal_fine_color.sh
      - name: Verify exact 26751 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726751-26751-frozen-reciprocal-fine-color-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726751-26751-frozen-reciprocal-fine-color-debug.apk' build_26751_frozen_reciprocal_fine_color_outputs/26751_APK.sha256
      - name: Upload 26751 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26751-frozen-reciprocal-fine-color
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726751-26751-frozen-reciprocal-fine-color-debug.apk
            build_26751_frozen_reciprocal_fine_color_outputs/
