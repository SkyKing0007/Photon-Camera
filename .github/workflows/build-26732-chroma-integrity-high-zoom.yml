name: Build 26732 Chroma Integrity High Zoom
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26732_README_UPLOAD.txt'
      - '26732_*'
      - 'build_26732_chroma_integrity_high_zoom.sh'
      - 'transform_26732.py'
      - 'validate_26732.py'
      - 'verify_26732_*.py'
      - 'handoff_payload_26732/**'
      - '.github/workflows/build-26732-chroma-integrity-high-zoom.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26732 handoff and exact successful 26731 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26732_HANDOFF_HASHES.sha256
          python3 -S verify_26732_infrastructure.py build_26732_chroma_integrity_high_zoom.sh .github/workflows/build-26732-chroma-integrity-high-zoom.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26732 candidate with successful 26731 procedure from successful 26731 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26732_chroma_integrity_high_zoom.sh
      - name: Verify exact 26732 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726732-26732-chroma-integrity-high-zoom-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726732-26732-chroma-integrity-high-zoom-debug.apk' build_26732_chroma_integrity_high_zoom_outputs/26732_APK.sha256
      - name: Upload 26732 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26732-chroma-integrity-high-zoom
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726732-26732-chroma-integrity-high-zoom-debug.apk
            build_26732_chroma_integrity_high_zoom_outputs/
