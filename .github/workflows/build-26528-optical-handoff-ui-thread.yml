name: Build 26528 Optical Handoff UI Thread
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26528_optical_handoff_ui_thread.py
      - validate_26528_optical_handoff_ui_thread.py
      - build_26528_optical_handoff_ui_thread.sh
      - 26528_BASE_26527_HEAD.txt
      - 26528_SCOPE_PROVENANCE.txt
      - 26528_README_UPLOAD.txt
      - 26528_RUNTIME_DELTA_FROM_SUCCESSFUL_26527.patch
      - 26528_RUNTIME_DELTA_FROM_SUCCESSFUL_26527.patch.sha256
      - 26528_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26527.patch
      - 26528_RUNTIME_ROLLBACK_TO_SUCCESSFUL_26527.patch.sha256
      - 26528_HANDOFF_HASHES.sha256
      - .github/workflows/build-26528-optical-handoff-ui-thread.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26528-optical-handoff-ui-thread-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26528 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26528_HANDOFF_HASHES.sha256
          python3 -m py_compile \
            apply_26528_optical_handoff_ui_thread.py \
            validate_26528_optical_handoff_ui_thread.py
          python3 apply_26528_optical_handoff_ui_thread.py --self-test
          bash -n build_26528_optical_handoff_ui_thread.sh
          [[ "$(tr -d '\r\n' < 26528_BASE_26527_HEAD.txt)" == "ef5f868802ced149f6700d524ff0ef6f08fbb675" ]]
          grep -F 'VERSION_NAME="0.9726528"; VERSION_BUILD="26528"' build_26528_optical_handoff_ui_thread.sh >/dev/null
          grep -F 'TEMPORAL_IMAGE_MATH_CHANGED=false' build_26528_optical_handoff_ui_thread.sh >/dev/null
          grep -F 'OPTICAL_HANDOFF_CORRECTION=RESTORE_UI_THREAD_CAMERA_RESTART_CONTRACT' build_26528_optical_handoff_ui_thread.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26528_optical_handoff_ui_thread.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26528 handoff static guards verified"

      - name: Guarded 26528 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26528_optical_handoff_ui_thread.sh
          ./build_26528_optical_handoff_ui_thread.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26528-optical-handoff-ui-thread-v1
          path: |
            IrisCamera-0.9726528-26528-optical-handoff-ui-thread-debug.apk
            build_26528_optical_handoff_ui_thread_outputs/
          if-no-files-found: warn
