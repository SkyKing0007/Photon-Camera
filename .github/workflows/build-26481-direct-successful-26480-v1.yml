name: Build 26481 Direct Successful 26480 Root Cause V1

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26481_direct_successful_26480_v1.sh
      - transform_26481_direct_26480_rootcause_v1.py
      - 26480_successful_source.patch
      - 26480_successful_after.sha256
      - 26480_successful_build_report.txt
      - .github/workflows/build-26481-direct-successful-26480-v1.yml

permissions:
  contents: write

jobs:
  build:
    name: Guarded direct 26480 to 26481
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout experimental infrastructure only
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install runtime GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version

      - name: Run strict direct-successful-26480 procedure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26481_direct_successful_26480_v1.sh
          ./build_26481_direct_successful_26480_v1.sh

      - name: Upload complete 26481 next-baseline package and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26481-direct-successful-26480-v1
          if-no-files-found: warn
          path: |
            build_26481_outputs/**
            IrisCamera-0.9726481-26481-direct-26480-rootcause-debug.apk
