name: Build 26672 R1 HEIC Google V2 UI Polish

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26672_R1_README_UPLOAD.txt'
      - 'R1_26672_*'
      - 'build_26672_r1_heic_google_v2_ui_polish.sh'
      - 'transform_26672.py'
      - 'validate_26672.py'
      - 'verify_26672_*.py'
      - 'handoff_payload_26672/**'
      - '.github/workflows/build-26672-r1-heic-google-v2-ui-polish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26672 handoff and exact successful 26671 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26672_HANDOFF_HASHES.sha256
          bash -n build_26672_r1_heic_google_v2_ui_polish.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26672.py','validate_26672.py','verify_26672_authority.py','verify_26672_infrastructure.py','verify_26672_patches.py','verify_26672_regressions.py','verify_26672_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26672 candidate from successful 26671 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26672_r1_heic_google_v2_ui_polish.sh
      - name: Verify exact 26672 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726672-26672-r1-heic-google-v2-ui-polish-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726672-26672-r1-heic-google-v2-ui-polish-debug.apk" build_26672_r1_heic_google_v2_ui_polish_outputs/26672_R1_APK.sha256
      - name: Upload 26672 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26672-r1-heic-google-v2-ui-polish
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726672-26672-r1-heic-google-v2-ui-polish-debug.apk
            build_26672_r1_heic_google_v2_ui_polish_outputs/
