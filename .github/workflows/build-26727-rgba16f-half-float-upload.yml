name: Build 26727 RGBA16F Half Float Upload
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26727_README_UPLOAD.txt'
      - '26727_*'
      - 'build_26727_rgba16f_half_float_upload.sh'
      - 'transform_26727.py'
      - 'validate_26727.py'
      - 'verify_26727_*.py'
      - 'handoff_payload_26727/**'
      - '.github/workflows/build-26727-rgba16f-half-float-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26727 handoff and exact successful 26726 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26727_HANDOFF_HASHES.sha256
          python3 -S verify_26727_infrastructure.py build_26727_rgba16f_half_float_upload.sh .github/workflows/build-26727-rgba16f-half-float-upload.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26727 candidate with successful 26726 procedure from successful 26726 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26727_rgba16f_half_float_upload.sh
      - name: Verify exact 26727 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726727-26727-rgba16f-half-float-upload-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726727-26727-rgba16f-half-float-upload-debug.apk' build_26727_rgba16f_half_float_upload_outputs/26727_APK.sha256
      - name: Upload 26727 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26727-rgba16f-half-float-upload
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726727-26727-rgba16f-half-float-upload-debug.apk
            build_26727_rgba16f_half_float_upload_outputs/
