name: Build 26545 V1.3 Current bjzhou Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26545-v1-3-current-bjzhou-parity.yml'
      - 'build_26545_v1_3_current_bjzhou_parity.sh'
      - 'validate_26545_v1_3_current_bjzhou_parity.py'
      - 'preflight_26545_v1_3_glsl.py'
      - '26545_V1_3_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26545-v1-3-current-bjzhou-parity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26545 V1.3 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26545_V1_3_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26545_v1_3_current_bjzhou_parity.py preflight_26545_v1_3_glsl.py
          python3 validate_26545_v1_3_current_bjzhou_parity.py --self-test
          python3 preflight_26545_v1_3_glsl.py --self-test
          bash -n build_26545_v1_3_current_bjzhou_parity.sh
          B=build_26545_v1_3_current_bjzhou_parity.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_HEAD="801e16582656dc6f672d1a292f8375b1046d0fbf"' "$B" >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26545-v1-2-before-v1-3-bjzhou-parity"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="33006824714"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9621002273"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="eb924aa95cb790b4c801bf7afa4eeb092b02faf468b990197c53e602f7262bd4"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="230627af3b0c12bf297eaae7e9b7efac7e1972d6b9fbefecb3b89e6dd1df69bb"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="a923dc9730a7402702cfd7feeb9e6d5d28dd95743e76ee08e96bcbbc2da93da1"' "$B" >/dev/null
          grep -F 'CAND_MANIFEST_SHA="8f6296faaa8559af45a229e6e61c14ad49a941ea138b83625f2e1e6573b36078"' "$B" >/dev/null
          grep -F 'BJZHOU_PARITY_HEAD="8e37909035b51b82ab54941dba390427478899b7"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F '18 V1.3 active/changed shaders' "$B" >/dev/null
          grep -F 'MgcSpatialRejectionGeometry.kt' 26545_V1_3_RUNTIME_FILES.txt >/dev/null
          grep -F 'mergeGradientThreshold = coreImagingTuning.fusion.mergeGradientThreshold' 26545_V1_3_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'outputPixel * 4 + ivec2(2)' 26545_V1_3_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          grep -F 'vec2 warpedUv = mirrorUv(uv + flow.xy)' 26545_V1_3_RUNTIME_DELTA_FROM_V1_2.patch >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          echo 'PASS: 26545 V1.3 handoff pins exact successful V1.2 authority + backup + current-MGC parity + full compiler/patch/invariance gates'

      - name: Guarded 26545 V1.3 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26545_v1_3_current_bjzhou_parity.sh
          ./build_26545_v1_3_current_bjzhou_parity.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26545-v1-3-current-bjzhou-parity
          path: |
            IrisCamera-0.9726545-26545-v1-3-current-bjzhou-parity-debug.apk
            build_26545_v1_3_current_bjzhou_parity_outputs/
          if-no-files-found: warn
