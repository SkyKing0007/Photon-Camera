name: Build 26710 One-Shot Reference + HAL LONG
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26710_README_UPLOAD.txt'
      - '26710_*'
      - 'build_26710_one_shot_reference_hal_long.sh'
      - 'transform_26710.py'
      - 'validate_26710.py'
      - 'verify_26710_*.py'
      - 'handoff_payload_26710/**'
      - '.github/workflows/build-26710-one-shot-reference-hal-long.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26710 handoff and exact successful 26709 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26710_HANDOFF_HASHES.sha256
          bash -n build_26710_one_shot_reference_hal_long.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26710.py','validate_26710.py','verify_26710_authority.py','verify_26710_patches.py','verify_26710_regressions.py','verify_26710_shaders.py','verify_26710_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26710_infrastructure.py build_26710_one_shot_reference_hal_long.sh .github/workflows/build-26710-one-shot-reference-hal-long.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26710 candidate from successful 26709 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26710_one_shot_reference_hal_long.sh
      - name: Verify exact 26710 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726710-26710-one-shot-reference-hal-long-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726710-26710-one-shot-reference-hal-long-debug.apk' build_26710_one_shot_reference_hal_long_outputs/26710_APK.sha256
      - name: Upload 26710 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26710-one-shot-reference-hal-long
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726710-26710-one-shot-reference-hal-long-debug.apk
            build_26710_one_shot_reference_hal_long_outputs/
