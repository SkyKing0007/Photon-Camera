name: Build 26591 V1 Photon Upper-Tail Separation

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26591_*'
      - 'REGRESSION_V1_26591_*'
      - 'build_26591_v1_photon_upper_tail_separation.sh'
      - 'transform_26591_v1.py'
      - 'validate_26591_v1.py'
      - 'verify_26591_v1_authority.py'
      - 'verify_26591_v1_regressions.py'
      - 'verify_26591_v1_patches.py'
      - 'verify_26591_v1_shaders.py'
      - 'handoff_payload_26591_v1/**'
      - '.github/workflows/build-26591-v1-photon-upper-tail-separation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26591 V1 package and inherited successful 26590 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26591_HANDOFF_HASHES.sha256
          bash -n build_26591_v1_photon_upper_tail_separation.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26591_v1.py','validate_26591_v1.py','verify_26591_v1_authority.py','verify_26591_v1_regressions.py','verify_26591_v1_patches.py','verify_26591_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26591_v1_photon_upper_tail_separation.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="18a83a078535e9557be6926f11cde6c7528e886d"' in s
          assert 'BASE_RUN_ID="33806704931"' in s
          assert 'BASE_JOB_ID="100818787451"' in s
          assert 'BASE_ARTIFACT_ID="9913335951"' in s
          assert 'BASE_ARTIFACT_SHA="d252abb0b1bed987534d52bf8ed6a8082288cdaf06f3e50619f7a9f917fd3dd7"' in s
          assert 'BASE_TAR_SHA="33c37f462ed8e94470d57103eb808805f67c43952d7b975e1d8dbf960f43e82c"' in s
          assert 'VERSION_NAME="0.9726591"' in s and 'VERSION_BUILD="26591"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 5 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26591 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert 'HANDOFF_PARENT_COMMIT="18a83a078535e9557be6926f11cde6c7528e886d"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          print('PASS sealed syntax + successful 26590 authority + exact inherited successful-26590 compiler/build order')
          PY
          grep -F 'Exact 26590 direct-sun fixture' REGRESSION_V1_26591_PHOTON_LIKE_UPPER_TAIL.txt >/dev/null
          grep -F 'Historic broad pink, pink/green dotted edges, cyan/green speckling, zipper/ghost artifacts' REGRESSION_V1_26591_CARRIED_26590.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26591_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26591_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F '0a503a301a5969278b9d0a541c0953aacf1593b4' V1_26591_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26590.txt >/dev/null
          grep -F 'be68011c31c006320dc0fad657f4bd888af8422f' V1_26591_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26590.txt >/dev/null
          ! grep -R -F 'V1_26591_' .github/workflows --exclude='build-26591-v1-photon-upper-tail-separation.yml'
          ! grep -R -F 'handoff_payload_26591_v1' .github/workflows --exclude='build-26591-v1-photon-upper-tail-separation.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26591 candidate from successful compiled 26590 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26591_v1_photon_upper_tail_separation.sh

      - name: Upload 26591 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26591-v1-photon-upper-tail-separation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726591-26591-v1-photon-upper-tail-separation-debug.apk
            build_26591_v1_photon_upper_tail_separation_outputs/
