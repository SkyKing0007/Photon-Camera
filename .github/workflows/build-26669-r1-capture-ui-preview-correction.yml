name: Build 26669 R1 Capture UI Preview Correction

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26669_R1_README_UPLOAD.txt'
      - 'R1_26669_*'
      - 'build_26669_r1_capture_ui_preview_correction.sh'
      - 'transform_26669.py'
      - 'validate_26669.py'
      - 'verify_26669_*.py'
      - 'handoff_payload_26669/**'
      - '.github/workflows/build-26669-r1-capture-ui-preview-correction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26669 handoff and exact successful 26668 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26669_HANDOFF_HASHES.sha256
          bash -n build_26669_r1_capture_ui_preview_correction.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26669.py','validate_26669.py','verify_26669_authority.py','verify_26669_infrastructure.py','verify_26669_patches.py','verify_26669_regressions.py','verify_26669_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26669 candidate from successful 26668 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26669_r1_capture_ui_preview_correction.sh
      - name: Verify exact 26669 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726669-26669-r1-capture-ui-preview-correction-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726669-26669-r1-capture-ui-preview-correction-debug.apk" build_26669_r1_capture_ui_preview_correction_outputs/26669_R1_APK.sha256
      - name: Upload 26669 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26669-r1-capture-ui-preview-correction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726669-26669-r1-capture-ui-preview-correction-debug.apk
            build_26669_r1_capture_ui_preview_correction_outputs/
