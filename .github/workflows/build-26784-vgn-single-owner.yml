name: Build 26784 VGN Single Owner
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26784.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26784 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26784.txt
          grep -Fx 'RUN_26784_VGN_SINGLE_OWNER' TRIGGER_26784.txt
          sha256sum -c 26784_HANDOFF_HASHES.sha256
          bash -n build_26784_vgn_single_owner.sh
          python3 -S -m py_compile transform_26784.py validate_26784.py verify_26784_patches.py verify_26784_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26784_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26784_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26784 candidate from successful 26783 authority using exact successful 26783 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26784_vgn_single_owner.sh
      - name: Verify exact 26784 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726784-26784-vgn-single-owner-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726784-26784-vgn-single-owner-debug.apk' build_26784_vgn_single_owner_outputs/26784_APK.sha256
      - name: Upload 26784 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26784-vgn-single-owner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726784-26784-vgn-single-owner-debug.apk
            build_26784_vgn_single_owner_outputs/
