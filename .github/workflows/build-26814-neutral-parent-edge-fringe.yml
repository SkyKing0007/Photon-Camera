name: Build 26814 Unified RGB Shared Confidence
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26814.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26814 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26814.txt
          grep -Fx 'RUN_26814_UNIFIED_RGB_SHARED_CONFIDENCE' TRIGGER_26814.txt
          sha256sum -c 26814_HANDOFF_HASHES.sha256
          bash -n build_26814_neutral_parent_edge_fringe.sh
          python3 -S -m py_compile transform_26814.py validate_26814.py verify_26814_patches.py verify_26814_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26814_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26814_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26814 candidate from successful 26813 authority using exact successful 26813 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26814_neutral_parent_edge_fringe.sh
      - name: Verify exact 26814 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726814-26814-unified-rgb-shared-confidence-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726814-26814-unified-rgb-shared-confidence-debug.apk' build_26814_neutral_parent_edge_fringe_outputs/26814_APK.sha256
      - name: Upload 26814 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26814-unified-rgb-shared-confidence
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726814-26814-unified-rgb-shared-confidence-debug.apk
            build_26814_neutral_parent_edge_fringe_outputs/
