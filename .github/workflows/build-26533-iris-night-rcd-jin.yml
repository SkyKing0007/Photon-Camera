name: Build 26533 V1.3 Iris Night RCD Jin
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26533_iris_night_rcd_jin.py
      - prepare_26533_jin_model.py
      - validate_26533_iris_night_rcd_jin.py
      - build_26533_iris_night_rcd_jin.sh
      - 26533_README_UPLOAD.txt
      - 26533_PREHANDOFF_STATIC_AUDIT.txt
      - 26533_HANDOFF_HASHES.sha256
      - 26533_EXACT_26532_OWNER_HASHES.sha256
      - .github/workflows/build-26533-iris-night-rcd-jin.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26533-iris-night-rcd-jin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26533 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26533_HANDOFF_HASHES.sha256
          test "$(grep -Ev '^($|#)' 26533_EXACT_26532_OWNER_HASHES.sha256 | wc -l | tr -d ' ')" = "8"
          grep -F '242e05cb32a8c5e090d1ea4963e30f4c3089f0daba5ad8e2d962ea7fc57c4fa5  app/src/main/java/com/particlesdevs/photoncamera/processing/processor/HdrxProcessor.java' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F 'c0e8ab475c798833c8b165a09d23644216131ab27f3955f1905231bb848dce12  app/src/main/java/com/particlesdevs/photoncamera/processing/processor/PhotonMotionMgc1271Bridge.kt' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F '750827e00cc871fac6d7ec5261684c16f91c31e8dc2d7a75f31ebea41ec7b881  app/src/main/java/com/hinnka/mycamera/processor/GlesMgcRawFusion.kt' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F 'b2a10d7f8168424e65c2286132307333d0066a23edd047f1e99a06e9fb341107  app/src/main/java/com/hinnka/mycamera/processor/GlesIris26521SpatialRgbStacker.kt' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F '9a50d62e6974cdd2ce158db64f7320a0f60097b92a6f5318288bf3bba91d55ed  app/src/main/java/com/hinnka/mycamera/processor/RawStackContracts.kt' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F 'c4402fa3ccc86a4bec44c1d03caabb92bd19a38e88ca20a094dc9c440e0a71e2  app/src/main/java/com/particlesdevs/photoncamera/processing/processor/MotionV2Merger.java' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F '48c9ecb75b8348e0c915c494e70a9a04f55ab41c7d433d336ce0889c276f91b3  app/src/main/java/com/particlesdevs/photoncamera/processing/render/Parameters.java' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          grep -F '49a8be8daf88caab5e6defd7ddf694d9875d0767d9c34e6c37457d798c53af55  app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/MotionV2Render.java' 26533_EXACT_26532_OWNER_HASHES.sha256 >/dev/null
          ! grep -R -F '8e10e9dfee15bb306aab74bdd8a41c41df05d9d5df753727887750e08f4c8e1c' apply_26533_iris_night_rcd_jin.py validate_26533_iris_night_rcd_jin.py build_26533_iris_night_rcd_jin.sh >/dev/null
          ! grep -R -F '2a4c259a6a47e066fa7605c5aa0b3d40d07d775bad75d1960a0444107eaf7a8a' apply_26533_iris_night_rcd_jin.py validate_26533_iris_night_rcd_jin.py build_26533_iris_night_rcd_jin.sh >/dev/null
          ! grep -R -F '8dc271032667ffc8b4b4e19ed1166a4948ebe74a0583d88d7672440320f927d3' apply_26533_iris_night_rcd_jin.py validate_26533_iris_night_rcd_jin.py build_26533_iris_night_rcd_jin.sh >/dev/null
          python3 -m py_compile \
            apply_26533_iris_night_rcd_jin.py \
            prepare_26533_jin_model.py \
            validate_26533_iris_night_rcd_jin.py
          bash -n build_26533_iris_night_rcd_jin.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'SUCCESSFUL_26532_HEAD="22222d162053fefade881a4c37dc388c6f68c581"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'FAILED_26533_V12_HEAD="58392a1aba8f97803ac61f16c3096ac22c5d64f6"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'seven certified RCD shaders proven inherited byte-exact from successful 26532' build_26533_iris_night_rcd_jin.sh >/dev/null
          python3 - <<'PYDELTA'
          from pathlib import Path
          s=Path('build_26533_iris_night_rcd_jin.sh').read_text()
          block=s.split('EXPECTED_CHANGED="$OUT/26533_expected_changed_files.txt"',1)[1].split('EOF\nsort -o "$EXPECTED_CHANGED"',1)[0]
          for name in ('rcd26489_diag_direction.glsl','rcd26489_diag_residual.glsl','rcd26489_green.glsl','rcd26489_green_rb.glsl','rcd26489_lpf.glsl','rcd26489_opposite.glsl','rcd26489_vh_direction.glsl'):
              if name in block: raise SystemExit('no-op inherited RCD shader leaked into V1.3 changed allowlist: '+name)
          for name in ('rcd26489_populate.glsl','rcd26489_write.glsl','MotionV2RcdDemosaic.java'):
              if name not in block: raise SystemExit('real RCD delta missing from V1.3 changed allowlist: '+name)
          print('PASS: V1.3 exact-candidate RCD changed/no-op scope encoded')
          PYDELTA
          grep -F 'git merge-base --is-ancestor "$FAILED_26533_V12_HEAD" HEAD' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26532-iris-superres20-pink-foliage.yml"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26532-iris-superres20-pink-foliage"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726533"; VERSION_BUILD="26533"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'JIN_UPSTREAM_HEAD="2a0681eae7c2bbc120a019d5bb71bcbd12291df7"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'ORT_ANDROID_VERSION="1.29.0"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'OWNER_HASHES="$ROOT/26533_EXACT_26532_OWNER_HASHES.sha256"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F '( cd "$BASE" && sha256sum -c "$OWNER_HASHES" )' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F -- '--base-owner-hashes "$OWNER_HASHES"' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F '26533_RUNTIME_DELTA_FROM_26532.patch' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F '26533_RUNTIME_ROLLBACK_TO_26532.patch' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'libjpeg-turbo/CMakeLists.txt' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'libultrahdr/ultrahdr_api.h' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'libultrahdr/lib/src/ultrahdr_api.cpp' build_26533_iris_night_rcd_jin.sh >/dev/null
          ! grep -F 'libultrahdr/CMakeLists.txt' build_26533_iris_night_rcd_jin.sh >/dev/null
          ! grep -E 'BACKUP_BRANCH=|git (branch|switch).*backup-' build_26533_iris_night_rcd_jin.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          python3 validate_26533_iris_night_rcd_jin.py --self-test
          grep -F 'python3 "$VALIDATE" --self-test' build_26533_iris_night_rcd_jin.sh >/dev/null
          grep -F 'java_executable_text' validate_26533_iris_night_rcd_jin.py >/dev/null
          echo "PASS: 26533 V1.3 exact-26532 owner + semantic validator + inherited-RCD delta contract + strict handoff guards verified before execution"

      - name: Guarded 26533 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26533_iris_night_rcd_jin.sh
          ./build_26533_iris_night_rcd_jin.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26533-v1-3-iris-night-rcd-jin
          path: |
            IrisCamera-0.9726533-26533-iris-night-rcd-jin-debug.apk
            build_26533_iris_night_rcd_jin_outputs/
          if-no-files-found: warn
