name: Build 26564 V1 True 2X Super Res

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26564_*'
      - 'REGRESSION_26564_*'
      - 'build_26564_v1_true_2x_sr.sh'
      - 'transform_26564_v1_true_2x_sr.py'
      - 'validate_26564_v1_true_2x_sr.py'
      - 'validate_26564_true2x_memory.py'
      - 'test_26564_true2x_cpu_gpu_numeric_parity.py'
      - 'extract_26564_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26564.py'
      - '.github/workflows/build-26564-v1-true-2x-sr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26564 V1 true-2x handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26564_HANDOFF_HASHES.sha256
          python3 -m py_compile transform_26564_v1_true_2x_sr.py validate_26564_v1_true_2x_sr.py validate_26564_true2x_memory.py test_26564_true2x_cpu_gpu_numeric_parity.py extract_26564_runtime_glsl.py scan_glsl_reserved_identifiers_26564.py
          python3 extract_26564_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26564.py --self-test
          bash -n build_26564_v1_true_2x_sr.sh
          grep -F 'BASE_SUCCESS_COMMIT="d048338a8e303c11b2208d4c1b78c8c129ebc57b"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'BASE_RUN_ID="33277777042"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9722074240"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="5861fb6cd33eb459fc1d9d3a571b65ceaba3525200df9b950597ae35b4579a7a"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'BASE_TAR_SHA="07787003b70edfd6d7d3d50cf291a195484204205ad22c687088455710aa9594"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26563-v1-before-26564-true-2x-sr"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726564"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F 'VERSION_BUILD="26564"' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26564_v1_true_2x_sr.sh >/dev/null
          grep -F "print(f'PASS TOTAL {len(PASS)} / {len(PASS)}')" validate_26564_v1_true_2x_sr.py >/dev/null
          grep -F 'PASS TOTAL 12 / 12' validate_26564_true2x_memory.py >/dev/null
          grep -F -- '--- /dev/null' V1_26564_RUNTIME_DELTA_FROM_26563_V1.patch >/dev/null
          ! grep -Eq '  /' V1_26564_PREWRITE_SOURCE_HASHES.sha256
          ! grep -R -F 'V1_26564_' .github/workflows --exclude='build-26564-v1-true-2x-sr.yml'

      - name: Build exact 26564 candidate from successful compiled 26563 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26564_v1_true_2x_sr.sh
          ./build_26564_v1_true_2x_sr.sh

      - name: Upload 26564 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26564-v1-true-2x-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726564-26564-v1-true-2x-sr-debug.apk
            build_26564_v1_true_2x_sr_outputs/
