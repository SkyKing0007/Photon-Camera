name: Build 26694 Spektra Integration Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26694_README_UPLOAD.txt'
      - '26694_*'
      - 'build_26694_spektra_integration_fix.sh'
      - 'transform_26694.py'
      - 'validate_26694.py'
      - 'repair_26694_*.py'
      - 'handoff_payload_26694/**'
      - '.github/workflows/build-26694-spektra-integration-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26694 handoff and exact successful 26693 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26694_HANDOFF_HASHES.sha256
          bash -n build_26694_spektra_integration_fix.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26694.py','validate_26694.py','repair_26694_authority.py','repair_26694_infrastructure.py','repair_26694_patches.py','repair_26694_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26694 candidate from successful 26693 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26694_spektra_integration_fix.sh
      - name: Verify exact 26694 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726694-26694-spektra-integration-fix-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726694-26694-spektra-integration-fix-debug.apk" build_26694_spektra_integration_fix_outputs/26694_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26694_spektra_integration_fix_outputs/26694_apk_jni_contract.txt
      - name: Upload 26694 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26694-spektra-integration-fix
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726694-26694-spektra-integration-fix-debug.apk
            build_26694_spektra_integration_fix_outputs/
