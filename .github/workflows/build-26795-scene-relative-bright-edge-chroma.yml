name: Build 26795 Scene Relative Bright Edge Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26795.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26795 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26795.txt
          grep -Fx 'RUN_26795_SCENE_RELATIVE_BRIGHT_EDGE_CHROMA' TRIGGER_26795.txt
          sha256sum -c 26795_HANDOFF_HASHES.sha256
          bash -n build_26795_scene_relative_bright_edge_chroma.sh
          python3 -S -m py_compile transform_26795.py validate_26795.py verify_26795_patches.py verify_26795_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26795_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26795_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26795 candidate from successful 26794 authority using exact successful 26794 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26795_scene_relative_bright_edge_chroma.sh
      - name: Verify exact 26795 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726795-26795-scene-relative-bright-edge-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726795-26795-scene-relative-bright-edge-chroma-debug.apk' build_26795_scene_relative_bright_edge_chroma_outputs/26795_APK.sha256
      - name: Upload 26795 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26795-scene-relative-bright-edge-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726795-26795-scene-relative-bright-edge-chroma-debug.apk
            build_26795_scene_relative_bright_edge_chroma_outputs/
