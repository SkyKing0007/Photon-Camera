name: Build 26493 V3 RCD Boundary Chroma GLSL Keyword Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26492_successful_app_source.tar.gz'
      - '26492_successful_after.sha256'
      - 'transform_26493_rcd_provenance_boundary_chroma_v2_glsl_keyword_fix.py'
      - 'build_26493_rcd_provenance_boundary_chroma_v3_glsl_keyword_fix.sh'
      - '.github/workflows/build-26493-v3-rcd-boundary-chroma-glsl-keyword-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve failed V2 GLSL checkpoint and verify earlier rollbacks
        shell: bash
        run: |
          set -euo pipefail
          V5B="a424653a42923b02bd3a9f303da05d7a7e43409c"
          V5B_BACKUP="backup-26492-v5b-tested-before-26493-boundary-refinement"
          V1="00a72ba28665c0667c4f45e490f638195f46d6dc"
          V1_BACKUP="backup-26493-v1-manifest-failed-before-v2-canonical-bundle"
          V2="0599afe5098e02b35169bf6cd0df32837b26e9b0"
          V2_BACKUP="backup-26493-v2-glsl-keyword-failed-before-v3-reserved-name-fix"
          v5b_actual="$(git ls-remote origin "refs/heads/$V5B_BACKUP" | awk '{print $1}')"
          [[ "$v5b_actual" == "$V5B" ]] || { echo "::error::tested V5B rollback missing/moved: $v5b_actual"; exit 1; }
          v1_actual="$(git ls-remote origin "refs/heads/$V1_BACKUP" | awk '{print $1}')"
          [[ "$v1_actual" == "$V1" ]] || { echo "::error::failed V1 rollback missing/moved: $v1_actual"; exit 1; }
          git cat-file -e "$V2^{commit}"
          existing="$(git ls-remote origin "refs/heads/$V2_BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$V2" ]] || { echo "::error::V2 backup exists at $existing expected $V2"; exit 1; }
            echo "PASS: failed V2 GLSL checkpoint already preserved"
          else
            git push origin "$V2:refs/heads/$V2_BACKUP"
            actual="$(git ls-remote origin "refs/heads/$V2_BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$V2" ]] || { echo "::error::V2 backup verification failed"; exit 1; }
            echo "PASS: failed V2 GLSL checkpoint preserved $V2_BACKUP=$actual"
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict V3 package identity reserved-keyword and complete-baseline preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26492_successful_app_source.tar.gz "4636f22d1ea417b9b3c5380025abc502971c3f334c78b3f7c199570ad72d98a9"
          check_sha 26492_successful_after.sha256 "dc19b4eba0fbeab493476383f5b148d9258103ab7d9e3d71e4e9e2915d149bef"
          check_sha transform_26493_rcd_provenance_boundary_chroma_v2_glsl_keyword_fix.py "7b52fc154ddde069e040099f148b3431c984e1945e9efb6ed0e9638044feeba0"
          check_sha build_26493_rcd_provenance_boundary_chroma_v3_glsl_keyword_fix.sh "ab5f7880d30e8ed3aad937fcf7d853e13272c0f7a9128a1a4b8fe8e98cf05d44"
          bash -n build_26493_rcd_provenance_boundary_chroma_v3_glsl_keyword_fix.sh
          python3 -m py_compile transform_26493_rcd_provenance_boundary_chroma_v2_glsl_keyword_fix.py
          python3 transform_26493_rcd_provenance_boundary_chroma_v2_glsl_keyword_fix.py --self-test
          python3 - <<'PY_BUNDLE'
          import tarfile
          with tarfile.open('26492_successful_app_source.tar.gz','r:gz') as tf:
              files=[m.name for m in tf.getmembers() if m.isfile() and (m.name.startswith('app/src/main/') or m.name=='app/version.properties')]
          if len(files)!=856:
              raise SystemExit(f'complete V5B bundle file count={len(files)} expected=856')
          print('PASS: complete V5B bundle carries all 856 canonical files')
          PY_BUNDLE

      - name: Build guarded 26493 V3 APK
        shell: bash
        run: |
          chmod +x build_26493_rcd_provenance_boundary_chroma_v3_glsl_keyword_fix.sh
          ./build_26493_rcd_provenance_boundary_chroma_v3_glsl_keyword_fix.sh

      - name: Upload 26493 V3 APK and canonical next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26493-v3-rcd-boundary-chroma-glsl-keyword-fix
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726493-26493-rcd-provenance-boundary-chroma-v3-glsl-keyword-fix-debug.apk
            build_26493_v3_outputs/**
