name: Build 26892 Adaptive SDR Backlight Foreground and Auto Contrast
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26892.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay SHA-pinned successful 26891 historical runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26892_replay_exact_26891_workflow.py
          test "$(sha256sum build_26891_iris_rawr.sh | awk '{print $1}')" = 'f0b25de61cc661a461c10e7665623ba15ddda0362ba047c05e543aaf670f094b'
          sha256sum -c 26891_GENERATED_BUILD_SHA256.txt
      - name: Derive SHA-sealed 26892 successor guarded runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26892.txt && grep -Fx 'RUN_26892_SCENE_ADAPTIVE_SDR_BACKLIGHT_CONTRAST_V1' TRIGGER_26892.txt
          python3 -S stage_26892_root.py
          sha256sum -c 26892_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26892_build.py verify_26892_candidate.py verify_26892_semantics.py verify_26892_patches.py verify_26892_expanded_glsl.py stage_26892_root.py test_26892_negative_tamper.py test_26892_three_stage_negatives.py test_26892_tone_math.py photon_26892_replay_exact_26891_workflow.py
          python3 -S test_26892_three_stage_negatives.py
          python3 -S test_26892_tone_math.py
          python3 -S generate_26892_build.py .
          cp build_26892_iris_rawr.sh /tmp/26892_first_generation.sh
          python3 -S generate_26892_build.py .
          cmp /tmp/26892_first_generation.sh build_26892_iris_rawr.sh
          sha256sum -c 26892_GENERATED_BUILD_SHA256.txt
          bash -n build_26892_iris_rawr.sh
          python3 -S stage_26892_root.py
          test "$(find handoff_payload_26892 -type f | wc -l)" -eq 4
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited 17-stage 26892 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26892_iris_rawr.sh
      - name: Prove single intended 26892 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726892-26892-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726892-26892-iris-rawr-debug.apk' build_26892_iris_rawr_outputs/26892_APK.sha256
      - name: Seal exact EXECUTED 26892 runner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26892_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26892 --root . --expected-sha256 37b12a9cbb5918b49d279d40d51f11fa086a0682dd487f88b6ecc7f17313069d
          test -f build_26892_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26892_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26892 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26892-sdr-adaptive-contrast-backlight-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726892-26892-iris-rawr-debug.apk
            build_26892_iris_rawr_outputs/
