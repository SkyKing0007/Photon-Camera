name: Build 26842 Clip Rolloff Mottling
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26842.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26842 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26842.txt
          grep -Fx 'RUN_26842_CLIP_MOTTLE' TRIGGER_26842.txt
          sha256sum -c 26842_HANDOFF_HASHES.sha256
          bash -n build_26842_clip_mottle.sh
          python3 -S -m py_compile transform_26842.py validate_26842.py verify_26842_patches.py verify_26842_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26842_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26842_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26842 candidate from successful 26841 authority using exact successful 26841 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26842_clip_mottle.sh
      - name: Verify exact 26842 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726842-26842-clip-mottle-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726842-26842-clip-mottle-debug.apk' build_26842_clip_mottle_outputs/26842_APK.sha256
      - name: Upload 26842 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26842-clip-mottle
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726842-26842-clip-mottle-debug.apk
            build_26842_clip_mottle_outputs/
