name: Build 26615 Iris-Owned Spatial Appearance

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26615_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26615_*'
      - 'R1_26615_*'
      - 'build_26615_r1_iris_spatial_appearance.sh'
      - 'transform_26615.py'
      - 'validate_26615.py'
      - 'verify_26615_*.py'
      - 'handoff_payload_26615/**'
      - '.github/workflows/build-26615-r1-iris-spatial-appearance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26615 package and successful 26614 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26615_HANDOFF_HASHES.sha256
          bash -n build_26615_r1_iris_spatial_appearance.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26615.py','validate_26615.py','verify_26615_authority.py','verify_26615_infrastructure.py','verify_26615_patches.py','verify_26615_regressions.py','verify_26615_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26615 candidate from successful compiled 26614 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26615_r1_iris_spatial_appearance.sh
      - name: Upload 26615 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26615-r1-iris-spatial-appearance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726615-26615-r1-iris-spatial-appearance-debug.apk
            build_26615_r1_iris_spatial_appearance_outputs/
