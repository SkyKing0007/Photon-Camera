name: Build 26497 Root Highlight UHDR

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26496_successful_app_source.tar.gz'
      - '26496_successful_after.sha256'
      - '26497_source_delta_from_exact_26496.patch'
      - 'validate_26497_root_highlight_uhdr.py'
      - 'build_26497_root_highlight_uhdr_v1.sh'
      - '.github/workflows/build-26497-root-highlight-uhdr-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact successful 26496 backup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="6ac07643aa31605ba364a3f5ff3e3a5bda901872"
          BACKUP="backup-26496-success-before-26497-root-highlight-uhdr"
          git cat-file -e "$EXPECTED^{commit}"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED" ]] || { echo "::error::backup mismatch $BACKUP=$actual expected=$EXPECTED"; exit 1; }
          echo "PASS: exact successful 26496 backup $BACKUP=$actual"

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26497 package identity and math preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26496_successful_app_source.tar.gz "2ef616843f6559dca3406d87470c4502a5d18414f79c3da71cd86f179a863d65"
          check_sha 26496_successful_after.sha256 "cc0371d11a4896aba2190c5558ad038c4408fe175e86f5bc77f324bc3d274ec7"
          check_sha 26497_source_delta_from_exact_26496.patch "307502b7d444371228c86eac48674413b66573f5a99939582660970a644b2060"
          check_sha validate_26497_root_highlight_uhdr.py "58fcaff99ad4cbde4c4891226f328cde839ee7251e814ae94f60fb691d9f9734"
          check_sha build_26497_root_highlight_uhdr_v1.sh "d9c2c448d1837b953b7128e30c2041f90d9f5ad6d531672316278d5ab64068c7"
          bash -n build_26497_root_highlight_uhdr_v1.sh
          python3 -m py_compile validate_26497_root_highlight_uhdr.py
          python3 validate_26497_root_highlight_uhdr.py
          [[ "$(wc -l < 26496_successful_after.sha256)" -eq 857 ]]
          echo "PASS: 26497 package identity + syntax + math preflight"

      - name: Build guarded 26497 APK
        shell: bash
        run: |
          chmod +x build_26497_root_highlight_uhdr_v1.sh
          ./build_26497_root_highlight_uhdr_v1.sh

      - name: Upload 26497 APK and complete next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26497-root-highlight-uhdr
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726497-26497-root-highlight-uhdr-debug.apk
            build_26497_outputs/**
