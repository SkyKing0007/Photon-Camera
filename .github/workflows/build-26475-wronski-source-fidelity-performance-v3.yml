name: Build 26475 Wronski Source Fidelity Performance V3

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26475_wronski_source_fidelity_performance_v3.sh
      - .github/workflows/build-26475-wronski-source-fidelity-performance-v3.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26475 Wronski source fidelity performance V3
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard 26475 V3 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "0937a8e5731b3fd58616e0fb77f34184aaa56c2c" || {
            echo "26475 V3 infrastructure commit must be directly based on failed 26475 V2 infrastructure commit"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26475 V3 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26475 V3 workflow lineage gate PASS"

      - name: Run guarded 26475 V3 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26475_wronski_source_fidelity_performance_v3.sh
          ./build_26475_wronski_source_fidelity_performance_v3.sh

      - name: Upload 26475 V3 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26475-wronski-source-fidelity-performance-v3
          if-no-files-found: error
          path: |
            build_26475_outputs/**
            IrisCamera-0.9726475-26475-wronski-source-fidelity-performance-debug.apk
