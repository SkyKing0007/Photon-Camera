name: Build 26773 UI Rotation + Downloads
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26773.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26773 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26773.txt
          grep -Fx 'RUN_26773_UI_ROTATION_DOWNLOADS' TRIGGER_26773.txt
          sha256sum -c 26773_HANDOFF_HASHES.sha256
          bash -n build_26773_ui_rotation_downloads.sh
          python3 -S -m py_compile transform_26773.py validate_26773.py verify_26773_patches.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26773_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26773_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26773 candidate from successful 26772 R6 authority using unchanged R6 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26773_ui_rotation_downloads.sh
      - name: Verify exact 26773 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726773-26773-ui-rotation-downloads-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726773-26773-ui-rotation-downloads-debug.apk' build_26773_ui_rotation_downloads_outputs/26773_APK.sha256
      - name: Upload 26773 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26773-ui-rotation-downloads
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726773-26773-ui-rotation-downloads-debug.apk
            build_26773_ui_rotation_downloads_outputs/
