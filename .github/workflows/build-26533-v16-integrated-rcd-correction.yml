name: Build 26533 V1.6 Integrated RCD Regression Correction
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26533_v16_integrated_rcd_correction.py
      - validate_26533_v16_integrated_rcd_correction.py
      - preflight_26533_v16_changed_syntax.py
      - preflight_26533_v16_provenance_shader.py
      - build_26533_v16_integrated_rcd_correction.sh
      - 26533_V16_*.txt
      - 26533_V16_*.sha256
      - 26533_V16_*.patch
      - .github/workflows/build-26533-v16-integrated-rcd-correction.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26533-v16-integrated-rcd-correction
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify V1.6 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26533_V16_HANDOFF_HASHES.sha256
          sha256sum -c 26533_V16_RUNTIME_DELTA_FROM_V15.patch.sha256
          sha256sum -c 26533_V16_RUNTIME_ROLLBACK_TO_V15.patch.sha256
          python3 -m py_compile apply_26533_v16_integrated_rcd_correction.py validate_26533_v16_integrated_rcd_correction.py preflight_26533_v16_changed_syntax.py preflight_26533_v16_provenance_shader.py
          python3 apply_26533_v16_integrated_rcd_correction.py --self-test
          python3 validate_26533_v16_integrated_rcd_correction.py --self-test
          bash -n build_26533_v16_integrated_rcd_correction.sh
          grep -F 'BASE_V15_HEAD="10d1aa2c1a37adcfd36533ba4c3879046fd29c3e"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="2257efa438c2895fa0d516bcff7f6d9ececeff4ce24dafc0237eb1c82356a612"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="8cf21915b0043a6bb4752e6bc184eb40481abec1e96e14e1008350a64b40b1f5"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26533-v1-5-normalized16-rcd-domain"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726533"; VERSION_BUILD="26533"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'THIRD="$AFTER/app/src/main/cpp/third_party_26507"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F '( cd "$THIRD" && sha256sum -c "$BJZHOU_MANIFEST" )' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'V16_SYNTAX_PREFLIGHT="$ROOT/preflight_26533_v16_changed_syntax.py"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F 'V16_PROVENANCE_PREFLIGHT="$ROOT/preflight_26533_v16_provenance_shader.py"' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          ! grep -E 'BACKUP_BRANCH=|git (branch|switch).*backup-' build_26533_v16_integrated_rcd_correction.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: V1.6 exact V1.5 artifact + integrated RCD regression-correction handoff verified"
      - name: Guarded 26533 V1.6 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26533_v16_integrated_rcd_correction.sh
          ./build_26533_v16_integrated_rcd_correction.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26533-v1-6-integrated-rcd-correction
          path: |
            IrisCamera-0.9726533-26533-v1-6-integrated-rcd-correction-debug.apk
            build_26533_v16_integrated_rcd_correction_outputs/
          if-no-files-found: warn
