name: Build 26726 Universal RGBA16F Carrier
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26726_README_UPLOAD.txt'
      - '26726_*'
      - 'build_26726_universal_rgba16f_carrier.sh'
      - 'transform_26726.py'
      - 'validate_26726.py'
      - 'verify_26726_*.py'
      - 'handoff_payload_26726/**'
      - '.github/workflows/build-26726-universal-rgba16f-carrier.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26726 handoff and exact successful 26725 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26726_HANDOFF_HASHES.sha256
          python3 -S verify_26726_infrastructure.py build_26726_universal_rgba16f_carrier.sh .github/workflows/build-26726-universal-rgba16f-carrier.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26726 candidate with successful 26725 procedure from successful 26725 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26726_universal_rgba16f_carrier.sh
      - name: Verify exact 26726 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726726-26726-universal-rgba16f-carrier-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726726-26726-universal-rgba16f-carrier-debug.apk' build_26726_universal_rgba16f_carrier_outputs/26726_APK.sha256
      - name: Upload 26726 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26726-universal-rgba16f-carrier
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726726-26726-universal-rgba16f-carrier-debug.apk
            build_26726_universal_rgba16f_carrier_outputs/
