name: Build 26526 Combined Zoom Temporal Audit
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26526_combined_zoom_temporal_audit.py
      - validate_26526_combined_zoom_temporal_audit.py
      - audit_26526_temporal_support.py
      - preflight_26526_inherited_shaders.py
      - build_26526_combined_zoom_temporal_audit.sh
      - 26526_BASE_26525_HEAD.txt
      - 26526_SCOPE_PROVENANCE.txt
      - 26526_README_UPLOAD.txt
      - 26526_HANDOFF_HASHES.sha256
      - .github/workflows/build-26526-combined-zoom-temporal-audit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26526-combined-zoom-temporal-audit-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m))
          xs=[x for x in d["assets"] if x["name"]==n]
          assert d["tag_name"]==v and len(xs)==1 and xs[0]["browser_download_url"]==u
          digest=xs[0].get("digest"); assert digest and digest.startswith("sha256:")
          actual=hashlib.sha256(open(a,"rb").read()).hexdigest()
          assert actual==digest.split(":",1)[1]
          print("PASS: glslang release asset SHA256",actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26526 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26526_HANDOFF_HASHES.sha256
          python3 -m py_compile \
            apply_26526_combined_zoom_temporal_audit.py \
            validate_26526_combined_zoom_temporal_audit.py \
            audit_26526_temporal_support.py \
            preflight_26526_inherited_shaders.py
          python3 apply_26526_combined_zoom_temporal_audit.py --self-test
          bash -n build_26526_combined_zoom_temporal_audit.sh
          [[ "$(tr -d '\r\n' < 26526_BASE_26525_HEAD.txt)" == "10b4cc9ce59c98b4c163878a87fe8a07168cc290" ]]
          grep -F 'VERSION_NAME="0.9726526"; VERSION_BUILD="26526"' build_26526_combined_zoom_temporal_audit.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26526_combined_zoom_temporal_audit.sh >/dev/null
          grep -F 'TEMPORAL_IMAGE_MATH_CHANGED=false' build_26526_combined_zoom_temporal_audit.sh >/dev/null
          grep -F 'session.getDevice().getId()' apply_26526_combined_zoom_temporal_audit.py >/dev/null
          grep -F 'IRIS_26526_SINGLE_PREVIEW_GEOMETRY_AUTHORITY' apply_26526_combined_zoom_temporal_audit.py >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26526 handoff static guards verified"

      - name: Guarded 26526 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26526_combined_zoom_temporal_audit.sh
          ./build_26526_combined_zoom_temporal_audit.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26526-combined-zoom-temporal-audit-v1
          path: |
            IrisCamera-0.9726526-26526-combined-zoom-temporal-audit-debug.apk
            build_26526_combined_zoom_temporal_audit_outputs/
          if-no-files-found: warn
