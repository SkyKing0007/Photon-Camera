name: Build 26585 V1 Structured Highlight + Tone-Aware Chroma

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26585_*'
      - 'REGRESSION_V1_26585_*'
      - 'build_26585_v1_structured_highlight_chroma.sh'
      - 'transform_26585_v1.py'
      - 'validate_26585_v1.py'
      - 'verify_26585_v1_authority.py'
      - 'verify_26585_v1_regressions.py'
      - 'verify_26585_v1_patches.py'
      - 'verify_26585_v1_shaders.py'
      - 'handoff_payload_26585_v1/**'
      - '.github/workflows/build-26585-v1-structured-highlight-chroma.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26585 V1 package and inherited mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26585_HANDOFF_HASHES.sha256
          bash -n build_26585_v1_structured_highlight_chroma.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26585_v1.py','validate_26585_v1.py','verify_26585_v1_authority.py','verify_26585_v1_regressions.py','verify_26585_v1_patches.py','verify_26585_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26585_v1_structured_highlight_chroma.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="b0c7bee97fc42e29e1145ebf62b7d4d9f68fff1e"' in s
          assert 'BASE_RUN_ID="33706486670"' in s
          assert 'BASE_JOB_ID="100496588302"' in s
          assert 'BASE_ARTIFACT_ID="9875462465"' in s
          assert 'BASE_ARTIFACT_SHA="533f6f620dd13ea3dc386d94f55d9613d19ba2c81bcbb8cf5784a09474d6e8b9"' in s
          assert 'BASE_TAR_SHA="657ea390c3184f83ed5d745884a09c90c4822ffb25bf069d5186964d50655807"' in s
          assert 'VERSION_NAME="0.9726585"' in s and 'VERSION_BUILD="26585"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 4 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26585 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert '[[ "$(git rev-parse HEAD^)" == "$BASE_SUCCESS_COMMIT" ]]' in s
          print('PASS sealed syntax + successful 26584 V1 authority + inherited compiler/build order')
          PY
          grep -F 'structured highlight guide must use supported P98-class tail rather than 26584 P90' REGRESSION_V1_26585_STRUCTURED_HIGHLIGHT_TAIL.txt >/dev/null
          grep -F 'added high-highlight chroma gain is capped <=1.12x' REGRESSION_V1_26585_TONE_AWARE_HIGHLIGHT_CHROMA.txt >/dev/null
          grep -F 'Night brightness advantage constants remain exactly +0.40 EV dark / +0.30 EV bright' REGRESSION_V1_26585_CARRIED_26584.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26585_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26585_' .github/workflows --exclude='build-26585-v1-structured-highlight-chroma.yml'
          ! grep -R -F 'handoff_payload_26585_v1' .github/workflows --exclude='build-26585-v1-structured-highlight-chroma.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26585 candidate from successful compiled 26584 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26585_v1_structured_highlight_chroma.sh

      - name: Upload 26585 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26585-v1-structured-highlight-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726585-26585-v1-structured-highlight-chroma-debug.apk
            build_26585_v1_structured_highlight_chroma_outputs/
