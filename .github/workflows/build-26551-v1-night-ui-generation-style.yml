name: Build 26551 V1 Night UI Generation + Style

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26551-v1-night-ui-generation-style.yml'
      - 'build_26551_v1_night_ui_generation_style.sh'
      - 'validate_26551_v1_night_ui_generation_style.py'
      - 'V1_26551_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26551-v1-night-ui-generation-style
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26551 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26551_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26551_v1_night_ui_generation_style.py
          python3 validate_26551_v1_night_ui_generation_style.py --self-test
          bash -n build_26551_v1_night_ui_generation_style.sh
          grep -F 'BASE_RUN_ID="33135046015"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9671766019"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="529c7f9376a2a5cc9edb34d33066d804e127162f"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726551"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'VERSION_BUILD="26551"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'VENDOR_MANIFEST_SHA="7dbcc5ee5b9040965e431d79c45c5100f559c2b96c50970ca21987c684c825a8"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'RUNTIME_GAINMAP_SHADER="$WORK/26551_inherited_gainmap_runtime_expanded.frag"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'glslangValidator -S frag "$RUNTIME_GAINMAP_SHADER"' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26551_v1_night_ui_generation_style.sh >/dev/null
          grep -F 'chmod +x build_26551_v1_night_ui_generation_style.sh' .github/workflows/build-26551-v1-night-ui-generation-style.yml >/dev/null
          grep -F './build_26551_v1_night_ui_generation_style.sh' .github/workflows/build-26551-v1-night-ui-generation-style.yml >/dev/null
          # Prior 26550 workflow is path-scoped and must not overlap this 26551 upload.
          grep -F -- "- 'V1_26550_*'" .github/workflows/build-26550-v1-night-presentation-uhdr-ui.yml >/dev/null

      - name: Build exact 26551 candidate from successful compiled 26550 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x build_26551_v1_night_ui_generation_style.sh
          ./build_26551_v1_night_ui_generation_style.sh

      - name: Upload 26551 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26551-v1-night-ui-generation-style
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726551-26551-v1-night-ui-generation-style-debug.apk
            build_26551_v1_night_ui_generation_style_outputs/
