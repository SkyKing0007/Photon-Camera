name: Build 26890 B Adaptive Toe Default JPEG Names and HDRQ Strength 11.5
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26890.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact SHA-pinned successful 26889 historical workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26890_replay_exact_26889_workflow.py
          test "$(sha256sum build_26889_iris_rawr.sh | awk '{print $1}')" = '4070c3a0f47fb043d99ad18a1b2d53a629be26891d1147ef9bfc60d790cb7d73'
          sha256sum -c 26889_GENERATED_BUILD_SHA256.txt
      - name: Derive and seal exact-successor guarded 26890 runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26890.txt && grep -Fx 'RUN_26890_B_TONE_TOE_DEFAULT_B_A_NAME_SINGLE_TRIGGER_V1' TRIGGER_26890.txt
          python3 -S stage_26890_root.py
          sha256sum -c 26890_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26890_build.py verify_26890_candidate.py verify_26890_semantics.py verify_26890_patches.py verify_26890_expanded_glsl.py stage_26890_root.py test_26890_negative_tamper.py test_26890_tone_math.py test_26890_three_stage_negatives.py photon_26890_replay_exact_26889_workflow.py
          python3 -S test_26890_three_stage_negatives.py
          python3 -S generate_26890_build.py .
          cp build_26890_iris_rawr.sh /tmp/26890_first_generation.sh
          python3 -S generate_26890_build.py .
          cmp /tmp/26890_first_generation.sh build_26890_iris_rawr.sh
          sha256sum -c 26890_GENERATED_BUILD_SHA256.txt
          bash -n build_26890_iris_rawr.sh
          python3 -S stage_26890_root.py
          test "$(find handoff_payload_26890 -type f | wc -l)" -eq 8
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited guarded 17-stage 26890 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26890_iris_rawr.sh
      - name: Verify exactly one intended 26890 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726890-26890-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726890-26890-iris-rawr-debug.apk' build_26890_iris_rawr_outputs/26890_APK.sha256
      - name: Seal exact EXECUTED 26890 runner and compiled evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26890_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26890 --root . --expected-sha256 525b56e735d24b24461cf2575bdfcdfe90b242ec87514b9ddfcaf83c442ee3df
          test -f build_26890_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26890_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26890 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26890-b-tone-default-jpeg-single-trigger-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726890-26890-iris-rawr-debug.apk
            build_26890_iris_rawr_outputs/
