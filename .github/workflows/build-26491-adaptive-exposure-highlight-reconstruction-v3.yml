name: Build 26491 V3 Adaptive Exposure Highlight Reconstruction

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26490_successful_source.patch'
      - '26490_successful_after.sha256'
      - 'transform_26488_full_merge_rgb_rejection_contract_v1.py'
      - 'transform_26491_adaptive_exposure_highlight_reconstruction_v3.py'
      - 'build_26491_adaptive_exposure_highlight_reconstruction_v3.sh'
      - '.github/workflows/build-26491-adaptive-exposure-highlight-reconstruction-v3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26491 V3 infrastructure identity and preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::26491 V3 infrastructure identity mismatch: actual=$actual expected=$expected"
              exit 1
            fi
          }
          check_sha build_26491_adaptive_exposure_highlight_reconstruction_v3.sh "4ede30ed5672d6a56bf85b0eb006ef9b02c11239c855ebf4376ae787c6e44b40"
          check_sha transform_26491_adaptive_exposure_highlight_reconstruction_v3.py "38e8a7a343669937f910399d42d82a063de2971cfb013f5c27c5d264418e5048"
          check_sha 26490_successful_source.patch "c589cc000047da6dd19c7b1ac71405fa635d75db37007fa526c60368001433ba"
          check_sha 26490_successful_after.sha256 "431a62d9e23cd17d71388d4b79ad0a0c548c58ae9eabb2ad1894ba9cad34322f"
          check_sha transform_26488_full_merge_rgb_rejection_contract_v1.py "b7710d343aa26b1215178821983f4ff3f742ad07d1ca556de2d272fbc36664c0"
          check_sha build_26490_highlight_domain_short_border_v3.sh "1fe2dad7cd734d3f83deac3b2eb4880b18d10cc13c8469f1a7589fc427c0cadf"
          check_sha transform_26490_highlight_domain_short_border_v3.py "60c91ce99da7408082b47cc16004ddc43ff043f3cb0466795cb445ba9f2365dc"
          bash -n build_26491_adaptive_exposure_highlight_reconstruction_v3.sh
          python3 -m py_compile transform_26488_full_merge_rgb_rejection_contract_v1.py transform_26491_adaptive_exposure_highlight_reconstruction_v3.py
          python3 transform_26491_adaptive_exposure_highlight_reconstruction_v3.py --self-test
          python3 -c 'import importlib.util,re; p="transform_26491_adaptive_exposure_highlight_reconstruction_v3.py"; s=importlib.util.spec_from_file_location("t",p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); clean=re.sub(r"//.*","",re.sub(r"/\*.*?\*/","",m.SHORT_26491,flags=re.S)); bad=re.search(r"\b(?:float|vec[234]|int|ivec[234]|uint|uvec[234]|bool|mat[234])\s+(sample|common|coherent|precision)\b",clean); assert bad is None, f"reserved GLSL identifier {bad.group(1)}"'
          echo "PASS: 26491 V3 workflow infrastructure identity + pre-run reserved-name preflight"

      - name: Build guarded 26491 V3 candidate and APK
        shell: bash
        run: |
          chmod +x build_26491_adaptive_exposure_highlight_reconstruction_v3.sh
          ./build_26491_adaptive_exposure_highlight_reconstruction_v3.sh

      - name: Upload 26491 V3 artifact and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26491-v3-adaptive-exposure-joint-short-highlight
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726491-26491-v3-adaptive-exposure-joint-short-highlight-debug.apk
            build_26491_outputs/**
