name: Build 26633 R1 SHORT Boundary + Shadow Toe + Motion Luma

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26633_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26633_*'
      - 'R1_26633_*'
      - 'build_26633_r1_short_shadow_luma.sh'
      - 'transform_26633_r1.py'
      - 'validate_26633_r1.py'
      - 'verify_26633_r1_*.py'
      - 'handoff_payload_26633_r1/**'
      - '.github/workflows/build-26633-r1-short-shadow-luma.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26633 R1 package and exact successful 26631 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26633_HANDOFF_HASHES.sha256
          bash -n build_26633_r1_short_shadow_luma.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26633_r1.py','validate_26633_r1.py','verify_26633_r1_authority.py','verify_26633_r1_infrastructure.py','verify_26633_r1_patches.py','verify_26633_r1_regressions.py','verify_26633_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26633 R1 candidate from successful compiled 26632 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26633_r1_short_shadow_luma.sh
      - name: Upload 26633 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26633-r1-short-shadow-luma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726633-26633-r1-short-shadow-luma-debug.apk
            build_26633_r1_short_shadow_luma_outputs/
