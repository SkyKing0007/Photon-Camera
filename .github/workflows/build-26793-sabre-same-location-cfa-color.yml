name: Build 26793 Sabre Same Location CFA Color
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26793.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26793 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26793.txt
          grep -Fx 'RUN_26793_SABRE_SAME_LOCATION_CFA_COLOR' TRIGGER_26793.txt
          sha256sum -c 26793_HANDOFF_HASHES.sha256
          bash -n build_26793_sabre_same_location_cfa_color.sh
          python3 -S -m py_compile transform_26793.py validate_26793.py verify_26793_patches.py verify_26793_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26793_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26793_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26793 candidate from successful 26792 authority using exact successful 26792 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26793_sabre_same_location_cfa_color.sh
      - name: Verify exact 26793 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726793-26793-sabre-same-location-cfa-color-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726793-26793-sabre-same-location-cfa-color-debug.apk' build_26793_sabre_same_location_cfa_color_outputs/26793_APK.sha256
      - name: Upload 26793 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26793-sabre-same-location-cfa-color
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726793-26793-sabre-same-location-cfa-color-debug.apk
            build_26793_sabre_same_location_cfa_color_outputs/
