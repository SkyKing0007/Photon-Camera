name: Build 26756 Plan-B JNI Lifetime
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26756_README_UPLOAD.txt'
      - '26756_*'
      - 'build_26756_plan_b_jni_lifetime.sh'
      - 'transform_26756.py'
      - 'validate_26756.py'
      - 'verify_26756_*.py'
      - 'handoff_payload_26756/**'
      - '.github/workflows/build-26756-plan-b-jni-lifetime.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26756 handoff and exact successful 26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26756_HANDOFF_HASHES.sha256
          python3 -S verify_26756_infrastructure.py build_26756_plan_b_jni_lifetime.sh .github/workflows/build-26756-plan-b-jni-lifetime.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26756 candidate from exact successful 26755 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26756_plan_b_jni_lifetime.sh
      - name: Verify exact 26756 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726756-26756-plan-b-jni-lifetime-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726756-26756-plan-b-jni-lifetime-debug.apk' build_26756_plan_b_jni_lifetime_outputs/26756_APK.sha256
      - name: Upload 26756 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26756-plan-b-jni-lifetime
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726756-26756-plan-b-jni-lifetime-debug.apk
            build_26756_plan_b_jni_lifetime_outputs/
