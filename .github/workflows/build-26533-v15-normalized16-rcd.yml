name: Build 26533 V1.5 Normalized16 RCD Domain
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26533_v15_normalized16_rcd_domain.py
      - validate_26533_v15_normalized16_rcd_domain.py
      - build_26533_v15_normalized16_rcd_domain.sh
      - 26533_V15_*.txt
      - 26533_V15_*.sha256
      - 26533_V15_*.patch
      - .github/workflows/build-26533-v15-normalized16-rcd.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26533-v15-normalized16-rcd
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify V1.5 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26533_V15_HANDOFF_HASHES.sha256
          sha256sum -c 26533_V15_RUNTIME_DELTA_FROM_V14.patch.sha256
          sha256sum -c 26533_V15_RUNTIME_ROLLBACK_TO_V14.patch.sha256
          python3 -m py_compile apply_26533_v15_normalized16_rcd_domain.py validate_26533_v15_normalized16_rcd_domain.py
          python3 apply_26533_v15_normalized16_rcd_domain.py --self-test
          python3 validate_26533_v15_normalized16_rcd_domain.py --self-test
          bash -n build_26533_v15_normalized16_rcd_domain.sh
          grep -F 'BASE_V14_HEAD="ca012c54b5c0e32c88f3f21a0853210a75df9d53"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="fb2d0bb45580d70882aa2ab019ec2b11ce3ec928d2036336a7ba2daf4a0e8d18"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="189fb174aa932a02e71f50893b6fcb8eadbc8bea5f71b7d364d2162f6b59e4e9"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26533-v1-4-iris-motion-night-rcd-jin"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726533"; VERSION_BUILD="26533"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'THIRD="$AFTER/app/src/main/cpp/third_party_26507"' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F '( cd "$THIRD" && sha256sum -c "$BJZHOU_MANIFEST" )' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          ! grep -E 'BACKUP_BRANCH=|git (branch|switch).*backup-' build_26533_v15_normalized16_rcd_domain.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: V1.5 exact V1.4 artifact + one-file normalized16-domain handoff verified"
      - name: Guarded 26533 V1.5 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26533_v15_normalized16_rcd_domain.sh
          ./build_26533_v15_normalized16_rcd_domain.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26533-v1-5-normalized16-rcd-domain
          path: |
            IrisCamera-0.9726533-26533-v1-5-normalized16-rcd-debug.apk
            build_26533_v15_normalized16_rcd_outputs/
          if-no-files-found: warn
