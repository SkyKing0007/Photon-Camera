name: Build 26543 V1.2 Owner Memory + Active Figure 7

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26543-owner-memory-figure7.yml'
      - 'build_26543_owner_memory_figure7.sh'
      - 'apply_26543_owner_memory_figure7.py'
      - 'finish_26543_banded_figure7_covariance.py'
      - 'validate_26543_owner_memory_figure7.py'
      - 'preflight_26543_changed_syntax.py'
      - 'preflight_26543_java_kotlin_contracts.py'
      - '26543_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26543-owner-memory-figure7
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26543 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26543_HANDOFF_HASHES.sha256
          sha256sum -c 26543_BASE_26542_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26543_RUNTIME_PAYLOAD.tar.gz.sha256
          sha256sum -c 26543_RUNTIME_DELTA_FROM_26542.patch.sha256
          sha256sum -c 26543_RUNTIME_ROLLBACK_TO_26542.patch.sha256
          python3 -m py_compile apply_26543_owner_memory_figure7.py finish_26543_banded_figure7_covariance.py validate_26543_owner_memory_figure7.py preflight_26543_changed_syntax.py preflight_26543_java_kotlin_contracts.py
          python3 apply_26543_owner_memory_figure7.py --self-test
          python3 finish_26543_banded_figure7_covariance.py --self-test
          python3 validate_26543_owner_memory_figure7.py --self-test
          python3 preflight_26543_changed_syntax.py --self-test
          python3 preflight_26543_java_kotlin_contracts.py --self-test
          bash -n build_26543_owner_memory_figure7.sh
          B=build_26543_owner_memory_figure7.sh
          V=validate_26543_owner_memory_figure7.py
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26542_HANDOFF_HEAD="db3e9aa6490e6fcc84309374a809ed90dfb153de"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9586864070"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="77e2e20c767c11d102c8817cf635e22bfdaebaeba506f968163348feeac932bd"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="862ed7f08dd56c2359ed57ada73ca1095fddec4c815fd1b814dec7b4f27c5056"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="1bc889af07d5065eda3cc8d499827d3ae5981e46801cefb23f3612710bf09e7a"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=967' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=967' "$B" >/dev/null
          grep -F 'runtime file inventory is not exactly seven' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726543"; VERSION_BUILD="26543"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'live-owner Wronski/IPOL Figure-7' "$B" >/dev/null
          grep -F 'bounded band covariance' "$B" >/dev/null
          grep -F "Night no longer reaches PhotonMotionMgc1271Bridge" "$V" >/dev/null
          grep -F "Motion HdrxProcessor no longer reaches PhotonMotionMgc1271Bridge" "$V" >/dev/null
          grep -F "GlesMgcRawFusion does not reach production Spatial-RGB owner" "$V" >/dev/null
          grep -F "production stacker does not compile embedded covariance/mergeRgb shaders" "$V" >/dev/null
          grep -F "stale IrisNightMgc1271Bridge gained callers" "$V" >/dev/null
          grep -F "stale MotionV2CfaReconstruction gained production callers" "$V" >/dev/null
          grep -F 'IRIS_26543_ACTIVE_FIGURE7 owner=GlesIris26521SpatialRgbStacker' "$V" >/dev/null
          grep -F 'persistent Night native RAW copies=1; outstanding Camera2 RAW slots<=3; retained temporal full RAW/2 covariance textures=0' "$V" >/dev/null
          grep -F 'precisionCoeffs' apply_26543_owner_memory_figure7.py >/dev/null
          grep -F 'reserved GLSL keyword precision used as identifier' "$V" >/dev/null
          grep -F 'GLSL_RESERVED_IDENTIFIERS' preflight_26543_changed_syntax.py >/dev/null
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          ! grep -E 'git branch [^-]' "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          [[ "$(grep -Fc 'git diff --binary --full-index --no-ext-diff -- app/src/main' "$B")" -eq 2 ]]
          grep -F 'git commit -qm candidate-26543-for-rollback' "$B" >/dev/null
          ! grep -F 'git diff --binary --full-index --no-ext-diff -R' "$B" >/dev/null
          echo 'PASS: 26543 V1.2 handoff verifies exact 26542 lineage + deterministic full-index patch proof + runtime ownership + bounded memory + reserved-keyword-safe active Figure-7 gates'

      - name: Guarded 26543 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26543_owner_memory_figure7.sh
          ./build_26543_owner_memory_figure7.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26543-owner-memory-figure7
          path: |
            IrisCamera-0.9726543-26543-owner-memory-figure7-debug.apk
            build_26543_owner_memory_figure7_outputs/
          if-no-files-found: warn
