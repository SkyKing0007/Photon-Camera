name: Build 26590 V1 Short Near-Clip Mask

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26590_*'
      - 'REGRESSION_V1_26590_*'
      - 'build_26590_v1_short_nearclip_mask.sh'
      - 'transform_26590_v1.py'
      - 'validate_26590_v1.py'
      - 'verify_26590_v1_authority.py'
      - 'verify_26590_v1_regressions.py'
      - 'verify_26590_v1_patches.py'
      - 'verify_26590_v1_shaders.py'
      - 'handoff_payload_26590_v1/**'
      - '.github/workflows/build-26590-v1-short-nearclip-mask.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26590 V1 package and inherited successful 26589 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26590_HANDOFF_HASHES.sha256
          bash -n build_26590_v1_short_nearclip_mask.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26590_v1.py','validate_26590_v1.py','verify_26590_v1_authority.py','verify_26590_v1_regressions.py','verify_26590_v1_patches.py','verify_26590_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26590_v1_short_nearclip_mask.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="bf57c2379711bed8afe407d35af0d97e63494708"' in s
          assert 'BASE_RUN_ID="33799466212"' in s
          assert 'BASE_JOB_ID="100795046694"' in s
          assert 'BASE_ARTIFACT_ID="9910597718"' in s
          assert 'BASE_ARTIFACT_SHA="df74137fced8a87199c6f255c6a2ae88bc4a44349e4841a0e638940467ffb449"' in s
          assert 'BASE_TAR_SHA="b0d62ae90480c640e6cfcd6bc9f36defd322c76b08d731dde9f97e9292cfe998"' in s
          assert 'VERSION_NAME="0.9726590"' in s and 'VERSION_BUILD="26590"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 3 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26590 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert 'HANDOFF_PARENT_COMMIT="bf57c2379711bed8afe407d35af0d97e63494708"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          print('PASS sealed syntax + successful 26589 authority + exact inherited compiler/build order')
          PY
          grep -F 'reference near-clip trigger used 0.980 while restore admission required raw code at sensor white' REGRESSION_V1_26590_NEAR_CLIP_SHORT_MASK.txt >/dev/null
          grep -F 'historic broad pink, pink/green dotted edges, cyan/green speckling, zipper/ghost artifacts' REGRESSION_V1_26590_CARRIED_26589.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26590_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26590_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F '8c7cef578cd878ea981c2e05253b8ad30993add4' V1_26590_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26589.txt >/dev/null
          grep -F '149b999a4e3ff3df2d355630020d6b1835a823ce' V1_26590_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26589.txt >/dev/null
          ! grep -R -F 'V1_26590_' .github/workflows --exclude='build-26590-v1-short-nearclip-mask.yml'
          ! grep -R -F 'handoff_payload_26590_v1' .github/workflows --exclude='build-26590-v1-short-nearclip-mask.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26590 candidate from successful compiled 26589 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26590_v1_short_nearclip_mask.sh

      - name: Upload 26590 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26590-v1-short-nearclip-mask
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726590-26590-v1-short-nearclip-mask-debug.apk
            build_26590_v1_short_nearclip_mask_outputs/
