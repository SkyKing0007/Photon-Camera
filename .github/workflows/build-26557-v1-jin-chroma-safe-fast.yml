name: Build 26557 V1 Jin Chroma Safe Fast

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26557_*'
      - 'build_26557_v1_jin_chroma_safe_fast.sh'
      - 'validate_26557_v1_jin_chroma_safe_fast.py'
      - '.github/workflows/build-26557-v1-jin-chroma-safe-fast.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26557 V1 localized handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26557_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26557_v1_jin_chroma_safe_fast.py
          python3 validate_26557_v1_jin_chroma_safe_fast.py --self-test
          bash -n build_26557_v1_jin_chroma_safe_fast.sh
          grep -F 'BASE_RUN_ID="33223417490"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9706067486"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'BASE_SUCCESS_COMMIT="b080e8c2794e9ca7a59f9dc5cbbed7915a4a4aed"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'BASE_TAR_SHA="33d8dede08886e67c171323ff074e3b5618420ec99ef15cc2cda75340a3b13b8"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="aa0a28cbe2cb7a71943e35f8ba715190b6011e34e07c74cd08cc6bd034ccd500"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="ae3a8fb971fb4a8f13d2afaa1598908a86cd704278b7ef34e02889c72d71052d"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726557"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F 'VERSION_BUILD="26557"' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26557_v1_jin_chroma_safe_fast.sh >/dev/null
          ! grep -F "V1_26557_" .github/workflows/build-26556-v1-motion30-natural1x-jin-guided.yml

      - name: Build exact 26557 V1 candidate from successful compiled 26556 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26557_v1_jin_chroma_safe_fast.sh
          ./build_26557_v1_jin_chroma_safe_fast.sh

      - name: Upload 26557 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26557-v1-jin-chroma-safe-fast
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726557-26557-v1-jin-chroma-safe-fast-debug.apk
            build_26557_v1_jin_chroma_safe_fast_outputs/
