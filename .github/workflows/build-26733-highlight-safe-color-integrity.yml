name: Build 26733 Highlight Safe Color Integrity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26733_README_UPLOAD.txt'
      - '26733_*'
      - 'build_26733_highlight_safe_color_integrity.sh'
      - 'transform_26733.py'
      - 'validate_26733.py'
      - 'verify_26733_*.py'
      - 'handoff_payload_26733/**'
      - '.github/workflows/build-26733-highlight-safe-color-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26733 handoff and exact successful 26732 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26733_HANDOFF_HASHES.sha256
          python3 -S verify_26733_infrastructure.py build_26733_highlight_safe_color_integrity.sh .github/workflows/build-26733-highlight-safe-color-integrity.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26733 candidate with successful 26732 procedure from successful 26732 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26733_highlight_safe_color_integrity.sh
      - name: Verify exact 26733 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726733-26733-highlight-safe-color-integrity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726733-26733-highlight-safe-color-integrity-debug.apk' build_26733_highlight_safe_color_integrity_outputs/26733_APK.sha256
      - name: Upload 26733 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26733-highlight-safe-color-integrity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726733-26733-highlight-safe-color-integrity-debug.apk
            build_26733_highlight_safe_color_integrity_outputs/
