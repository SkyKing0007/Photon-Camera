name: Build 26483 Bjzhou Online Merge Levelwise LK Joint Chroma V1.1

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 26482_successful_source.patch
      - 26482_successful_after.sha256
      - 26483_delta_from_26482.patch
      - transform_26483_bjzhou_online_merge_v1.py
      - build_26483_bjzhou_online_merge_v1.sh
      - .github/workflows/build-26483-bjzhou-online-merge-v1.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded direct 26482 to 26483
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout experimental infrastructure only
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify committed 26482 checkpoint and 26483 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum 26482_successful_source.patch | awk '{print $1}')" = "3165c4a4f8fd48c07367ef2e4c617fbe5ff98a79cc2f965b14d05ecf6dfc5e49"
          test "$(sha256sum 26482_successful_after.sha256 | awk '{print $1}')" = "85242b109462f0223d1f1cdb6edf6638312efb73da5a4ea7a028dfc3b4b28335"
          test "$(sha256sum 26483_delta_from_26482.patch | awk '{print $1}')" = "d7a2a229c53d67814f9648cdffba11620436f83933160facbb09d4fa56ec7225"
          test "$(sha256sum transform_26483_bjzhou_online_merge_v1.py | awk '{print $1}')" = "e221ebf5ddacbab3f6448baab4d27f3115ac71aea5573e2cc08f736acce18d3c"
          test "$(sha256sum build_26483_bjzhou_online_merge_v1.sh | awk '{print $1}')" = "8247ef64202287e1b64ac9907be56048cd8912f399f4c58af1a0796a6e41ed76"
          python3 -m py_compile transform_26483_bjzhou_online_merge_v1.py
          bash -n build_26483_bjzhou_online_merge_v1.sh
          echo "26482 checkpoint + 26483 infrastructure identity PASS"

      - name: Install runtime GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version

      - name: Run strict direct-successful-26482 procedure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26483_bjzhou_online_merge_v1.sh
          ./build_26483_bjzhou_online_merge_v1.sh

      - name: Upload complete 26483 checkpoint and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26483-bjzhou-online-merge-v1
          if-no-files-found: warn
          path: |
            build_26483_outputs/**
            IrisCamera-0.9726483-26483-bjzhou-online-merge-debug.apk
