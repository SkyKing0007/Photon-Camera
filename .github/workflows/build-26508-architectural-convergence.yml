name: Build 26508 Architectural Convergence

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - build_26508_architectural_convergence.sh
      - apply_26508_architectural_convergence.py
      - validate_26508_architectural_convergence.py
      - 26508_README_UPLOAD.txt
      - 26508_HANDOFF_HASHES.sha256
      - .github/workflows/build-26508-architectural-convergence.yml

permissions:
  contents: read

concurrency:
  group: photon-26508-architectural-convergence
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26508 architecture convergence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Verify tested 26507 V5 lineage and exact backup
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=c4f99d7f3212ac82b0976b41621c8b5bb917d31b
          BACKUP=backup-26507-tested-before-26508-20260818
          FAILED_V1=14d3322f2344620f817769532ba5e8411903696c
          FAILED_V1_BACKUP=backup-26508-failed-transform-before-anchor-fix-20260818
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor "$EXPECTED" HEAD
          git merge-base --is-ancestor "$FAILED_V1" HEAD
          git merge-base --is-ancestor 6118984523296945a0910e55ddaa4d3126184059 HEAD
          test -z "$(git diff --name-only 6118984523296945a0910e55ddaa4d3126184059..HEAD -- app/src/main app/version.properties)"
          test "$(git ls-remote origin refs/heads/$BACKUP | awk '{print $1}')" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/$FAILED_V1_BACKUP | awk '{print $1}')" = "$FAILED_V1"
          echo "PASS: exact tested 26507 V5 lineage + tested-runtime backup + failed-26508-V1 backup"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0; A="glslang-${V}-linux-x86_64-release.tar.gz"; U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26508 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26508_HANDOFF_HASHES.sha256
          bash -n build_26508_architectural_convergence.sh
          python3 -m py_compile apply_26508_architectural_convergence.py validate_26508_architectural_convergence.py
          grep -F 'TESTED_26507_V5_HEAD="c4f99d7f3212ac82b0976b41621c8b5bb917d31b"' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'BACKUP_26507_V5_BRANCH="backup-26507-tested-before-26508-20260818"' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'FAILED_26508_V1_HEAD="14d3322f2344620f817769532ba5e8411903696c"' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'BACKUP_26508_V1_BRANCH="backup-26508-failed-transform-before-anchor-fix-20260818"' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'IRIS_26508_V2_EXACT_26504_DIAGNOSTIC_ANCHOR' apply_26508_architectural_convergence.py >/dev/null
          grep -F 'IRIS_26504_DISABLE_HEAVY_PROVENANCE_READBACK' apply_26508_architectural_convergence.py >/dev/null
          grep -F '26508_PRECHANGE_TESTED_26507_RUNTIME.patch' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26502_canonical_runtime_snapshot.json' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'app_shell_pre_26508_overlay.sha256' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26508_pre_gradle_manifest.json' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26508_post_gradle_integrity.txt' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26508_successful_app_source.tar.gz' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26508_build_report.txt' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'VERSION_NAME=0.9726508' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'VERSION_BUILD=26508' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'IRIS_26508_SHARED_NORMAL_LONG_MGC_FUSION_OWNER' apply_26508_architectural_convergence.py >/dev/null
          grep -F 'IRIS_26508_SHORT_TO_NEAREST_NORMAL_BRIDGE_AUTHORITY' apply_26508_architectural_convergence.py >/dev/null
          grep -F 'IRIS_26508_GPU_8_CONNECTED_REGION_PROPAGATION' apply_26508_architectural_convergence.py >/dev/null
          grep -F 'IRIS_26508_BRIDGE_GEOMETRY_ONLY_NEVER_CONTRIBUTES_RGB' apply_26508_architectural_convergence.py >/dev/null
          if grep -F 'HDR_EXPOSURE_SCALE = 1.25f' apply_26508_architectural_convergence.py >/dev/null; then echo 'rejected HDR 1.25 draft survived' >&2; exit 1; fi
          if grep -Eq 'ParseExif|getMPY' apply_26508_architectural_convergence.py; then echo 'forbidden EXIF/MPY edit survived' >&2; exit 1; fi
          grep -F 'pinned libultrahdr root ultrahdr_api.h missing' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'stale out-of-scope 26507 V3 freeze locals returned' build_26508_architectural_convergence.sh >/dev/null
          grep -F '26507 V4 Throwable-safe JPEG444 logging missing' build_26508_architectural_convergence.sh >/dev/null
          grep -F 'IRIS_26508_TYPED_POSTBUILD_PROOF' build_26508_architectural_convergence.sh >/dev/null
          python3 - <<'PYTYPE'
          from pathlib import Path
          s=Path('build_26508_architectural_convergence.sh').read_text()
          block=s.split('IRIS_26508_TYPED_POSTBUILD_PROOF',1)[1].split('PYAPK',2)[1]
          dex_part=block.split('shaders={',1)[0]
          for non_dex in ('IRIS_26508_BRIDGE_GEOMETRY_ONLY_NEVER_CONTRIBUTES_RGB','IRIS_26508_GPU_8_CONNECTED_REGION_PROPAGATION','IRIS_26507_SHORT_A_SHARED_MGC_PRECHROMA_GATE','IRIS_26507_LONG_A_SHARED_MGC_PRECHROMA_GATE'):
              assert non_dex not in dex_part, f'source/shader-only marker incorrectly required from DEX: {non_dex}'
          for runtime in ('IRIS_26508_FROZEN_GEOMETRY_BRIDGE','IRIS_26508_NEAREST_NORMAL_BRIDGE_SELECTION','IRIS_26508_SHARED_NORMAL_LONG_MGC_FUSION_OWNER','IRIS_26508_SHORT_ARCHITECTURAL_RESULT','IRIS_26507_FULL_HDR_DISPLAY_CAPACITY_PARITY','IRIS_26507_JPEG444'):
              assert runtime in dex_part, f'missing typed runtime DEX proof marker: {runtime}'
          print('PASS: 26508 post-build proof retains 26507 V5 type-aware contract')
          PYTYPE
          echo "PASS: 26508 handoff static guards"

      - name: Build guarded 26508
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26508_architectural_convergence.sh apply_26508_architectural_convergence.py
          ./build_26508_architectural_convergence.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26508-architectural-convergence
          path: |
            IrisCamera-0.9726508-26508-architectural-convergence-debug.apk
            build_26508_architectural_convergence_outputs/
          if-no-files-found: warn
