name: Build 26813 26809 IQ + Gallery + Chroma No-Raise
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26813.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26813 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26813.txt
          grep -Fx 'RUN_26813_26809_IQ_GALLERY_CHROMA_NO_RAISE' TRIGGER_26813.txt
          sha256sum -c 26813_HANDOFF_HASHES.sha256
          bash -n build_26813_neutral_parent_edge_fringe.sh
          python3 -S -m py_compile transform_26813.py validate_26813.py verify_26813_patches.py verify_26813_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26813_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26813_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26813 candidate from successful 26812 authority using exact successful 26812 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26813_neutral_parent_edge_fringe.sh
      - name: Verify exact 26813 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726813-26813-26809-iq-gallery-chroma-no-raise-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726813-26813-26809-iq-gallery-chroma-no-raise-debug.apk' build_26813_neutral_parent_edge_fringe_outputs/26813_APK.sha256
      - name: Upload 26813 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26813-26809-iq-gallery-chroma-no-raise
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726813-26813-26809-iq-gallery-chroma-no-raise-debug.apk
            build_26813_neutral_parent_edge_fringe_outputs/
