name: Build 26709 Adaptive Reference Long
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26709_README_UPLOAD.txt'
      - '26709_*'
      - 'build_26709_adaptive_reference_long.sh'
      - 'transform_26709.py'
      - 'validate_26709.py'
      - 'verify_26709_*.py'
      - 'handoff_payload_26709/**'
      - '.github/workflows/build-26709-adaptive-reference-long.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26709 handoff and exact successful 26708 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26709_HANDOFF_HASHES.sha256
          bash -n build_26709_adaptive_reference_long.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26709.py','validate_26709.py','verify_26709_authority.py','verify_26709_patches.py','verify_26709_regressions.py','verify_26709_shaders.py','verify_26709_infrastructure.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          python3 -S verify_26709_infrastructure.py build_26709_adaptive_reference_long.sh .github/workflows/build-26709-adaptive-reference-long.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26709 candidate from successful 26708 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26709_adaptive_reference_long.sh
      - name: Verify exact 26709 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726709-26709-adaptive-reference-long-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726709-26709-adaptive-reference-long-debug.apk' build_26709_adaptive_reference_long_outputs/26709_APK.sha256
      - name: Upload 26709 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26709-adaptive-reference-long
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726709-26709-adaptive-reference-long-debug.apk
            build_26709_adaptive_reference_long_outputs/
