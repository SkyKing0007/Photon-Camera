name: Build 26518 Released-Spatial ABI Compatibility

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26518_released_spatial_abi.py
      - validate_26518_released_spatial_abi.py
      - build_26518_released_spatial_abi.sh
      - 26518_BASE_26517_COMMIT.txt
      - 26518_BJZHOU_RELEASE_SPATIAL_REF.txt
      - 26518_README_UPLOAD.txt
      - 26518_HANDOFF_HASHES.sha256
      - .github/workflows/build-26518-released-spatial-abi.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26518-released-spatial-abi-v1
  cancel-in-progress: false

jobs:
  build:
    name: Direct tested 26517 to released-Spatial ABI 26518
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify 26518 handoff invariants
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26518_HANDOFF_HASHES.sha256
          bash -n build_26518_released_spatial_abi.sh
          python3 -m py_compile apply_26518_released_spatial_abi.py validate_26518_released_spatial_abi.py
          [[ "$(tr -d '\r\n' < 26518_BASE_26517_COMMIT.txt)" == "0807073b897c057e90f26f557c4b5455762dba70" ]]
          grep -F 'SUCCESSFUL_26517_HEAD="0807073b897c057e90f26f557c4b5455762dba70"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'BACKUP_26517="backup-26517-before-26518-released-spatial-abi"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'BASE_WORKFLOW="build-26517-released-spatial-viewfinder.yml"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26517-released-spatial-viewfinder-v1"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'RELEASE_SPATIAL_HEAD="c4ff5a3e99b5f9f6027ba1c038eb7cc850bb9b01"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726518"; VERSION_BUILD="26518"' build_26518_released_spatial_abi.sh >/dev/null
          grep -F 'IRIS_26518_RELEASED_1271_RESULT_ABI_SNR_BRIDGE' apply_26518_released_spatial_abi.py >/dev/null
          grep -F 'mgcDenoiseTuningSnr = bayerKernelTuning.referenceSnr' apply_26518_released_spatial_abi.py >/dev/null
          grep -F 'mgcSharpenTuningSnr = bayerKernelTuning.referenceSnr' apply_26518_released_spatial_abi.py >/dev/null
          [[ "$(grep -Fc 'MgcSabreResolveTuning' apply_26518_released_spatial_abi.py)" -eq 1 ]] || { echo 'Sabre tuning token count drifted from forbidden-check-only contract' >&2; exit 1; }
          echo 'PASS: 26518 handoff is one-file c4ff result-ABI adapter; no merge/tuning import'
      - name: Build guarded 26518 from successful 26517 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26518_released_spatial_abi.sh apply_26518_released_spatial_abi.py validate_26518_released_spatial_abi.py
          ./build_26518_released_spatial_abi.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26518-released-spatial-abi-v1
          path: |
            IrisCamera-0.9726518-26518-released-spatial-abi-debug.apk
            build_26518_released_spatial_abi_outputs/
          if-no-files-found: warn
