name: Build 26537 Night Jin Luma Root Fix
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26537_night_jin_luma_root_fix.py
      - validate_26537_night_jin_luma_root_fix.py
      - preflight_26537_changed_syntax.py
      - build_26537_night_jin_luma_root_fix.sh
      - 26537_HANDOFF_HASHES.sha256
      - 26537_BASE_26536_CANDIDATE_SOURCE.sha256
      - 26537_BASE_26536_CANDIDATE_SOURCE_FILE.sha256
      - 26537_BASE_26536_HANDOFF_HEAD.txt
      - 26537_PROTECTED_26536_RUNTIME_ANCHORS.sha256
      - 26537_RUNTIME_FILES.txt
      - 26537_RUNTIME_DELTA_FROM_26536.patch
      - 26537_RUNTIME_DELTA_FROM_26536.patch.sha256
      - 26537_RUNTIME_ROLLBACK_TO_26536.patch
      - 26537_RUNTIME_ROLLBACK_TO_26536.patch.sha256
      - 26537_UPLOAD_INSTRUCTIONS.md
      - 26537_LOCAL_VALIDATION.txt
      - .github/workflows/build-26537-night-jin-luma-root-fix.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26537-night-jin-luma-root-fix
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26537 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26537_HANDOFF_HASHES.sha256
          sha256sum -c 26537_BASE_26536_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26537_RUNTIME_DELTA_FROM_26536.patch.sha256
          sha256sum -c 26537_RUNTIME_ROLLBACK_TO_26536.patch.sha256
          python3 -m py_compile apply_26537_night_jin_luma_root_fix.py validate_26537_night_jin_luma_root_fix.py preflight_26537_changed_syntax.py
          python3 apply_26537_night_jin_luma_root_fix.py --self-test
          python3 validate_26537_night_jin_luma_root_fix.py --self-test
          bash -n build_26537_night_jin_luma_root_fix.sh

          B=build_26537_night_jin_luma_root_fix.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26536_HANDOFF_HEAD="1744e02eaa9688a87c98d5fe243dbff793b634d9"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26536-v1-2-exact-26535-procedure"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9546629470"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="6990184bc7779a1da732d96bcbe06b79a941c8c720c3435e954b46d6e0e7eea7"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="14f156e979e40c62ad9aa26d69e7952b18f6f71b68b3399b0b222decb40a2cd4"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=964' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=964' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726537"; VERSION_BUILD="26537"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'assert_cpp_deps_exact "$ROOT" post' "$B" >/dev/null
          grep -F 'IRIS_26537_POSTBUILD_SANITIZED_VALIDATION' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'NIGHT_JIN_PROVIDER=CPU_ONLY' "$B" >/dev/null
          grep -F 'NIGHT_PRE_JIN_ULTRAHDR=false' "$B" >/dev/null
          grep -F 'LUMA_ACTIVATION_SNR=PREMERGE_REFERENCE' "$B" >/dev/null
          grep -F 'PHOTON_NIGHT_FALLBACK=false' "$B" >/dev/null
          grep -F 'SINGLE_FRAME_FALLBACK=false' "$B" >/dev/null

          # No branch creation: only branch query via --show-current is allowed.
          python3 - "$B" <<'PY'
          from pathlib import Path
          s=Path(__import__('sys').argv[1]).read_text().splitlines()
          bad=[x for x in s if 'git branch ' in x and 'git branch --show-current' not in x]
          assert not bad, bad
          print('PASS: no backup/local branch creation in 26537 build script')
          PY

          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: 26537 handoff mirrors proven 26535/26536 strict pre-execution procedure'

      - name: Guarded 26537 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26537_night_jin_luma_root_fix.sh
          ./build_26537_night_jin_luma_root_fix.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26537-night-jin-luma-root-fix
          path: |
            IrisCamera-0.9726537-26537-night-jin-luma-root-fix-debug.apk
            build_26537_night_jin_luma_root_fix_outputs/
          if-no-files-found: warn
