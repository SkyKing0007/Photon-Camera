name: Build 26667 R1 Preview Long Confidence

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26667_R1_README_UPLOAD.txt'
      - 'R1_26667_*'
      - 'build_26667_r1_preview_long_confidence.sh'
      - 'transform_26667.py'
      - 'validate_26667.py'
      - 'verify_26667_*.py'
      - 'handoff_payload_26667/**'
      - '.github/workflows/build-26667-r1-preview-long-confidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26667 handoff and exact successful 26666 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26667_HANDOFF_HASHES.sha256
          bash -n build_26667_r1_preview_long_confidence.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26667.py','validate_26667.py','verify_26667_authority.py','verify_26667_infrastructure.py','verify_26667_patches.py','verify_26667_regressions.py','verify_26667_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26667 candidate from successful 26666 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26667_r1_preview_long_confidence.sh
      - name: Verify exact 26667 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726667-26667-r1-preview-long-confidence-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726667-26667-r1-preview-long-confidence-debug.apk" build_26667_r1_preview_long_confidence_outputs/26667_R1_APK.sha256
      - name: Upload 26667 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26667-r1-preview-long-confidence
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726667-26667-r1-preview-long-confidence-debug.apk
            build_26667_r1_preview_long_confidence_outputs/
