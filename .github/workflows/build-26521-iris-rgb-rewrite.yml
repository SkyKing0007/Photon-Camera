name: Build 26521 Iris RGB Rewrite
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26520_zsl_stacked_dng.py
      - apply_26521_iris_rgb_rewrite.py
      - validate_26521_iris_rgb_rewrite.py
      - iris_fused_bayer_rgb_26521.glsl.txt
      - build_26521_iris_rgb_rewrite.sh
      - 26521_BASE_26519_COMMIT.txt
      - 26521_README_UPLOAD.txt
      - 26521_HANDOFF_HASHES.sha256
      - .github/workflows/build-26521-iris-rgb-rewrite.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26521-iris-rgb-rewrite-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26521_HANDOFF_HASHES.sha256
          python3 -m py_compile apply_26520_zsl_stacked_dng.py apply_26521_iris_rgb_rewrite.py validate_26521_iris_rgb_rewrite.py
          bash -n build_26521_iris_rgb_rewrite.sh
          [[ "$(tr -d '\r\n' < 26521_BASE_26519_COMMIT.txt)" == "9b59a27235747733bacdde68bf6a888ebffefa18" ]]
          grep -F 'BACKUP="backup-26519-before-26521-iris-rgb-rewrite"' build_26521_iris_rgb_rewrite.sh >/dev/null
          grep -F 'protected_build_infrastructure_drift.txt' build_26521_iris_rgb_rewrite.sh >/dev/null
          grep -F 'assert_cpp_deps_exact()' build_26521_iris_rgb_rewrite.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726521"' build_26521_iris_rgb_rewrite.sh >/dev/null
          echo "PASS: 26521 handoff verified"
      - name: Guarded build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x build_26521_iris_rgb_rewrite.sh
          ./build_26521_iris_rgb_rewrite.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26521-iris-rgb-rewrite-v1
          path: |
            IrisCamera-0.9726521-26521-iris-rgb-rewrite-debug.apk
            build_26521_iris_rgb_rewrite_outputs/
          if-no-files-found: warn
