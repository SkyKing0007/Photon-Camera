name: Build 26498 V1.3 Recovery V6

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26498_v1_3_recovery_v6.sh
      - .github/workflows/build-26498-v1-3-recovery-v6.yml
      - 26498_V1_3_RECOVERY_V6_HASHES.sha256
      - 26498_V1_3_RECOVERY_V6_ANCHOR_FIX.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Require experimental branch and infrastructure-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Verify exact V6 handoff identities and self-tests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26498_V1_3_RECOVERY_V6_HASHES.sha256
          python3 -m py_compile verify_26498_v1_3_recovery_v5_source_integrity.py
          python3 verify_26498_v1_3_recovery_v5_source_integrity.py self-test
          bash -n build_26498_v1_3_recovery_v6.sh
          grep -Fq "'rm -rf \"\$OUT\" && mkdir -p \"\$OUT\"\\n'" build_26498_v1_3_recovery_v6.sh
          grep -q 'CAND_OWNED_COUNT' build_26498_v1_3_recovery_v6.sh
          grep -q 'expected=865' build_26498_v1_3_recovery_v6.sh
          grep -q 'cd "$CAND"' build_26498_v1_3_recovery_v6.sh
          grep -q ':app:assembleDebug' build_26498_v1_3_recovery_v6.sh
          grep -q 'RECOVERY V6 BUILD COMPLETE' build_26498_v1_3_recovery_v6.sh
          echo 'PASS: V6 handoff identity + corrected-anchor + source-integrity self-tests'

      - name: Build guarded 26498 V1.3 candidate and APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26498_v1_3_recovery_v6.sh
          ./build_26498_v1_3_recovery_v6.sh

      - name: Upload 26498 V1.3 APK and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26498-v1.3-recovery-v6
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726498-26498-v1.3-daylight-root-fixes-shadow-aux-debug.apk
            build_26498_v1_3_recovery_v6_outputs/**
