name: Build 26521 V5 Iris Spatial RGB
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26520_v4_live_mgc_dng.py
      - apply_26520_v5_spatial_correctness.py
      - apply_26521_v4_iris_spatial_rgb.py
      - apply_26521_v5_iris_spatial_rgb.py
      - validate_26521_v5_iris_spatial_rgb.py
      - preflight_26521_v5_iris_embedded_shaders.py
      - build_26521_v5_iris_spatial_rgb.sh
      - 26521_V5_BASE_26519_COMMIT.txt
      - 26521_V5_BJZHOU_RELEASE_SPATIAL_REF.txt
      - 26521_V5_SPATIAL_FIX_PROVENANCE.txt
      - 26521_V5_README_UPLOAD.txt
      - 26521_V5_HANDOFF_HASHES.sha256
      - .github/workflows/build-26521-v5-iris-spatial-rgb.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26521-v5-iris-spatial-rgb-v1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          expected=digest.split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert expected==actual
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify V5 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26521_V5_HANDOFF_HASHES.sha256
          python3 -m py_compile \
            apply_26520_v4_live_mgc_dng.py \
            apply_26520_v5_spatial_correctness.py \
            apply_26521_v4_iris_spatial_rgb.py \
            apply_26521_v5_iris_spatial_rgb.py \
            validate_26521_v5_iris_spatial_rgb.py \
            preflight_26521_v5_iris_embedded_shaders.py
          bash -n build_26521_v5_iris_spatial_rgb.sh
          [[ "$(tr -d '\r\n' < 26521_V5_BASE_26519_COMMIT.txt)" == \
             "9b59a27235747733bacdde68bf6a888ebffefa18" ]]
          grep -F 'BACKUP_26519="backup-26519-before-26521-iris-rgb-rewrite"' build_26521_v5_iris_spatial_rgb.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726521"; VERSION_BUILD="26521"' build_26521_v5_iris_spatial_rgb.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26521_v5_iris_spatial_rgb.sh >/dev/null
          grep -F 'IRIS_26521_V5_INDEPENDENT_SPATIAL_RGB_OWNER_ACTIVE' apply_26521_v5_iris_spatial_rgb.py >/dev/null
          grep -F 'IRIS_26520_V5_CONTINUOUS_FINEST_LK_TRANSPORT' apply_26520_v5_spatial_correctness.py >/dev/null
          grep -F 'IRIS_26520_V5_SPATIAL_RGB_TWO_SLOT_RAW_LIFETIME' apply_26520_v5_spatial_correctness.py >/dev/null
          grep -F 'EXCLUDED_62927DB=true' 26521_V5_SPATIAL_FIX_PROVENANCE.txt >/dev/null
          grep -F 'DEFERRED_SPATIAL_CHROMA_IIR=true' 26521_V5_SPATIAL_FIX_PROVENANCE.txt >/dev/null
          ! grep -F 'GlesMgcRawSabre' apply_26521_v5_iris_spatial_rgb.py
          ! grep -F 'RawTilePlanner' apply_26521_v5_iris_spatial_rgb.py
          glslangValidator --version | head -1 | grep -F 16.5.0
          echo "PASS: 26521 V5 handoff static guards verified"
      - name: Guarded V5 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26521_v5_iris_spatial_rgb.sh
          ./build_26521_v5_iris_spatial_rgb.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26521-v5-iris-spatial-rgb-v1
          path: |
            IrisCamera-0.9726521-26521-v5-iris-spatial-rgb-debug.apk
            build_26521_v5_iris_spatial_rgb_outputs/
          if-no-files-found: warn
