name: Build 26693 Global UI Spektra Lifecycle

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26693_README_UPLOAD.txt'
      - '26693_*'
      - 'build_26693_global_ui_spektra_lifecycle.sh'
      - 'transform_26693.py'
      - 'validate_26693.py'
      - 'repair_26693_*.py'
      - 'handoff_payload_26693/**'
      - '.github/workflows/build-26693-global-ui-spektra-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26693 handoff and exact successful 26692 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26693_HANDOFF_HASHES.sha256
          bash -n build_26693_global_ui_spektra_lifecycle.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26693.py','validate_26693.py','repair_26693_authority.py','repair_26693_infrastructure.py','repair_26693_patches.py','repair_26693_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26693 candidate from successful 26692 R1.1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26693_global_ui_spektra_lifecycle.sh
      - name: Verify exact 26693 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726693-26693-global-ui-spektra-lifecycle-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726693-26693-global-ui-spektra-lifecycle-debug.apk" build_26693_global_ui_spektra_lifecycle_outputs/26693_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26693_global_ui_spektra_lifecycle_outputs/26693_apk_jni_contract.txt
      - name: Upload 26693 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26693-global-ui-spektra-lifecycle
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726693-26693-global-ui-spektra-lifecycle-debug.apk
            build_26693_global_ui_spektra_lifecycle_outputs/
