name: Build 26643 R1 AOSP HEIC UI

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26643_R1_README_UPLOAD.txt'
      - 'R1_26643_*'
      - 'build_26643_r1_aosp_heic_ui.sh'
      - 'transform_26643_r1.py'
      - 'validate_26643_r1.py'
      - 'verify_26643_r1_*.py'
      - 'handoff_payload_26643_r1/**'
      - '.github/workflows/build-26643-r1-aosp-heic-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26643 R1 package and exact successful 26642 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26643_HANDOFF_HASHES.sha256
          bash -n build_26643_r1_aosp_heic_ui.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26643_r1.py','validate_26643_r1.py','verify_26643_r1_authority.py','verify_26643_r1_infrastructure.py','verify_26643_r1_patches.py','verify_26643_r1_regressions.py','verify_26643_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26643 R1 candidate from successful compiled 26642 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26643_r1_aosp_heic_ui.sh
      - name: Upload 26643 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26643-r1-aosp-heic-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726643-26643-r1-aosp-heic-ui-debug.apk
            build_26643_r1_aosp_heic_ui_outputs/
