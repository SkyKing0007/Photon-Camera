name: Build 26654 R1 Final Highlight Authority Cleanup

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26654_R1_README_UPLOAD.txt'
      - 'R1_26654_*'
      - 'build_26654_r1_final_highlight_authority_cleanup.sh'
      - 'transform_26654.py'
      - 'validate_26654.py'
      - 'verify_26654_*.py'
      - 'handoff_payload_26654/**'
      - '.github/workflows/build-26654-r1-final-highlight-authority-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26654 handoff and exact successful 26653 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26654_HANDOFF_HASHES.sha256
          bash -n build_26654_r1_final_highlight_authority_cleanup.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26654.py','validate_26654.py','verify_26654_authority.py','verify_26654_infrastructure.py','verify_26654_patches.py','verify_26654_regressions.py','verify_26654_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26654 candidate from successful 26653 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26654_r1_final_highlight_authority_cleanup.sh
      - name: Verify exact 26654 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726654-26654-r1-final-highlight-authority-cleanup-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726654-26654-r1-final-highlight-authority-cleanup-debug.apk" build_26654_r1_final_highlight_authority_cleanup_outputs/26654_R1_APK.sha256
      - name: Upload 26654 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26654-r1-final-highlight-authority-cleanup
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726654-26654-r1-final-highlight-authority-cleanup-debug.apk
            build_26654_r1_final_highlight_authority_cleanup_outputs/
