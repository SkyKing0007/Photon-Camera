name: Build 26469 Censored Highlight Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26469_censored_highlight_foundation.sh
      - .github/workflows/build-26469-censored-highlight-foundation.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26469 build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run guarded 26469 operation
        shell: bash
        run: |
          chmod +x ./build_26469_censored_highlight_foundation.sh
          ./build_26469_censored_highlight_foundation.sh

      - name: Upload 26469 APK and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26469-censored-highlight-foundation
          retention-days: 14
          if-no-files-found: warn
          path: |
            build_26469_outputs/**
            IrisCamera-0.9726469-26469-censored-highlight-foundation-debug.apk
