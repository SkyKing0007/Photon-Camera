name: Build 26718 20x High Zoom Detail Reconstruction
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26718_README_UPLOAD.txt'
      - '26718_*'
      - 'build_26718_high_zoom_detail_reconstruction.sh'
      - 'transform_26718.py'
      - 'validate_26718.py'
      - 'verify_26718_*.py'
      - 'handoff_payload_26718/**'
      - '.github/workflows/build-26718-high-zoom-detail-reconstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26718 handoff and exact successful 26717 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26718_HANDOFF_HASHES.sha256
          python3 -S verify_26718_infrastructure.py build_26718_high_zoom_detail_reconstruction.sh .github/workflows/build-26718-high-zoom-detail-reconstruction.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26718 candidate with successful 26717 procedure from successful 26717 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26718_high_zoom_detail_reconstruction.sh
      - name: Verify exact 26718 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726718-26718-high-zoom-detail-reconstruction-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726718-26718-high-zoom-detail-reconstruction-debug.apk' build_26718_high_zoom_detail_reconstruction_outputs/26718_APK.sha256
      - name: Upload 26718 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26718-high-zoom-detail-reconstruction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726718-26718-high-zoom-detail-reconstruction-debug.apk
            build_26718_high_zoom_detail_reconstruction_outputs/
