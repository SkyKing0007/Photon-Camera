name: Build 26502 Stack-Aware Chroma Highlight
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - build_26502_stack_aware_chroma_highlight.sh
      - 26502_v1_stack_aware_chroma_highlight_runtime.patch
      - validate_26502_stack_aware_chroma_highlight.py
      - 26502_PRECHANGE_26501_V6_PATCH_CHECKPOINT.txt
      - 26502_HANDOFF_HASHES.sha256
      - 26502_v2_buildfix_prechange.patch
      - 26502_v3_infrastructure_correction.patch
      - .github/workflows/build-26502-stack-aware-chroma-highlight.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - name: Verify branch, V6 lineage, and backup branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor ed5470179aea9514c15d52dcb35613c7925778c6 HEAD
          git merge-base --is-ancestor c6415d57a0d276b6ba7d4948df45ed15ea88a410 HEAD
          git fetch --no-tags origin backup-26501-v6-before-26502-20260818:refs/remotes/origin/backup-26501-v6-before-26502-20260818
          test "$(git rev-parse origin/backup-26501-v6-before-26502-20260818)" = "c6415d57a0d276b6ba7d4948df45ed15ea88a410"
          DIRECT_RUNTIME_DIFF="${RUNNER_TEMP}/26502-direct-runtime-diff.txt"
          git diff --name-only ed5470179aea9514c15d52dcb35613c7925778c6..HEAD -- app/src/main app/version.properties > "$DIRECT_RUNTIME_DIFF"
          test ! -s "$DIRECT_RUNTIME_DIFF" || { cat "$DIRECT_RUNTIME_DIFF" >&2; exit 1; }
          echo "PASS: exact tested 26501 V6 backup branch is frozen before 26502"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Bootstrap pinned Khronos GLSL validator without APT
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          GLSLANG_VERSION="16.5.0"
          GLSLANG_ASSET="glslang-${GLSLANG_VERSION}-linux-x86_64-release.tar.gz"
          GLSLANG_URL="https://github.com/KhronosGroup/glslang/releases/download/${GLSLANG_VERSION}/${GLSLANG_ASSET}"
          RELEASE_META="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-release.json"
          TOOL_ROOT="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/${GLSLANG_ASSET}"
          rm -rf "$TOOL_ROOT" "$ARCHIVE" "$RELEASE_META"; mkdir -p "$TOOL_ROOT"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/${GLSLANG_VERSION}" -o "$RELEASE_META"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 "$GLSLANG_URL" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          python3 -c 'import hashlib,json,sys; m,v,n,u,a=sys.argv[1:]; d=json.load(open(m,encoding="utf-8")); assert d.get("tag_name")==v; xs=[x for x in d.get("assets",[]) if x.get("name")==n]; assert len(xs)==1; x=xs[0]; assert x.get("browser_download_url")==u; dg=x.get("digest") or ""; assert dg.startswith("sha256:"); ex=dg.split(":",1)[1].lower(); ac=hashlib.sha256(open(a,"rb").read()).hexdigest(); assert ac==ex, f"Khronos asset SHA-256 mismatch: {ac} != {ex}"; print(f"PASS: official Khronos release asset SHA256 {ac}")' "$RELEASE_META" "$GLSLANG_VERSION" "$GLSLANG_ASSET" "$GLSLANG_URL" "$ARCHIVE"
          ARCHIVE_LIST="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-contents.txt"; tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"; grep -Fxq 'bin/glslangValidator' "$ARCHIVE_LIST"; grep -Fxq 'bin/glslang' "$ARCHIVE_LIST"; tar -xzf "$ARCHIVE" -C "$TOOL_ROOT"; test -x "$TOOL_ROOT/bin/glslang"; test -e "$TOOL_ROOT/bin/glslangValidator"
          VERSION_OUTPUT="$("$TOOL_ROOT/bin/glslangValidator" --version)"; VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"; printf '%s\n' "$VERSION_LINE"; grep -F '16.5.0' <<<"$VERSION_LINE"; echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"; echo "PASS: pinned Khronos glslangValidator 16.5.0 ready without APT"
      - name: Restore canonical 26499 V7 source archive from Git history
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SOURCE_COMMIT="719f93fd2085ffd41ead0c9bcfa2bd630f34ab8b"; CANONICAL_SOURCE_SHA256="ce5be58fa20b9e28786b9c6e4355743066fe92e78791b50b5ee2df568c5ae9e1"
          git merge-base --is-ancestor "$CANONICAL_SOURCE_COMMIT" HEAD
          git show "${CANONICAL_SOURCE_COMMIT}:26499_v7_successful_app_source.tar.gz" > 26499_v7_successful_app_source.tar.gz
          echo "$CANONICAL_SOURCE_SHA256  26499_v7_successful_app_source.tar.gz" | sha256sum -c -
          echo "PASS: restored canonical V7 source archive from Git history"
      - name: Verify exact 26502 handoff files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26502_HANDOFF_HASHES.sha256
          bash -n build_26502_stack_aware_chroma_highlight.sh
          python3 -m py_compile validate_26502_stack_aware_chroma_highlight.py validate_26501_proper_spatial_rgb.py verify_26501_source_integrity.py
          grep -F 'V6_HEAD="c6415d57a0d276b6ba7d4948df45ed15ea88a410"' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'BACKUP_BRANCH="backup-26501-v6-before-26502-20260818"' build_26502_stack_aware_chroma_highlight.sh
          if grep -Fq 'backup-26502-v1-before-buildfix-20260818' build_26502_stack_aware_chroma_highlight.sh .github/workflows/build-26502-stack-aware-chroma-highlight.yml; then echo "obsolete infrastructure-only backup requirement survived" >&2; exit 1; fi
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'assert_no_patch_artifacts "26502_runtime_patch"' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'assert_no_patch_artifacts "26502_preflight_final_candidate"' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'PATCH_26502_SHA="2725bb41bdc867b2f7dfbcb41f7373ca16e00e0eb75c4acefbc8d43fb478eb28"' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'VERSION_NAME=0.9726502' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'VERSION_BUILD=26502' build_26502_stack_aware_chroma_highlight.sh
          grep -F './gradlew clean :app:assembleDebug --stacktrace' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26502_stack_aware_chroma_highlight.sh
          grep -F 'IRIS_26502_OPPONENT_SUPPORT_REGULARIZATION' 26502_v1_stack_aware_chroma_highlight_runtime.patch
          grep -F 'IRIS_26502_CONTINUOUS_HIGHLIGHT_RELIABILITY' 26502_v1_stack_aware_chroma_highlight_runtime.patch
          grep -F 'IRIS_26502_STACK_AWARE_RGB_OUTPUT' 26502_v1_stack_aware_chroma_highlight_runtime.patch
          if grep -Eq '\|[[:space:]]*grep[[:space:]]+-q' build_26502_stack_aware_chroma_highlight.sh; then echo "pipefail-unsafe grep -q pipeline survived" >&2; exit 1; fi
          echo "PASS: 26502 handoff identity and build gates verified"
      - name: Build guarded 26502 candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26502_stack_aware_chroma_highlight.sh
          ./build_26502_stack_aware_chroma_highlight.sh
      - name: Upload 26502 APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26502-stack-aware-chroma-highlight
          path: |
            IrisCamera-0.9726502-26502-stack-aware-chroma-highlight-debug.apk
            build_26502_stack_aware_chroma_highlight_outputs/
          if-no-files-found: warn
