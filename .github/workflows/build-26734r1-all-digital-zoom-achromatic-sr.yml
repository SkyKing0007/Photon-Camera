name: Build 26734 R1 All Digital Zoom Achromatic SR
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26734R1_README_UPLOAD.txt'
      - '26734R1_*'
      - 'build_26734r1_all_digital_zoom_achromatic_sr.sh'
      - 'transform_26734r1.py'
      - 'validate_26734r1.py'
      - 'verify_26734r1_*.py'
      - 'handoff_payload_26734r1/**'
      - '.github/workflows/build-26734r1-all-digital-zoom-achromatic-sr.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26734 R1 handoff and exact successful 26733 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26734R1_HANDOFF_HASHES.sha256
          python3 -S verify_26734r1_infrastructure.py build_26734r1_all_digital_zoom_achromatic_sr.sh .github/workflows/build-26734r1-all-digital-zoom-achromatic-sr.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact unchanged 26734 runtime candidate with successful 26733 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26734r1_all_digital_zoom_achromatic_sr.sh
      - name: Verify exact 26734 R1 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726734-26734-r1-all-digital-zoom-achromatic-sr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726734-26734-r1-all-digital-zoom-achromatic-sr-debug.apk' build_26734r1_all_digital_zoom_achromatic_sr_outputs/26734R1_APK.sha256
      - name: Upload 26734 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26734-r1-all-digital-zoom-achromatic-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726734-26734-r1-all-digital-zoom-achromatic-sr-debug.apk
            build_26734r1_all_digital_zoom_achromatic_sr_outputs/
