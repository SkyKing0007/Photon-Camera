name: Build 26822 Single Owner False Color Attenuation
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26822.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26822 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26822.txt
          grep -Fx 'RUN_26822_SINGLE_OWNER_FALSE_COLOR_ATTENUATION' TRIGGER_26822.txt
          sha256sum -c 26822_HANDOFF_HASHES.sha256
          bash -n build_26822_single_owner_false_color_attenuation.sh
          python3 -S -m py_compile transform_26822.py validate_26822.py verify_26822_patches.py verify_26822_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26822_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26822_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26822 candidate from successful 26821 authority using exact successful 26821 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26822_single_owner_false_color_attenuation.sh
      - name: Verify exact 26822 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726822-26822-single-owner-false-color-attenuation-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726822-26822-single-owner-false-color-attenuation-debug.apk' build_26822_single_owner_false_color_attenuation_outputs/26822_APK.sha256
      - name: Upload 26822 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26822-single-owner-false-color-attenuation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726822-26822-single-owner-false-color-attenuation-debug.apk
            build_26822_single_owner_false_color_attenuation_outputs/
