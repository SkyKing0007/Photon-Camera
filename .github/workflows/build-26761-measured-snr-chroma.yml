name: Build 26761 Measured SNR Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26761_README_UPLOAD.txt'
      - '26761_*'
      - 'build_26761_measured_snr_chroma.sh'
      - 'transform_26761.py'
      - 'validate_26761.py'
      - 'verify_26761_*.py'
      - 'handoff_payload_26761/**'
      - '.github/workflows/build-26761-measured-snr-chroma.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26761 handoff and exact successful 26760/26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26761_HANDOFF_HASHES.sha256
          python3 -S verify_26761_infrastructure.py build_26761_measured_snr_chroma.sh .github/workflows/build-26761-measured-snr-chroma.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26761 candidate from exact successful 26760 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26761_measured_snr_chroma.sh
      - name: Verify exact 26761 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726761-26761-measured-snr-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726761-26761-measured-snr-chroma-debug.apk' build_26761_measured_snr_chroma_outputs/26761_APK.sha256
      - name: Upload 26761 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26761-measured-snr-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726761-26761-measured-snr-chroma-debug.apk
            build_26761_measured_snr_chroma_outputs/
