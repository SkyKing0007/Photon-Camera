name: Build 26546 V1 VGN Night Ownership

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26546-v1-vgn-night-ownership.yml'
      - 'build_26546_v1_vgn_night_ownership.sh'
      - 'validate_26546_v1_vgn_night_ownership.py'
      - 'preflight_26546_v1_glsl.py'
      - 'V1_26546_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26546-v1-vgn-night-ownership
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26546 V1 package before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26546_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26546_v1_vgn_night_ownership.py preflight_26546_v1_glsl.py
          python3 validate_26546_v1_vgn_night_ownership.py --self-test
          python3 preflight_26546_v1_glsl.py --self-test
          bash -n build_26546_v1_vgn_night_ownership.sh
          B=build_26546_v1_vgn_night_ownership.sh
          P=V1_26546_RUNTIME_DELTA_FROM_26545_V1_4.patch
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'REPO_BASE_HEAD="c315877fa5ba5be98778f27c1218e63249915f65"' "$B" >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26545-v1-4-tested-before-26546-vgn-night-fix"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="33032848083"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9630958191"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="6a35024a95ea7cefe9b11bf2dbd9a904bc70ddf81911c676ac6f198e6fe4f77c"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="162d45e035a0ee69ecdcde56be7b5ce74b4777828b84e9b1a40a324a71dacb27"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="cf50d39250c22875d489f8432c4a10be72085e250d63866c91a763482a46df02"' "$B" >/dev/null
          grep -F 'CAND_MANIFEST_SHA="e148ca391d613c716326aa6ce24cf98bff81815293f337cf286e3db30eddb58b"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726546"' "$B" >/dev/null
          grep -F 'VERSION_BUILD="26546"' "$B" >/dev/null
          grep -F 'REVISION="V1"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F '18 active/changed shaders' "$B" >/dev/null
          grep -F 'strength>=0.9999?sum:' "$P" >/dev/null
          grep -F 'strength>=0.9999?fc:' "$P" >/dev/null
          grep -F 'if(strength<0.9999){r=' "$P" >/dev/null
          grep -F 'if(strength<0.9999)f*=strength;' "$P" >/dev/null
          grep -F 'IRIS_26546_NIGHT_PREVIEW_SURFACE_ISOLATION' "$P" >/dev/null
          grep -F 'iris26533CaptureMode != CameraMode.NIGHT' "$P" >/dev/null
          grep -F 'IRIS_26546_NIGHT_TRUE_TWO_GPU_BUFFER_INPUT' "$P" >/dev/null
          grep -F 'basePipeline.main1 = new GLTexture' "$P" >/dev/null
          grep -F 'Allocator.free(source);' "$P" >/dev/null
          grep -F 'basePipeline.main2 = new GLTexture' "$P" >/dev/null
          grep -F 'basePipeline.main3 = null;' "$P" >/dev/null
          grep -F 'basePipeline.texnum = 1;' "$P" >/dev/null
          grep -F 'IRIS_26546_NIGHT_RGBA16F_POST_OWNERSHIP' "$P" >/dev/null
          grep -F 'IRIS_26546_NIGHT_VGN_POLICY_ISOLATION' "$P" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          echo 'PASS: 26546 V1 package pins exact tested 26545 V1.4 authority, VGN endpoint behavior, Night preview isolation, two-GPU-buffer ownership, real compilers, deterministic patches, and post-build invariance'

      - name: Guarded 26546 V1 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26546_v1_vgn_night_ownership.sh
          ./build_26546_v1_vgn_night_ownership.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26546-v1-vgn-night-ownership
          path: |
            IrisCamera-0.9726546-26546-v1-vgn-night-ownership-debug.apk
            build_26546_v1_vgn_night_ownership_outputs/
          if-no-files-found: warn
