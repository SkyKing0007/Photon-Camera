name: Build 26536 V1.2 Exact 26535 Procedure
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - v1_2_exact_26535_overlay.py
      - v1_2_exact_26535_overlay.hashes
      - V1_2_EXACT_26535_PROCEDURE.txt
      - V1_2_UPLOAD_INSTRUCTIONS.md
      - .github/workflows/build-26536-v1-2-exact-26535-procedure.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26536-v1-2-exact-26535-procedure
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify exact V1 and mirror successful 26535 pre-execution procedure
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c v1_2_exact_26535_overlay.hashes
          python3 -m py_compile v1_2_exact_26535_overlay.py
          python3 v1_2_exact_26535_overlay.py --self-test
          python3 v1_2_exact_26535_overlay.py --check

          # Same integrity family used by successful 26535.
          sha256sum -c 26536_HANDOFF_HASHES.sha256
          sha256sum -c 26536_BASE_26535_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26536_RUNTIME_DELTA_FROM_26535.patch.sha256
          sha256sum -c 26536_RUNTIME_ROLLBACK_TO_26535.patch.sha256
          python3 -m py_compile apply_26536_integrated_night_lowlight_reliability.py validate_26536_integrated_night_lowlight_reliability.py preflight_26536_changed_syntax.py preflight_26536_false_color_shader.py
          python3 apply_26536_integrated_night_lowlight_reliability.py --self-test
          python3 validate_26536_integrated_night_lowlight_reliability.py --self-test
          bash -n build_26536_integrated_night_lowlight_reliability.sh

          # Explicit structural anchors, matching the 26535 belt-and-suspenders style.
          B=build_26536_integrated_night_lowlight_reliability.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26535_HANDOFF_HEAD="7a2982a42ed0656b883858f5a025f01d7be30f77"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT="photon-26535-shared-spatial-rgb-support-guard"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="33484a274de4fe6bce35f18110915e501d41c13b5ab88e3f0eb08362155d4756"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="f541c384335ae5faac88466e1fc6676ea270f84f57201de173e894895f8fe7ee"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=964' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=964' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726536"; VERSION_BUILD="26536"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'assert_cpp_deps_exact "$ROOT" post' "$B" >/dev/null
          grep -F '26536_postbuild_native_dependency_manifest_check.txt' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F '26536_candidate_app_source.tar.gz.sha256' "$B" >/dev/null
          grep -F 'MOTION_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F' "$B" >/dev/null
          grep -F 'NIGHT_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F_TO_OPTIONAL_JIN' "$B" >/dev/null
          grep -F 'ADAPTIVE_MGC_LUMA=true' "$B" >/dev/null
          grep -F 'EXISTING_VGN_IIR_LOCKED=true' "$B" >/dev/null
          grep -F 'DNG_SR_UHDR_OWNERSHIP_UNCHANGED=true' "$B" >/dev/null

          # Confirm exact V1 contains the two infrastructure anchors V1.2 is allowed to change.
          grep -F 'git branch local-safety-26535-before-26536' "$B" >/dev/null
          grep -F 'python3 "$VALIDATE" --base "$BASE" --candidate "$ROOT" | tee "$OUT/26536_postbuild_architecture_validation.txt"' "$B" >/dev/null

          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: exact original 26536 handoff satisfies successful-26535-style pre-execution anchors'

      - name: Apply V1.2 infrastructure-only correction and re-prove procedure
        shell: bash
        run: |
          set -euo pipefail
          python3 v1_2_exact_26535_overlay.py
          B=build_26536_integrated_night_lowlight_reliability.sh
          bash -n "$B"
          sha256sum -c 26536_HANDOFF_HASHES.sha256

          # No backup branch creation remains.
          ! grep -F 'git branch local-safety-26535-before-26536' "$B" >/dev/null
          grep -F 'exact six-file forward/rollback proof; fuzz=0 both directions; no backup branch' "$B" >/dev/null

          # Gate 5 correction is present; raw ROOT architecture validation is gone.
          grep -F 'IRIS_26536_V1_2_POSTBUILD_SANITIZED_VALIDATION' "$B" >/dev/null
          grep -F 'python3 "$VALIDATE" --base "$BASE" --candidate "$POSTCHECK"' "$B" >/dev/null
          ! grep -F 'python3 "$VALIDATE" --base "$BASE" --candidate "$ROOT" | tee "$OUT/26536_postbuild_architecture_validation.txt"' "$B" >/dev/null

          # The proven 26535-style gates must still exist after patching.
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' "$B" >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'assert_cpp_deps_exact "$ROOT" post' "$B" >/dev/null
          grep -F '26536_postbuild_native_dependency_manifest_check.txt' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F '26536_candidate_app_source.tar.gz.sha256' "$B" >/dev/null

          python3 - "$B" <<'PY'
          from pathlib import Path
          s=Path(__import__('sys').argv[1]).read_text()
          order=[
            s.index('assert_cpp_deps_exact "$ROOT" post'),
            s.index('26536_postbuild_native_dependency_manifest_check.txt'),
            s.index('IRIS_26536_V1_2_POSTBUILD_SANITIZED_VALIDATION'),
            s.index('python3 "$VALIDATE" --base "$BASE" --candidate "$POSTCHECK"'),
          ]
          assert order==sorted(order), order
          print('PASS: exact cpp/deps + pinned-native proofs precede sanitized architecture validation')
          PY

          # Only infrastructure/hash bookkeeping may differ in the checked-out repository.
          mapfile -t CHANGED < <(git diff --name-only | LC_ALL=C sort)
          EXPECTED=$'26536_HANDOFF_HASHES.sha256\nbuild_26536_integrated_night_lowlight_reliability.sh'
          [[ "$(printf '%s\n' "${CHANGED[@]}")" == "$EXPECTED" ]] || { printf 'FAIL: unexpected V1.2 working-tree changes: %s\n' "${CHANGED[*]}" >&2; exit 1; }
          git diff --quiet -- app/src || { echo 'FAIL: V1.2 overlay changed app/src' >&2; exit 1; }
          git diff --binary -- 26536_HANDOFF_HASHES.sha256 "$B" > 26536_v1_2_infrastructure_only.patch
          sha256sum "$B" > 26536_v1_2_patched_build_script.sha256
          sha256sum 26536_HANDOFF_HASHES.sha256 > 26536_v1_2_runner_handoff_manifest.sha256
          echo 'PASS: V1.2 infrastructure-only delta; app/src byte authority untouched'

      - name: Guarded 26536 V1.2 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26536_integrated_night_lowlight_reliability.sh
          ./build_26536_integrated_night_lowlight_reliability.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26536-v1-2-exact-26535-procedure
          path: |
            IrisCamera-0.9726536-26536-integrated-night-lowlight-reliability-debug.apk
            build_26536_integrated_night_lowlight_reliability_outputs/
            26536_v1_2_infrastructure_only.patch
            26536_v1_2_patched_build_script.sha256
            26536_v1_2_runner_handoff_manifest.sha256
          if-no-files-found: warn
