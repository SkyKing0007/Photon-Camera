name: Build 26616 Wronski Exposure Fusion LTM

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26616_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26616_*'
      - 'R1_26616_*'
      - 'build_26616_r1_wronski_exposure_fusion_ltm.sh'
      - 'transform_26616.py'
      - 'validate_26616.py'
      - 'verify_26616_*.py'
      - 'handoff_payload_26616/**'
      - '.github/workflows/build-26616-r1-wronski-exposure-fusion-ltm.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26616 package and successful 26615 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26616_HANDOFF_HASHES.sha256
          bash -n build_26616_r1_wronski_exposure_fusion_ltm.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26616.py','validate_26616.py','verify_26616_authority.py','verify_26616_infrastructure.py','verify_26616_patches.py','verify_26616_regressions.py','verify_26616_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26616 candidate from successful compiled 26615 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26616_r1_wronski_exposure_fusion_ltm.sh
      - name: Upload 26616 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26616-r1-wronski-exposure-fusion-ltm
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726616-26616-r1-wronski-exposure-fusion-ltm-debug.apk
            build_26616_r1_wronski_exposure_fusion_ltm_outputs/
