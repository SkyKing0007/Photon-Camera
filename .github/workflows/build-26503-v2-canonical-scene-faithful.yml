name: Build 26503 V2 Canonical Scene-Faithful Motion

on:
  workflow_dispatch:
    inputs:
      promote_26503_source:
        description: 'ONLY after on-device acceptance: promote 26503 into canonical app/src/main'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26503_v2_canonical_scene_faithful.sh
      - apply_26503_v2_integrated.py
      - validate_26503_v2_integrated.py
      - validate_26503_seed_math.py
      - 26503_v2_seed_safe_highlight_shadow_runtime.patch
      - 26503_V2_PRECHANGE_26502_V4_CHECKPOINT.txt
      - 26503_V2_MATH_REGRESSION_AUDIT.txt
      - 26503_V2_README_UPLOAD.txt
      - 26503_V2_HANDOFF_HASHES.sha256
      - .github/workflows/build-26503-v2-canonical-scene-faithful.yml

permissions:
  contents: write

concurrency:
  group: photon-26503-v2-canonical
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26503 V2 A-G canonical build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROMOTE_26503_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_26503_source && 'true' || 'false' }}
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
          persist-credentials: true

      - name: Verify branch and 26502 tested ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor 5b87d616a8d20ea0fbad9b7fd47627215cd4ba48 HEAD
          git merge-base --is-ancestor c6415d57a0d276b6ba7d4948df45ed15ea88a410 HEAD
          echo "PASS: tested 26502 V4 lineage; dev excluded"
          echo "PASS: no backup branch is created, fetched, or required"
          echo "PROMOTE_26503_SOURCE=$PROMOTE_26503_SOURCE"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator without APT
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          GLSLANG_VERSION="16.5.0"
          GLSLANG_ASSET="glslang-${GLSLANG_VERSION}-linux-x86_64-release.tar.gz"
          GLSLANG_URL="https://github.com/KhronosGroup/glslang/releases/download/${GLSLANG_VERSION}/${GLSLANG_ASSET}"
          RELEASE_META="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-release.json"
          TOOL_ROOT="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/${GLSLANG_ASSET}"
          rm -rf "$TOOL_ROOT" "$ARCHIVE" "$RELEASE_META"; mkdir -p "$TOOL_ROOT"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/${GLSLANG_VERSION}" -o "$RELEASE_META"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 "$GLSLANG_URL" -o "$ARCHIVE"
          test -s "$ARCHIVE"
          python3 -c 'import hashlib,json,sys; m,v,n,u,a=sys.argv[1:]; d=json.load(open(m,encoding="utf-8")); assert d.get("tag_name")==v; xs=[x for x in d.get("assets",[]) if x.get("name")==n]; assert len(xs)==1; x=xs[0]; assert x.get("browser_download_url")==u; dg=x.get("digest") or ""; assert dg.startswith("sha256:"); ex=dg.split(":",1)[1].lower(); ac=hashlib.sha256(open(a,"rb").read()).hexdigest(); assert ac==ex, f"Khronos asset SHA-256 mismatch: {ac} != {ex}"; print(f"PASS: official Khronos release asset SHA256 {ac}")' "$RELEASE_META" "$GLSLANG_VERSION" "$GLSLANG_ASSET" "$GLSLANG_URL" "$ARCHIVE"
          ARCHIVE_LIST="${RUNNER_TEMP}/glslang-${GLSLANG_VERSION}-contents.txt"; tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"; grep -Fxq 'bin/glslangValidator' "$ARCHIVE_LIST"; grep -Fxq 'bin/glslang' "$ARCHIVE_LIST"; tar -xzf "$ARCHIVE" -C "$TOOL_ROOT"; test -x "$TOOL_ROOT/bin/glslang"; test -e "$TOOL_ROOT/bin/glslangValidator"
          VERSION_OUTPUT="$("$TOOL_ROOT/bin/glslangValidator" --version)"; VERSION_LINE="${VERSION_OUTPUT%%$'\n'*}"; printf '%s\n' "$VERSION_LINE"; grep -F '16.5.0' <<<"$VERSION_LINE"; echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"; echo "PASS: pinned Khronos glslangValidator 16.5.0 ready without APT"

      - name: Restore canonical 26499 archive one last time
        shell: bash
        run: |
          set -euo pipefail
          C="719f93fd2085ffd41ead0c9bcfa2bd630f34ab8b"
          S="ce5be58fa20b9e28786b9c6e4355743066fe92e78791b50b5ee2df568c5ae9e1"
          git merge-base --is-ancestor "$C" HEAD
          git show "${C}:26499_v7_successful_app_source.tar.gz" > 26499_v7_successful_app_source.tar.gz
          echo "$S  26499_v7_successful_app_source.tar.gz" | sha256sum -c -
          echo "PASS: historical archive restored only for one-time tested-26502 canonicalization proof"

      - name: Verify 26503 V2 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26503_V2_HANDOFF_HASHES.sha256
          bash -n build_26503_v2_canonical_scene_faithful.sh
          python3 -m py_compile apply_26503_v2_integrated.py validate_26503_v2_integrated.py validate_26503_seed_math.py \
            validate_26502_stack_aware_chroma_highlight.py validate_26501_proper_spatial_rgb.py verify_26501_source_integrity.py
          grep -F 'BASELINE_26502_HEAD="5b87d616a8d20ea0fbad9b7fd47627215cd4ba48"' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F 'VERSION_NAME=0.9726503' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F 'VERSION_BUILD=26503' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F './gradlew clean :app:assembleDebug --stacktrace' build_26503_v2_canonical_scene_faithful.sh >/dev/null
          grep -F 'IRIS_26503_FROZEN_CAPTURE_SCENE_KEY_GAIN' apply_26503_v2_integrated.py >/dev/null
          grep -F 'IRIS_26503_LOCAL_FRAME_EQUIVALENT_SUPPORT_CARRIER' apply_26503_v2_integrated.py >/dev/null
          grep -F 'IRIS_26503_DISABLE_HEAVY_PROVENANCE_READBACK' apply_26503_v2_integrated.py >/dev/null
          if grep -Fq 'IRIS_26503_ACTUAL_CAPTURE_RESULT_ISO_EXIF' apply_26503_v2_integrated.py; then
            echo 'forbidden 26503 EXIF rewrite survived; tested-26502 normalization must remain frozen' >&2; exit 1
          fi
          if grep -Fq "edit('app/src/main/java/com/particlesdevs/photoncamera/api/ParseExif.java'" apply_26503_v2_integrated.py; then
            echo 'forbidden ParseExif transform survived' >&2; exit 1
          fi
          if grep -Eq '^\s*git\s+branch\s+' build_26503_v2_canonical_scene_faithful.sh; then
            echo "forbidden branch-creation command survived" >&2; exit 1
          fi
          echo "PASS: handoff syntax/hashes/A-G/speed/frozen-EXIF/version/no-backup gates verified"

      - name: Canonicalize tested 26502 and build guarded 26503 V2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26503_v2_canonical_scene_faithful.sh apply_26503_v2_integrated.py
          ./build_26503_v2_canonical_scene_faithful.sh

      - name: Upload APK and complete proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26503-v2-canonical-scene-faithful
          path: |
            IrisCamera-0.9726503-26503-canonical-scene-faithful-debug.apk
            build_26503_v2_canonical_scene_faithful_outputs/
          if-no-files-found: warn
