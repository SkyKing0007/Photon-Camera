name: Build 26493 RCD Provenance Boundary Chroma V1

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26492_successful_source.patch'
      - '26492_successful_after.sha256'
      - 'transform_26493_rcd_provenance_boundary_chroma_v1.py'
      - 'build_26493_rcd_provenance_boundary_chroma_v1.sh'
      - '.github/workflows/build-26493-rcd-provenance-boundary-chroma-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact tested V5B rollback automatically
        shell: bash
        run: |
          set -euo pipefail
          V5B="a424653a42923b02bd3a9f303da05d7a7e43409c"
          BACKUP="backup-26492-v5b-tested-before-26493-boundary-refinement"
          git cat-file -e "$V5B^{commit}"
          existing="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$V5B" ]] || { echo "::error::rollback branch moved: $existing expected $V5B"; exit 1; }
            echo "PASS: exact tested V5B rollback already preserved"
          else
            git push origin "$V5B:refs/heads/$BACKUP"
            actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$V5B" ]] || { echo "::error::rollback branch verification failed"; exit 1; }
            echo "PASS: exact tested V5B rollback created $BACKUP=$actual"
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict package identity and preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26492_successful_source.patch "1c4f948df5ac0ffd2b956d4890f051af936b34457fcff932d54027832f67f75f"
          check_sha 26492_successful_after.sha256 "dc19b4eba0fbeab493476383f5b148d9258103ab7d9e3d71e4e9e2915d149bef"
          check_sha transform_26493_rcd_provenance_boundary_chroma_v1.py "6e981316abfc2d7951369def577c5ecde777aefb37c420f4bfe1f897cab6382f"
          check_sha build_26493_rcd_provenance_boundary_chroma_v1.sh "24c593cb60d93cdceb2acf0e3fb4d8fe93f6cd22944956e01dcb0865e68581ec"
          bash -n build_26493_rcd_provenance_boundary_chroma_v1.sh
          python3 -m py_compile transform_26493_rcd_provenance_boundary_chroma_v1.py
          python3 transform_26493_rcd_provenance_boundary_chroma_v1.py --self-test
          echo "PASS: 26493 exact package identity + local model self-test"

      - name: Build guarded 26493 APK
        shell: bash
        run: |
          chmod +x build_26493_rcd_provenance_boundary_chroma_v1.sh
          ./build_26493_rcd_provenance_boundary_chroma_v1.sh

      - name: Upload 26493 APK and canonical next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26493-rcd-provenance-boundary-chroma-v1
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726493-26493-rcd-provenance-boundary-chroma-v1-debug.apk
            build_26493_outputs/**
