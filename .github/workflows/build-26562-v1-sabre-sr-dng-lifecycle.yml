name: Build 26562 V1.1 Sabre SR DNG Lifecycle

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26562_*'
      - 'build_26562_v1_sabre_sr_dng_lifecycle.sh'
      - 'transform_26562_v1_sabre_sr_dng_lifecycle.py'
      - 'validate_26562_v1_sabre_sr_dng_lifecycle.py'
      - 'extract_26562_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26562.py'
      - 'selftest_26562_sabre_linearraw_dng.py'
      - '.github/workflows/build-26562-v1-sabre-sr-dng-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26562 V1.1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26562_HANDOFF_HASHES.sha256
          python3 -m py_compile transform_26562_v1_sabre_sr_dng_lifecycle.py validate_26562_v1_sabre_sr_dng_lifecycle.py extract_26562_runtime_glsl.py scan_glsl_reserved_identifiers_26562.py selftest_26562_sabre_linearraw_dng.py
          python3 extract_26562_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26562.py --self-test
          bash -n build_26562_v1_sabre_sr_dng_lifecycle.sh
          grep -F 'BASE_SUCCESS_COMMIT="6e0618b13d4fd3f98c292cf275ba0a487068b66f"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'HANDOFF_PARENT_COMMIT="007f694a67d67f136e281867a3c15f163396606e"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'BASE_RUN_ID="33268952022"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9719538010"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="9a7e1fd2fbeb88b6da023cb5c54b259e3c1a1415d10ad54152a3a86ebc4d9b7d"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'BASE_TAR_SHA="9e2a9a2cb2ca6306bd6f6535b4fe673ec69154ffdc9f98a5ae064b62c27f8249"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26561-v1-1-before-26562-sabre-sr-dng-lifecycle"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726562"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'VERSION_BUILD="26562"' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'prewrite manifest contains absolute path' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'run_live_repository_extras_scope_regression' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          grep -F 'src/test/java/android/util/Log.java' build_26562_v1_sabre_sr_dng_lifecycle.sh >/dev/null
          ! grep -Eq '  /' V1_26562_PREWRITE_SOURCE_HASHES.sha256
          ! grep -R -F 'V1_26562_' .github/workflows --exclude='build-26562-v1-sabre-sr-dng-lifecycle.yml'

      - name: Build exact 26562 V1.1 candidate from successful compiled 26561 V1.1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26562_v1_sabre_sr_dng_lifecycle.sh
          ./build_26562_v1_sabre_sr_dng_lifecycle.sh

      - name: Upload 26562 V1.1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26562-v1-1-sabre-sr-dng-lifecycle
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726562-26562-v1-1-sabre-sr-dng-lifecycle-debug.apk
            build_26562_v1_sabre_sr_dng_lifecycle_outputs/
