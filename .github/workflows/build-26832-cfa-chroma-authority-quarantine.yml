name: Build 26832 CFA Chroma Authority Quarantine
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26832.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26832 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26832.txt
          grep -Fx 'RUN_26832_CFA_CHROMA_AUTHORITY_QUARANTINE' TRIGGER_26832.txt
          sha256sum -c 26832_HANDOFF_HASHES.sha256
          bash -n build_26832_cfa_chroma_authority_quarantine.sh
          python3 -S -m py_compile transform_26832.py validate_26832.py verify_26832_patches.py verify_26832_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26832_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26832_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26832 candidate from successful 26831 authority using exact successful 26831 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26832_cfa_chroma_authority_quarantine.sh
      - name: Verify exact 26832 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726832-26832-cfa-chroma-authority-quarantine-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726832-26832-cfa-chroma-authority-quarantine-debug.apk' build_26832_cfa_chroma_authority_quarantine_outputs/26832_APK.sha256
      - name: Upload 26832 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26832-cfa-chroma-authority-quarantine
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726832-26832-cfa-chroma-authority-quarantine-debug.apk
            build_26832_cfa_chroma_authority_quarantine_outputs/
