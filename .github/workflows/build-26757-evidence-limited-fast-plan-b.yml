name: Build 26757 Evidence-Limited Fast Plan-B
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26757_README_UPLOAD.txt'
      - '26757_*'
      - 'build_26757_evidence_limited_fast_plan_b.sh'
      - 'transform_26757.py'
      - 'validate_26757.py'
      - 'verify_26757_*.py'
      - 'handoff_payload_26757/**'
      - '.github/workflows/build-26757-evidence-limited-fast-plan-b.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26757 handoff and exact successful 26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26757_HANDOFF_HASHES.sha256
          python3 -S verify_26757_infrastructure.py build_26757_evidence_limited_fast_plan_b.sh .github/workflows/build-26757-evidence-limited-fast-plan-b.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26757 candidate from exact successful 26756 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26757_evidence_limited_fast_plan_b.sh
      - name: Verify exact 26757 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726757-26757-evidence-limited-fast-plan-b-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726757-26757-evidence-limited-fast-plan-b-debug.apk' build_26757_evidence_limited_fast_plan_b_outputs/26757_APK.sha256
      - name: Upload 26757 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26757-evidence-limited-fast-plan-b
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726757-26757-evidence-limited-fast-plan-b-debug.apk
            build_26757_evidence_limited_fast_plan_b_outputs/
