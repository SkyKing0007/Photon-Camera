name: Build 26573 V1 True-Detail Super Resolution

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26573_*'
      - 'REGRESSION_V1_26573_*'
      - 'build_26573_v1_true_detail_sr.sh'
      - 'transform_26573_v1.py'
      - 'validate_26573_v1.py'
      - 'verify_26573_v1_authority.py'
      - 'verify_26573_v1_patches.py'
      - 'verify_26573_v1_shaders.py'
      - 'handoff_payload_26573_v1/**'
      - '.github/workflows/build-26573-v1-true-detail-sr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26573 V1 package and mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26573_HANDOFF_HASHES.sha256
          bash -n build_26573_v1_true_detail_sr.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26573_v1.py',
              'validate_26573_v1.py',
              'verify_26573_v1_authority.py',
              'verify_26573_v1_patches.py',
              'verify_26573_v1_shaders.py',
          ]
          for name in files:
              compile(Path(name).read_text(), name, 'exec')
          s=Path('build_26573_v1_true_detail_sr.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="2349eae1ec3479656171d26ae42fb3d229d3dd09"' in s
          assert 'HANDOFF_PARENT_COMMIT="2349eae1ec3479656171d26ae42fb3d229d3dd09"' in s
          assert 'BASE_RUN_ID="33464122028"' in s
          assert 'BASE_ARTIFACT_ID="9784306626"' in s
          assert 'BASE_ARTIFACT_SHA="8863884dacb7fc09dd65d39855c16e2f4892db836ff0273810fde047af88e097"' in s
          assert 'BASE_TAR_SHA="afe5b96a032f8571f512af2af031a23cc6de367e6aad35d73ac6db0f984887fe"' in s
          assert 'VERSION_NAME="0.9726573"' in s and 'VERSION_BUILD="26573"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' in s
          assert 'BACKUP_COMMIT="c3a1f82ca93de02403fda4bc85cff9462bc4aca4"' in s
          assert 'backup-26571-pre-true-detail-sr' in s
          assert 'git ls-remote origin refs/heads/backup-26571-pre-true-detail-sr' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26573 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k < n < p < b < a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          expected="""snapshot_candidate_from_authority(){
            local authority_root="$1" live_root="$2" dest_root="$3"
            rm -rf "$dest_root"; mkdir -p "$dest_root"
            # Exact successful 26571 mechanics: authority file universe first, then only live runtime source domain.
            cp -a "$authority_root/." "$dest_root/"
            rm -rf "$dest_root/app/src"
            cp -a "$live_root/app/src" "$dest_root/app/"
            cp -a "$live_root/app/build.gradle" "$dest_root/app/build.gradle"
            cp -a "$live_root/app/version.properties" "$dest_root/app/version.properties"
          }"""
          assert expected in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$LIVE_CANON"' in s
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s
          print('PASS sealed Python syntax + exact successful 26571 authority-seeded verification order inheritance')
          PY
          grep -F 'IRIS_26573_CROSS_FRAME_TRUE_DETAIL_LUMA_OWNER' REGRESSION_V1_26573_TRUE_DETAIL_SR_CONTRACT.txt >/dev/null
          grep -F 'run 33433465300 / job 99624165337' REGRESSION_V1_26573_CARRIED_FAILURES.txt >/dev/null
          grep -F 'No verification order is weakened' V1_26573_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          ! grep -R -F 'V1_26573_' .github/workflows --exclude='build-26573-v1-true-detail-sr.yml'
          ! grep -R -F 'handoff_payload_26573_v1' .github/workflows --exclude='build-26573-v1-true-detail-sr.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26573 candidate from successful compiled 26572 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26573_v1_true_detail_sr.sh
          ./build_26573_v1_true_detail_sr.sh

      - name: Upload 26573 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26573-v1-true-detail-sr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726573-26573-v1-true-detail-sr-debug.apk
            build_26573_v1_true_detail_sr_outputs/
