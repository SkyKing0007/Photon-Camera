name: Build 26708 Isolated SHORT Highlight
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26708_README_UPLOAD.txt'
      - '26708_*'
      - 'build_26708_isolated_short_highlight.sh'
      - 'transform_26708.py'
      - 'validate_26708.py'
      - 'verify_26708_*.py'
      - 'handoff_payload_26708/**'
      - '.github/workflows/build-26708-isolated-short-highlight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26708 handoff and exact successful 26707 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26708_HANDOFF_HASHES.sha256
          bash -n build_26708_isolated_short_highlight.sh
          python3 -S - <<'PY'
          from pathlib import Path
          for n in ['transform_26708.py','validate_26708.py','verify_26708_authority.py','verify_26708_patches.py','verify_26708_regressions.py','verify_26708_shaders.py']:
              compile(Path(n).read_text(),n,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26708 candidate from successful 26707 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26708_isolated_short_highlight.sh
      - name: Verify exact 26708 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726708-26708-isolated-short-highlight-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726708-26708-isolated-short-highlight-debug.apk' build_26708_isolated_short_highlight_outputs/26708_APK.sha256
      - name: Upload 26708 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26708-isolated-short-highlight
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726708-26708-isolated-short-highlight-debug.apk
            build_26708_isolated_short_highlight_outputs/
