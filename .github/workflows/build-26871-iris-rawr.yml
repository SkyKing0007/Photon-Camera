name: Build 26871 B Exposure Flicker Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26871.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 26870 mechanics and generate guarded 26871 build
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26871.txt
          grep -Fx 'RUN_26871_B_EXPOSURE_FLICKER_CHROMA' TRIGGER_26871.txt
          sha256sum -c 26871_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26871_build.py verify_26871_candidate.py verify_26871_patches.py verify_26871_runtime_shader.py regressions/26871_b_shutter_group.py
          python3 -S generate_26871_build.py .
          bash -n build_26871_iris_rawr.sh
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26871_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26871_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
          rm -rf __pycache__ regressions/__pycache__
      - name: Preserve exact historical generated GLSL guard and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run inherited guarded 17-stage 26871 native B build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26871_iris_rawr.sh
      - name: Verify exactly one intended 26871 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726871-26871-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726871-26871-iris-rawr-debug.apk' build_26871_iris_rawr_outputs/26871_APK.sha256
      - name: Upload authoritative 26871 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26871-b-exposure-flicker-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726871-26871-iris-rawr-debug.apk
            build_26871_iris_rawr_outputs/
