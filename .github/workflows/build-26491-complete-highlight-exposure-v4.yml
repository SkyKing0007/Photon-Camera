name: Build 26491 V4 Complete Highlight Exposure Architecture

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26490_successful_source.patch'
      - '26490_successful_after.sha256'
      - 'transform_26488_full_merge_rgb_rejection_contract_v1.py'
      - 'build_26490_highlight_domain_short_border_v3.sh'
      - 'transform_26490_highlight_domain_short_border_v3.py'
      - 'transform_26491_complete_highlight_exposure_v4.py'
      - 'build_26491_complete_highlight_exposure_v4.sh'
      - '.github/workflows/build-26491-complete-highlight-exposure-v4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26491 V4 infrastructure identity and complete preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::26491 V4 infrastructure identity mismatch: actual=$actual expected=$expected"
              exit 1
            fi
          }
          check_sha build_26491_complete_highlight_exposure_v4.sh "86c25b51b0bc472903d2ae2b23d3fbc30259734584e1e931b41e9eefaf9f2bd3"
          check_sha transform_26491_complete_highlight_exposure_v4.py "82b78d994b9657e36b202849f465061b2a4ada66822fa9f6b82d013935e37ed5"
          check_sha 26490_successful_source.patch "c589cc000047da6dd19c7b1ac71405fa635d75db37007fa526c60368001433ba"
          check_sha 26490_successful_after.sha256 "431a62d9e23cd17d71388d4b79ad0a0c548c58ae9eabb2ad1894ba9cad34322f"
          check_sha transform_26488_full_merge_rgb_rejection_contract_v1.py "b7710d343aa26b1215178821983f4ff3f742ad07d1ca556de2d272fbc36664c0"
          check_sha build_26490_highlight_domain_short_border_v3.sh "1fe2dad7cd734d3f83deac3b2eb4880b18d10cc13c8469f1a7589fc427c0cadf"
          check_sha transform_26490_highlight_domain_short_border_v3.py "60c91ce99da7408082b47cc16004ddc43ff043f3cb0466795cb445ba9f2365dc"
          bash -n build_26491_complete_highlight_exposure_v4.sh
          python3 -m py_compile \
            transform_26488_full_merge_rgb_rejection_contract_v1.py \
            transform_26491_complete_highlight_exposure_v4.py
          python3 transform_26491_complete_highlight_exposure_v4.py --self-test
          python3 - <<'PY_PREFLIGHT'
          import importlib.util,re
          p='transform_26491_complete_highlight_exposure_v4.py'
          s=importlib.util.spec_from_file_location('t',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          reserved=r'\b(?:float|vec[234]|int|ivec[234]|uint|uvec[234]|bool|mat[234])\s+(sample|common|coherent|precision|packed)\b'
          for name,src in [('short',m.SHORT_26491),('rcd_populate',m.RCD_POPULATE_26491)]:
              clean=re.sub(r'//.*','',re.sub(r'/\*.*?\*/','',src,flags=re.S))
              bad=re.search(reserved,clean)
              assert bad is None, f'{name}: reserved GLSL identifier {bad.group(1)}'
          assert 'IRIS_26491_MIDTONES_GLOBAL_HIGHLIGHTS_LOCAL_HDR' in m.NEW_MERGER_POLICY
          assert 'IRIS_26491_JOINT_SHORT_HDR_SPATIAL_CHROMATICITY' in m.SHORT_26491
          assert 'IRIS_26491_NEUTRAL_CENSORED_FALLBACK' in m.RCD_POPULATE_26491
          assert 'IRIS_26491_EXTENDED_LINEAR_CHROMA_PRESERVING_HIGHLIGHT_COMPRESSION' in m.NEW_RENDER_HEADROOM
          assert 'IRIS_26491_FINAL_OUTPUT_LEFT_EDGE_MIRROR_ONE_PIXEL' in m.NEW_RENDER_MAIN
          print('PASS: 26491 V4 six-scope marker + reserved-name workflow preflight')
          PY_PREFLIGHT
          echo "PASS: 26491 V4 workflow infrastructure identity"

      - name: Build guarded 26491 V4 candidate and APK
        shell: bash
        run: |
          chmod +x build_26491_complete_highlight_exposure_v4.sh
          ./build_26491_complete_highlight_exposure_v4.sh

      - name: Upload 26491 V4 artifact and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26491-v4-complete-highlight-exposure
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726491-26491-v4-complete-highlight-exposure-debug.apk
            build_26491_outputs/**
