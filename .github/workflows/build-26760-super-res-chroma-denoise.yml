name: Build 26760 Super Res Chroma Denoise
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26760_README_UPLOAD.txt'
      - '26760_*'
      - 'build_26760_super_res_chroma_denoise.sh'
      - 'transform_26760.py'
      - 'validate_26760.py'
      - 'verify_26760_*.py'
      - 'handoff_payload_26760/**'
      - '.github/workflows/build-26760-super-res-chroma-denoise.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26760 handoff and exact successful 26759/26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26760_HANDOFF_HASHES.sha256
          python3 -S verify_26760_infrastructure.py build_26760_super_res_chroma_denoise.sh .github/workflows/build-26760-super-res-chroma-denoise.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26760 candidate from exact successful 26759 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26760_super_res_chroma_denoise.sh
      - name: Verify exact 26760 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726760-26760-super-res-chroma-denoise-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726760-26760-super-res-chroma-denoise-debug.apk' build_26760_super_res_chroma_denoise_outputs/26760_APK.sha256
      - name: Upload 26760 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26760-super-res-chroma-denoise
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726760-26760-super-res-chroma-denoise-debug.apk
            build_26760_super_res_chroma_denoise_outputs/
