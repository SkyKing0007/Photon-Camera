name: Build 26738 Wronski RAW RGB Seam Integrity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26738_README_UPLOAD.txt'
      - '26738_*'
      - 'build_26738_wronski_raw_rgb_seam_integrity.sh'
      - 'transform_26738.py'
      - 'validate_26738.py'
      - 'verify_26738_*.py'
      - 'handoff_payload_26738/**'
      - 'authority_payload_26736/**'
      - 'authority_payload_26737/**'
      - '.github/workflows/build-26738-wronski-raw-rgb-seam-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26738 handoff and exact 26737 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26738_HANDOFF_HASHES.sha256
          python3 -S verify_26738_infrastructure.py build_26738_wronski_raw_rgb_seam_integrity.sh .github/workflows/build-26738-wronski-raw-rgb-seam-integrity.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26738 candidate with successful 26737 procedure from sealed exact 26737 candidate authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26738_wronski_raw_rgb_seam_integrity.sh
      - name: Verify exact 26738 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726738-26738-wronski-raw-rgb-seam-integrity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726738-26738-wronski-raw-rgb-seam-integrity-debug.apk' build_26738_wronski_raw_rgb_seam_integrity_outputs/26738_APK.sha256
      - name: Upload 26738 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26738-wronski-raw-rgb-seam-integrity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726738-26738-wronski-raw-rgb-seam-integrity-debug.apk
            build_26738_wronski_raw_rgb_seam_integrity_outputs/
