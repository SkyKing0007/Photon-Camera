name: Build 26488 Full MergeRgb Rejection Contract V4 Runtime Hardening

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26483_successful_source.patch'
      - '26483_successful_after.sha256'
      - '26484_delta_from_26483.patch'
      - 'transform_26485_runtime_shutter_full_fix_v1.py'
      - 'transform_26486_full_bjzhou_censored_opponent_latency_v1.py'
      - 'transform_26487_reconstruction_correctness_latency_v2.py'
      - 'transform_26488_full_merge_rgb_rejection_contract_v1.py'
      - 'build_26488_full_merge_rgb_rejection_contract_v1.sh'
      - '.github/workflows/build-26488-full-merge-rgb-rejection-contract-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26488 infrastructure identity
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::26488 infrastructure identity mismatch: actual=$actual expected=$expected"
              exit 1
            fi
          }
          check_sha build_26488_full_merge_rgb_rejection_contract_v1.sh "08e93c9834492389f19d137e13e57c8abd55d98529f642cbd010b20d4abaa303"
          check_sha transform_26488_full_merge_rgb_rejection_contract_v1.py "b7710d343aa26b1215178821983f4ff3f742ad07d1ca556de2d272fbc36664c0"
          check_sha transform_26487_reconstruction_correctness_latency_v2.py "0580c756d1180554621aa4e7a1848271511fc2094a692b16b3b209df9bda5d77"
          check_sha transform_26486_full_bjzhou_censored_opponent_latency_v1.py "3030fa2543c6593711f8822a770c78de25e9347c65717420ffde291c1aad0eca"
          check_sha transform_26485_runtime_shutter_full_fix_v1.py "2e04a8e250d0fb64ca3e4a7763ed4943203d7f1ae740283018a7fb1b90c9a461"
          check_sha 26483_successful_source.patch "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          check_sha 26483_successful_after.sha256 "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          check_sha 26484_delta_from_26483.patch "18fbb861c3c49f4ad8399f29aa60ca3e85df57ffacc794b8b6a2206b42197ac3"
          bash -n build_26488_full_merge_rgb_rejection_contract_v1.sh
          python3 -m py_compile \
            transform_26485_runtime_shutter_full_fix_v1.py \
            transform_26486_full_bjzhou_censored_opponent_latency_v1.py \
            transform_26487_reconstruction_correctness_latency_v2.py \
            transform_26488_full_merge_rgb_rejection_contract_v1.py
          python3 transform_26488_full_merge_rgb_rejection_contract_v1.py --self-test
          echo "PASS: 26488 workflow infrastructure identity"

      - name: Build guarded 26488 candidate and APK
        shell: bash
        run: |
          chmod +x build_26488_full_merge_rgb_rejection_contract_v1.sh
          ./build_26488_full_merge_rgb_rejection_contract_v1.sh

      - name: Upload 26488 artifact and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26488-v4-runtime-hardened-merge-rgb
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726488-26488-v4-runtime-hardened-merge-rgb-debug.apk
            build_26488_outputs/**
