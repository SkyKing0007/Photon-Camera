name: Build 26492 V5B Semantic RCD Parser Gate

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26490_successful_source.patch'
      - '26490_successful_after.sha256'
      - 'transform_26491_complete_highlight_exposure_v4.py'
      - 'transform_26492_authority_provenance_v2.py'
      - 'transform_26492_rcd_parser_compat_v5.py'
      - 'build_26492_authority_provenance_v5b_parser_gate_fix.sh'
      - '.github/workflows/build-26492-authority-provenance-v5b-parser-gate-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing exact V4 rollback
        shell: bash
        run: |
          set -euo pipefail
          V4="3476e961539469aeb4a7b9a6614c07a05b24e462"
          BACKUP="backup-26492-v4-black-before-v5-rcd-parser-fix"
          actual="$(git ls-remote origin "refs/heads/$BACKUP" | awk '{print $1}')"
          [[ "$actual" == "$V4" ]] || { echo "::error::V4 rollback branch missing/moved: $actual"; exit 1; }
          echo "PASS: exact V4 rollback preserved $BACKUP=$actual"

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict V5B identity and semantic parser preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha build_26492_authority_provenance_v5b_parser_gate_fix.sh "be92f63ac98e56965c8d355b199e903a66ba6e20d8e0fd8f08fa5b4aeeeb9d7a"
          check_sha transform_26492_rcd_parser_compat_v5.py "b24ab77f4e4d6fb43c72c881b9dfb455ca7d43ffc2437bf1baa6ac74629dc866"
          check_sha transform_26492_authority_provenance_v2.py "fda88e97092bdea6b7eb4323a51d01f389d5481c57ac9c1f0ec8ce86086b4784"
          check_sha transform_26491_complete_highlight_exposure_v4.py "82b78d994b9657e36b202849f465061b2a4ada66822fa9f6b82d013935e37ed5"
          check_sha 26490_successful_source.patch "c589cc000047da6dd19c7b1ac71405fa635d75db37007fa526c60368001433ba"
          check_sha 26490_successful_after.sha256 "431a62d9e23cd17d71388d4b79ad0a0c548c58ae9eabb2ad1894ba9cad34322f"
          bash -n build_26492_authority_provenance_v5b_parser_gate_fix.sh
          python3 -m py_compile transform_26491_complete_highlight_exposure_v4.py transform_26492_authority_provenance_v2.py transform_26492_rcd_parser_compat_v5.py
          python3 transform_26491_complete_highlight_exposure_v4.py --self-test
          python3 transform_26492_authority_provenance_v2.py --self-test
          python3 transform_26492_rcd_parser_compat_v5.py --self-test
          echo "PASS: V5B exact identities + unchanged V5 transform + semantic parser preflight"

      - name: Build guarded 26492 V5B corrected APK
        shell: bash
        run: |
          chmod +x build_26492_authority_provenance_v5b_parser_gate_fix.sh
          ./build_26492_authority_provenance_v5b_parser_gate_fix.sh

      - name: Upload 26492 V5B APK and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26492-v5b-authority-provenance-r32f-rcd-parser-fix
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726492-26492-v5b-authority-provenance-r32f-rcd-parser-fix-debug.apk
            build_26492_v5b_outputs/**
