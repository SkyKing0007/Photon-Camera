name: Build 26484 Full Bjzhou Integration V1

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 26483_successful_source.patch
      - 26483_successful_after.sha256
      - 26484_delta_from_26483.patch
      - transform_26484_full_bjzhou_integration_v1.py
      - build_26484_full_bjzhou_integration_v1.sh
      - .github/workflows/build-26484-full-bjzhou-integration-v1.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded successful 26483 to 26484
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout experimental infrastructure only
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 26483 baseline and 26484 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum 26483_successful_source.patch | awk '{print $1}')" = "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          test "$(sha256sum 26483_successful_after.sha256 | awk '{print $1}')" = "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          test "$(sha256sum 26484_delta_from_26483.patch | awk '{print $1}')" = "2d54472d3c018f694eec01d59b524b98a1cb8ab97b8b2e1ae5257467e23c5c62"
          test "$(sha256sum transform_26484_full_bjzhou_integration_v1.py | awk '{print $1}')" = "f3c212d9c16e39ffcde2ff4beae65e50c0ad7b30fd5e0b517dbfbcdaafec0c00"
          test "$(sha256sum build_26484_full_bjzhou_integration_v1.sh | awk '{print $1}')" = "a98b8ffc2fb834112245e5900afd82d469907adaff1b6b82483acb364f22d505"
          python3 -m py_compile transform_26484_full_bjzhou_integration_v1.py
          bash -n build_26484_full_bjzhou_integration_v1.sh
          echo "26483 checkpoint + 26484 infrastructure identity PASS"

      - name: Install GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version

      - name: Run strict 26484 procedure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26484_full_bjzhou_integration_v1.sh
          ./build_26484_full_bjzhou_integration_v1.sh

      - name: Upload complete 26484 checkpoint and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26484-full-bjzhou-integration-v1
          if-no-files-found: warn
          path: |
            build_26484_outputs/**
            IrisCamera-0.9726484-26484-full-bjzhou-integration-debug.apk
