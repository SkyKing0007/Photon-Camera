name: Build 26755 RAW-Lifetime Bounded IPOL
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26755_README_UPLOAD.txt'
      - '26755_*'
      - 'build_26755_raw_lifetime_bounded_ipol.sh'
      - 'transform_26755.py'
      - 'validate_26755.py'
      - 'verify_26755_*.py'
      - 'handoff_payload_26755/**'
      - '.github/workflows/build-26755-raw-lifetime-bounded-ipol.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26755 handoff and exact successful 26752 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26755_HANDOFF_HASHES.sha256
          python3 -S verify_26755_infrastructure.py build_26755_raw_lifetime_bounded_ipol.sh .github/workflows/build-26755-raw-lifetime-bounded-ipol.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26755 candidate from exact successful 26754 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26755_raw_lifetime_bounded_ipol.sh
      - name: Verify exact 26755 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726755-26755-raw-lifetime-bounded-ipol-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726755-26755-raw-lifetime-bounded-ipol-debug.apk' build_26755_raw_lifetime_bounded_ipol_outputs/26755_APK.sha256
      - name: Upload 26755 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26755-raw-lifetime-bounded-ipol
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726755-26755-raw-lifetime-bounded-ipol-debug.apk
            build_26755_raw_lifetime_bounded_ipol_outputs/
