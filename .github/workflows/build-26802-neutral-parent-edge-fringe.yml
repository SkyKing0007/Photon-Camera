name: Build 26802 Neutral Parent Edge Fringe
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26802.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26802 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26802.txt
          grep -Fx 'RUN_26802_NEUTRAL_PARENT_EDGE_FRINGE' TRIGGER_26802.txt
          sha256sum -c 26802_HANDOFF_HASHES.sha256
          bash -n build_26802_neutral_parent_edge_fringe.sh
          python3 -S -m py_compile transform_26802.py validate_26802.py verify_26802_patches.py verify_26802_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26802_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26802_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26802 candidate from successful 26801 authority using exact successful 26801 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26802_neutral_parent_edge_fringe.sh
      - name: Verify exact 26802 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726802-26802-neutral-parent-edge-fringe-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726802-26802-neutral-parent-edge-fringe-debug.apk' build_26802_neutral_parent_edge_fringe_outputs/26802_APK.sha256
      - name: Upload 26802 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26802-neutral-parent-edge-fringe
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726802-26802-neutral-parent-edge-fringe-debug.apk
            build_26802_neutral_parent_edge_fringe_outputs/
