name: Build 26697 Spektra AE 1.1.2 Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26697_README_UPLOAD.txt'
      - '26697_*'
      - 'build_26697_spektra_ae_112_parity.sh'
      - 'transform_26697.py'
      - 'validate_26697.py'
      - 'repair_26697_*.py'
      - 'handoff_payload_26697/**'
      - '.github/workflows/build-26697-spektra-ae-112-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26697 handoff and exact successful 26696 R1 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26697_HANDOFF_HASHES.sha256
          bash -n build_26697_spektra_ae_112_parity.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26697.py','validate_26697.py','repair_26697_authority.py','repair_26697_infrastructure.py','repair_26697_patches.py','repair_26697_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26697 candidate from successful 26696 R1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26697_spektra_ae_112_parity.sh
      - name: Verify exact 26697 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726697-26697-spektra-ae-112-parity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726697-26697-spektra-ae-112-parity-debug.apk" build_26697_spektra_ae_112_parity_outputs/26697_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26697_spektra_ae_112_parity_outputs/26697_apk_jni_contract.txt
      - name: Upload 26697 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26697-spektra-ae-112-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726697-26697-spektra-ae-112-parity-debug.apk
            build_26697_spektra_ae_112_parity_outputs/
