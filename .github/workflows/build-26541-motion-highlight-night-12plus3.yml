name: Build 26541 Motion Highlight + Night 12+3
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26541_*'
      - 'apply_26541_*'
      - 'validate_26541_*'
      - 'preflight_26541_*'
      - 'build_26541_*'
      - '.github/workflows/build-26541-motion-highlight-night-12plus3.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26541-motion-highlight-night-12plus3
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26541 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26541_HANDOFF_HASHES.sha256
          sha256sum -c 26541_BASE_26540_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26541_RUNTIME_PAYLOAD.tar.gz.sha256
          sha256sum -c 26541_RUNTIME_DELTA_FROM_26540.patch.sha256
          sha256sum -c 26541_RUNTIME_ROLLBACK_TO_26540.patch.sha256
          python3 -m py_compile apply_26541_motion_highlight_night_12plus3.py validate_26541_motion_highlight_night_12plus3.py preflight_26541_changed_syntax.py preflight_26541_java_compile_contracts.py
          python3 apply_26541_motion_highlight_night_12plus3.py --self-test
          python3 validate_26541_motion_highlight_night_12plus3.py --self-test
          python3 preflight_26541_changed_syntax.py --self-test
          python3 preflight_26541_java_compile_contracts.py --self-test
          bash -n build_26541_motion_highlight_night_12plus3.sh
          B=build_26541_motion_highlight_night_12plus3.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26540_HANDOFF_HEAD="0a8477cf263d3d7968cb4aa8ba659b87763b8322"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9574865147"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="2054861007ce3311dd995dca29f20b73d7a1afddfa80a9a0c7d6183ecd4a1e9b"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="77e90e241c8218bdea6d6faa10facfdc7ae23ab17e2476eb57c4ef42c2cb6ed9"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=967' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=967' "$B" >/dev/null
          grep -F 'runtime file inventory is not exactly nine' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726541"; VERSION_BUILD="26541"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'Night is fresh non-ZSL 12+3' "$B" >/dev/null
          grep -F 'No RCD' "$B" >/dev/null
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          ! grep -E 'git branch [^-]' "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: 26541 handoff mirrors successful 26540 V1.1 strict procedure + new 26541 regression gates'
      - name: Guarded 26541 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26541_motion_highlight_night_12plus3.sh
          ./build_26541_motion_highlight_night_12plus3.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26541-motion-highlight-night-12plus3
          path: |
            IrisCamera-0.9726541-26541-motion-highlight-night-12plus3-debug.apk
            build_26541_motion_highlight_night_12plus3_outputs/
          if-no-files-found: warn
