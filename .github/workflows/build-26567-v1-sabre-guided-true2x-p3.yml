name: Build 26567 V1.3 Sabre-Guided True2X + Internal P3

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26567_*'
      - 'REGRESSION_26567_*'
      - 'build_26567_v1_sabre_guided_true2x_p3.sh'
      - 'transform_26567_v1.py'
      - 'validate_26567_v1.py'
      - 'verify_26567_authority.py'
      - 'verify_26567_patches.py'
      - 'verify_26567_shaders.py'
      - '.github/workflows/build-26567-v1-sabre-guided-true2x-p3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26567 V1.3 package
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26567_HANDOFF_HASHES.sha256
          test "$(wc -l < V1_26567_HANDOFF_HASHES.sha256)" -eq 25
          bash -n build_26567_v1_sabre_guided_true2x_p3.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files = [
              'transform_26567_v1.py',
              'validate_26567_v1.py',
              'verify_26567_authority.py',
              'verify_26567_patches.py',
              'verify_26567_shaders.py',
          ]
          for name in files:
              source = Path(name).read_text()
              compile(source, name, 'exec')
          print('PASS sealed Python in-memory syntax gate')
          PY
          grep -F 'BASE_SUCCESS_COMMIT="f591411c3b696c1b88938e159332f36ac652775d"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'BASE_RUN_ID="33330757249"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9737608902"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="472a08f2de49820926580a309bcd73538432d6bbdbf0924f554397e8ba9276c9"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'BASE_TAR_SHA="853ae4cd00d96755366ee3a5a32a74e947b1d363168375453b33888e2a863b4c"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26566-v1-before-26567-sabre-guided-true2x"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726567"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'VERSION_BUILD="26567"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'GLSLANG_VERSION="16.5.0"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'GLSLANG_ARCHIVE_SHA="b9b1f96acb898a62251b171f7695efcecfc206a530299054071919b06820f657"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          grep -F 'run 33340661287, job 99335599790' REGRESSION_26567_CARRIED_FAILURES.txt >/dev/null
          grep -F 'snapshot_app_source "$ROOT" "$POST"' build_26567_v1_sabre_guided_true2x_p3.sh >/dev/null
          python3 -S - <<'PY'
          from pathlib import Path
          s=Path('build_26567_v1_sabre_guided_true2x_p3.sh').read_text()
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          p=s.index('  verify_candidate_patches', k)
          a=s.index('./gradlew :app:assembleDebug --stacktrace', k)
          assert k < p < a, 'real Kotlin/Java compilers must precede expensive patch proof and assemble'
          assert 'python3 -S "$VALIDATE" "$BASE" "$POST"' in s, 'post-build semantic validation must use clean source snapshot'
          assert 'python3 -S "$AUTHORITY" "$ROOT" "$BASE" "$POST"' in s, 'post-build authority must use clean source snapshot'
          print('PASS V1.3 compiler order + regression #20 clean-snapshot contract')
          PY
          ! grep -R -F 'V1_26567_' .github/workflows --exclude='build-26567-v1-sabre-guided-true2x-p3.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26567 candidate from successful compiled 26566 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26567_v1_sabre_guided_true2x_p3.sh
          ./build_26567_v1_sabre_guided_true2x_p3.sh

      - name: Upload 26567 V1.3 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26567-v1-3-sabre-guided-true2x-p3
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726567-26567-v1-3-sabre-guided-true2x-p3-debug.apk
            build_26567_v1_sabre_guided_true2x_p3_outputs/
