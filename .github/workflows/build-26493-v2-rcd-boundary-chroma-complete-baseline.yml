name: Build 26493 V2 RCD Boundary Chroma Complete Baseline

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26492_successful_app_source.tar.gz'
      - '26492_successful_after.sha256'
      - 'transform_26493_rcd_provenance_boundary_chroma_v1.py'
      - 'build_26493_rcd_provenance_boundary_chroma_v2_canonical_bundle.sh'
      - '.github/workflows/build-26493-v2-rcd-boundary-chroma-complete-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve failed V1 infrastructure and verify tested V5B rollback
        shell: bash
        run: |
          set -euo pipefail
          V5B="a424653a42923b02bd3a9f303da05d7a7e43409c"
          V5B_BACKUP="backup-26492-v5b-tested-before-26493-boundary-refinement"
          V1="00a72ba28665c0667c4f45e490f638195f46d6dc"
          V1_BACKUP="backup-26493-v1-manifest-failed-before-v2-canonical-bundle"
          v5b_actual="$(git ls-remote origin "refs/heads/$V5B_BACKUP" | awk '{print $1}')"
          [[ "$v5b_actual" == "$V5B" ]] || { echo "::error::tested V5B rollback missing/moved: $v5b_actual"; exit 1; }
          git cat-file -e "$V1^{commit}"
          existing="$(git ls-remote origin "refs/heads/$V1_BACKUP" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$V1" ]] || { echo "::error::V1 backup exists at $existing expected $V1"; exit 1; }
            echo "PASS: failed V1 infrastructure checkpoint already preserved"
          else
            git push origin "$V1:refs/heads/$V1_BACKUP"
            actual="$(git ls-remote origin "refs/heads/$V1_BACKUP" | awk '{print $1}')"
            [[ "$actual" == "$V1" ]] || { echo "::error::V1 backup verification failed"; exit 1; }
            echo "PASS: failed V1 infrastructure checkpoint preserved $V1_BACKUP=$actual"
          fi

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict V2 package identity and complete-baseline preflight
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            [[ "$actual" == "$expected" ]] || { echo "::error file=$file::identity mismatch"; exit 1; }
          }
          check_sha 26492_successful_app_source.tar.gz "4636f22d1ea417b9b3c5380025abc502971c3f334c78b3f7c199570ad72d98a9"
          check_sha 26492_successful_after.sha256 "dc19b4eba0fbeab493476383f5b148d9258103ab7d9e3d71e4e9e2915d149bef"
          check_sha transform_26493_rcd_provenance_boundary_chroma_v1.py "6e981316abfc2d7951369def577c5ecde777aefb37c420f4bfe1f897cab6382f"
          check_sha build_26493_rcd_provenance_boundary_chroma_v2_canonical_bundle.sh "71697778f384c3ac6155f03e94302bd6c7bc0a2c431d1fb2ad17058aef84b190"
          bash -n build_26493_rcd_provenance_boundary_chroma_v2_canonical_bundle.sh
          python3 -m py_compile transform_26493_rcd_provenance_boundary_chroma_v1.py
          python3 transform_26493_rcd_provenance_boundary_chroma_v1.py --self-test
          python3 - <<'PY_BUNDLE'
          import tarfile
          with tarfile.open('26492_successful_app_source.tar.gz','r:gz') as tf:
              files=[m.name for m in tf.getmembers() if m.isfile() and (m.name.startswith('app/src/main/') or m.name=='app/version.properties')]
          if len(files)!=856:
              raise SystemExit(f'complete V5B bundle file count={len(files)} expected=856')
          print('PASS: complete V5B bundle carries all 856 canonical files')
          PY_BUNDLE

      - name: Build guarded 26493 V2 APK
        shell: bash
        run: |
          chmod +x build_26493_rcd_provenance_boundary_chroma_v2_canonical_bundle.sh
          ./build_26493_rcd_provenance_boundary_chroma_v2_canonical_bundle.sh

      - name: Upload 26493 V2 APK and canonical next baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26493-v2-rcd-provenance-boundary-chroma-complete-baseline
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726493-26493-rcd-provenance-boundary-chroma-v2-debug.apk
            build_26493_v2_outputs/**
