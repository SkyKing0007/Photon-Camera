name: Build 26625 R1 Robust SHORT Fallback Geometry

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26625_R1_README_UPLOAD.txt'
      - 'REGRESSION_R1_26625_*'
      - 'R1_26625_*'
      - 'build_26625_r1_robust_short_fallback_geometry.sh'
      - 'transform_26625_r1.py'
      - 'validate_26625_r1.py'
      - 'verify_26625_r1_*.py'
      - 'handoff_payload_26625_r1/**'
      - '.github/workflows/build-26625-r1-robust-short-fallback-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26625 package and exact successful 26624 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26625_HANDOFF_HASHES.sha256
          bash -n build_26625_r1_robust_short_fallback_geometry.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26625_r1.py','validate_26625_r1.py','verify_26625_r1_authority.py','verify_26625_r1_infrastructure.py','verify_26625_r1_patches.py','verify_26625_r1_regressions.py','verify_26625_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26625 candidate from successful compiled 26624 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26625_r1_robust_short_fallback_geometry.sh
      - name: Upload 26625 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26625-r1-robust-short-fallback-geometry
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726625-26625-r1-robust-short-fallback-geometry-debug.apk
            build_26625_r1_robust_short_fallback_geometry_outputs/
