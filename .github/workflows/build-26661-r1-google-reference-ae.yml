name: Build 26661 R1 Google Highlight-Safe Reference AE

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26661_R1_README_UPLOAD.txt'
      - 'R1_26661_*'
      - 'build_26661_r1_google_reference_ae.sh'
      - 'transform_26661.py'
      - 'validate_26661.py'
      - 'verify_26661_*.py'
      - 'handoff_payload_26661/**'
      - '.github/workflows/build-26661-r1-google-reference-ae.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26661 handoff and exact successful 26660 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26661_HANDOFF_HASHES.sha256
          bash -n build_26661_r1_google_reference_ae.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26661.py','validate_26661.py','verify_26661_authority.py','verify_26661_infrastructure.py','verify_26661_patches.py','verify_26661_regressions.py','verify_26661_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26661 candidate from successful 26660 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26661_r1_google_reference_ae.sh
      - name: Verify exact 26661 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726661-26661-r1-google-reference-ae-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726661-26661-r1-google-reference-ae-debug.apk" build_26661_r1_google_reference_ae_outputs/26661_R1_APK.sha256
      - name: Upload 26661 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26661-r1-google-reference-ae
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726661-26661-r1-google-reference-ae-debug.apk
            build_26661_r1_google_reference_ae_outputs/
