name: Build 26641 R1 UHDR HEIC Shared GL Performance

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26641_R1_README_UPLOAD.txt'
      - 'R1_26641_*'
      - 'build_26641_r1_uhdr_heic_shared_gl_performance.sh'
      - 'transform_26641_r1.py'
      - 'validate_26641_r1.py'
      - 'verify_26641_r1_*.py'
      - 'handoff_payload_26641_r1/**'
      - '.github/workflows/build-26641-r1-uhdr-heic-shared-gl-performance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26641 R1 package and exact successful 26639 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26641_HANDOFF_HASHES.sha256
          bash -n build_26641_r1_uhdr_heic_shared_gl_performance.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26641_r1.py','validate_26641_r1.py','verify_26641_r1_authority.py','verify_26641_r1_infrastructure.py','verify_26641_r1_patches.py','verify_26641_r1_regressions.py','verify_26641_r1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26641 R1 candidate from successful compiled 26640 R1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26641_r1_uhdr_heic_shared_gl_performance.sh
      - name: Upload 26641 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26641-r1-uhdr-heic-shared-gl-performance
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726641-26641-r1-uhdr-heic-shared-gl-performance-debug.apk
            build_26641_r1_uhdr_heic_shared_gl_performance_outputs/
