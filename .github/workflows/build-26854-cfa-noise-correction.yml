name: Build 26854 CFA Noise Correction
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26854.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26854 package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26854.txt
          grep -Fx 'RUN_26854_CFA_NOISE_CORRECTION' TRIGGER_26854.txt
          sha256sum -c 26854_HANDOFF_HASHES.sha256
          bash -n build_26854_cfa_noise_correction.sh
          python3 -S -m py_compile transform_26854.py validate_26854.py verify_26854_patches.py verify_26854_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26854_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26854_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Verify and remove precisely the 50 accidental generated GLSL files from temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -S guard_26854_accidental_glsl.py
          test -z "$(git ls-files -- glsl_static)"
          test "$(git diff --cached --name-only --diff-filter=D -- glsl_static | wc -l)" -eq 50
      - name: Run exact inherited 17-stage 26854 guarded build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26854_cfa_noise_correction.sh
      - name: Verify exactly one intended 26854 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726854-26854-cfa-noise-correction-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726854-26854-cfa-noise-correction-debug.apk' build_26854_cfa_noise_correction_outputs/26854_APK.sha256
      - name: Upload 26854 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26854-cfa-noise-correction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726854-26854-cfa-noise-correction-debug.apk
            build_26854_cfa_noise_correction_outputs/
