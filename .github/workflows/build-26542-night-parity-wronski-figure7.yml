name: Build 26542 Night Parity + Wronski Figure 7

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26542-night-parity-wronski-figure7.yml'
      - 'build_26542_night_parity_wronski_figure7.sh'
      - 'apply_26542_night_parity_wronski_figure7.py'
      - 'validate_26542_night_parity_wronski_figure7.py'
      - 'preflight_26542_changed_syntax.py'
      - 'preflight_26542_java_kotlin_contracts.py'
      - '26542_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26542-night-parity-wronski-figure7
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26542 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26542_HANDOFF_HASHES.sha256
          sha256sum -c 26542_BASE_26541_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26542_RUNTIME_PAYLOAD.tar.gz.sha256
          sha256sum -c 26542_RUNTIME_DELTA_FROM_26541.patch.sha256
          sha256sum -c 26542_RUNTIME_ROLLBACK_TO_26541.patch.sha256
          python3 -m py_compile apply_26542_night_parity_wronski_figure7.py validate_26542_night_parity_wronski_figure7.py preflight_26542_changed_syntax.py preflight_26542_java_kotlin_contracts.py
          python3 apply_26542_night_parity_wronski_figure7.py --self-test
          python3 validate_26542_night_parity_wronski_figure7.py --self-test
          python3 preflight_26542_changed_syntax.py --self-test
          python3 preflight_26542_java_kotlin_contracts.py --self-test
          bash -n build_26542_night_parity_wronski_figure7.sh
          B=build_26542_night_parity_wronski_figure7.sh
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26541_HANDOFF_HEAD="25c4cf547421e4e971bc3afbd7a7697e0ced7c11"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9584372900"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="cb8bfa6eff1e7562f4a91c4089d48e28591dfbcd39b0f7b5d6f2b11cc41dbae7"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="8b0d9350331863d5205421b48d3f58b8172265340b961b928417e2f3f4e34192"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_MANIFEST_SHA="d4363c4d2cc54f4e7aff2c08ed4f804a01c622d1500be2cafb19731b1c5c65f2"' "$B" >/dev/null
          grep -F 'EXPECTED_BASE_FILES=967' "$B" >/dev/null
          grep -F 'EXPECTED_CANDIDATE_FILES=967' "$B" >/dev/null
          grep -F 'runtime file inventory is not exactly five' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726542"; VERSION_BUILD="26542"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F -- '--fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'expected exactly one Gradle APK' "$B" >/dev/null
          grep -F 'Night role-aware 12-short DNG parity' "$B" >/dev/null
          grep -F 'active Wronski/IPOL Figure-7 covariance law' "$B" >/dev/null
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          ! grep -E 'git branch [^-]' "$B" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo 'PASS: 26542 handoff mirrors successful 26541 strict procedure + Night parity/Figure-7 gates'

      - name: Guarded 26542 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26542_night_parity_wronski_figure7.sh
          ./build_26542_night_parity_wronski_figure7.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26542-night-parity-wronski-figure7
          path: |
            IrisCamera-0.9726542-26542-night-parity-wronski-figure7-debug.apk
            build_26542_night_parity_wronski_figure7_outputs/
          if-no-files-found: warn
