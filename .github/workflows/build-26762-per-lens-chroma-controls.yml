name: Build 26762 Per-Lens Chroma Controls
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26762_README_UPLOAD.txt'
      - '26762_*'
      - 'build_26762_per_lens_chroma_controls.sh'
      - 'transform_26762.py'
      - 'validate_26762.py'
      - 'verify_26762_*.py'
      - 'handoff_payload_26762/**'
      - '.github/workflows/build-26762-per-lens-chroma-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26762 handoff and successful 26761/26752 authority inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26762_HANDOFF_HASHES.sha256
          bash -n build_26762_per_lens_chroma_controls.sh
          python3 -S -m py_compile transform_26762.py validate_26762.py verify_26762_patches.py verify_26762_shaders.py
          rm -rf __pycache__
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26762 candidate from exact successful 26761 Actions runtime authority using successful 26752 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26762_per_lens_chroma_controls.sh
      - name: Verify exact 26762 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726762-26762-per-lens-chroma-controls-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726762-26762-per-lens-chroma-controls-debug.apk' build_26762_per_lens_chroma_controls_outputs/26762_APK.sha256
      - name: Upload 26762 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26762-per-lens-chroma-controls
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726762-26762-per-lens-chroma-controls-debug.apk
            build_26762_per_lens_chroma_controls_outputs/
