name: Build 26507 MGC Parity Immutable HDR JPEG444

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - build_26507_mgc_parity_immutable_hdr_jpeg444.sh
      - apply_26507_mgc_parity_immutable_hdr_jpeg444.py
      - validate_26507_mgc_parity_immutable_hdr_jpeg444.py
      - 26507_README_UPLOAD.txt
      - 26507_HANDOFF_HASHES.sha256
      - .github/workflows/build-26507-mgc-parity-immutable-hdr-jpeg444.yml

permissions:
  contents: read

concurrency:
  group: photon-26507-mgc-parity-immutable-hdr-jpeg444
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26507 MGC parity / immutable HDR / JPEG444
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Verify tested 26506 lineage and exact backup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor 951f63980608eaaf2adba245bdd268a890f6a8ab HEAD
          git merge-base --is-ancestor 6118984523296945a0910e55ddaa4d3126184059 HEAD
          test -z "$(git diff --name-only 6118984523296945a0910e55ddaa4d3126184059..HEAD -- app/src/main app/version.properties)"
          test "$(git ls-remote origin refs/heads/backup-26506-tested-before-26507-20260818 | awk '{print $1}')" = "951f63980608eaaf2adba245bdd268a890f6a8ab"
          echo "PASS: tested 26506 V2 + canonical runtime + exact 26507 backup"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0; A="glslang-${V}-linux-x86_64-release.tar.gz"; U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]; assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]; actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert expected==actual; print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"; "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26507_HANDOFF_HASHES.sha256
          bash -n build_26507_mgc_parity_immutable_hdr_jpeg444.sh
          python3 -m py_compile apply_26507_mgc_parity_immutable_hdr_jpeg444.py validate_26507_mgc_parity_immutable_hdr_jpeg444.py
          grep -F 'HANDOFF_26506_HEAD="951f63980608eaaf2adba245bdd268a890f6a8ab"' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26506-tested-before-26507-20260818"' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'HANDOFF_26507_V2_HEAD="accce4a324de92dcc93300c6f696d72f38cf55e3"' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'BACKUP_26507_V2_BRANCH="backup-26507-v2-before-native-gate-fix-20260818"' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'BJZHOU_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'VERSION_NAME=0.9726507' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'VERSION_BUILD=26507' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          grep -F 'IRIS_26507_MGC_RAW_HALF_GUIDE_PARITY' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'IRIS_26507_IMMUTABLE_AUX_FREEZE' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'iris26507ShortExpected' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'iris26507LongExpected' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'Log.e(TAG,"IRIS_26507_JPEG444_FAILED",t);' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          if grep -F 'iris26480ShortHighlightRequested, iris26505LongRequested, 80L' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null; then echo 'stale out-of-scope V3 freeze locals survived' >&2; exit 1; fi
          if grep -F 'Log.getStackTraceString(t)' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null; then echo 'Exception-only JPEG444 stack helper survived' >&2; exit 1; fi
          grep -F 'IRIS_26507_SHORT_A_SHARED_MGC_PRECHROMA_GATE' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'IRIS_26507_LONG_A_SHARED_MGC_PRECHROMA_GATE' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'IRIS_26507_GPU_LOCAL_8_CONNECTED_SHORT_TOPOLOGY' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          grep -F 'IRIS_26507_FULL_HDR_DISPLAY_CAPACITY_PARITY' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          if grep -F 'HDR_EXPOSURE_SCALE = 1.25f' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null; then echo 'rejected HDR 1.25 draft survived' >&2; exit 1; fi
          grep -F 'TJSAMP_444' apply_26507_mgc_parity_immutable_hdr_jpeg444.py >/dev/null
          if grep -Eq 'edit\(.*ParseExif|IRIS_26503_ACTUAL_CAPTURE_RESULT_ISO_EXIF' apply_26507_mgc_parity_immutable_hdr_jpeg444.py; then echo 'forbidden EXIF rewrite' >&2; exit 1; fi
          grep -F 'IRIS_26507_V5_TYPED_POSTBUILD_PROOF' build_26507_mgc_parity_immutable_hdr_jpeg444.sh >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build_26507_mgc_parity_immutable_hdr_jpeg444.sh').read_text()
          block=s.split('IRIS_26507_V5_TYPED_POSTBUILD_PROOF',1)[1].split('PYAPK',2)[1]
          for source_only in ('IRIS_26507_SHORT_A_SHARED_MGC_PRECHROMA_GATE','IRIS_26507_LONG_A_SHARED_MGC_PRECHROMA_GATE'):
              assert source_only not in block, f'source-only comment incorrectly required in APK proof: {source_only}'
          for runtime in ('IRIS_26507_MGC_GEOMETRY','IRIS_26507_FROZEN_AUX_BATCH_BOUNDARY','IRIS_26507_FULL_HDR_DISPLAY_CAPACITY_PARITY','IRIS_26507_JPEG444'):
              assert runtime in block, f'missing typed runtime proof marker: {runtime}'
          print('PASS: typed post-build proof distinguishes DEX runtime strings from source-only comments')
          PY
          echo "PASS: 26507 handoff static guards"

      - name: Build guarded 26507
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26507_mgc_parity_immutable_hdr_jpeg444.sh apply_26507_mgc_parity_immutable_hdr_jpeg444.py
          ./build_26507_mgc_parity_immutable_hdr_jpeg444.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26507-mgc-parity-immutable-hdr-jpeg444
          path: |
            IrisCamera-0.9726507-26507-mgc-parity-immutable-hdr-jpeg444-debug.apk
            build_26507_mgc_parity_immutable_hdr_jpeg444_outputs/
          if-no-files-found: warn
