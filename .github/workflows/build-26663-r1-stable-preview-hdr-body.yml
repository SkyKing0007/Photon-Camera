name: Build 26663 R1 Stable Preview HDR Body

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26663_R1_README_UPLOAD.txt'
      - 'R1_26663_*'
      - 'build_26663_r1_stable_preview_hdr_body.sh'
      - 'transform_26663.py'
      - 'validate_26663.py'
      - 'verify_26663_*.py'
      - 'handoff_payload_26663/**'
      - '.github/workflows/build-26663-r1-stable-preview-hdr-body.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26663 handoff and exact successful 26662 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26663_HANDOFF_HASHES.sha256
          bash -n build_26663_r1_stable_preview_hdr_body.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26663.py','validate_26663.py','verify_26663_authority.py','verify_26663_infrastructure.py','verify_26663_patches.py','verify_26663_regressions.py','verify_26663_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26663 candidate from successful 26662 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26663_r1_stable_preview_hdr_body.sh
      - name: Verify exact 26663 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726663-26663-r1-stable-preview-hdr-body-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726663-26663-r1-stable-preview-hdr-body-debug.apk" build_26663_r1_stable_preview_hdr_body_outputs/26663_R1_APK.sha256
      - name: Upload 26663 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26663-r1-stable-preview-hdr-body
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726663-26663-r1-stable-preview-hdr-body-debug.apk
            build_26663_r1_stable_preview_hdr_body_outputs/
