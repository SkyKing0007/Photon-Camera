name: Build 26536 Integrated Night Lowlight Reliability
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26536_integrated_night_lowlight_reliability.py
      - validate_26536_integrated_night_lowlight_reliability.py
      - preflight_26536_changed_syntax.py
      - preflight_26536_false_color_shader.py
      - build_26536_integrated_night_lowlight_reliability.sh
      - 26536_*.txt
      - 26536_*.sha256
      - 26536_*.patch
      - README_26536_UPLOAD.txt
      - .github/workflows/build-26536-integrated-night-lowlight-reliability.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26536-integrated-night-lowlight-reliability
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26536 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26536_HANDOFF_HASHES.sha256
          sha256sum -c 26536_BASE_26535_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26536_RUNTIME_DELTA_FROM_26535.patch.sha256
          sha256sum -c 26536_RUNTIME_ROLLBACK_TO_26535.patch.sha256
          python3 -m py_compile apply_26536_integrated_night_lowlight_reliability.py validate_26536_integrated_night_lowlight_reliability.py preflight_26536_changed_syntax.py preflight_26536_false_color_shader.py
          python3 apply_26536_integrated_night_lowlight_reliability.py --self-test
          python3 validate_26536_integrated_night_lowlight_reliability.py --self-test
          bash -n build_26536_integrated_night_lowlight_reliability.sh
          grep -F 'BASE_26535_HANDOFF_HEAD="7a2982a42ed0656b883858f5a025f01d7be30f77"' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="33484a274de4fe6bce35f18110915e501d41c13b5ab88e3f0eb08362155d4756"' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726536"; VERSION_BUILD="26536"' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'NIGHT_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F_TO_OPTIONAL_JIN' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'ADAPTIVE_MGC_LUMA=true' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          grep -F 'EXISTING_VGN_IIR_LOCKED=true' build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" build_26536_integrated_night_lowlight_reliability.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26536 exact successful-26535 artifact handoff verified"
      - name: Guarded 26536 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26536_integrated_night_lowlight_reliability.sh
          ./build_26536_integrated_night_lowlight_reliability.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26536-integrated-night-lowlight-reliability
          path: |
            IrisCamera-0.9726536-26536-integrated-night-lowlight-reliability-debug.apk
            build_26536_integrated_night_lowlight_reliability_outputs/
          if-no-files-found: warn
