name: Build 26560 V1 Sabre Only Spatial RGB Cleanup

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26560_*'
      - 'build_26560_v1_sabre_only_spatial_rgb_cleanup.sh'
      - 'validate_26560_v1_sabre_only_spatial_rgb_cleanup.py'
      - '.github/workflows/build-26560-v1-sabre-only-spatial-rgb-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26560 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26560_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26560_v1_sabre_only_spatial_rgb_cleanup.py
          python3 validate_26560_v1_sabre_only_spatial_rgb_cleanup.py --self-test
          bash -n build_26560_v1_sabre_only_spatial_rgb_cleanup.sh
          grep -F 'BASE_SUCCESS_COMMIT="77aee0b9abd18f22cb3f9872d53e3ea1869824fe"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'BASE_RUN_ID="33235249721"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9709756680"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="33854b4c8a02743d6378577cd73f161de7f4e525445c16b06aa5273b250351ba"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'BASE_TAR_SHA="5322e66d997f1724accd2cf34c7a0933b194c857f3fe05cd7ea99bbfad870e6e"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="60430f42ae65e934f87278b578e087c1cb4e87f692746c184293a85f95cc501e"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="a8249154bdf98d6661f2ca05a8ec2ff47fc76d86dd4475967cbfc5c4e13b0a39"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726560"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F 'VERSION_BUILD="26560"' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26560_v1_sabre_only_spatial_rgb_cleanup.sh >/dev/null
          ! grep -F 'V1_26560_' .github/workflows/build-26559-v1-remove-microcontrast-halo.yml

      - name: Build exact 26560 candidate from successful compiled 26559 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26560_v1_sabre_only_spatial_rgb_cleanup.sh
          ./build_26560_v1_sabre_only_spatial_rgb_cleanup.sh

      - name: Upload 26560 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26560-v1-sabre-only-spatial-rgb-cleanup
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726560-26560-v1-sabre-only-spatial-rgb-cleanup-debug.apk
            build_26560_v1_sabre_only_spatial_rgb_cleanup_outputs/
