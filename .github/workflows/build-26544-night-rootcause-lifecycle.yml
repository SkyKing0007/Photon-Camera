name: Build 26544 V1.1 Night Root-Cause Lifecycle

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26544-night-rootcause-lifecycle.yml'
      - 'build_26544_night_rootcause_lifecycle.sh'
      - 'validate_26544_night_rootcause_lifecycle.py'
      - '26544_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26544-night-rootcause-lifecycle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m))
          xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest')
          assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26544 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26544_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26544_night_rootcause_lifecycle.py
          python3 validate_26544_night_rootcause_lifecycle.py --self-test
          bash -n build_26544_night_rootcause_lifecycle.sh
          B=build_26544_night_rootcause_lifecycle.sh
          V=validate_26544_night_rootcause_lifecycle.py
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'BASE_26543_HEAD="7c6fa593abf9c50464e6093a1af75e92c2685705"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="32927284550"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9592028495"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="8116403e8a7f21672e194294e359c5b289d424ef6bf47cbc06ebbbb6dbc4437b"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="18e380899a2d1817ccdcc840f30ba69290b3a1c6541d9083796062f22d229c48"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="9ac60d97d8ccad91a4957ac23e1bd728166ededcfde622848ed1d09b2f82a8fb"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726544"' "$B" >/dev/null
          grep -F 'VERSION_BUILD="26544"' "$B" >/dev/null
          grep -F 'BJZHOU_VENDOR_HEAD="09c76e57e8f01a5a8fc536ab41fc80ba642d4042"' "$B" >/dev/null
          grep -F '26507_BJZHOU_NATIVE_DEPENDENCIES.sha256' "$B" >/dev/null
          grep -F '26507_BJZHOU_DEPENDENCY_COMMIT.txt' "$B" >/dev/null
          grep -F '26507 pinned libjpeg-turbo source missing before Gradle' "$B" >/dev/null
          grep -F 'REGRESSION: 26507 pinned libjpeg-turbo source missing immediately before assemble' "$B" >/dev/null
          grep -F 'sha256sum -c "$BJZHOU_MANIFEST"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F 'IRIS_NIGHT_26543_SPOOL_EXECUTOR' "$V" >/dev/null
          grep -F 'setProcessStateSummary(state)' "$V" >/dev/null
          grep -F 'IRIS_26544_NIGHT_FINAL_JPEG_COMPLETE' "$V" >/dev/null
          grep -F 'PreferenceKeys.setCameraModeOrdinal(CameraMode.MOTION.ordinal());' "$V" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          ! grep -E 'git branch [^-]' "$B" >/dev/null
          echo 'PASS: 26544 V1.1 handoff pins exact successful 26543 artifact + exact native vendor bootstrap + all real compiler/build gates'

      - name: Guarded 26544 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26544_night_rootcause_lifecycle.sh
          ./build_26544_night_rootcause_lifecycle.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26544-night-rootcause-lifecycle
          path: |
            IrisCamera-0.9726544-26544-night-rootcause-lifecycle-debug.apk
            build_26544_night_rootcause_lifecycle_outputs/
          if-no-files-found: warn
