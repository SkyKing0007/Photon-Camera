name: Build 26490 V3 Highlight Domain Short Border

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'transform_26490_highlight_domain_short_border_v3.py'
      - 'build_26490_highlight_domain_short_border_v3.sh'
      - '.github/workflows/build-26490-v3-highlight-domain-short-border.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Strict 26490 V3 infrastructure identity
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1" expected="$2" actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "IDENTITY: $file actual=$actual expected=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::26490 V3 infrastructure identity mismatch: actual=$actual expected=$expected"
              exit 1
            fi
          }
          check_sha build_26490_highlight_domain_short_border_v3.sh "1fe2dad7cd734d3f83deac3b2eb4880b18d10cc13c8469f1a7589fc427c0cadf"
          check_sha transform_26490_highlight_domain_short_border_v3.py "60c91ce99da7408082b47cc16004ddc43ff043f3cb0466795cb445ba9f2365dc"
          check_sha transform_26489_v3_r32f_accumulator_portability.py "fc181e389ac775f65d46b6bef13d4c075bf05e0be436e5ce5fa0265be7766283"
          check_sha transform_26489_bjzhou_host_bayer_rcd_v2.py "8def08e77dd63a31b93afb443184cad148364a21090b30da6ceadf883be93925"
          check_sha transform_26488_full_merge_rgb_rejection_contract_v1.py "b7710d343aa26b1215178821983f4ff3f742ad07d1ca556de2d272fbc36664c0"
          check_sha transform_26487_reconstruction_correctness_latency_v2.py "0580c756d1180554621aa4e7a1848271511fc2094a692b16b3b209df9bda5d77"
          check_sha transform_26486_full_bjzhou_censored_opponent_latency_v1.py "3030fa2543c6593711f8822a770c78de25e9347c65717420ffde291c1aad0eca"
          check_sha transform_26485_runtime_shutter_full_fix_v1.py "2e04a8e250d0fb64ca3e4a7763ed4943203d7f1ae740283018a7fb1b90c9a461"
          check_sha 26483_successful_source.patch "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          check_sha 26483_successful_after.sha256 "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          check_sha 26484_delta_from_26483.patch "18fbb861c3c49f4ad8399f29aa60ca3e85df57ffacc794b8b6a2206b42197ac3"
          bash -n build_26490_highlight_domain_short_border_v3.sh
          python3 -m py_compile \
            transform_26485_runtime_shutter_full_fix_v1.py \
            transform_26486_full_bjzhou_censored_opponent_latency_v1.py \
            transform_26487_reconstruction_correctness_latency_v2.py \
            transform_26488_full_merge_rgb_rejection_contract_v1.py \
            transform_26489_bjzhou_host_bayer_rcd_v2.py \
            transform_26489_v3_r32f_accumulator_portability.py \
            transform_26490_highlight_domain_short_border_v3.py
          python3 transform_26489_bjzhou_host_bayer_rcd_v2.py --self-test
          python3 transform_26489_v3_r32f_accumulator_portability.py --self-test
          python3 transform_26490_highlight_domain_short_border_v3.py --self-test
          echo "PASS: 26490 V3 workflow infrastructure identity"

      - name: Build guarded 26490 V3 candidate and APK
        shell: bash
        run: |
          chmod +x build_26490_highlight_domain_short_border_v3.sh
          ./build_26490_highlight_domain_short_border_v3.sh

      - name: Upload 26490 V3 artifact and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26490-v3-highlight-domain-short-border
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726490-26490-v3-highlight-domain-short-border-debug.apk
            build_26490_outputs/**
