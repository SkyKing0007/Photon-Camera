name: Build 26535 Shared Spatial-RGB Support Guard
on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - apply_26535_shared_spatial_rgb_support.py
      - validate_26535_shared_spatial_rgb_support.py
      - preflight_26535_changed_syntax.py
      - preflight_26535_highlight_chroma_shader.py
      - build_26535_shared_spatial_rgb_support.sh
      - 26535_*.txt
      - 26535_*.sha256
      - 26535_*.patch
      - 26535_runtime_overlay/**
      - .github/workflows/build-26535-shared-spatial-rgb-support.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: photon-26535-shared-spatial-rgb-support
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"; T="$RUNNER_TEMP/glslang-$V"; F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]; d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest(); assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"
      - name: Verify 26535 handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26535_HANDOFF_HASHES.sha256
          sha256sum -c 26535_BASE_26534_CANDIDATE_SOURCE_FILE.sha256
          sha256sum -c 26535_RUNTIME_DELTA_FROM_26534.patch.sha256
          sha256sum -c 26535_RUNTIME_ROLLBACK_TO_26534.patch.sha256
          sha256sum -c 26535_RUNTIME_OVERLAY.sha256
          python3 -m py_compile apply_26535_shared_spatial_rgb_support.py validate_26535_shared_spatial_rgb_support.py preflight_26535_changed_syntax.py preflight_26535_highlight_chroma_shader.py
          python3 apply_26535_shared_spatial_rgb_support.py --self-test
          python3 validate_26535_shared_spatial_rgb_support.py --self-test
          bash -n build_26535_shared_spatial_rgb_support.sh
          grep -F 'STRICT_26534_HANDOFF_HEAD="74ba3685f856a2240c4e5eb7224aeb53d8a1c2ee"' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'EXPECTED_BASE_TAR_SHA="a595fe6e78a96004a4631d6e6e03bae23c7d3cabd02b7e89fab1a177b324a58c"' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726535"; VERSION_BUILD="26535"' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'git branch backup-26534-before-26535' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'git diff --binary --no-ext-diff -- app/src/main' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'git diff --binary --no-ext-diff -R -- app/src/main' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'MOTION_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F' build_26535_shared_spatial_rgb_support.sh >/dev/null
          grep -F 'NIGHT_PRODUCTION=MGC_SPATIAL_RGB_RGBA32F_TO_JIN' build_26535_shared_spatial_rgb_support.sh >/dev/null
          ! grep -E 'git push|git switch dev|git checkout dev' build_26535_shared_spatial_rgb_support.sh >/dev/null
          glslangValidator --version | grep -F 16.5.0
          echo "PASS: 26535 exact successful-26534 artifact handoff verified"
      - name: Guarded 26535 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26535_shared_spatial_rgb_support.sh
          ./build_26535_shared_spatial_rgb_support.sh
      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26535-shared-spatial-rgb-support-guard
          path: |
            IrisCamera-0.9726535-26535-shared-spatial-rgb-support-guard-debug.apk
            build_26535_shared_spatial_rgb_support_outputs/
          if-no-files-found: warn
