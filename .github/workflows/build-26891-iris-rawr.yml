name: Build 26891 B OFF HDRQ Normalized Burst Preserve Features
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26891.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay SHA-pinned successful 26890 historical runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -S photon_26891_replay_exact_26890_workflow.py
          test "$(sha256sum build_26890_iris_rawr.sh | awk '{print $1}')" = '525b56e735d24b24461cf2575bdfcdfe90b242ec87514b9ddfcaf83c442ee3df'
          sha256sum -c 26890_GENERATED_BUILD_SHA256.txt
      - name: Derive SHA-sealed 26891 successor guarded runner
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26891.txt && grep -Fx 'RUN_26891_B_OFF_HDRQ_RAWR_NORMALIZE_PRESERVE_26890_V1' TRIGGER_26891.txt
          python3 -S stage_26891_root.py
          sha256sum -c 26891_HANDOFF_HASHES.sha256
          python3 -S -m py_compile generate_26891_build.py verify_26891_candidate.py verify_26891_semantics.py verify_26891_patches.py verify_26891_expanded_glsl.py stage_26891_root.py test_26891_negative_tamper.py test_26891_three_stage_negatives.py photon_26891_replay_exact_26890_workflow.py
          python3 -S test_26891_three_stage_negatives.py
          python3 -S generate_26891_build.py .
          cp build_26891_iris_rawr.sh /tmp/26891_first_generation.sh
          python3 -S generate_26891_build.py .
          cmp /tmp/26891_first_generation.sh build_26891_iris_rawr.sh
          sha256sum -c 26891_GENERATED_BUILD_SHA256.txt
          bash -n build_26891_iris_rawr.sh
          python3 -S stage_26891_root.py
          test "$(find handoff_payload_26891 -type f | wc -l)" -eq 6
          ! find . -type f -name '*.apk' | grep -q .
      - name: Run inherited 17-stage 26891 build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26891_iris_rawr.sh
      - name: Prove single intended 26891 APK
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726891-26891-iris-rawr-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726891-26891-iris-rawr-debug.apk' build_26891_iris_rawr_outputs/26891_APK.sha256
      - name: Seal exact EXECUTED 26891 runner
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26891_GENERATED_BUILD_SHA256.txt
          python3 -S photon_preserve_successful_runner.py 26891 --root . --expected-sha256 f0b25de61cc661a461c10e7665623ba15ddda0362ba047c05e543aaf670f094b
          test -f build_26891_iris_rawr_outputs/exact_generated_runner/EXACT_EXECUTED_RUNNER.sha256
          (cd build_26891_iris_rawr_outputs/exact_generated_runner && sha256sum -c EXACT_EXECUTED_RUNNER.sha256)
      - name: Upload authoritative 26891 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26891-b-off-hdrq-normalized-burst-executed-runner
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726891-26891-iris-rawr-debug.apk
            build_26891_iris_rawr_outputs/
