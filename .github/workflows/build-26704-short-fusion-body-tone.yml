name: Build 26704 Short Fusion + Body Tone

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26704_README_UPLOAD.txt'
      - '26704_*'
      - 'build_26704_short_fusion_body_tone.sh'
      - 'transform_26704.py'
      - 'validate_26704.py'
      - 'verify_26704_*.py'
      - 'handoff_payload_26704/**'
      - '.github/workflows/build-26704-short-fusion-body-tone.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26704 handoff and exact successful 26703 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26704_HANDOFF_HASHES.sha256
          bash -n build_26704_short_fusion_body_tone.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26704.py','validate_26704.py','verify_26704_authority.py','verify_26704_infrastructure.py','verify_26704_patches.py','verify_26704_regressions.py','verify_26704_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26704 candidate from successful 26703 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26704_short_fusion_body_tone.sh
      - name: Verify exact 26704 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726704-26704-short-fusion-body-tone-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726704-26704-short-fusion-body-tone-debug.apk" build_26704_short_fusion_body_tone_outputs/26704_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26704_short_fusion_body_tone_outputs/26704_apk_jni_contract.txt
      - name: Upload 26704 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26704-short-fusion-body-tone
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726704-26704-short-fusion-body-tone-debug.apk
            build_26704_short_fusion_body_tone_outputs/
