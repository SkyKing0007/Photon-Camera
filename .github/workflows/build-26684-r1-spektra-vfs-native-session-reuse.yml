name: Build 26684 R1 Spektra VF-S Native Session Reuse

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26684_R1_README_UPLOAD.txt'
      - 'R1_26684_*'
      - 'build_26684_r1_spektra_vfs_native_session_reuse.sh'
      - 'transform_26684.py'
      - 'validate_26684.py'
      - 'verify_26684_*.py'
      - 'handoff_payload_26684/**'
      - '.github/workflows/build-26684-r1-spektra-vfs-native-session-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26684 handoff and exact successful 26683 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26684_HANDOFF_HASHES.sha256
          bash -n build_26684_r1_spektra_vfs_native_session_reuse.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26684.py','validate_26684.py','verify_26684_authority.py','verify_26684_infrastructure.py','verify_26684_patches.py','verify_26684_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26684 candidate from successful 26683 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26684_r1_spektra_vfs_native_session_reuse.sh
      - name: Verify exact 26684 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726684-26684-r1-spektra-vfs-native-session-reuse-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726684-26684-r1-spektra-vfs-native-session-reuse-debug.apk" build_26684_r1_spektra_vfs_native_session_reuse_outputs/26684_R1_APK.sha256
      - name: Upload 26684 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26684-r1-spektra-vfs-native-session-reuse
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726684-26684-r1-spektra-vfs-native-session-reuse-debug.apk
            build_26684_r1_spektra_vfs_native_session_reuse_outputs/
