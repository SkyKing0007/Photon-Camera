name: Build 26650 R1 Highlight Compression Toggle

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26650_R1_README_UPLOAD.txt'
      - 'R1_26650_*'
      - 'build_26650_r1_highlight_compression_toggle.sh'
      - 'transform_26650.py'
      - 'validate_26650.py'
      - 'verify_26650_*.py'
      - 'handoff_payload_26650/**'
      - '.github/workflows/build-26650-r1-highlight-compression-toggle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26650 handoff and exact successful 26648 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26650_HANDOFF_HASHES.sha256
          bash -n build_26650_r1_highlight_compression_toggle.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26650.py','validate_26650.py','verify_26650_authority.py','verify_26650_infrastructure.py','verify_26650_patches.py','verify_26650_regressions.py','verify_26650_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26650 candidate from successful 26648 R1.2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26650_r1_highlight_compression_toggle.sh
      - name: Verify exact 26650 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726650-26650-r1-highlight-compression-toggle-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726650-26650-r1-highlight-compression-toggle-debug.apk" build_26650_r1_highlight_compression_toggle_outputs/26650_R1_APK.sha256
      - name: Upload 26650 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26650-r1-highlight-compression-toggle
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726650-26650-r1-highlight-compression-toggle-debug.apk
            build_26650_r1_highlight_compression_toggle_outputs/
