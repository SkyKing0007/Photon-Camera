name: Build 26840 Smooth Rolloff Clip-Zone Chroma
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26840.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26840 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26840.txt
          grep -Fx 'RUN_26840_SMOOTH_ROLLOFF_CLIP_ZONE_CHROMA' TRIGGER_26840.txt
          sha256sum -c 26840_HANDOFF_HASHES.sha256
          bash -n build_26840_smooth_rolloff_clip_zone_chroma.sh
          python3 -S -m py_compile transform_26840.py validate_26840.py verify_26840_patches.py verify_26840_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26840_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26840_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26840 candidate from successful 26839 authority using exact successful 26839 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26840_smooth_rolloff_clip_zone_chroma.sh
      - name: Verify exact 26840 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726840-26840-smooth-rolloff-clip-zone-chroma-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726840-26840-smooth-rolloff-clip-zone-chroma-debug.apk' build_26840_smooth_rolloff_clip_zone_chroma_outputs/26840_APK.sha256
      - name: Upload 26840 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26840-smooth-rolloff-clip-zone-chroma
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726840-26840-smooth-rolloff-clip-zone-chroma-debug.apk
            build_26840_smooth_rolloff_clip_zone_chroma_outputs/
