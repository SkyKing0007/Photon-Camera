name: Build 26468 Correctness Single-Frame Seam

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26468_correctness_singleframe_seam.sh
      - .github/workflows/build-26468-correctness-singleframe-seam.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26468 build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run guarded 26468 operation
        shell: bash
        run: |
          chmod +x ./build_26468_correctness_singleframe_seam.sh
          ./build_26468_correctness_singleframe_seam.sh

      - name: Upload 26468 APK and audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26468-correctness-singleframe-seam
          if-no-files-found: warn
          retention-days: 14
          path: |
            build_26468_outputs/**
            IrisCamera-0.9726468-26468-correctness-singleframe-seam-debug.apk
