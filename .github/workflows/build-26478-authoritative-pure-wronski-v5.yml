name: Build 26478 Authoritative Pure Wronski V5

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26478_authoritative_pure_wronski_v5.sh
      - .github/workflows/build-26478-authoritative-pure-wronski-v5.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded authoritative 26478 V5
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard and syntax-check 26478 V5 infrastructure
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"

          test "$(git rev-parse HEAD^)" = "87de69aff3d927be9c031c2fce476dffe88e4d71" || {
            echo "26478 V5 commit must be direct child of exact V4 infrastructure HEAD"
            git log -7 --oneline
            exit 1
          }
          test "$(git rev-parse HEAD~2)" = "62fed09aa61ac963f951fd39b1a62be870d75654" || {
            echo "26478 V5 chain missing exact 62fed09 correction"
            git log -7 --oneline
            exit 1
          }
          test "$(git rev-parse HEAD~3)" = "a5fa756f8b5cf1101e807b776728d08225f3e53e" || {
            echo "26478 V5 chain missing exact first 26478 infrastructure commit"
            git log -7 --oneline
            exit 1
          }
          test "$(git rev-parse HEAD~4)" = "be24c16cb091e753852b900384dbde6f8d32744e" || {
            echo "26478 V5 chain must descend exactly from successful 26477 V3"
            git log -7 --oneline
            exit 1
          }

          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 V5 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties
            exit 1
          }

          expected_current="$(printf '%s\n' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v5.yml' \
            'build_26478_authoritative_pure_wronski_v5.sh' | sort)"
          actual_current="$(git diff --name-only HEAD^ HEAD | sort)"
          test "$actual_current" = "$expected_current" || {
            echo "26478 V5 commit must contain exactly the push-trigger wrapper/workflow"
            echo "ACTUAL:"
            printf '%s\n' "$actual_current"
            echo "EXPECTED:"
            printf '%s\n' "$expected_current"
            exit 1
          }

          # Across every 26478 infrastructure-only commit, committed app source must remain untouched.
          test "$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26478 infrastructure chain changed app source directly"
            git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD -- app/src/main app/version.properties
            exit 1
          }

          expected_combined="$(printf '%s\n' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v3.yml' \
            'build_26478_authoritative_pure_wronski_v3.sh' \
            'transform_26478_speaker_support_diagnostic_v1.py' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v4.yml' \
            'build_26478_authoritative_pure_wronski_v4.sh' \
            'transform_26478_pure_wronski_highlight_safe_v1.py' \
            '.github/workflows/build-26478-authoritative-pure-wronski-v5.yml' \
            'build_26478_authoritative_pure_wronski_v5.sh' | sort)"
          actual_combined="$(git diff --name-only be24c16cb091e753852b900384dbde6f8d32744e HEAD | sort)"
          test "$actual_combined" = "$expected_combined" || {
            echo "final 26478 infrastructure chain is not exactly the eight intended infrastructure files"
            echo "ACTUAL:"
            printf '%s\n' "$actual_combined"
            echo "EXPECTED:"
            printf '%s\n' "$expected_combined"
            exit 1
          }

          test -f ./transform_26478_pure_wronski_highlight_safe_v1.py
          test -f ./transform_26478_speaker_support_diagnostic_v1.py

          bash -n ./build_26478_authoritative_pure_wronski_v5.sh
          python3 -m py_compile ./transform_26478_pure_wronski_highlight_safe_v1.py
          python3 -m py_compile ./transform_26478_speaker_support_diagnostic_v1.py

          echo "26478 V5 exact infrastructure lineage + syntax PASS"

      - name: Run guarded 26478 build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26478_authoritative_pure_wronski_v5.sh
          ./build_26478_authoritative_pure_wronski_v5.sh

      - name: Upload 26478 audit patches and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26478-authoritative-pure-wronski-v5
          if-no-files-found: error
          path: |
            build_26478_outputs/**
            IrisCamera-0.9726478-26478-pure-wronski-highlight-safe-speaker-diag-debug.apk
