name: Build 26589 V1 Motion Auxiliary Merge Count Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26589_*'
      - 'REGRESSION_V1_26589_*'
      - 'build_26589_v1_motion_aux_merged_count_parity.sh'
      - 'transform_26589_v1.py'
      - 'validate_26589_v1.py'
      - 'verify_26589_v1_authority.py'
      - 'verify_26589_v1_regressions.py'
      - 'verify_26589_v1_patches.py'
      - 'verify_26589_v1_shaders.py'
      - 'handoff_payload_26589_v1/**'
      - '.github/workflows/build-26589-v1-motion-aux-merged-count-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26589 V1 package and inherited successful 26588 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26589_HANDOFF_HASHES.sha256
          bash -n build_26589_v1_motion_aux_merged_count_parity.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26589_v1.py','validate_26589_v1.py','verify_26589_v1_authority.py','verify_26589_v1_regressions.py','verify_26589_v1_patches.py','verify_26589_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          s=Path('build_26589_v1_motion_aux_merged_count_parity.sh').read_text()
          assert 'BASE_SUCCESS_COMMIT="b4957d367f68f977dab4f66f17de3a6036f50139"' in s
          assert 'BASE_RUN_ID="33792598348"' in s
          assert 'BASE_JOB_ID="100772523948"' in s
          assert 'BASE_ARTIFACT_ID="9908044565"' in s
          assert 'BASE_ARTIFACT_SHA="b5b095968d19bf232d7dabb2e1cbee26c22c81fa24e1bf4f6667e13d582cc850"' in s
          assert 'BASE_TAR_SHA="e03b0afa3a5fb99d919d675797498183094a4058852f4d5c8675e7567ef65ca1"' in s
          assert 'VERSION_NAME="0.9726589"' in s and 'VERSION_BUILD="26589"' in s
          assert 'GLSLANG_VERSION="16.5.0"' in s
          assert '[[ "$(wc -l < "$CHANGED")" -eq 2 ]]' in s
          k=s.index('./gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace')
          n=s.index("./gradlew ':app:buildCMakeDebug[arm64-v8a]' ':app:buildCMakeDebug[armeabi-v7a]' --stacktrace",k)
          p=s.index('  verify_candidate_patches',n)
          b=s.index('pass "26589 PRE-BUILD SAFETY PROOF PASSED"',p)
          a=s.index('./gradlew :app:assembleDebug --stacktrace',b)
          assert k<n<p<b<a
          assert '\nverify_package\nverify_scope\nobtain_authority\nmake_candidate\nverify_shaders\n' in s
          assert 'BACKUP_BRANCH=' not in s
          assert 'HANDOFF_PARENT_COMMIT="b4957d367f68f977dab4f66f17de3a6036f50139"' in s
          assert '[[ "$(git rev-parse HEAD^)" == "$HANDOFF_PARENT_COMMIT" ]]' in s
          assert 'python3 -S "$SHADERVERIFY" "$BASE" "$AFTER" --out "$SHADER_OUT" --glslang "$compiler"' in s
          print('PASS sealed syntax + successful 26588 authority + exact inherited compiler/build order')
          PY
          grep -F 'MGC PARITY ARCHITECTURE INVALID: 26587 SHORT leaked into mergedFrameCount merged=15 expected=16' REGRESSION_V1_26589_MOTION_AUX_MERGED_COUNT.txt >/dev/null
          grep -F 'historic broad pink, pink/green dotted edges, cyan/green speckling, zipper/ghost artifacts' REGRESSION_V1_26589_CARRIED_26588.txt >/dev/null
          grep -F 'app/build/** and app/.cxx/** never count as runtime-source changes.' REGRESSION_V1_26589_WORKFLOW_PACKAGING.txt >/dev/null
          grep -F 'no verification gate is weakened' V1_26589_INFRASTRUCTURE_DIFF_AUDIT.txt >/dev/null
          grep -F 'e4a4f8e614987485294c1079674e5ce94b041012' V1_26589_BUILD_SCRIPT_DIFF_AUDIT_FROM_SUCCESSFUL_26588.txt >/dev/null
          grep -F 'dcdd5f155e38f64dfd2a2cb100b792516ff76b1a' V1_26589_WORKFLOW_DIFF_AUDIT_FROM_SUCCESSFUL_26588.txt >/dev/null
          ! grep -R -F 'V1_26589_' .github/workflows --exclude='build-26589-v1-motion-aux-merged-count-parity.yml'
          ! grep -R -F 'handoff_payload_26589_v1' .github/workflows --exclude='build-26589-v1-motion-aux-merged-count-parity.yml'
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .

      - name: Build exact 26589 candidate from successful compiled 26588 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26589_v1_motion_aux_merged_count_parity.sh

      - name: Upload 26589 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26589-v1-motion-aux-merged-count-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726589-26589-v1-motion-aux-merged-count-parity-debug.apk
            build_26589_v1_motion_aux_merged_count_parity_outputs/
