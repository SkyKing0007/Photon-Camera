name: Build 26719 High Zoom Lazy Isolation
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26719_README_UPLOAD.txt'
      - '26719_*'
      - 'build_26719_high_zoom_lazy_isolation.sh'
      - 'transform_26719.py'
      - 'validate_26719.py'
      - 'verify_26719_*.py'
      - 'handoff_payload_26719/**'
      - '.github/workflows/build-26719-high-zoom-lazy-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26719 handoff and exact successful 26718 R1 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26719_HANDOFF_HASHES.sha256
          python3 -S verify_26719_infrastructure.py build_26719_high_zoom_lazy_isolation.sh .github/workflows/build-26719-high-zoom-lazy-isolation.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26719 candidate with successful 26718 R1 procedure from successful 26718 R1 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26719_high_zoom_lazy_isolation.sh
      - name: Verify exact 26719 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726719-26719-high-zoom-lazy-isolation-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726719-26719-high-zoom-lazy-isolation-debug.apk' build_26719_high_zoom_lazy_isolation_outputs/26719_APK.sha256
      - name: Upload 26719 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26719-high-zoom-lazy-isolation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726719-26719-high-zoom-lazy-isolation-debug.apk
            build_26719_high_zoom_lazy_isolation_outputs/
