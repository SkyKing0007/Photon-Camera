name: Build 26499 V7 RCD Layout Runtime Fix

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26499_v7_rcd_layout_runtime_fix.sh
      - .github/workflows/build-26499-v7-rcd-layout-runtime-fix.yml
      - 26499_V7_HANDOFF_HASHES.sha256
      - 26498_V1_3_RECOVERY_V7_RCD_LAYOUT_FIX.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Require experimental branch and infrastructure-only V7 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git branch --show-current)" != "dev"
          git merge-base --is-ancestor 3756e4323594a5d61fe66cf0cca9694ae8543495 HEAD
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GLSL validator
        shell: bash
        run: |
          set -euo pipefail
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y glslang-tools
          glslangValidator --version | head -1

      - name: Verify exact V7 handoff identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26499_V7_HANDOFF_HASHES.sha256
          bash -n build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'backup-26498-v1.3-recovery-v6-before-v7-rcd-layout-fix' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'EXPECTED_V7_PATCH="7f28e8f65fd78ba1d92f3fc53155156419bd38b4878438c1f5bb0f1f2ac9be23"' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'zero semantic GLSL-token changes' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'all V7 RCD/shadow layouts are discoverable by GLInterface.getLayouts()' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'VERSION_NAME=0.9726499' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q 'VERSION_BUILD=26499' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q ':app:assembleDebug' build_26499_v7_rcd_layout_runtime_fix.sh
          grep -q '26499 V7 RCD LAYOUT RUNTIME FIX BUILD COMPLETE' build_26499_v7_rcd_layout_runtime_fix.sh
          echo 'PASS: V7 handoff identity + backup + parser gate + version/build gate'

      - name: Build guarded 26499 V7 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26499_v7_rcd_layout_runtime_fix.sh
          ./build_26499_v7_rcd_layout_runtime_fix.sh

      - name: Upload 26499 V7 APK and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26499-v7-rcd-layout-runtime-fix
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726499-26499-v7-rcd-layout-runtime-fix-debug.apk
            build_26499_v7_rcd_layout_runtime_fix_outputs/**
