name: Build 26810 Unsupported Chroma + Exact Gallery Item
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26810.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26810 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26810.txt
          grep -Fx 'RUN_26810_UNSUPPORTED_CHROMA_EXACT_GALLERY_ITEM' TRIGGER_26810.txt
          sha256sum -c 26810_HANDOFF_HASHES.sha256
          bash -n build_26810_neutral_parent_edge_fringe.sh
          python3 -S -m py_compile transform_26810.py validate_26810.py verify_26810_patches.py verify_26810_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26810_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26810_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26810 candidate from successful 26809 authority using exact successful 26808 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26810_neutral_parent_edge_fringe.sh
      - name: Verify exact 26810 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726810-26810-neutral-parent-edge-fringe-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726810-26810-neutral-parent-edge-fringe-debug.apk' build_26810_neutral_parent_edge_fringe_outputs/26810_APK.sha256
      - name: Upload 26810 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26810-neutral-parent-edge-fringe
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726810-26810-neutral-parent-edge-fringe-debug.apk
            build_26810_neutral_parent_edge_fringe_outputs/
