name: Build 26670 R1 Restore 26660 Live HDR Manual

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26670_R1_README_UPLOAD.txt'
      - 'R1_26670_*'
      - 'build_26670_r1_restore_26660_live_hdr_manual.sh'
      - 'transform_26670.py'
      - 'validate_26670.py'
      - 'verify_26670_*.py'
      - 'handoff_payload_26670/**'
      - '.github/workflows/build-26670-r1-restore-26660-live-hdr-manual.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26670 handoff and exact successful 26669 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26670_HANDOFF_HASHES.sha256
          bash -n build_26670_r1_restore_26660_live_hdr_manual.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26670.py','validate_26670.py','verify_26670_authority.py','verify_26670_infrastructure.py','verify_26670_patches.py','verify_26670_regressions.py','verify_26670_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26670 candidate from successful 26669 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26670_r1_restore_26660_live_hdr_manual.sh
      - name: Verify exact 26670 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726670-26670-r1-restore-26660-live-hdr-manual-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726670-26670-r1-restore-26660-live-hdr-manual-debug.apk" build_26670_r1_restore_26660_live_hdr_manual_outputs/26670_R1_APK.sha256
      - name: Upload 26670 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26670-r1-restore-26660-live-hdr-manual
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726670-26670-r1-restore-26660-live-hdr-manual-debug.apk
            build_26670_r1_restore_26660_live_hdr_manual_outputs/
