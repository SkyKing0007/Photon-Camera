name: Build 26775 Resolve VGN Phase Validity
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26775.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26775 R2 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26775.txt
          grep -Fx 'RUN_26775_R2_MANIFEST_ORDER_REPAIR' TRIGGER_26775.txt
          sha256sum -c 26775_HANDOFF_HASHES.sha256
          bash -n build_26775_resolve_vgn_phase_validity.sh
          python3 -S -m py_compile transform_26775.py validate_26775.py verify_26775_patches.py verify_26775_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26775_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26775_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26775 candidate from successful 26774 authority using unchanged successful procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26775_resolve_vgn_phase_validity.sh
      - name: Verify exact 26775 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726775-26775-resolve-vgn-phase-validity-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726775-26775-resolve-vgn-phase-validity-debug.apk' build_26775_resolve_vgn_phase_validity_outputs/26775_APK.sha256
      - name: Upload 26775 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26775-resolve-vgn-phase-validity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726775-26775-resolve-vgn-phase-validity-debug.apk
            build_26775_resolve_vgn_phase_validity_outputs/
