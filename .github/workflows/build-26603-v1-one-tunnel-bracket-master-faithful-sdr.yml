name: Build 26603 V1 One-Tunnel Bracket + Master-Faithful SDR

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26603_README_UPLOAD.txt'
      - 'REGRESSION_V1_26603_*'
      - 'V1_26603_*'
      - 'build_26603_v1_one_tunnel_bracket_master_faithful_sdr.sh'
      - 'transform_26603_v1.py'
      - 'validate_26603_v1.py'
      - 'verify_26603_v1_*.py'
      - 'handoff_payload_26603_v1/**'
      - '.github/workflows/build-26603-v1-one-tunnel-bracket-master-faithful-sdr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26603 V1 package and exact successful 26602/26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26603_HANDOFF_HASHES.sha256
          bash -n build_26603_v1_one_tunnel_bracket_master_faithful_sdr.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26603_v1.py','validate_26603_v1.py','verify_26603_v1_authority.py','verify_26603_v1_infrastructure.py','verify_26603_v1_patches.py','verify_26603_v1_regressions.py','verify_26603_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26603 candidate from successful compiled 26602 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26603_v1_one_tunnel_bracket_master_faithful_sdr.sh
      - name: Upload 26603 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26603-v1-one-tunnel-bracket-master-faithful-sdr
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726603-26603-v1-one-tunnel-bracket-master-faithful-sdr-debug.apk
            build_26603_v1_one_tunnel_bracket_master_faithful_sdr_outputs/
