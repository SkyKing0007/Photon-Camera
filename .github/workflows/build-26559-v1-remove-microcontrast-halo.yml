name: Build 26559 V1 Remove Microcontrast Halo

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26559_*'
      - 'build_26559_v1_remove_microcontrast_halo.sh'
      - 'validate_26559_v1_remove_microcontrast_halo.py'
      - 'extract_26559_runtime_glsl.py'
      - 'scan_glsl_reserved_identifiers_26559.py'
      - '.github/workflows/build-26559-v1-remove-microcontrast-halo.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26559 V1 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_26559_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26559_v1_remove_microcontrast_halo.py extract_26559_runtime_glsl.py scan_glsl_reserved_identifiers_26559.py
          python3 validate_26559_v1_remove_microcontrast_halo.py --self-test
          python3 extract_26559_runtime_glsl.py --self-test
          python3 scan_glsl_reserved_identifiers_26559.py --self-test
          bash -n build_26559_v1_remove_microcontrast_halo.sh
          grep -F 'BASE_SUCCESS_COMMIT="928bc3d3101864f944228b0ed55b0e789fafb1dd"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'BASE_RUN_ID="33233880828"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9709364572"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="b2c12b144b138f40776fb4ee1a17c54ccf6de93e4198e62e5905fba480f90d52"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'BASE_TAR_SHA="6bc435593ab0523b13308748ff4421d3b8752166dde44c6cb772b31ee56e77b9"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'BASE_MANIFEST_SHA="348a615d62529bd9019bbd4d1634a1c54645d00f2d702e457cdabeb53289ac8c"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'CAND_MANIFEST_SHA="60430f42ae65e934f87278b578e087c1cb4e87f692746c184293a85f95cc501e"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'GLSLANG_PKG_VERSION="15.1.0-2~ubuntu0.24.04.2"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726559"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F 'VERSION_BUILD="26559"' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26559_v1_remove_microcontrast_halo.sh >/dev/null
          ! grep -F 'V1_26559_' .github/workflows/build-26558-v1-night-sabre-tonemap.yml

      - name: Build exact 26559 candidate from successful compiled 26558 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26559_v1_remove_microcontrast_halo.sh
          ./build_26559_v1_remove_microcontrast_halo.sh

      - name: Upload 26559 V1 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26559-v1-remove-microcontrast-halo
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726559-26559-v1-remove-microcontrast-halo-debug.apk
            build_26559_v1_remove_microcontrast_halo_outputs/
