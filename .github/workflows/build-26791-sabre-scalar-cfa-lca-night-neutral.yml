name: Build 26791 Sabre Scalar CFA LCA Night Neutral
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26791.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26791 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26791.txt
          grep -Fx 'RUN_26791_SABRE_SCALAR_CFA_LCA_NIGHT_NEUTRAL' TRIGGER_26791.txt
          sha256sum -c 26791_HANDOFF_HASHES.sha256
          bash -n build_26791_sabre_scalar_cfa_lca_night_neutral.sh
          python3 -S -m py_compile transform_26791.py validate_26791.py verify_26791_patches.py verify_26791_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26791_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26791_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26791 candidate from successful 26790 authority using exact successful 26790 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26791_sabre_scalar_cfa_lca_night_neutral.sh
      - name: Verify exact 26791 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726791-26791-sabre-scalar-cfa-lca-night-neutral-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726791-26791-sabre-scalar-cfa-lca-night-neutral-debug.apk' build_26791_sabre_scalar_cfa_lca_night_neutral_outputs/26791_APK.sha256
      - name: Upload 26791 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26791-sabre-scalar-cfa-lca-night-neutral
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726791-26791-sabre-scalar-cfa-lca-night-neutral-debug.apk
            build_26791_sabre_scalar_cfa_lca_night_neutral_outputs/
