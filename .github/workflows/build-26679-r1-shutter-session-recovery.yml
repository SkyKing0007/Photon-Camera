name: Build 26679 R1 Shutter Session Recovery

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26679_R1_README_UPLOAD.txt'
      - 'R1_26679_*'
      - 'build_26679_r1_shutter_session_recovery.sh'
      - 'transform_26679.py'
      - 'validate_26679.py'
      - 'verify_26679_*.py'
      - 'handoff_payload_26679/**'
      - '.github/workflows/build-26679-r1-shutter-session-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26679 handoff and exact successful 26678 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26679_HANDOFF_HASHES.sha256
          bash -n build_26679_r1_shutter_session_recovery.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26679.py','validate_26679.py','verify_26679_authority.py','verify_26679_infrastructure.py','verify_26679_patches.py','verify_26679_regressions.py','verify_26679_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26679 candidate from successful 26678 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26679_r1_shutter_session_recovery.sh
      - name: Verify exact 26679 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726679-26679-r1-shutter-session-recovery-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726679-26679-r1-shutter-session-recovery-debug.apk" build_26679_r1_shutter_session_recovery_outputs/26679_R1_APK.sha256
      - name: Upload 26679 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26679-r1-shutter-session-recovery
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726679-26679-r1-shutter-session-recovery-debug.apk
            build_26679_r1_shutter_session_recovery_outputs/
