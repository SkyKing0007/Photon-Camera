name: Photon 26930 V1 - successful 26929 source physical-LSC chroma noise and natural fine grain
on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - TRIGGER_26930.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout intended experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Prepare pinned JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on original successful 26923 and current 26926 executable references and three-stage seal
        run: |
          python3 -S test_26923_workflow_refs.py
          python3 -S test_26926_workflow_refs.py --all
          python3 -S build_26926_incremental.py seal
          python3 -S test_26926_sealed_negatives.py
          python3 -S test_26926_source.py --payload
          python3 -S test_26926_math_host.py --payload
          python3 -S test_26926_shader_contract.py --payload
          python3 -S test_26926_shader_shadow.py --payload
          python3 -S test_26926_patch_proof.py
          python3 -S compile_26926_lk_shaders.py --preflight
          python3 -S build_26927_incremental.py seal
          python3 -S test_26927_workflow_refs.py --all
          python3 -S test_26927_sealed_negatives.py
          python3 -S test_26927_source.py --payload
          python3 -S test_26927_chroma_math.py --payload
          python3 -S test_26927_shader_contract.py --payload
          python3 -S test_26927_shader_shadow.py --payload
          python3 -S test_26927_patch_proof.py --payload
          python3 -S build_26928_incremental.py seal
          python3 -S test_26928_workflow_refs.py --all
          python3 -S test_26928_sealed_negatives.py
          python3 -S test_26928_source.py --payload
          python3 -S test_26928_chroma_math.py --payload
          python3 -S test_26928_shader_contract.py --payload
          python3 -S test_26928_shader_shadow.py --payload
          python3 -S test_26928_patch_proof.py --payload
      - name: Preserve full successful 26916 and all historical 26904-26915 verification
        run: |
          python3 -S verify_26911_handoff.py
          python3 -S verify_26912_handoff.py
          python3 -S verify_26913_handoff.py
          python3 -S verify_26914_handoff.py
          python3 -S test_26912_sealed_negatives.py
          python3 -S test_26913_sealed_negatives.py
          python3 -S test_26914_sealed_negatives.py
          python3 -S test_26912_source.py --payload
          python3 -S test_26913_brightness.py --payload
          python3 -S test_26914_source.py --payload
          python3 -S verify_26914_v2_handoff.py
          python3 -S test_26914_v2_sealed_negatives.py
          python3 -S test_26914_v2_source.py --payload
          python3 -S test_26914_kotlin_owner.py handoff_payload_26914/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/PhotonMotionMgc1271Bridge.kt --expect-failure
          python3 -S test_26914_kotlin_owner.py handoff_payload_26914_v2/app/src/main/java/com/particlesdevs/photoncamera/processing/processor/PhotonMotionMgc1271Bridge.kt
          python3 -S verify_26915_handoff.py
          python3 -S test_26915_source.py --payload
          python3 -S test_26915_native_guide.py --payload
          python3 -S test_26915_capture.py --payload
          python3 -S test_26915_java_carrier.py --payload
          python3 -S test_26915_kotlin_consumer.py --static-only --payload
          python3 -S test_26915_sealed_negatives.py
          python3 -S verify_26916_handoff.py
          python3 -S test_26916_source.py --payload
          python3 -S test_26916_hue.py --payload
          python3 -S test_26916_patch_proof.py --payload
          python3 -S test_26916_sealed_negatives.py
          python3 -S build_26916_incremental.py seal
          python3 -S verify_26917_handoff.py
          python3 -S test_26917_source.py --payload
          python3 -S test_26917_border.py --payload
          python3 -S test_26917_patch_proof.py --payload
          python3 -S test_26917_sealed_negatives.py
          python3 -S build_26917_incremental.py seal
          python3 -S verify_26918_handoff.py
          python3 -S test_26918_source.py --payload
          python3 -S test_26918_bypass.py --payload
          python3 -S test_26918_patch_proof.py --payload
          python3 -S test_26918_sealed_negatives.py
          python3 -S build_26918_incremental.py seal
          python3 -S verify_26919_handoff.py
          python3 -S test_26919_source.py --payload
          python3 -S test_26919_clip_fcc.py --payload
          python3 -S test_26919_patch_proof.py --payload
          python3 -S test_26919_sealed_negatives.py
          python3 -S build_26919_incremental.py seal
          python3 -S verify_26920_handoff.py
          python3 -S test_26920_source.py --payload
          python3 -S test_26920_vulkan_abi.py --payload
          python3 -S test_26920_patch_proof.py --payload
          python3 -S test_26920_math_host.py
          python3 -S test_26920_sealed_negatives.py
          python3 -S build_26920_incremental.py seal
          # The 26922 successful handoff remains historical; never accept its
          # --live full-source equality as certification of 26923 changes.
          python3 -S build_26922_incremental.py seal
          python3 -S test_26922_source.py --payload
          python3 -S test_26922_sealed_negatives.py
      - name: Verify 26923 three-stage upload with 2031 protected, 7 changed and 1 added
        run: |
          python3 -S build_26923_incremental.py seal
          python3 -S test_26923_sealed_negatives.py
          python3 -S test_26923_source.py --payload
          python3 -S test_26923_math_host.py
      - name: Targeted 26903 archive/Night, 26886/26887 historical checks and 26925 V1 V2 V3 V4 failure regressions
        run: |
          python3 -S test_26903_v3_archive_receipt.py
          python3 -S test_26925_workflow_refs.py
          python3 -S build_26925_incremental.py seal
          python3 -S test_26925_sealed_negatives.py
          python3 -S test_26925_shader_contract.py --payload
          python3 -S test_26925_shader_abi.py --payload
          python3 -S test_26925_shader_shadow.py --payload
          python3 -S test_26925_source.py --payload
          python3 -S test_26925_math_host.py --payload
      - name: Regression test native cache libheif exact two-patch replay and rejection
        run: python3 -S test_26906_native_cache.py
      - name: Re-run original 26907/26908/26909/26910/26911 and successful 26912 exposure regressions
        run: |
          python3 -S test_26907_hue_source.py
          python3 -S test_26908_exposure_render.py
          python3 -S test_26909_exposure.py
          python3 -S test_26910_capture_focus.py
          python3 -S test_26911_continuity.py
          python3 -S test_26912_source.py --payload
          python3 -S test_26913_brightness.py --payload
          python3 -S test_26914_source.py --payload
          python3 -S verify_26915_handoff.py
          python3 -S test_26915_source.py --payload
          python3 -S test_26915_sealed_negatives.py
      - name: Verify 26904 V3 exact CMake compiler handoff and sealed scope
        run: python3 -S verify_26904_v3_safety.py
      - name: Verify corrected SPIR-V optimizer CLI and V2 package
        run: python3 -S verify_26904_v2_safety.py
      - name: Verify standalone uploaded package before touching runtime
        run: |
          python3 -S build_26904_incremental.py seal
          python3 -S test_26904_changeaware.py . --with-javac
      - name: Replay exact successful 26923 V4 historical 26922-to-26923 source, negative and patch proof in original source scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -S build_26923_incremental.py fetch
          python3 -S build_26923_incremental.py prepare
          python3 -S test_26923_source.py --live
          python3 -S test_26923_patch_proof.py --live
          python3 -S test_26923_math_host.py --live
          python3 -S test_26923_shader_contract.py
          python3 -S test_26923_shader_shadow.py --live
          python3 -S build_26923_incremental.py regress
      - name: Obtain exact successful 26923 V4 Actions artifact and executed compiled source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26926_incremental.py fetch
      - name: Authority-seed 2039 successful 26923 compiled files, overlay 13 changed plus 2 new and freeze 2026 protected
        run: python3 -S build_26926_incremental.py prepare
      - name: Re-run 26907/26908/26909 and 26911 continuity + exact 26913 brightness and shutter ISO regressions
        run: |
          python3 -S test_26907_hue_source.py
          python3 -S test_26908_exposure_render.py
          python3 -S test_26909_exposure.py
          python3 -S test_26910_capture_focus.py
          python3 -S test_26911_continuity.py
          python3 -S test_26912_source.py --payload
          python3 -S test_26913_brightness.py --payload
          # Prior 26915 seven-path regressions use their immutable original payload.
          python3 -S test_26915_source.py --payload
          python3 -S test_26915_native_guide.py --payload
          python3 -S test_26915_capture.py --payload
          python3 -S test_26915_java_carrier.py --payload
          python3 -S test_26915_kotlin_consumer.py --static-only --payload
          # Current candidate tests must run on the actual seeded runtime tree.
          python3 -S test_26917_border.py --live
          python3 -S test_26920_source.py --payload
          python3 -S test_26920_vulkan_abi.py --payload
          python3 -S test_26920_patch_proof.py --payload
          python3 -S test_26920_math_host.py
          python3 -S verify_26920_handoff.py
          python3 -S test_26922_source.py --payload
          python3 -S test_26923_source.py --payload
          python3 -S test_26923_math_host.py
          python3 -S test_26903_modes.py .
          python3 -S test_26926_source.py --live
          python3 -S test_26926_math_host.py --live
          python3 -S test_26926_shader_shadow.py --live
          python3 -S test_26926_shader_contract.py --live
          python3 -S test_26926_patch_proof.py --live
          python3 -S build_26926_incremental.py regress
      - name: Assert current 26926 shader ABI against the historical 26923 source-owned contract
        run: python3 -S test_26926_shader_contract.py --live
      - name: Real pinned GLSL ESSL and Vulkan SPIR-V compilation
        run: bash compile_26904_shaders_v2.sh
      - name: Hand off exact pinned glslang 16.5.0 to Android CMake
        run: python3 -S verify_26904_v3_cmake_handoff.py --handoff
      - name: Replay successful 26906 pinned compiler and compile 26926 current post-AMaZE and FCC ESSL300/310 SPIR-V
        run: bash compile_26926_shaders.sh
      - name: Compile 26926 current Wronski native noise/support guide and wavelet prod/trace Vulkan SPIR-V
        run: bash compile_26926_hr_spirv.sh
      - name: Real pinned 16.5.0 ESSL310 and SPIR-V compile of UPDATED 26916 hue shader and exact RGB probe
        run: bash compile_26907_hue_glsl.sh
      - name: Real pinned 26908 final render shader ESSL/SPIR-V compilation unchanged
        run: bash compile_26908_render_glsl.sh
      - name: Compile new B OFF native AMaZE import with real pinned glslang and SPIR-V validation plus optimization
        run: bash compile_26917_amaze_import.sh
      - name: Compile exact original 26920 LK prod/trace Vulkan shaders with 26926 source gate and descriptor ABI
        run: python3 -S compile_26926_lk_shaders.py
      - name: Verify sealed 26918/26919 historical B OFF shader compiler source without substituting it for live 26917
        run: |
          python3 -S verify_26918_handoff.py
          python3 -S verify_26919_handoff.py
          python3 -S test_26918_source.py --payload
          python3 -S test_26919_source.py --payload
      - name: Compile supplemental real host C++17 bounded LK/confidence math and fail-closed cases
        run: |
          python3 -S test_26920_math_host.py
          python3 -S test_26920_source.py --payload
          python3 -S test_26922_source.py --payload
          python3 -S test_26923_source.py --payload
          python3 -S test_26923_math_host.py
          python3 -S test_26926_source.py --live
          python3 -S test_26926_math_host.py --live
      - name: Freeze 2041 current source entries, 13 changed plus 2 additions, 2026 protected, all real shaders compiled
        run: python3 -S build_26926_incremental.py verify-compiled
      - name: Obtain exact successful 26926 V4 Actions artifact and executed compiled source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26927_incremental.py fetch
      - name: Authority-seed successful 26926 compiled source and overlay exactly four 26927 changes
        run: python3 -S build_26927_incremental.py prepare
      - name: Prove 26927 exact source, protected 2037, gl sampler order, chroma domain and full-index rollback
        run: |
          python3 -S test_26927_source.py --live
          python3 -S test_26927_chroma_math.py --live
          python3 -S test_26927_shader_contract.py --live
          python3 -S test_26927_shader_shadow.py --live
          python3 -S test_26927_patch_proof.py --live
          python3 -S build_26927_incremental.py regress
      - name: Record GitHub runner image toolchain provenance for binary cache
        id: runner_image
        shell: bash
        run: |
          set -euo pipefail
          : "${ImageOS:?Actions image OS missing}"
          : "${ImageVersion:?Actions image version missing}"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # CRITICAL: evaluate the native source hash AFTER authority-seeded app/src
      # exists; never reuse app/.cxx from a different native source input universe.
      - name: Restore native CMake outputs only for the exact compiled-source fingerprint
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify cached native libheif can be safely re-patched without discarding native outputs
        env:
          PHOTON_26906_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: python3 -S verify_26906_native_cache.py preflight
      - name: Compile 26927 current three post-AMaZE/FCC ESSL300/310 with original 26906 pinned GLSL and SPIR-V procedure
        run: bash compile_26927_shaders.sh
      - name: Compile 26927 unchanged source-identified Wronski native 3 shader prod/trace variants with pinned real glslang16.5
        run: bash compile_26927_hr_spirv.sh
      - name: Freeze 2041 exact 26927 source, 4 changed, 2037 protected, full current real shader compilers
        run: python3 -S build_26927_incremental.py verify-compiled
      - name: Obtain exact successful 26927 V1 Actions artifact and executed compiled source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26928_incremental.py fetch
      - name: Authority-seed successful 26927 compiled source and overlay exactly two 26928 source changes
        run: python3 -S build_26928_incremental.py prepare
      - name: Prove 26928 exact source, 2039 protected, B OFF chroma domain and full-index rollback
        run: |
          python3 -S test_26928_source.py --live
          python3 -S test_26928_chroma_math.py --live
          python3 -S test_26928_shader_contract.py --live
          python3 -S test_26928_shader_shadow.py --live
          python3 -S test_26928_patch_proof.py --live
          python3 -S build_26928_incremental.py regress
      - name: Compile current 26928 post-AMaZE/FCC ESSL300/310 and optimize/validate real pinned SPIR-V
        run: bash compile_26928_shaders.sh
      - name: Recompile source-identified unchanged 26928 Wronski prod/trace Vulkan SPIR-V with pinned glslang16.5
        run: bash compile_26928_hr_spirv.sh
      - name: Freeze 2041 exact 26928 source, 2 changed, 2039 protected, full current real shader compilers
        run: python3 -S build_26928_incremental.py verify-compiled
      # 26928 is already BUILD-PROVEN from successful run 43542398468,
      # its published compiled candidate, APK and both real NDK ABI receipts.
      # Do not spend ~9m rebuilding the same 26928 APK just to throw it away.
      # 26929 fetch/prepare must verify exact prior compiler/APK receipts.
      - name: Prove historical 26928 runtime regression and protect successful published APK authority
        run: |
          python3 -S test_26928_workflow_refs.py
          python3 -S build_26928_incremental.py regress
          python3 -S build_26928_incremental.py verify-compiled
      - name: Seal 26929 three-stage source scope, math/ABI, negative tampering and original app settings BEFORE any new overlay
        run: |
          python3 -S build_26929_incremental.py seal
          python3 -S test_26929_workflow_refs.py
          python3 -S test_26929_source.py --payload
          python3 -S test_26929_chroma_math.py --payload
          python3 -S test_26929_shader_contract.py --payload
          python3 -S test_26929_patch_proof.py
          python3 -S test_26929_sealed_negatives.py
      - name: Obtain exact successful 26928 V1 Actions artifact and executed compiled source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26929_incremental.py fetch
      - name: Authority-seed successful 26928 V1 compiled source and overlay only 3 files
        run: python3 -S build_26929_incremental.py prepare
      - name: Prove 26929 local noise-aware chroma math, exact source, shader ABI and full-index rollback
        run: |
          python3 -S test_26929_source.py --live
          python3 -S test_26929_chroma_math.py --live
          python3 -S test_26929_shader_contract.py --live
          python3 -S test_26929_shader_shadow.py --live
          python3 -S test_26929_patch_proof.py --live
          python3 -S build_26929_incremental.py regress
      - name: Restore input-addressed Gradle cache AFTER actual 26929 source seed
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
          restore-keys: |
            photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-
      - name: Restore new source-matched native CMake cache AFTER 26929 shader overlay
        id: native-cache-26929
        uses: actions/cache/restore@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify native libheif cache replay for 26929 exact-input source fingerprint
        env:
          PHOTON_26906_NATIVE_CACHE_HIT: ${{ steps.native-cache-26929.outputs.cache-hit }}
        run: python3 -S verify_26906_native_cache.py preflight
      - name: Recompile 26929 current ESSL300/310 B/FCC source with original pinned 16.5 compiler and optimizer
        run: bash compile_26929_shaders.sh
      - name: Compile modified 26929 B ON wavelet copy and unchanged native guide/finalize prod/trace SPIR-V
        run: bash compile_26929_hr_spirv.sh
      - name: Verify compiled native GLSL bytes, protected 2038, and exact candidate source BEFORE Android build
        run: python3 -S build_26929_incremental.py verify-compiled
      # 26929 V2 is already BUILD-PROVEN by the exact published successful
      # Actions artifact. NEVER run its :app:assembleDebug a second time.
      # Keep every inherited historical source/GLSL and current 26929 real
      # Vulkan compiler gate above; next seed from exact published 26929 TAR.
      - name: Seal 26930 three-stage source, math, shader ABI, negative tampering and fallbacks before source overlay
        run: |
          python3 -S build_26930_incremental.py seal
          python3 -S test_26930_workflow_refs.py
          python3 -S test_26930_source.py --payload
          python3 -S test_26930_chroma_math.py --payload
          python3 -S test_26930_shader_contract.py --payload
          python3 -S test_26930_patch_proof.py
          python3 -S test_26930_sealed_negatives.py
      - name: Obtain exact successful 26929 V2 Actions artifact and compiled 2041-file runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26930_incremental.py fetch
      - name: Authority-seed successful 26929 V2 compiled source and overlay exactly three 26930 files
        run: python3 -S build_26930_incremental.py prepare
      - name: Prove 26930 physical-LSC and per-site noise, shadow colour domain, slider preservation and exact rollback
        run: |
          python3 -S test_26930_source.py --live
          python3 -S test_26930_chroma_math.py --live
          python3 -S test_26930_shader_contract.py --live
          python3 -S test_26930_shader_shadow.py --live
          python3 -S test_26930_patch_proof.py --live
          python3 -S build_26930_incremental.py regress
      # Gradle restore MUST be after the actual 26930 source seed; never
      # cross source/CMake fingerprints or rebuild a prior successful APK.
      - name: Restore input-addressed Gradle cache AFTER actual 26930 source seed
        id: gradle-cache-26930
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
          restore-keys: |
            photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-
      - name: Restore source- and runner-matched native CMake cache for 26930
        id: native-cache-26930
        uses: actions/cache/restore@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify exact-native-input libheif cache patch replay or genuine cold build
        env:
          PHOTON_26906_NATIVE_CACHE_HIT: ${{ steps.native-cache-26930.outputs.cache-hit }}
        run: python3 -S verify_26906_native_cache.py preflight
      - name: Compile current 26930 ESSL300/310 source with exact pinned 16.5.0 and SPIR-V validation/optimization
        run: bash compile_26930_shaders.sh
      - name: Compile 26930 wavelet/LSC/per-CFA native copy and untouched guide/finalize production and trace SPIR-V
        run: bash compile_26930_hr_spirv.sh
      - name: Freeze exact 26930 candidate and actual native/compiler SPIR-V bytes before Android assembly
        run: python3 -S build_26930_incremental.py verify-compiled
      - name: Assemble exactly one 26930 Android APK using full NDK both ABIs, Kotlin, Java and Gradle compilers
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache :app:assembleDebug --stacktrace 2>&1 | tee photon_26930_outputs/26930_gradle_assemble.log
      - name: Verify both real Android NDK ABI Vulkan/CMake shadow bytes and descriptor contract
        run: |
          python3 -S test_26920_vulkan_abi.py --live --cmake
          python3 -S test_26930_shader_shadow.py --live --cmake
      - name: Verify libheif native CMake-generated source after actual APK assembly
        run: python3 -S verify_26906_native_cache.py postflight
      - name: Seal exactly one built 26930 APK, 2041 source files, 2038 protected unchanged and actual build receipts
        run: python3 -S build_26930_incremental.py finalize
      - name: Save 26930 native cache only after genuine successful dual-ABI APK
        if: steps.native-cache-26930.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Save successful source-keyed Gradle cache
        if: steps.gradle-cache-26930.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
