name: Build 26509 Direct 26507 Root Correction

on:
  workflow_dispatch:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 26507_successful_app_source.tar.gz
      - 26507_SUCCESSFUL_SOURCE.sha256
      - 26507_SUCCESSFUL_SOURCE_ARCHIVE.sha256
      - 26507_BJZHOU_NATIVE_DEPENDENCIES.sha256
      - 26507_BJZHOU_DEPENDENCY_COMMIT.txt
      - 26509_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch
      - 26509_EXACT_DELTA_FROM_SUCCESSFUL_26507.patch.sha256
      - apply_26509_root_correction.py
      - validate_26509_root_correction.py
      - build_26509_direct_26507_root_correction.sh
      - 26509_README_UPLOAD.txt
      - 26509_HANDOFF_HASHES.sha256
      - .github/workflows/build-26509-direct-26507-root-correction.yml

permissions:
  contents: read

concurrency:
  group: photon-26509-direct-26507-root-correction
  cancel-in-progress: false

jobs:
  build:
    name: Guarded 26509 direct successful-26507 root correction
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"; mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'PY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          expected=xs[0]['digest'].split(':',1)[1]
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert expected==actual
          print('PASS: glslang SHA',actual)
          PY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | head -1 | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify direct-source handoff before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26509_HANDOFF_HASHES.sha256
          bash -n build_26509_direct_26507_root_correction.sh
          python3 -m py_compile apply_26509_root_correction.py validate_26509_root_correction.py
          grep -F 'SOURCE_TAR_SHA="3165a63224fc99652504113c312827b4af823eb643567f3678bfd938ad2c0082"' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26508-v3-rejected-before-26509-root-correction-20260819"' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'REJECTED_26508_V3_HEAD="33f26df7daafaa956b578233d1e94de57d5c84a3"' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726509"' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'VERSION_BUILD="26509"' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'IRIS_26509_V2_BINDING_PROOF_REGION_TEXTURE' build_26509_direct_26507_root_correction.sh >/dev/null
          grep -F 'IRIS_26509_BRIDGE_COPY_ONLY_IF_TIMESTAMP_CLOSER' apply_26509_root_correction.py >/dev/null
          grep -F 'IRIS_26509_NORMAL_RAW_SIGNAL_EXPOSURE_AUTHORITY' apply_26509_root_correction.py >/dev/null
          grep -F 'IRIS_26509_ASYNC_BITMAP_LIFETIME_OWNER' apply_26509_root_correction.py >/dev/null
          # Direct-source rule: no historical source reconstruction commands or older apply/validator dependencies.
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build_26509_direct_26507_root_correction.sh').read_text()
          forbidden=['git '+'archive','apply_'+'26502','apply_'+'26503','apply_'+'26504','apply_'+'26505','apply_'+'26506','validate_'+'26502','validate_'+'26503','validate_'+'26504','validate_'+'26505','validate_'+'26506']
          bad=[x for x in forbidden if x in s]
          assert not bad, 'historical runtime reconstruction dependency survived: '+repr(bad)
          assert '26507_successful_app_source.tar.gz' in s
          print('PASS: 26509 build is direct from successful 26507 source; no historical runtime replay')
          PY
          echo "PASS: 26509 direct-source handoff static guards"

      - name: Build guarded 26509 directly from successful 26507 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_26509_direct_26507_root_correction.sh apply_26509_root_correction.py
          ./build_26509_direct_26507_root_correction.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26509-direct-26507-root-correction
          path: |
            IrisCamera-0.9726509-26509-direct-26507-root-correction-debug.apk
            build_26509_direct_26507_root_correction_outputs/
          if-no-files-found: warn
