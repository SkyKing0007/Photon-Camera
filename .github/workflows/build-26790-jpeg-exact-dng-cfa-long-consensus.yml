name: Build 26790 JPEG Exact DNG CFA Long Consensus
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26790.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26790 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26790.txt
          grep -Fx 'RUN_26790_JPEG_EXACT_DNG_CFA_LONG_CONSENSUS' TRIGGER_26790.txt
          sha256sum -c 26790_HANDOFF_HASHES.sha256
          bash -n build_26790_jpeg_exact_dng_cfa_long_consensus.sh
          python3 -S -m py_compile transform_26790.py validate_26790.py verify_26790_patches.py verify_26790_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26790_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26790_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26790 candidate from successful 26789 authority using exact successful 26789 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26790_jpeg_exact_dng_cfa_long_consensus.sh
      - name: Verify exact 26790 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726790-26790-jpeg-exact-dng-cfa-long-consensus-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726790-26790-jpeg-exact-dng-cfa-long-consensus-debug.apk' build_26790_jpeg_exact_dng_cfa_long_consensus_outputs/26790_APK.sha256
      - name: Upload 26790 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26790-jpeg-exact-dng-cfa-long-consensus
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726790-26790-jpeg-exact-dng-cfa-long-consensus-debug.apk
            build_26790_jpeg_exact_dng_cfa_long_consensus_outputs/
