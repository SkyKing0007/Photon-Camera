name: Build 26657 R1 Photon New RGB Carrier Correction

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26657_R1_README_UPLOAD.txt'
      - 'R1_26657_*'
      - 'build_26657_r1_photon_new_rgb_carrier_correction.sh'
      - 'transform_26657.py'
      - 'validate_26657.py'
      - 'verify_26657_*.py'
      - 'handoff_payload_26657/**'
      - '.github/workflows/build-26657-r1-photon-new-rgb-carrier-correction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26657 handoff and exact successful 26656 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26657_HANDOFF_HASHES.sha256
          bash -n build_26657_r1_photon_new_rgb_carrier_correction.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26657.py','validate_26657.py','verify_26657_authority.py','verify_26657_infrastructure.py','verify_26657_patches.py','verify_26657_regressions.py','verify_26657_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26657 candidate from successful 26656 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26657_r1_photon_new_rgb_carrier_correction.sh
      - name: Verify exact 26657 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726657-26657-r1-photon-new-rgb-carrier-correction-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726657-26657-r1-photon-new-rgb-carrier-correction-debug.apk" build_26657_r1_photon_new_rgb_carrier_correction_outputs/26657_R1_APK.sha256
      - name: Upload 26657 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26657-r1-photon-new-rgb-carrier-correction
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726657-26657-r1-photon-new-rgb-carrier-correction-debug.apk
            build_26657_r1_photon_new_rgb_carrier_correction_outputs/
