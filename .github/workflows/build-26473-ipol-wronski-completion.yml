name: Build 26473 IPOL Wronski Completion

on:
  workflow_dispatch:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - build_26473_ipol_wronski_completion.sh
      - .github/workflows/build-26473-ipol-wronski-completion.yml

permissions:
  contents: read

jobs:
  build:
    name: Guarded 26473 IPOL Wronski completion
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guard 26473 infrastructure lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "experimental-clean-photon-rebuild"
          test "$(git rev-parse HEAD^)" = "8aa6d4e71402761672115571203b3dcb099a615b" || {
            echo "26473 infrastructure commit must be directly based on successful 26472 V6"
            git log -4 --oneline
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD -- app/src/main app/version.properties | wc -l)" -eq 0 || {
            echo "26473 infrastructure commit changed app source directly"
            git diff --name-only HEAD^ HEAD
            exit 1
          }
          echo "26473 workflow lineage gate PASS"

      - name: Run guarded 26473 IPOL Wronski completion
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_26473_ipol_wronski_completion.sh
          ./build_26473_ipol_wronski_completion.sh

      - name: Upload 26473 audit and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26473-ipol-wronski-completion
          if-no-files-found: error
          path: |
            build_26473_outputs/**
            IrisCamera-0.9726473-26473-ipol-wronski-completion-debug.apk
