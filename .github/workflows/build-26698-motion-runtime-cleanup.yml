name: Build 26698 Motion Runtime Cleanup

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26698_README_UPLOAD.txt'
      - '26698_*'
      - 'build_26698_motion_runtime_cleanup.sh'
      - 'transform_26698.py'
      - 'validate_26698.py'
      - 'repair_26698_*.py'
      - 'handoff_payload_26698/**'
      - '.github/workflows/build-26698-motion-runtime-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26698 handoff and exact successful 26697 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c 26698_HANDOFF_HASHES.sha256
          bash -n build_26698_motion_runtime_cleanup.sh
          python3 -S - <<'PY2'
          from pathlib import Path
          files=['transform_26698.py','validate_26698.py','repair_26698_authority.py','repair_26698_infrastructure.py','repair_26698_patches.py','repair_26698_regressions.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY2
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26698 candidate from successful 26697 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26698_motion_runtime_cleanup.sh
      - name: Verify exact 26698 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726698-26698-motion-runtime-cleanup-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726698-26698-motion-runtime-cleanup-debug.apk" build_26698_motion_runtime_cleanup_outputs/26698_APK.sha256
          grep -F "PASS APK JNI CONTRACT" build_26698_motion_runtime_cleanup_outputs/26698_apk_jni_contract.txt
      - name: Upload 26698 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26698-motion-runtime-cleanup
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726698-26698-motion-runtime-cleanup-debug.apk
            build_26698_motion_runtime_cleanup_outputs/
