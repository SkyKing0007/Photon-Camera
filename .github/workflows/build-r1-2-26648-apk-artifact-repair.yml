name: Build 26648 R1.2 APK Artifact Packaging Repair

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26648_R1_2_README_UPLOAD.txt'
      - 'R1_2_26648_*'
      - 'build_r1_2_26648_universal_fusion_heic_ui.sh'
      - 'transform_r1_2_26648.py'
      - 'validate_r1_2_26648.py'
      - 'verify_r1_2_26648_*.py'
      - 'handoff_payload_r1_2_26648/**'
      - '.github/workflows/build-r1-2-26648-apk-artifact-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26648 R1.2 packaging repair and inherited successful mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_2_26648_HANDOFF_HASHES.sha256
          bash -n build_r1_2_26648_universal_fusion_heic_ui.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_r1_2_26648.py','validate_r1_2_26648.py','verify_r1_2_26648_authority.py','verify_r1_2_26648_infrastructure.py','verify_r1_2_26648_patches.py','verify_r1_2_26648_regressions.py','verify_r1_2_26648_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Rebuild exact successful R1.1 runtime candidate with corrected R1.2 artifact contract
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_r1_2_26648_universal_fusion_heic_ui.sh
      - name: Verify exact R1.2 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726648-26648-r1-2-universal-fusion-heic-ui-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726648-26648-r1-2-universal-fusion-heic-ui-debug.apk" build_r1_2_26648_universal_fusion_heic_ui_outputs/26648_R1_2_APK.sha256
      - name: Upload 26648 R1.2 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26648-r1-2-universal-fusion-heic-ui
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726648-26648-r1-2-universal-fusion-heic-ui-debug.apk
            build_r1_2_26648_universal_fusion_heic_ui_outputs/
