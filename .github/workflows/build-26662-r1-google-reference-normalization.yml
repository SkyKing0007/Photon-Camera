name: Build 26662 R1 Google Reference Normalization

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26662_R1_README_UPLOAD.txt'
      - 'R1_26662_*'
      - 'build_26662_r1_google_reference_normalization.sh'
      - 'transform_26662.py'
      - 'validate_26662.py'
      - 'verify_26662_*.py'
      - 'handoff_payload_26662/**'
      - '.github/workflows/build-26662-r1-google-reference-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26662 handoff and exact successful 26661 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R1_26662_HANDOFF_HASHES.sha256
          bash -n build_26662_r1_google_reference_normalization.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26662.py','validate_26662.py','verify_26662_authority.py','verify_26662_infrastructure.py','verify_26662_patches.py','verify_26662_regressions.py','verify_26662_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26662 candidate from successful 26661 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26662_r1_google_reference_normalization.sh
      - name: Verify exact 26662 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726662-26662-r1-google-reference-normalization-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F "IrisCamera-0.9726662-26662-r1-google-reference-normalization-debug.apk" build_26662_r1_google_reference_normalization_outputs/26662_R1_APK.sha256
      - name: Upload 26662 R1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26662-r1-google-reference-normalization
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726662-26662-r1-google-reference-normalization-debug.apk
            build_26662_r1_google_reference_normalization_outputs/
