name: Build 26619 R2 Monotonic Guided Base Detail Compiler Repair

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26619_R2_README_UPLOAD.txt'
      - 'REGRESSION_R2_26619_*'
      - 'R2_26619_*'
      - 'build_26619_r2_monotonic_guided_base_detail_ltm.sh'
      - 'transform_26619_r2.py'
      - 'validate_26619_r2.py'
      - 'verify_26619_r2_*.py'
      - 'handoff_payload_26619_r2/**'
      - '.github/workflows/build-26619-r2-monotonic-guided-base-detail.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26619 package and successful 26618 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c R2_26619_HANDOFF_HASHES.sha256
          bash -n build_26619_r2_monotonic_guided_base_detail_ltm.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26619_r2.py','validate_26619_r2.py','verify_26619_r2_authority.py','verify_26619_r2_infrastructure.py','verify_26619_r2_patches.py','verify_26619_r2_regressions.py','verify_26619_r2_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26619 candidate from successful 26618 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26619_r2_monotonic_guided_base_detail_ltm.sh
      - name: Upload 26619 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26619-r2-monotonic-guided-base-detail
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726619-26619-r2-monotonic-guided-base-detail-debug.apk
            build_26619_r2_monotonic_guided_base_detail_ltm_outputs/
