name: Build 26715 SDR ZSL + Iris Logs
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26715_README_UPLOAD.txt'
      - '26715_*'
      - 'build_26715_sdr_zsl_iris_logs.sh'
      - 'transform_26715.py'
      - 'validate_26715.py'
      - 'verify_26715_*.py'
      - 'handoff_payload_26715/**'
      - '.github/workflows/build-26715-sdr-zsl-iris-logs.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26715 handoff and exact successful 26714 mechanics
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26715_HANDOFF_HASHES.sha256
          python3 -S verify_26715_infrastructure.py build_26715_sdr_zsl_iris_logs.sh .github/workflows/build-26715-sdr-zsl-iris-logs.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26715 candidate from successful 26714 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26715_sdr_zsl_iris_logs.sh
      - name: Verify exact 26715 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726715-26715-sdr-zsl-iris-logs-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726715-26715-sdr-zsl-iris-logs-debug.apk' build_26715_sdr_zsl_iris_logs_outputs/26715_APK.sha256
      - name: Upload 26715 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26715-sdr-zsl-iris-logs
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726715-26715-sdr-zsl-iris-logs-debug.apk
            build_26715_sdr_zsl_iris_logs_outputs/
