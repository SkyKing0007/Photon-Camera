name: Build 26602 V1 Full-Protected Bracket HDR + UHDR-Master SDR Parity

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26602_README_UPLOAD.txt'
      - 'REGRESSION_V1_26602_*'
      - 'V1_26602_*'
      - 'build_26602_v1_full_protected_bracket_uhdr_master_parity.sh'
      - 'transform_26602_v1.py'
      - 'validate_26602_v1.py'
      - 'verify_26602_v1_*.py'
      - 'handoff_payload_26602_v1/**'
      - '.github/workflows/build-26602-v1-full-protected-bracket-uhdr-master-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26602 V1 package and exact successful 26601/26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26602_HANDOFF_HASHES.sha256
          bash -n build_26602_v1_full_protected_bracket_uhdr_master_parity.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26602_v1.py','validate_26602_v1.py','verify_26602_v1_authority.py','verify_26602_v1_infrastructure.py','verify_26602_v1_patches.py','verify_26602_v1_regressions.py','verify_26602_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26602 candidate from successful compiled 26601 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26602_v1_full_protected_bracket_uhdr_master_parity.sh
      - name: Upload 26602 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26602-v1-full-protected-bracket-uhdr-master-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726602-26602-v1-full-protected-bracket-uhdr-master-parity-debug.apk
            build_26602_v1_full_protected_bracket_uhdr_master_parity_outputs/
