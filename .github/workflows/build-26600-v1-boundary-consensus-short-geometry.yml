name: Build 26600 V1 Boundary-Consensus SHORT Geometry

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26600_README_UPLOAD.txt'
      - 'REGRESSION_V1_26600_*'
      - 'V1_26600_*'
      - 'build_26600_v1_boundary_consensus_short_geometry.sh'
      - 'transform_26600_v1.py'
      - 'validate_26600_v1.py'
      - 'verify_26600_v1_*.py'
      - 'handoff_payload_26600_v1/**'
      - '.github/workflows/build-26600-v1-boundary-consensus-short-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26600 V1 package and exact successful 26599/26593 mechanics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26600_HANDOFF_HASHES.sha256
          bash -n build_26600_v1_boundary_consensus_short_geometry.sh
          python3 -S - <<'PY'
          from pathlib import Path
          files=['transform_26600_v1.py','validate_26600_v1.py','verify_26600_v1_authority.py','verify_26600_v1_infrastructure.py','verify_26600_v1_patches.py','verify_26600_v1_regressions.py','verify_26600_v1_shaders.py']
          for name in files: compile(Path(name).read_text(),name,'exec')
          print('PASS sealed Python syntax')
          PY
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26600 candidate from successful compiled 26599 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26600_v1_boundary_consensus_short_geometry.sh
      - name: Upload 26600 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26600-v1-boundary-consensus-short-geometry
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726600-26600-v1-boundary-consensus-short-geometry-debug.apk
            build_26600_v1_boundary_consensus_short_geometry_outputs/
