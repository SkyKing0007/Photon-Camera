name: Build 26485 Runtime Shutter Full Fix V1

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '26483_successful_source.patch'
      - '26483_successful_after.sha256'
      - '26484_delta_from_26483.patch'
      - 'transform_26485_runtime_shutter_full_fix_v1.py'
      - 'build_26485_runtime_shutter_full_fix_v1.sh'
      - '.github/workflows/build-26485-runtime-shutter-full-fix-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Strict infrastructure identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum build_26485_runtime_shutter_full_fix_v1.sh | awk '{print $1}')" = "acf694bfc88dfe5ffcebf2a8c0f073be167f60b9d1c51017308b43ea9c93f19c"
          test "$(sha256sum transform_26485_runtime_shutter_full_fix_v1.py | awk '{print $1}')" = "2e04a8e250d0fb64ca3e4a7763ed4943203d7f1ae740283018a7fb1b90c9a461"
          test "$(sha256sum 26483_successful_source.patch | awk '{print $1}')" = "a993c2c9e12cba8098623fab8b83f0965b9ad2016eded6fd857f55935a1c11db"
          test "$(sha256sum 26483_successful_after.sha256 | awk '{print $1}')" = "7cba064adf92e6645a1f94ea44a5bd205a800cead9dcd8c392816de5f2725ca7"
          test "$(sha256sum 26484_delta_from_26483.patch | awk '{print $1}')" = "18fbb861c3c49f4ad8399f29aa60ca3e85df57ffacc794b8b6a2206b42197ac3"
          bash -n build_26485_runtime_shutter_full_fix_v1.sh
          python3 -m py_compile transform_26485_runtime_shutter_full_fix_v1.py
          echo "PASS: workflow infrastructure identity"

      - name: Build guarded 26485 candidate and APK
        shell: bash
        run: |
          chmod +x build_26485_runtime_shutter_full_fix_v1.sh
          ./build_26485_runtime_shutter_full_fix_v1.sh

      - name: Upload 26485 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26485-runtime-shutter-full-fix-v1
          if-no-files-found: warn
          path: |
            IrisCamera-0.9726485-26485-runtime-shutter-full-fix-debug.apk
            build_26485_outputs/**
