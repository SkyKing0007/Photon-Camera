name: Build 26823 Phase-Valid Clipped Neutral Attenuation
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26823.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26823 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26823.txt
          grep -Fx 'RUN_26823_PHASE_VALID_CLIPPED_NEUTRAL_ATTENUATION' TRIGGER_26823.txt
          sha256sum -c 26823_HANDOFF_HASHES.sha256
          bash -n build_26823_phase_valid_clipped_neutral_attenuation.sh
          python3 -S -m py_compile transform_26823.py validate_26823.py verify_26823_patches.py verify_26823_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26823_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26823_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26823 candidate from successful 26822 authority using exact successful 26821 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26823_phase_valid_clipped_neutral_attenuation.sh
      - name: Verify exact 26823 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726823-26823-phase-valid-clipped-neutral-attenuation-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726823-26823-phase-valid-clipped-neutral-attenuation-debug.apk' build_26823_phase_valid_clipped_neutral_attenuation_outputs/26823_APK.sha256
      - name: Upload 26823 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26823-phase-valid-clipped-neutral-attenuation
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726823-26823-phase-valid-clipped-neutral-attenuation-debug.apk
            build_26823_phase_valid_clipped_neutral_attenuation_outputs/
