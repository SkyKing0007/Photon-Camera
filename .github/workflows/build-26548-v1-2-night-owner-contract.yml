name: Build 26548 V1.2 Night Owner Contract

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26548-v1-2-night-owner-contract.yml'
      - 'build_26548_v1_2_night_owner_contract.sh'
      - 'validate_26548_v1_2_night_owner_contract.py'
      - 'V1_2_26548_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26548-v1-2-night-owner-contract
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26548 V1.2 handoff package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_2_26548_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26548_v1_2_night_owner_contract.py
          python3 validate_26548_v1_2_night_owner_contract.py --self-test
          bash -n build_26548_v1_2_night_owner_contract.sh
          grep -F 'VERSION_NAME="0.9726548"' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'VERSION_BUILD="26548"' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'BASE_RUN_ID="33108723192"' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9661676421"' build_26548_v1_2_night_owner_contract.sh >/dev/null
          # Permanent V1.2 base-proof regression: success is GitHub run metadata + persisted artifact proofs,
          # never a console-only success echo that is absent from the uploaded artifact.
          grep -F "assert d.get('conclusion') == 'success'" build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'BASE_COMPILER="$BASE_OUT/26548_V1_COMPILER_STATUS.txt"' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'base compiler-status file missing persisted proof' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'base strict report missing persisted proof' build_26548_v1_2_night_owner_contract.sh >/dev/null
          ! grep -F "'26548 V1 BUILD SUCCESS'" build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F 'BACKUP BRANCH: NOT REQUIRED' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26548_v1_2_night_owner_contract.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26548_v1_2_night_owner_contract.sh >/dev/null
          # Permanent 26548 V1 workflow-permission regression: uploaded scripts may lose +x.
          grep -F 'chmod +x build_26548_v1_2_night_owner_contract.sh' .github/workflows/build-26548-v1-2-night-owner-contract.yml >/dev/null
          grep -F './build_26548_v1_2_night_owner_contract.sh' .github/workflows/build-26548-v1-2-night-owner-contract.yml >/dev/null
          # The prior 26548 V1 workflow is path-scoped to V1_26548_* and must not overlap V1_2_26548_*.
          grep -F -- "- 'V1_26548_*'" .github/workflows/build-26548-v1-integrated-night-moto-compat.yml >/dev/null

      - name: Build exact V1.2 candidate from successful 26548 V1 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x build_26548_v1_2_night_owner_contract.sh
          ./build_26548_v1_2_night_owner_contract.sh

      - name: Upload 26548 V1.2 proof + APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26548-v1-2-night-owner-contract
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726548-26548-v1-2-night-owner-contract-debug.apk
            build_26548_v1_2_night_owner_contract_outputs/
