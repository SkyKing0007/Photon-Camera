name: Photon 26906 - Experiment B Photo/Night visual tone and Night exposure
on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - TRIGGER_26906.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout intended experimental branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Prepare pinned JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact 26906 nine-file staged scope against successful 26905 authority
        run: |
          python3 -S verify_26906_handoff.py
          python3 -S build_26906_incremental.py seal
      - name: Regression test native cache libheif exact two-patch replay and rejection
        run: python3 -S test_26906_native_cache.py
      - name: Verify 26904 V3 exact CMake compiler handoff and sealed scope
        run: python3 -S verify_26904_v3_safety.py
      - name: Verify corrected SPIR-V optimizer CLI and V2 package
        run: python3 -S verify_26904_v2_safety.py
      - name: Verify standalone uploaded package before touching runtime
        run: |
          python3 -S build_26904_incremental.py seal
          python3 -S test_26904_changeaware.py . --with-javac
      - name: Restore content-addressed Gradle dependency and task caches
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
          restore-keys: |
            photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-
      - name: Obtain exact 26905 successful compiled-source authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -S build_26906_incremental.py fetch
      - name: Authority-seed 2027 successful 26905 source files and apply nine 26906 edits
        run: python3 -S build_26906_incremental.py prepare
      - name: Re-run real-source 26906 Java Night exposure and visual-tone regressions
        env:
          PHOTON_26906_BASE: .photon_26906_work/authority_26905
          PHOTON_26906_CANDIDATE: .photon_26906_work/candidate_26906
        run: python3 -S test_26906_source.py
      - name: Record GitHub runner image toolchain provenance for binary cache
        id: runner_image
        shell: bash
        run: |
          set -euo pipefail
          : "${ImageOS:?Actions image OS missing}"
          : "${ImageVersion:?Actions image version missing}"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # CRITICAL: evaluate the native source hash AFTER authority-seeded app/src
      # exists; never reuse app/.cxx from a different native source input universe.
      - name: Restore native CMake outputs only for the exact compiled-source fingerprint
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Verify cached native libheif can be safely re-patched without discarding native outputs
        env:
          PHOTON_26906_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: python3 -S verify_26906_native_cache.py preflight
      - name: Real pinned GLSL ESSL and Vulkan SPIR-V compilation
        run: bash compile_26904_shaders_v2.sh
      - name: Hand off exact pinned glslang 16.5.0 to Android CMake
        run: python3 -S verify_26904_v3_cmake_handoff.py --handoff
      - name: Real pinned glslang 16.5.0 SPIR-V compile of all three modified 26906 runtime shaders
        run: bash compile_26906_tone_glsl.sh
      - name: Freeze nine-file affected source scope after pinned ESSL310 SPIR-V checks
        run: python3 -S build_26906_incremental.py verify-compiled
      - name: Build complete Android debug APK once with input-aware Gradle cache
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache :app:assembleDebug --stacktrace 2>&1 | tee photon_26906_outputs/26906_gradle_assemble.log
      - name: Verify restored libheif was re-patched by real CMake to its original successful bytes
        run: python3 -S verify_26906_native_cache.py postflight
      - name: Prove final 26906 APK, full compiled source and source immutability
        run: python3 -S build_26906_incremental.py finalize
      - name: Save verified source-matched native CMake output only after successful APK
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.cxx
          key: photon-native-exact-v1-${{ runner.os }}-${{ steps.runner_image.outputs.image }}-${{ hashFiles('app/src/main/cpp/**/*', 'app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Save Gradle content-addressed cache only after successful APK
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: photon-gradle-inputaware-v1-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'build.gradle', 'settings.gradle') }}-${{ github.sha }}
      - name: Publish successful 26906 proof, exact builder/workflow, and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26906-b-photo-night-tone-night-exposure
          path: |
            IrisCamera-0.9726906-26906-iris-rawr-debug.apk
            photon_26906_outputs/
          if-no-files-found: error
          retention-days: 90
