name: Build 26566 V1 Iris JPEG Color + True2X Publication

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - 'V1_26566_*'
      - 'REGRESSION_26566_*'
      - 'build_26566_v1_jpeg_color_true2x.sh'
      - 'transform_26566_v1_jpeg_color_true2x.py'
      - 'validate_26566_v1.py'
      - 'verify_26566_authority.py'
      - 'verify_26566_patches.py'
      - '.github/workflows/build-26566-v1-jpeg-color-true2x.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed 26566 V1 package
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          sha256sum -c V1_26566_HANDOFF_HASHES.sha256
          bash -n build_26566_v1_jpeg_color_true2x.sh
          grep -F 'BASE_SUCCESS_COMMIT="6e30e54ae50094736a775b14f3d16f9f100bb238"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BASE_RUN_ID="33323775058"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9735679112"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="9dbdeb6e4eb5832ab2cc0875bb2a481bbce7d23099772baaebefcdd7f3b9f4a5"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BASE_TAR_SHA="ce84c3d50eb852a94949dadd76cf85be81a72a6105c0c9be34a3167a22bcb104"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26565-v1-2-before-26566-jpeg-color-solver-true2x"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'BACKUP_SHA="6e30e54ae50094736a775b14f3d16f9f100bb238"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'VERSION_NAME="0.9726566"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'VERSION_BUILD="26566"' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' build_26566_v1_jpeg_color_true2x.sh >/dev/null
          grep -F 'run 33283538711, job 99182648927' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33284071958, job 99184083108' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33284552163, job 99185364515' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33285297620, job 99187338833' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33322029512, job 99285563475' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          grep -F 'run 33322926514, rerun job 99288343214' REGRESSION_26566_CARRIED_FAILURES.txt >/dev/null
          host_syntax_flag="-fsyntax"'-only'
          host_compiler="clang"'++'
          ! grep -F -- "$host_syntax_flag" build_26566_v1_jpeg_color_true2x.sh transform_26566_v1_jpeg_color_true2x.py validate_26566_v1.py verify_26566_authority.py verify_26566_patches.py .github/workflows/build-26566-v1-jpeg-color-true2x.yml
          ! grep -F "$host_compiler" build_26566_v1_jpeg_color_true2x.sh transform_26566_v1_jpeg_color_true2x.py validate_26566_v1.py verify_26566_authority.py verify_26566_patches.py .github/workflows/build-26566-v1-jpeg-color-true2x.yml
          ! grep -R -F 'V1_26566_' .github/workflows --exclude='build-26566-v1-jpeg-color-true2x.yml'
          ! find . -type d -name '__pycache__' -print -quit | grep -q .
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - name: Build exact 26566 candidate from successful compiled 26565 V1.2 authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26566_v1_jpeg_color_true2x.sh
          ./build_26566_v1_jpeg_color_true2x.sh

      - name: Upload 26566 V1 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26566-v1-jpeg-color-true2x
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726566-26566-v1-jpeg-color-true2x-debug.apk
            build_26566_v1_jpeg_color_true2x_outputs/
