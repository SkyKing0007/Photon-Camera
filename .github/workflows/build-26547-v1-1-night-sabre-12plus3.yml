name: Build 26547 V1.1 Night Sabre 12+3

on:
  push:
    branches:
      - experimental-clean-photon-rebuild
    paths:
      - '.github/workflows/build-26547-v1-1-night-sabre-12plus3.yml'
      - 'build_26547_v1_1_night_sabre_12plus3.sh'
      - 'validate_26547_v1_1_night_sabre_12plus3.py'
      - 'preflight_26547_v1_1_glsl.py'
      - 'V1_1_26547_*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: photon-26547-v1-1-night-sabre-12plus3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap pinned Khronos GLSL validator
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          V=16.5.0
          A="glslang-${V}-linux-x86_64-release.tar.gz"
          U="https://github.com/KhronosGroup/glslang/releases/download/${V}/${A}"
          M="$RUNNER_TEMP/glslang-release.json"
          T="$RUNNER_TEMP/glslang-$V"
          F="$RUNNER_TEMP/$A"
          rm -rf "$M" "$T" "$F"
          mkdir -p "$T"
          curl --fail --location --silent --show-error --retry 5 \
            "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/$V" -o "$M"
          curl --fail --location --silent --show-error --retry 5 "$U" -o "$F"
          python3 - "$M" "$V" "$A" "$U" "$F" <<'GLSLPY'
          import hashlib,json,sys
          m,v,n,u,a=sys.argv[1:]
          d=json.load(open(m)); xs=[x for x in d['assets'] if x['name']==n]
          assert d['tag_name']==v and len(xs)==1 and xs[0]['browser_download_url']==u
          digest=xs[0].get('digest'); assert digest and digest.startswith('sha256:')
          actual=hashlib.sha256(open(a,'rb').read()).hexdigest()
          assert actual==digest.split(':',1)[1]
          print('PASS: glslang release asset SHA256',actual)
          GLSLPY
          tar -xzf "$F" -C "$T"
          "$T/bin/glslangValidator" --version | grep -F 16.5.0
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Verify 26547 V1.1 package before execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c V1_1_26547_HANDOFF_HASHES.sha256
          python3 -m py_compile validate_26547_v1_1_night_sabre_12plus3.py preflight_26547_v1_1_glsl.py
          python3 validate_26547_v1_1_night_sabre_12plus3.py --self-test
          python3 preflight_26547_v1_1_glsl.py --self-test
          bash -n build_26547_v1_1_night_sabre_12plus3.sh
          B=build_26547_v1_1_night_sabre_12plus3.sh
          P=V1_1_26547_RUNTIME_DELTA_FROM_26546_V1.patch
          grep -F 'EXPECTED_BRANCH="experimental-clean-photon-rebuild"' "$B" >/dev/null
          grep -F 'REPO_BASE_HEAD="2b8276710b7b5a5f460a3216216dfce7ab80a76e"' "$B" >/dev/null
          grep -F 'BACKUP_BRANCH="backup-26546-before-26547-night-sabre-12plus3"' "$B" >/dev/null
          grep -F 'BASE_RUN_ID="33040652975"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_ID="9633786367"' "$B" >/dev/null
          grep -F 'BASE_ARTIFACT_SHA="37b68d3b706dc5dccafe979f3d812066f2c5b0fbdf10a8f2b76de322cbad86f8"' "$B" >/dev/null
          grep -F 'BASE_TAR_SHA="03bbc3e7a355a7665f73d1cb6959ec527843716543d916fe3bbaa700fc0be76b"' "$B" >/dev/null
          grep -F 'BASE_MANIFEST_SHA="e148ca391d613c716326aa6ce24cf98bff81815293f337cf286e3db30eddb58b"' "$B" >/dev/null
          grep -F 'CAND_MANIFEST_SHA="a41d9e510f62166fa6cd892df12c3b4a46e36374ed850fb35885da75f9a128dd"' "$B" >/dev/null
          grep -F 'VERSION_NAME="0.9726547"' "$B" >/dev/null
          grep -F 'VERSION_BUILD="26547"' "$B" >/dev/null
          grep -F 'patch --batch --forward --fuzz=0 --no-backup-if-mismatch' "$B" >/dev/null
          grep -F 'core.abbrev="$abbrev"' "$B" >/dev/null
          grep -F 'PRE-BUILD SAFETY PROOF PASSED' "$B" >/dev/null
          grep -F './gradlew clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace' "$B" >/dev/null
          grep -F './gradlew :app:assembleDebug --stacktrace' "$B" >/dev/null
          grep -F '30 active Spatial/VGN/Sabre shaders' "$B" >/dev/null
          grep -F 'IRIS_26547_SABRE_SQRT_CLIP_DOMAIN' "$P" >/dev/null
          grep -F 'IRIS_26547_SABRE_LONG_DURATION_ROBUSTNESS' "$P" >/dev/null
          grep -F 'IRIS_26547_SABRE_DISK_RAW_STREAM_UPLOAD' "$P" >/dev/null
          grep -F 'IRIS_26547_NIGHT_REENTRY_GUARD' "$P" >/dev/null
          grep -F 'IRIS_26547_NIGHT_NO_SILENT_LONG_DROP' "$P" >/dev/null
          grep -F 'IRIS_26547_V1_1_MOTION_DNG_26546_PRESERVATION' "$P" >/dev/null
          glslangValidator --version | grep -F 16.5.0
          FORBIDDEN_RE="$(printf '%s' 'git p' 'ush|git sw' 'itch dev|git check' 'out dev')"
          ! grep -E "$FORBIDDEN_RE" "$B" >/dev/null
          echo 'PASS: 26547 V1.1 package pins exact successful 26546 authority, 12+3 math/runtime contracts + exact 26546 Motion DNG preservation, real compilers, deterministic patches, and post-build invariance'

      - name: Guarded 26547 V1.1 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x build_26547_v1_1_night_sabre_12plus3.sh
          ./build_26547_v1_1_night_sabre_12plus3.sh

      - name: Upload APK and proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-26547-v1-1-night-sabre-12plus3
          path: |
            IrisCamera-0.9726547-26547-v1-1-night-sabre-12plus3-debug.apk
            build_26547_v1_1_night_sabre_12plus3_outputs/
          if-no-files-found: warn
