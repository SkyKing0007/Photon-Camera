name: Build 26843 Fast Protective HDR
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26843.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26843 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26843.txt
          grep -Fx 'RUN_26843_FAST_PROTECT' TRIGGER_26843.txt
          sha256sum -c 26843_HANDOFF_HASHES.sha256
          bash -n build_26843_fast_protect.sh
          python3 -S -m py_compile transform_26843.py validate_26843.py verify_26843_patches.py verify_26843_runtime_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26843_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26843_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26843 candidate from successful 26842 authority using exact successful 26842 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26843_fast_protect.sh
      - name: Verify exact 26843 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726843-26843-fast-protect-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726843-26843-fast-protect-debug.apk' build_26843_fast_protect_outputs/26843_APK.sha256
      - name: Upload 26843 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26843-fast-protect
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726843-26843-fast-protect-debug.apk
            build_26843_fast_protect_outputs/
