name: Build 26786 Combined DNG CFA A/B
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - 'TRIGGER_26786.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 26786 trigger and sealed package
        shell: bash
        run: |
          set -euo pipefail
          test -f TRIGGER_26786.txt
          grep -Fx 'RUN_26786_COMBINED_DNG_CFA_AB' TRIGGER_26786.txt
          sha256sum -c 26786_HANDOFF_HASHES.sha256
          bash -n build_26786_combined_dng_cfa_ab.sh
          python3 -S -m py_compile transform_26786.py validate_26786.py verify_26786_patches.py verify_26786_embedded_glsl.py
          rm -rf __pycache__
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26786_FORWARD_FULL_INDEX.patch
          ! grep -Eq '^(rename from|rename to|copy from|copy to) ' 26786_ROLLBACK_FULL_INDEX.patch
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26786 candidate from successful 26785 authority using exact successful 26785 procedure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26786_combined_dng_cfa_ab.sh
      - name: Verify exact 26786 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726786-26786-combined-dng-cfa-ab-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726786-26786-combined-dng-cfa-ab-debug.apk' build_26786_combined_dng_cfa_ab_outputs/26786_APK.sha256
      - name: Upload 26786 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26786-combined-dng-cfa-ab
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726786-26786-combined-dng-cfa-ab-debug.apk
            build_26786_combined_dng_cfa_ab_outputs/
