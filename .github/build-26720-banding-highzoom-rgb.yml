name: Build 26720 Banding + High Zoom RGB
on:
  push:
    branches: [experimental-clean-photon-rebuild]
    paths:
      - '26720_README_UPLOAD.txt'
      - '26720_*'
      - 'build_26720_banding_highzoom_rgb.sh'
      - 'transform_26720.py'
      - 'validate_26720.py'
      - 'verify_26720_*.py'
      - 'handoff_payload_26720/**'
      - '.github/workflows/build-26720-banding-highzoom-rgb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experimental-clean-photon-rebuild
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sealed 26720 handoff and exact successful 26719 procedure inheritance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c 26720_HANDOFF_HASHES.sha256
          python3 -S verify_26720_infrastructure.py build_26720_banding_highzoom_rgb.sh .github/workflows/build-26720-banding-highzoom-rgb.yml
          ! find . \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) | grep -q .
          ! find . -type f -name '*.apk' | grep -q .
      - name: Build exact 26720 candidate with successful 26719 procedure from successful 26719 compiled authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build_26720_banding_highzoom_rgb.sh
      - name: Verify exact 26720 APK exists before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -f IrisCamera-0.9726720-26720-banding-highzoom-rgb-debug.apk
          test "$(find . -maxdepth 1 -type f -name 'IrisCamera-*.apk' | wc -l)" -eq 1
          grep -F 'IrisCamera-0.9726720-26720-banding-highzoom-rgb-debug.apk' build_26720_banding_highzoom_rgb_outputs/26720_APK.sha256
      - name: Upload 26720 proof and APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-26720-banding-highzoom-rgb
          if-no-files-found: error
          retention-days: 90
          path: |
            IrisCamera-0.9726720-26720-banding-highzoom-rgb-debug.apk
            build_26720_banding_highzoom_rgb_outputs/
